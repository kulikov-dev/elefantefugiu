# "Миф или правда" (pt «Mito ou verdade», en «Myth or fact»): claims a tourist might say, each tied to one published story.
# Order on the page = order in this file. `id` is the anchor and the address of the card (/ru/mif-ili-pravda/<id>/), so it never changes.
# verdict: myth | fact | part. statement up to 12 words, answer up to 30 (check:data warns above that).
# Only what the story or its "more" says: no new facts here.

- id: lello
  story: livraria-lello
  verdict: myth
  statement:
    pt: A Rowling imaginou Hogwarts a olhar para a escada da livraria Lello
    en: Rowling imagined Hogwarts from the staircase of the Lello bookstore
    ru: Роулинг придумала Хогвартс, глядя на лестницу в магазине Lello
  answer:
    pt: A própria Rowling escreveu em 2020 que nunca lá esteve. A lenda nasceu de ela ter vivido no Porto no início dos anos 90.
    en: Rowling herself wrote in 2020 that she had never been there. The legend grew out of her living in Porto in the early 1990s.
    ru: Сама Роулинг написала в 2020 году, что никогда там не бывала. Легенда выросла из того, что в начале 1990-х она жила в Порту.

- id: santa-justa
  story: elevador-santa-justa
  verdict: myth
  statement:
    pt: O Elevador de Santa Justa, em Lisboa, foi construído por Eiffel
    en: Eiffel built the Santa Justa Lift in Lisbon
    ru: Лифт Санта-Жушта в Лиссабоне построил Эйфель
  answer:
    pt: Foi projetado por Raoul Mesnier du Ponsard, engenheiro português de origem francesa. O ferro rendilhado ao gosto de Eiffel deu origem à lenda.
    en: It was designed by Raoul Mesnier du Ponsard, a Portuguese engineer of French descent. The lacy ironwork in Eiffel’s style gave rise to the legend.
    ru: Его спроектировал Рауль Мениер дю Понсар, португальский инженер французского происхождения. Ажурное железо в духе Эйфеля и породило легенду.

- id: maria-pia
  story: ponte-maria-pia-1877
  verdict: fact
  statement:
    pt: A Ponte D. Maria Pia foi construída pela empresa de Eiffel
    en: Eiffel’s firm built the Maria Pia Bridge in Porto
    ru: Мост Марии Пии в Порту построила фирма Эйфеля
  answer:
    pt: A ponte foi encomendada à empresa parisiense de Gustave Eiffel. O seu arco de 160 metros foi o maior do mundo, doze anos antes da Torre Eiffel.
    en: The bridge was ordered from Gustave Eiffel’s Paris firm. Its 160-meter arch was the longest in the world, twelve years before the tower.
    ru: Мост заказали парижской фирме Гюстава Эйфеля. Его арка в 160 метров стала самой длинной в мире, за двенадцать лет до башни.

- id: salga
  story: batalha-da-salga-1581
  verdict: fact
  statement:
    pt: Os ilhéus repeliram um desembarque espanhol com uma manada de touros
    en: Islanders beat back a Spanish landing with a herd of bulls
    ru: Островитяне отбили испанский десант стадом быков
  answer:
    pt: Em 1581, na Terceira, o frade Pedro propôs lançar os touros contra o inimigo. A formação desfez-se e os espanhóis fugiram para os barcos.
    en: In 1581 on Terceira, a monk named Pedro proposed sending the bulls at the enemy. Their line broke, and the Spanish fled to their boats.
    ru: В 1581 году на Терсейре монах Педро предложил пустить быков на врага. Строй рассыпался, и испанцы бежали к лодкам.

- id: ukulele
  story: braguinha-ukulele-1879
  verdict: part
  statement:
    pt: O ukulele foi inventado no Havai
    en: The ukulele was invented in Hawaii
    ru: Укулеле придумали на Гавайях
  answer:
    pt: Foi mesmo feito no Havai, mas por marceneiros madeirenses, que juntaram o corpo da braguinha à afinação do rajão. O nome deram-no os havaianos.
    en: It really was made in Hawaii, but by Madeiran carpenters, who took the body of the braguinha and the tuning of the rajão. Hawaiians gave it the name.
    ru: Сделали его действительно на Гавайях, но мадейрские столяры, взяв корпус от брагиньи и строй от ражана. Имя дали гавайцы.

- id: vipasca
  story: termas-vipasca
  verdict: fact
  statement:
    pt: Nos banhos romanos as mulheres pagavam o dobro dos homens
    en: In the Roman baths, women paid twice what men did
    ru: В римской бане женщины платили вдвое больше мужчин
  answer:
    pt: Pela lei das placas de bronze de Vipasca, o homem pagava meia moeda e a mulher uma inteira. Porquê, os historiadores discutem.
    en: By the law on the bronze tablets of Vipasca, a man paid half a coin and a woman a whole one. Historians argue over why.
    ru: По закону на бронзовых досках из Випаски мужчина платил полмонеты, женщина целую. Почему, историки спорят.

- id: cha
  story: catarina-cha-1662
  verdict: fact
  statement:
    pt: Foi uma princesa portuguesa que pôs o chá na moda em Inglaterra
    en: A Portuguese princess made tea fashionable in England
    ru: Чай в моду в Англии ввела португальская принцесса
  answer:
    pt: Catarina de Bragança, futura rainha de Inglaterra, bebia chá todos os dias e a corte seguiu-a. Já se vendia chá em Londres, mas foi ela quem o pôs na moda.
    en: Catherine of Braganza, who became queen of England, drank tea every day, and the court followed her. Tea was sold in London before, but she made it fashionable.
    ru: Катарина Брагансская, ставшая королевой Англии, пила чай каждый день, и за ней потянулся двор. Продавали его в Лондоне и раньше, но модным сделала она.

- id: diana
  story: templo-romano-evora
  verdict: myth
  statement:
    pt: O templo romano de Évora é o templo de Diana
    en: The Roman temple in Évora is the Temple of Diana
    ru: Римский храм в Эворе — это храм Дианы
  answer:
    pt: O nome foi inventado no século XVII por um padre português, e a arqueologia não o confirma. O templo foi provavelmente dedicado ao imperador Augusto.
    en: A Portuguese priest came up with the name in the 17th century, and archaeology doesn’t support it. The temple was most likely dedicated to Emperor Augustus.
    ru: Имя в XVII веке придумал португальский священник, археология его не подтверждает. Храм, скорее всего, посвящён императору Августу.

- id: bom-jesus
  story: elevador-bom-jesus
  verdict: fact
  statement:
    pt: O funicular de Braga anda a água, sem motor
    en: The funicular in Braga runs on water, with no motor
    ru: Фуникулёр в Браге ездит на воде, без мотора
  answer:
    pt: O depósito da cabine de cima enche-se de água, a cabine fica mais pesada, desce e puxa a de baixo. Ainda hoje não tem motor.
    en: The upper car’s tank is filled with water, so it gets heavier, rolls down, and pulls the lower car up. It still has no motor today.
    ru: Верхнюю кабину заливают водой, она тяжелеет, едет вниз и тянет нижнюю наверх. Мотора у фуникулёра нет и сегодня.

- id: mafra
  story: morcegos-mafra-1771
  verdict: part
  statement:
    pt: Os livros da biblioteca de Mafra são guardados por morcegos
    en: Bats guard the books in the Mafra library
    ru: Книги в библиотеке Мафры охраняют летучие мыши
  answer:
    pt: Os morcegos existem mesmo e à noite caçam os insetos que roem o papel. Mas desde quando lá estão e quanto ajudam os livros, ninguém mediu.
    en: The bats are real and hunt paper-eating insects at night. But no one has measured how long they have been there or how much they help the books.
    ru: Летучие мыши там живут и ночью охотятся на насекомых, которые точат бумагу. Но с каких пор они там и сколько пользы книгам, никто не измерял.
