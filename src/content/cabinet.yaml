  story: padrao-cabo-da-cruz-1486
  name:
    pt: Padrão de Diogo Cão
    en: Diogo Cão's padrão
    ru: Падран Диогу Кана
  summary:
    pt: Coluna de pedra com cruz que Diogo Cão ergueu na Namíbia em 1486. Passou cem anos em Berlim.
    en: The stone pillar with a cross that Diogo Cão set up in Namibia in 1486. It spent a hundred years in Berlin.
    ru: Каменный столб с крестом, который Диогу Кан поставил в Намибии в 1486 году. Сто лет простоял в Берлине.
  hint:
    pt: Os marinheiros tinham medo de um cabo. Procure onde o passaram.
    en: Sailors were afraid of one cape. Look where they got past it.
    ru: Моряки боялись одного мыса. Ищите там, где его прошли.
  image: cabinet-shelf/k04-padrao.png
- id: saleiro-sapi
  epoch: avis-e-descobrimentos
  shelf: 2
  host: cantino-1502
  phrase:
    pt: África
    en: Africa
    ru: Африку
  occurrence:
    pt: 1
    en: 1
    ru: 1
  story: saleiro-sapi
  name:
    pt: Saleiro sapi
    en: Sapi saltcellar
    ru: Солонка сапи
  summary:
    pt: Saleiro de marfim com figuras de portugueses. Esculpido por mestres africanos por volta de 1500.
    en: An ivory saltcellar with figures of Portuguese men. African masters carved it around 1500.
    ru: Солонка из слоновой кости с фигурками португальцев. Её вырезали африканские мастера около 1500 года.
  hint:
