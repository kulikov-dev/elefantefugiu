# The cabinet of rarities (docs/spec.md, "Кабинет редкостей"): one entry per object. The word `phrase` is hidden in the text of the story `host`
# (the exact form, as it stands there; `occurrence` is the number of the place when the phrase is met more than once); `story` is the story of the object.
# The shelf is the epoch of the host. Whether the cabinet is open at all is decided by src/lib/cabinet-config.mjs.
- id: coroa-vila-vicosa
  epoch: uniao-restauracao-e-ouro-do-brasil
  shelf: 1
  host: restauracao-1640
  phrase: { pt: aclamaram, en: proclaimed, ru: провозгласили }
  story: rei-que-deu-a-coroa-1646
  name: { pt: Coroa de Vila Viçosa, en: The crown of Vila Viçosa, ru: Корона из Вила-Висозы }
  summary:
    pt: A coroa real que D. João IV ofereceu à Virgem em 1646. Desde então, os reis nunca mais a puseram.
    en: The royal crown King João IV gave to the Virgin Mary in 1646. No king wore it again.
    ru: Королевская корона, которую Жуан IV отдал Деве Марии в 1646 году. С тех пор короли её не носили.
  hint:
    pt: Procure na manhã em que Portugal recuperou o seu rei.
    en: Look in the morning when Portugal got its own king back.
    ru: Ищите в утро, когда Португалия вернула себе короля.
- id: biombos-nanban
  epoch: uniao-restauracao-e-ouro-do-brasil
  shelf: 2
  host: catarina-cha-1662
  phrase: { pt: chá, en: tea, ru: чай }
  occurrence: { pt: 1, en: 1, ru: 1 }
  story: palavras-portuguesas-no-japao-1543
  name: { pt: Biombos nanban, en: Namban screens, ru: Ширмы намбан }
  summary:
    pt: Biombo japonês onde portugueses de calças largas desembarcam de um navio enorme. Era assim que o Japão os via.
    en: A Japanese folding screen showing Portuguese men in baggy trousers stepping off a huge ship. This is how Japan saw them.
    ru: Японская ширма, на которой португальцы в широких штанах сходят с огромного корабля. Так их видели в Японии.
  hint:
    pt: Uma princesa levou para Inglaterra um novo hábito. Procure junto dela.
    en: A princess took a new habit to England. Look with her.
    ru: Одна принцесса увезла в Англию новую привычку. Ищите у неё.
- id: ze-povinho
  epoch: monarquia-e-republica
  shelf: 1
  host: a-portuguesa-1890
  phrase: { pt: Grã-Bretanha, en: Britain, ru: Британия }
  story: ze-povinho-1875
  name: { pt: Zé Povinho, en: Zé Povinho, ru: Зе Повинью }
  summary:
    pt: Zé Povinho de barro da fábrica de Bordalo Pinheiro. A personagem de caricatura de 1875 tornou-se o rosto do povo português.
    en: A clay Zé Povinho from Bordalo Pinheiro's factory. An 1875 cartoon character who became the face of ordinary Portuguese people.
    ru: Глиняный Зе Повинью с фабрики Бордалу Пинейру. Персонаж карикатуры 1875 года стал лицом простых португальцев.
  hint:
    pt: Um dia, Portugal zangou-se com Inglaterra e compôs uma canção. Procure nela.
    en: Once Portugal got angry at England and wrote a song. Look in it.
    ru: Однажды Португалия обиделась на Англию и сочинила песню. Ищите в ней.
