  story: rinoceronte-torre-de-belem
  name:
    pt: Rinoceronte da Torre de Belém
    en: The Belém Tower rhino
    ru: Носорог башни Белен
  summary:
    pt: Cabeça de rinoceronte na Torre de Belém. É considerada o primeiro rinoceronte de pedra da Europa.
    en: A rhinoceros head on Belém Tower. It’s considered Europe’s first stone rhino.
    ru: Голова носорога на башне Белен. Считается первым каменным носорогом в Европе.
  hint:
