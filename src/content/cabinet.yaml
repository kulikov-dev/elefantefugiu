# The cabinet of rarities (docs/spec.md, "Кабинет редкостей"): one entry per object. The word `phrase` is hidden in the text of the story `host`
# (the exact form, as it stands there; `occurrence` is the number of the place when the phrase is met more than once); `story` is the story of the object.
# The shelf is the epoch of the host. Whether the cabinet is open at all is decided by src/lib/cabinet-config.mjs.
- id: anfora-garum
  epoch: lusitania-e-roma
  shelf: 1
  host: garum-lisboa
  phrase:
    pt: Ânforas
    en: Amphorae
    ru: Амфоры
  story: anforas-garum-troia
  name:
    pt: Jarro do molho de peixe
    en: Fish sauce jar
    ru: Банка для рыбного соуса
  summary:
    pt: Jarro de barro de fundo pontiagudo. Em jarros assim, o molho de peixe do Sado chegava a todo o mundo romano.
    en: A clay jar with a pointed bottom. Jars like this carried fish sauce from the Sado across the Roman world.
    ru: Глиняный кувшин с острым дном. В таких с берегов Садо везли рыбный соус по всему римскому миру.
  hint:
    pt: Os romanos adoravam um molho. Procure onde o guardavam debaixo de Lisboa.
    en: The Romans loved one sauce. Look where they stored it beneath Lisbon.
    ru: Римляне любили один соус. Ищите там, где его хранили под Лиссабоном.
  image: cabinet-shelf/k01-anfora.png
- id: miliario-geira
  epoch: lusitania-e-roma
  shelf: 2
  host: ponte-trajano-chaves
  phrase:
    pt: estrada
    en: road
    ru: дорогу
  occurrence:
    pt: 2
    en: 2
    ru: 1
  story: geira-miliarios
  name:
    pt: Marco miliário da Geira
    en: Milestone of the Geira
    ru: Мильный столб с Жейры
  summary:
    pt: Marco de granito da estrada romana que atravessa o Gerês. Tem a milha e o nome de um imperador.
    en: A granite milestone from the Roman road through the Gerês mountains. It shows the mile and an emperor’s name.
    ru: Гранитный столб с римской дороги через горы Жереш. На нём миля и имя императора.
  hint:
    pt: Os romanos construíam para durar. Procure onde ainda hoje se passa sobre a obra deles.
    en: The Romans built to last. Look where people still travel over their work.
    ru: Римляне строили надолго. Ищите там, где по их работе ездят до сих пор.
  image: cabinet-shelf/k02-miliario.png
- id: altar-endovelico
  epoch: lusitania-e-roma
  shelf: 3
  host: templo-romano-evora
  phrase:
    pt: Augusto
    en: Augustus
    ru: Августа
  story: endovelico
  name:
    pt: Altar de Endovélico
    en: Altar of Endovelicus
    ru: Алтарь Эндовелика
  summary:
    pt: Altar de pedra a Endovélico, deus subterrâneo que curava e respondia em sonhos. Também os romanos lhe rezavam.
    en: A stone altar to Endovelicus, an underground god who healed and answered in dreams. Romans prayed to him too.
    ru: Каменный алтарь Эндовелику, подземному богу, который лечил и отвечал во сне. Ему молились и римляне.
  hint:
    pt: Os romanos tinham o seu templo no Alentejo. Procure perto dele.
    en: The Romans had their own temple in the Alentejo. Look near it.
    ru: У римлян был свой храм в Алентежу. Ищите рядом с ним.
  image: cabinet-shelf/k03-altar.png
- id: padrao-cape-cross
  epoch: avis-e-descobrimentos
  shelf: 1
  host: bojador-1434
  phrase:
    pt: cabo
    en: cape
    ru: мыс
  occurrence:
    pt: 2
    en: 1
