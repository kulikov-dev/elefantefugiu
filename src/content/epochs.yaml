  intro:
    pt: O pastor Viriato derrotou legiões romanas durante oito anos, e Roma só se
      livrou dele subornando os seus próprios homens. Depois chegaram as
      estradas, as pontes, as cidades e o latim. Mil anos mais tarde, dele
      nasceria o português.
    en: For eight years the shepherd Viriathus beat Roman legions, and Rome got rid
      of him only by bribing his own men. Then came roads, bridges, cities and
      Latin. A thousand years later, Latin would grow into Portuguese.
    ru: Пастух Вириат восемь лет громил римские легионы, и Рим избавился от него,
      только подкупив его же людей. Потом пришли дороги, мосты, города и латынь.
      Через тысячу лет из неё вырастет португальский язык.
- id: suevos-visigodos-e-mouros
  slug:
    pt: suevos-visigodos-e-mouros
    en: suebi-visigoths-and-moors
    ru: sveby-vestgoty-i-mavry
  order: 2
  years:
    from: 409
    to: 1139
  name:
    pt: "Suevos, visigodos e mouros"
    en: "Suebi, Visigoths and Moors"
    ru: "Свевы, вестготы и мавры"
  years_label:
    pt: "séc. V–XII"
    en: "5th–12th centuries"
    ru: "V–XII вв."
  mvp: false
  placeholder: []
  intro:
    pt: Quando Roma enfraqueceu, os suevos fundaram no norte um reino com capital em
      Braga. Seguiram-se os visigodos e, em 711, os mouros, que ficaram no sul
      mais de cinco séculos. Deixaram noras, regadios e milhares de palavras, de
      «azeite» a «Algarve».
    en: As Rome weakened, the Suebi set up a kingdom in the north with Braga as its
      capital. The Visigoths followed, and in 711 the Moors, who stayed in the
      south for more than five centuries. They left waterwheels, irrigation and
      thousands of words, from azeite to Algarve.
    ru: Когда Рим ослаб, свевы основали на севере королевство со столицей в Браге.
      За ними пришли вестготы, а в 711 году мавры, которые остались на юге
      больше чем на пять веков. От них остались водяные колёса, орошение и
      тысячи слов, от azeite до Algarve.
- id: nascimento-do-reino-e-reconquista
  slug:
    pt: nascimento-do-reino-e-reconquista
    en: birth-of-the-kingdom-and-reconquista
    ru: rozhdenie-korolevstva-i-rekonkista
  order: 3
  years:
    from: 1139
    to: 1249
  name:
    pt: "Nascimento do reino e Reconquista"
    en: "Birth of the Kingdom and the Reconquista"
    ru: "Рождение королевства и Реконкиста"
  years_label:
    pt: "1139–1249"
    en: "1139–1249"
    ru: "1139–1249"
  mvp: false
  placeholder: []
  intro:
    pt: D. Afonso Henriques pegou em armas contra a própria mãe e tornou-se o
      primeiro rei de Portugal. Com a ajuda de cruzados a caminho da Terra
      Santa, conquistou Lisboa, e os seus descendentes chegaram ao Algarve. As
      fronteiras traçadas então quase não mudaram até hoje.
    en: Afonso Henriques took up arms against his own mother and became Portugal's
      first king. With help from crusaders sailing to the Holy Land he took
      Lisbon, and his descendants pushed on to the Algarve. The borders drawn
      back then have barely changed since.
    ru: Афонсу Энрикеш поднял оружие против собственной матери и стал первым королём
      Португалии. С помощью крестоносцев, плывших в Святую землю, он взял
      Лиссабон, а его потомки дошли до Алгарве. Границы, проведённые тогда, с
      тех пор почти не изменились.
- id: uniao-restauracao-e-ouro-do-brasil
  slug:
