  intro:
    pt: A 1 de novembro de 1755, o terramoto, o tsunami e o incêndio destruíram o
      centro de Lisboa. O Marquês de Pombal reconstruiu a cidade a régua e
      esquadro e governou o país com mão de ferro. Meio século depois chegaram
      as tropas de Napoleão, e a corte partiu para o Brasil.
    en: On 1 November 1755 an earthquake, a tsunami and fire destroyed the heart of
      Lisbon. The Marquis of Pombal rebuilt the city with a ruler and ran the
      country with an iron hand. Half a century later Napoleon's troops arrived,
      and the royal court sailed for Brazil.
    ru: 1 ноября 1755 года землетрясение, цунами и пожар уничтожили центр Лиссабона.
      Маркиз де Помбал отстроил город по линейке и правил страной железной
      рукой. Через полвека пришли войска Наполеона, и королевский двор уплыл в
      Бразилию.
