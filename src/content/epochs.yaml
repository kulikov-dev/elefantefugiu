  intro:
    pt: Salazar, professor de economia, veio pôr as finanças em ordem e ficou 40
      anos. O país viveu com censura e polícia política, ficou fora da Segunda
      Guerra Mundial e, a partir de 1961, combateu em África. A 25 de abril de
      1974, uma canção na rádio deu o sinal, e o regime caiu quase sem sangue.
    en: Salazar, an economics professor, came to fix the finances and stayed for 40
      years. The country lived with censorship and secret police, sat out the
      Second World War and from 1961 fought in Africa. On 25 April 1974 a song
      on the radio gave the signal, and the regime fell almost without
      bloodshed.
    ru: Профессор экономики Салазар пришёл навести порядок в финансах и остался на
      40 лет. Страна жила с цензурой и тайной полицией, во Второй мировой не
      участвовала, а с 1961 года воевала в Африке. 25 апреля 1974 года сигналом
      стала песня по радио, и режим пал почти без крови.
- id: lusitania-e-roma
  slug:
