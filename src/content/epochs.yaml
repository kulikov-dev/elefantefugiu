  intro:
    pt: Depois da revolução, as colónias tornaram-se independentes e regressaram ao
      país centenas de milhares de pessoas. Em 1986, Portugal entrou na
      Comunidade Europeia, construiu pontes e autoestradas e recebeu a Expo 98.
      Mas as crises voltam a empurrar os portugueses para o estrangeiro, como os
      avós nos anos 60.
    en: After the revolution the colonies won independence, and hundreds of
      thousands of people came back to Portugal. In 1986 the country joined the
      European Community, built bridges and motorways and hosted Expo 98. But
      crises keep pushing Portuguese abroad to look for work, just as their
      grandparents did in the 1960s.
    ru: После революции колонии получили независимость, и в страну вернулись сотни
      тысяч человек. В 1986 году Португалия вошла в Европейское сообщество,
      построила мосты и автострады и приняла Expo 98. Но кризисы снова
      отправляют португальцев искать работу за границей, как их дедов в 1960-е.
