    to: 1750
  name:
    pt: "União, Restauração e ouro do Brasil"
    en: "Union, Restoration and Brazilian Gold"
    ru: "Уния, Реставрация и золото Бразилии"
  years_label:
    pt: "1580–1750"
    en: "1580–1750"
    ru: "1580–1750"
  mvp: false
  placeholder: []
  intro:
    pt: "O jovem rei D. Sebastião desapareceu numa batalha em Marrocos, e Portugal
      passou 60 anos sob reis espanhóis. Em 1640, um grupo de conjurados
      devolveu a independência ao país. Pouco depois descobriu-se ouro no
      Brasil, e Lisboa brilhou: o palácio de Mafra, o aqueduto, as igrejas de
      talha dourada."
    en: "Young King Sebastian vanished in battle in Morocco, and for 60 years
      Portugal was ruled by Spanish kings. In 1640 a band of conspirators won
      back independence. Soon gold was found in Brazil, and Lisbon glittered:
      the palace at Mafra, the aqueduct, churches clad in gilded carving."
    ru: "Молодой король Себаштиан сгинул в битве в Марокко, и на 60 лет Португалия
      досталась испанским королям. В 1640 году заговорщики вернули стране
      независимость. Вскоре в Бразилии нашли золото, и Лиссабон заблестел:
      дворец в Мафре, акведук, церкви в позолоченной резьбе."
- id: monarquia-e-republica
  slug:
    pt: monarquia-e-republica
    en: monarchy-and-republic
    ru: monarhiya-i-respublika
  order: 7
  years:
    from: 1820
    to: 1926
  name:
    pt: "Monarquia e República"
    en: "Monarchy and Republic"
    ru: "Монархия и Республика"
  years_label:
    pt: "1820–1926"
    en: "1820–1926"
    ru: "1820–1926"
  mvp: false
  placeholder: []
  intro:
    pt: "Durante um século, Portugal discutiu o que queria ser: constituição, guerra
      civil entre dois irmãos, caminhos de ferro e o Ultimato inglês. Em 1908, o
      rei foi assassinado no Terreiro do Paço; dois anos depois, o país era uma
      república. Mas em 16 anos a República teve mais de 40 governos."
    en: "For a whole century Portugal argued over what it should be: a constitution,
      a civil war between two brothers, railways and the British Ultimatum. In
      1908 the king was shot in Lisbon's main square; two years later the
      country was a republic. But in 16 years the Republic went through more
      than 40 governments."
    ru: "Целый век Португалия спорила, какой ей быть: конституция, гражданская война
      двух братьев, железные дороги и британский ультиматум. В 1908 году на
      главной площади Лиссабона застрелили короля, а через два года страна стала
      республикой. Но за 16 лет республика сменила больше 40 правительств."
