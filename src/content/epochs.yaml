  intro:
    pt: "O jovem rei D. Sebastião desapareceu numa batalha em Marrocos, e Portugal
      passou 60 anos sob reis espanhóis. Em 1640, um grupo de conjurados
      devolveu a independência ao país. Pouco depois descobriu-se ouro no
      Brasil, e Lisboa brilhou: o palácio de Mafra, o aqueduto, as igrejas de
      talha dourada."
    en: "Young King Sebastian vanished in battle in Morocco, and for 60 years
      Portugal was ruled by Spanish kings. In 1640 a band of conspirators won
      back independence. Soon gold was found in Brazil, and Lisbon glittered:
      the palace at Mafra, the aqueduct, churches clad in gilded carving."
    ru: "Молодой король Себастьян сгинул в битве в Марокко, и на 60 лет Португалия досталась
      испанским королям. В 1640 году заговорщики вернули стране независимость. Вскоре в Бразилии
      нашли золото, и Лиссабон заблестел: дворец в Мафре, акведук, церкви в позолоченной резьбе."
