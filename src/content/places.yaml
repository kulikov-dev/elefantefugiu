  name: { pt: Lagos, en: Lagos, ru: Лагуш }
  name_of: { pt: de Lagos, ru: Лагуша }
  center: { lat: 37.101, lon: -8.671 }
  radius_km: 5
  cover:
    focus: "50% 50%"
    credit: { pt: "Ilustração criada por IA", en: "AI-generated illustration", ru: "Иллюстрация создана ИИ" }
    alt:
      pt: "Lagos em azulejo: as muralhas, o forte do porto e as rochas com arcos no mar"
      en: "Lagos in azulejo: the town walls, the harbor fort, and rock arches in the sea"
      ru: "Лагуш на азулежу: городские стены, форт у гавани и скалы с арками в море"
  intro:
    pt: "Lagos é um porto do barlavento algarvio de onde, no século XV, as caravelas partiam cada vez mais longe pela costa de África. Foi durante muito tempo a principal cidade do Algarve, até o terramoto de 1755 destruir grande parte das casas. O centro antigo continua rodeado de muralhas, e fora da cidade começam as falésias douradas e as grutas da Ponta da Piedade."
    en: "Lagos is a port in the western Algarve from which, in the 15th century, caravels sailed ever farther down the coast of Africa. For a long time it was the Algarve's leading town, until the 1755 earthquake destroyed most of its houses. Walls still ring the old center, and just outside town begin the golden cliffs and grottoes of Ponta da Piedade."
    ru: "Лагуш — порт на западе Алгарве, откуда в XV веке каравеллы уходили всё дальше вдоль берега Африки. Город долго был главным в Алгарве, пока землетрясение 1755 года не разрушило большую часть его домов. Старый центр по-прежнему окружают крепостные стены, а за городом начинаются золотые скалы и гроты Понта-да-Пиедаде."
