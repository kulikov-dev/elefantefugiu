      ru: "Брага на азулежу: старый город с колокольнями и лестница Бон-Жезуш на холме"
  intro:
    pt: "Braga é uma das cidades mais antigas de Portugal: os romanos fundaram-na como Bracara Augusta. Desde a Alta Idade Média é sede de arcebispos e, pela quantidade de igrejas, chamam-lhe a Roma portuguesa. Na encosta sobre a cidade ergue-se o Santuário do Bom Jesus, com o seu escadório barroco em ziguezague, Património Mundial da UNESCO."
    en: "Braga is one of Portugal's oldest cities: the Romans founded it as Bracara Augusta. Archbishops have been based here since the early Middle Ages, and with so many churches it is called the Portuguese Rome. On the slope above town stands the Bom Jesus sanctuary with its zigzag Baroque staircase, a UNESCO World Heritage Site."
    ru: "Брага — один из старейших городов Португалии: римляне основали её как Бракару Августу. С раннего Средневековья здесь сидят архиепископы, и за обилие церквей город зовут португальским Римом. На склоне над городом стоит святилище Бон-Жезуш с зигзагом барочных лестниц, оно внесено в список Всемирного наследия ЮНЕСКО."
