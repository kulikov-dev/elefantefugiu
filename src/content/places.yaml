- id: sintra
  name: { pt: Sintra, en: Sintra, ru: Синтра }
  name_of: { pt: de Sintra, ru: Синтры }
  center: { lat: 38.797, lon: -9.42 }
  radius_km: 8
  cover:
    focus: "50% 40%"
    credit: { pt: "Ilustração criada por IA", en: "AI-generated illustration", ru: "Иллюстрация создана ИИ" }
    alt:
      pt: "Sintra em azulejo: o Paço com as duas chaminés cónicas, por cima o Castelo dos Mouros e o Palácio da Pena"
      en: "Sintra in azulejo: the palace with its two conical chimneys, the Moorish Castle and Pena Palace above"
      ru: "Синтра на азулежу: дворец с двумя коническими трубами, над ним Мавританский замок и дворец Пена"
  intro:
    pt: "Sintra é uma serra arborizada sobre o Atlântico, perto de Lisboa. A neblina húmida do oceano mantém aqui a frescura e o verde denso, e por isso, durante séculos, os reis vinham passar o verão, seguidos pela nobreza e por estrangeiros ricos que construíram palácios e quintas. A Paisagem Cultural de Sintra é Património Mundial da UNESCO."
    en: "Sintra is a range of wooded hills above the Atlantic, close to Lisbon. Damp ocean mist keeps it cool and green, so for centuries kings came here for the summer, followed by nobles and wealthy foreigners who built palaces and estates. The Cultural Landscape of Sintra is a UNESCO World Heritage Site."
    ru: "Синтра — лесистые горы над Атлантикой рядом с Лиссабоном. Влажный океанский туман держит здесь прохладу и густую зелень, поэтому сюда веками уезжали на лето короли, а за ними знать и богатые иностранцы, которые строили дворцы и усадьбы. Культурный пейзаж Синтры внесён в список Всемирного наследия ЮНЕСКО."
- id: mafra
  name: { pt: Mafra, en: Mafra, ru: Мафра }
  name_of: { pt: de Mafra, ru: Мафры }
  center: { lat: 38.937, lon: -9.325 }
  radius_km: 5
  cover:
    focus: "50% 50%"
    credit: { pt: "Ilustração criada por IA", en: "AI-generated illustration", ru: "Иллюстрация создана ИИ" }
    alt:
      pt: "Mafra em azulejo: a longa fachada do palácio-convento com as duas torres sineiras, ao longe a Ericeira"
      en: "Mafra in azulejo: the long facade of the palace-monastery with its two bell towers, Ericeira in the distance"
      ru: "Мафра на азулежу: длинный фасад дворца-монастыря с двумя колокольнями, справа вдали Эрисейра"
  intro:
    pt: "Mafra deve a fama a um rei. No século XVIII, D. João V construiu aqui com ouro do Brasil um palácio-convento, um dos maiores edifícios de Portugal: com basílica, uma enorme biblioteca e uma tapada de caça murada. O palácio é Património Mundial da UNESCO, e a dez quilómetros fica a vila piscatória da Ericeira."
    en: "Mafra owes its fame to one king. In the 18th century, João V used Brazilian gold to build a palace-monastery here, one of the largest buildings in Portugal, with a basilica, a vast library, and a walled hunting park. The palace is a UNESCO World Heritage Site, and the fishing town of Ericeira lies about ten kilometers (six miles) away."
    ru: "Мафру прославил один король. В XVIII веке Жуан V на бразильском золоте построил здесь дворец-монастырь, одно из самых больших зданий Португалии: с базиликой, огромной библиотекой и охотничьим парком за стеной. Дворец внесён в список Всемирного наследия ЮНЕСКО, а в десяти километрах от него лежит рыбацкая Эрисейра."
