- id: lourinha
  name: { pt: Lourinhã, en: Lourinhã, ru: Лоуринья }
  name_of: { pt: da Lourinhã, ru: Лоуриньи }
  center: { lat: 39.242, lon: -9.313 }
  radius_km: 5
  cover:
    focus: "50% 24%"
    credit: { pt: "Ilustração criada por IA", en: "AI-generated illustration", ru: "Иллюстрация создана ИИ" }
    alt:
      pt: "Lourinhã em azulejo: um moinho no alto, vinhas, uma aldeia e falésias junto ao mar"
      en: "Lourinhã in azulejo: a windmill on a hill, vineyards, a village, and cliffs by the ocean"
      ru: "Лоуринья на азулежу: мельница на холме, виноградники, деревня и скалы у океана"
  intro:
    pt: "A Lourinhã é uma pequena cidade da costa atlântica a norte de Lisboa, entre vinhas e campos. Nas falésias afloram camadas do Jurássico, e os achados de dinossauros fizeram da Lourinhã um dos principais locais paleontológicos da Europa. Do vinho da região faz-se uma aguardente com denominação de origem própria."
    en: "Lourinhã is a small town on the Atlantic coast north of Lisbon, surrounded by vineyards and fields. Its sea cliffs expose layers from the Jurassic, and dinosaur finds have made it one of Europe's leading paleontology sites. Local wine is distilled into a brandy with its own protected designation of origin."
    ru: "Лоуринья — небольшой город на атлантическом побережье к северу от Лиссабона, среди виноградников и полей. В береговых скалах здесь выходят слои юрского периода, и находки динозавров сделали Лоуринью одним из главных палеонтологических мест Европы. Из местного вина гонят бренди с собственным защищённым наименованием."
