      ru: "Эвора на азулежу: римский храм и собор на холме, слева акведук"
  intro:
    pt: "Évora é a principal cidade do Alentejo, numa colina baixa no meio da planície de sobreiros e trigo. O templo romano, as muralhas medievais, a Sé e os palácios do tempo em que a corte aqui passava longas temporadas chegaram até hoje tão inteiros que todo o centro histórico é Património Mundial da UNESCO."
    en: "Évora is the main city of the Alentejo, set on a low hill in a plain of cork oaks and wheat. Its Roman temple, medieval walls, cathedral, and the palaces from the days when the royal court spent long stretches here have survived so intact that the whole historic center is a UNESCO World Heritage Site."
    ru: "Эвора — главный город Алентежу, на невысоком холме среди равнины с пробковыми дубами и пшеницей. Римский храм, средневековые стены, собор и дворцы тех времён, когда здесь подолгу жил королевский двор, сохранились так цельно, что весь исторический центр внесён в список Всемирного наследия ЮНЕСКО."
