# The places of the site (docs/spec.md, "Страницы мест"). A story belongs to the SMALLEST circle that holds the coordinates of its bridge,
# unless the story gives `area` (the id of a place) itself. A place with 3 or more stories on the site has a page, one with fewer has none:
# the page appears on the day its third story comes out. Nothing here is required but id, name, center and radius_km.
#   parent        a district of a city: its stories also stand on the page of the parent
#   name_of       the name in the sentence "History of ...": pt "de Sintra", ru "Синтры" (without it the page title is "{name}: ...")
#   neighbours    ids of the places the page "Nearby" shows first (the rest are the nearest places that have a page)
#   intro         the hand-written introduction, 2-3 sentences, any language may be left out: where it is missing the page builds it from the data
# A new town: add an entry (id, names, the centre and a radius that holds its sights), nothing else. check:data warns about a story whose bridge is in no place.

