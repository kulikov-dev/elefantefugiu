  center: { lat: 37.8, lon: -25.5 }
  radius_km: 30
  cover:
    focus: "50% 50%"
    credit: { pt: "Ilustração criada por IA", en: "AI-generated illustration", ru: "Иллюстрация создана ИИ" }
    alt:
      pt: "São Miguel em azulejo: uma cratera com duas lagoas e o vapor das águas quentes"
      en: "São Miguel in azulejo: a crater with two lakes and steam from hot springs"
      ru: "Сан-Мигел на азулежу: кратер с двумя озёрами и пар горячих источников"
  intro:
    pt: "São Miguel é a maior ilha dos Açores, e chamam-lhe a Ilha Verde. É vulcânica: lagoas em crateras, águas quentes e as fumarolas das Furnas, onde o cozido ainda se coze dentro da terra. Os portugueses povoaram-na no século XV, e Ponta Delgada tornou-se a maior cidade dos Açores."
    en: "São Miguel is the largest of the Azores, known as the Green Island. It is volcanic: crater lakes, hot springs, and the steaming vents of Furnas, where stew is still cooked in the ground. The Portuguese settled it in the 15th century, and Ponta Delgada grew into the largest city in the Azores."
    ru: "Сан-Мигел — самый большой из Азорских островов, его называют Зелёным. Остров вулканический: озёра в кратерах, горячие источники и фумаролы Фурнаша, где рагу до сих пор варят прямо в земле. Португальцы заселили его в XV веке, а Понта-Делгада выросла в крупнейший город Азор."
