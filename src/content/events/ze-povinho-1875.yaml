more:
  pt: |-
    Logo o primeiro desenho era sobre impostos. O ministro da Fazenda pede ao Zé uma esmola «para o Santo António», o santo parece-se com o chefe do governo, ao colo tem o rei em criança, e ao lado está o comandante da guarda de chicote na mão. O Zé Povinho paga. Os leitores perceberam logo a alusão.

    Bordalo não era só caricaturista. Nas Caldas da Rainha tinha uma fábrica de faiança, e foi lá que o Zé Povinho se tornou figura de barro. Punham-no nas prateleiras por todo o país, e assim saiu dos jornais para dentro das casas.

    O próprio Bordalo dizia dele: o Zé olha para um lado, depois para o outro, e fica na mesma. Por isso é amado e criticado: aguenta, mas às vezes mostra ao poder o que pensa. Os seus desenhos e figuras de barro estão reunidos no Museu Bordalo Pinheiro, em Lisboa.
  en: |-
    The very first drawing was about taxes. The finance minister collects alms from Zé “for Saint Anthony,” the saint looks like the head of government, the king sits on his lap as a baby, and beside them stands the commander of the guard with a whip. Zé Povinho pays. Readers got the hint right away.

    Bordalo wasn’t just a cartoonist. He ran a ceramics factory in Caldas da Rainha, and there Zé Povinho became a clay figure. People put him on shelves all over the country, and that’s how he moved from the papers into people’s homes.

    Bordalo himself put it this way: Zé looks one way, then the other, and stays just where he is. That’s why he’s both loved and scolded: he puts up with things, but now and then he shows the powerful what he thinks. His drawings and clay figures are gathered at the Bordalo Pinheiro Museum in Lisbon.
  ru: |-
    Уже первая картинка была про налоги. Министр финансов собирает с Зе подаяние «на святого Антония», святой похож на главу правительства, на коленях у него сидит король-младенец, а рядом стоит начальник стражи с кнутом. Зе Повинью платит. Читатели поняли намёк сразу.

    Бордалу был не только карикатуристом. В городке Калдаш-да-Раинья у него была керамическая фабрика, и там Зе Повинью стал глиняной фигуркой. Его ставили на полки по всей стране, и так он вышел из газет в дома.

    Сам Бордалу говорил о нём так: Зе смотрит в одну сторону, потом в другую и остаётся тем же. Поэтому его и любят, и ругают: он терпит, но иногда показывает власти, что думает. Его рисунки и глиняные фигурки собраны в музее Бордалу Пинейру в Лиссабоне.
