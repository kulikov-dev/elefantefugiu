hook:
  pt: O símbolo de Portugal não é rei nem navegador, mas um simplório.
  en: Portugal’s symbol isn’t a king or a navigator but a cartoon simpleton.
  ru: Символом Португалии стал не король и не мореплаватель, а нарисованный простак.
story:
  pt: |-
    A 12 de junho de 1875, no jornal lisboeta «A Lanterna Mágica», apareceu uma nova personagem do artista Rafael Bordalo Pinheiro. Era o Zé Povinho: um camponês de chapéu de aba larga, que todos enganam e despojam.

    Bordalo desenhou-o durante trinta anos, umas trezentas vezes. Reis, ministros e partidos mudavam, mas o Zé Povinho continuava o mesmo: aguentava, resmungava e respondia ao poder com um gesto trocista.

    Os leitores reconheceram-se nele. A personagem sobreviveu à monarquia, à república e à censura, e hoje é considerada o rosto não oficial de Portugal.
  en: |-
    On June 12, 1875, a new character by artist Rafael Bordalo Pinheiro appeared in the Lisbon paper A Lanterna Mágica (“The Magic Lantern”). It was Zé Povinho, “Joe Little-People”: a peasant in a wide-brimmed hat whom everyone cheats and fleeces.

    Bordalo drew him for thirty years, some three hundred times. Kings, ministers, and parties came and went, but Zé Povinho stayed the same: he put up with it, grumbled, and answered those in power with a mocking gesture.

    Readers saw themselves in him. The character outlived the monarchy, the republic, and censorship, and today he’s called the unofficial face of Portugal.
  ru: |-
    12 июня 1875 года в лиссабонской газете «Волшебный фонарь» появился новый персонаж художника Рафаэла Бордалу Пинейру. Это был Зе Повинью, «Зе из народа»: крестьянин в широкополой шляпе, которого все обманывают и обирают.

    Бордалу рисовал его тридцать лет, около трёхсот раз. Короли, министры и партии менялись, а Зе Повинью оставался тем же: терпел, ворчал и отвечал власти насмешливым жестом.

    Читатели узнали в нём себя. Персонаж пережил монархию, республику и цензуру, и сегодня его называют неофициальным лицом Португалии.
