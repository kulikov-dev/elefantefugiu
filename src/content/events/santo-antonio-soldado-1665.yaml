    en: A Saint on the Payroll · Lagos, 1665
    ru: Святой на жалованье · Лагуш, 1665
story:
  pt: |-
    Em 1665, em guerra com Espanha pela independência, Portugal precisava de toda a ajuda antes da batalha decisiva de Montes Claros. D. Afonso VI mandou alistar Santo António no exército como patrono, com soldo.

    António morrera em 1231. Quem servia não era um homem, mas o seu nome e a sua imagem: uma estátua de madeira do santo que acompanhava o regimento. O soldo era registado em nome do santo no livro do regimento.

    Portugal venceu, e o santo continuou ao serviço. Em 1668, D. Pedro II passou-o para o regimento de infantaria de Lagos, em agradecimento pelas vitórias sobre os espanhóis.

    O santo era também promovido: em 1733 foi feito capitão, com soldo de capitão. Em 1777, o major do regimento pediu à rainha D. Maria I que fizesse o santo major, mas ela recusou. Três anos depois recebeu uma patente ainda mais alta: general.
  en: |-
    In 1665, Portugal was fighting Spain for independence and needed all the help it could get before the decisive Battle of Montes Claros. King Afonso VI had Saint Anthony enlisted in the army as its patron, with pay.

    Anthony had died in 1231. What served was not a man but his name and his image: a wooden statue of the saint that went with the regiment. His pay was entered under the saint’s name in the regiment’s books.

    Portugal won, and the saint stayed in service. In 1668, King Pedro II transferred him to the infantry regiment of Lagos in thanks for the victories over Spain.

    The saint was promoted too: in 1733 he became a captain, with a captain’s pay. When the regiment’s major asked Queen Maria I in 1777 to make the saint a major, the queen refused. Three years later he got a higher rank: general.
  ru: |-
    В 1665 году Португалия воевала с Испанией за независимость, и перед решающей битвой при Монтеш-Кларуш ей была нужна любая помощь. Король Афонсу VI велел зачислить святого Антония в армию как покровителя, с жалованьем.

    Сам Антоний умер ещё в 1231 году. Служил не человек, а его имя и образ: деревянная статуя святого с полком. Жалованье записывали на имя святого в полковую книгу.

    Португалия победила, и святой остался на службе. В 1668 году Педру II перевёл его в пехотный полк Лагуша в благодарность за победы над испанцами.

    Святого не только кормили, но и повышали. В 1733 году его произвели в капитаны и стали платить капитанское жалованье. А когда в 1777 году майор полка попросил королеву Марию I сделать святого майором, королева отказала. Через три года святой получил чин сразу выше: генеральский.
more:
  pt: |-
    Porquê António? Nasceu em Lisboa, e os portugueses consideravam-no o seu santo. Acreditava-se que um santo nas fileiras protegia o exército, e as vitórias na guerra da independência só reforçaram essa fé. O santo não foi dispensado depois da guerra: passava de regimento em regimento como qualquer oficial, só que por ordem do rei.

    O seu serviço sobreviveu ao Marquês de Pombal e às invasões francesas. Em 1814, o príncipe regente D. João fê-lo tenente-coronel de outro regimento e deu-lhe a grã-cruz da Ordem de Cristo.

    O exemplo pegou no Brasil. Lá, António constava das tropas desde o fim do século XVI, e a sua carreira militar durou mais do que em Portugal: em 1924, o presidente brasileiro passou o santo à reserva por despacho.
  en: |-
    Why Anthony? He was born in Lisbon, and the Portuguese saw him as their own saint. People believed a saint in the ranks protected the army, and the victories in the war of independence only strengthened that belief. The saint wasn’t discharged after the war either: he moved from regiment to regiment like any officer, only on the king’s orders.

    His service outlasted Pombal and the French invasions. In 1814, Prince Regent João made the saint a lieutenant colonel in another regiment and awarded him the Grand Cross of the Order of Christ.

    Brazil followed the example. There, Anthony had been on the army rolls since the late 16th century, and his military career lasted longer than in Portugal: in 1924, the Brazilian president signed an order moving the saint to the reserve.
  ru: |-
    Почему именно Антоний? Он родился в Лиссабоне, и португальцы считали его своим святым. Верили, что святой в строю бережёт войско, а победы в войне за независимость эту веру только укрепили. Святого не увольняли и после войны: из полка в полк он переходил как обычный офицер, только по приказу короля.

    Его служба пережила и Помбала, и французские нашествия. В 1814 году принц-регент Жуан произвёл святого в подполковники другого полка и наградил большим крестом ордена Христа.

    Пример подхватили в Бразилии. Там Антоний числился в войсках с конца XVI века, и его военная карьера тянулась дольше, чем в Португалии: в 1924 году бразильский президент своим распоряжением перевёл святого в запас.
