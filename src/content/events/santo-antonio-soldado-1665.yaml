  statement:
    pt: Santo António constava do exército português e recebia soldo
    en: Saint Anthony was on the Portuguese army’s rolls and drew pay
    ru: Святой Антоний числился в португальской армии и получал жалованье
  answer:
    pt: Desde 1665 serviu em regimentos, a partir de 1668 em Lagos, em 1733 foi feito capitão e, por volta de 1780, general.
    en: From 1665 he served in regiments, from 1668 in Lagos. He became a captain in 1733 and a general around 1780.
    ru: С 1665 года он служил в полках, с 1668-го в Лагуше, в 1733-м стал капитаном, а около 1780-го генералом.
