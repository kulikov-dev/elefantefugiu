story:
  pt: >-
    Camões escreveu Os Lusíadas, poema que conta toda a história de Portugal como uma grande viagem por mar. Os portugueses veem nele a sua epopeia, e ao português chamam «a língua de Camões». Por isso a festa do país ficou ligada a ele. Do nascimento do poeta não se sabe nada: nem o ano nem a cidade. Só tem uma data firme: a da morte.


    Mas nem essa se conhecia: na lápide estava 1579. A data exata apareceu na Torre do Tombo, num papel de 1582 sobre o dinheiro pago à mãe do poeta: 10 de junho de 1580. Com base nela, em 1880, no tricentenário, o rei D. Luís I declarou o 10 de junho dia de festa, só por um ano. Dia de Portugal só passou a ser no século XX. Parte dos historiadores acha que o escrivão errou e que o poeta morreu em 1579.
  en: >-
    Camões wrote The Lusiads, a poem in which the whole history of Portugal is told as one great voyage by sea. The Portuguese regard it as their national epic, and Portuguese is called “the language of Camões.” That is why the country’s holiday was tied to him. His birth is uncertain: neither the year nor the city is known. Camões has only one firm date, the day he died.


    But even that was long unknown: the tombstone said 1579. The exact date turned up in the Torre do Tombo archive, in a paper of 1582 about money paid to the poet’s mother: June 10, 1580. On that basis, in 1880, for the tricentenary, King Luís I declared June 10 a holiday, for one year only. It became Portugal’s day for good in the 20th century. Some historians think the scribe got the year wrong and the poet died in 1579.
  ru: >-
    Камоэнс написал «Лузиады», поэму, в которой вся история Португалии рассказана как одно большое плавание. Португальцы считают её своим национальным эпосом, а португальский часто называют «языком Камоэнса». Поэтому праздник страны связали с ним. О рождении поэта неизвестно ничего: ни года, ни города. Твёрдая дата у Камоэнса только одна, день смерти.


    Но и её долго не знали: на надгробии стоял 1579 год. Точную дату нашли в архиве Торре-ду-Томбу, в бумаге 1582 года о деньгах, которые платили матери поэта: 10 июня 1580 года. По ней в 1880 году, к трёхсотлетию, король Луиш I объявил 10 июня праздником, тогда на один год. Постоянным днём Португалии оно стало уже в XX веке. Правда, часть историков считает, что писарь ошибся годом и поэт умер в 1579-м.
more:
  pt: >-
    A pensão de Camões veio de Os Lusíadas. Em 1570 voltou a Lisboa, depois de dezassete anos no Oriente, sem dinheiro, mas com um poema quase pronto. Em 1572 o livro foi impresso e o rei D. Sebastião deu ao poeta uma pequena pensão, de não mais de 15 mil réis por ano. Camões morreu em 1580, no mesmo ano em que Portugal caiu, por 60 anos, sob o rei de Espanha.


    Os Lusíadas são dez cantos sobre a viagem de Vasco da Gama à Índia e, dentro deles, toda a história de Portugal, que o próprio Gama conta pelo caminho. Os deuses do Olimpo disputam entre si a sorte dos navegadores: Vénus ajuda-os, Baco atrapalha-os. As personagens do poema são conhecidas desde a escola. Por exemplo, o «Velho do Restelo», que resmunga atrás das naus que partem: ainda hoje se chama assim a quem não acredita em nada de novo.


    E o enigma da primeira edição só foi resolvido há pouco. Em 1572 saíram dois livros com a mesma data: num, o pelicano do rosto olha para a esquerda, no outro para a direita. Em 2024, a investigadora de Coimbra Rita Marnoto mostrou que o livro do pelicano «da direita» é uma contrafação, impressa mais tarde.
  en: >-
    Camões got his pension thanks to The Lusiads. He came back to Lisbon in 1570 after seventeen years in the East, with no money but with an almost finished poem. In 1572 it was printed, and King Sebastian granted the poet a small pension, no more than 15,000 reais a year. Camões died in 1580, the very year Portugal fell for 60 years under the king of Spain.


    The Lusiads is ten cantos about Vasco da Gama’s voyage to India, and inside them the whole history of Portugal, which Gama retells along the way. The gods of Olympus quarrel over the sailors: Venus helps them, Bacchus gets in their way. The Portuguese know the poem’s characters from school. For instance, the “Old Man of Restelo,” who grumbles as the ships leave: to this day the name is used for anyone who distrusts everything new.


    And the riddle of the first edition was solved only recently. In 1572 two books came out with the same date: on one title page the pelican looks left, on the other right. In 2024 a researcher from Coimbra, Rita Marnoto, showed that the book with the “right-facing” pelican is a forgery, printed later.
  ru: >-
    Пенсия у Камоэнса появилась благодаря «Лузиадам». Он вернулся в Лиссабон в 1570 году после семнадцати лет на Востоке, без денег, зато с почти готовой поэмой. В 1572 году её напечатали, и король Себастьян назначил поэту небольшую пенсию, не больше 15 тысяч реалов в год. Умер Камоэнс в 1580-м, в тот самый год, когда Португалия на 60 лет попала под власть испанского короля.


    «Лузиады» — десять песен о плавании Васко да Гамы в Индию, а внутри них вся история Португалии, которую Гама пересказывает в пути. За мореплавателей спорят боги Олимпа: Венера им помогает, Вакх мешает. Героев поэмы португальцы знают со школы. Например, «старика из Рестелу», который ворчит вслед уходящим кораблям: так до сих пор называют того, кто не верит ни во что новое.


    А загадку первого издания разгадали только недавно. В 1572 году вышли две книги с одной и той же датой: на титуле одной пеликан смотрит влево, другой вправо. В 2024 году исследовательница из Коимбры Рита Марното показала, что книга с «правым» пеликаном — подделка, напечатанная позже.
