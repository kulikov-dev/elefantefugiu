    en: The Ridge Given Up After Victory · Buçaco, 1810
    ru: Хребет, который отдали после победы · Бусаку, 1810
story:
  pt: |-
    Em 1810, os franceses invadiram Portugal pela terceira vez. O marechal Masséna marchava sobre Lisboa com cerca de 65 mil soldados. Wellington esperava-os na serra do Buçaco, junto à mata que os frades carmelitas guardavam do machado havia dois séculos. Metade do seu exército era português: regimentos treinados de novo por oficiais britânicos, que ainda não tinham enfrentado uma grande batalha.

    A 27 de setembro, os franceses subiram as encostas cinco vezes, e cinco vezes foram repelidos. Os portugueses aguentaram tão bem como os britânicos. Wellington passou a noite no convento dos carmelitas.

    Mas de manhã soube-se que Masséna tinha encontrado um caminho que contornava a serra. Wellington recuou para Lisboa, para as Linhas de Torres Vedras, construídas de antemão. Entregou a serra, mas o exército português ficou a saber que era capaz de resistir.
  en: |-
    In 1810, the French invaded Portugal for the third time. Marshal Masséna marched on Lisbon with about 65,000 men. Wellington waited for them on the Buçaco ridge, next to the forest that Carmelite friars had guarded from the axe for two centuries. Half of his army was Portuguese: regiments retrained by British officers that had never yet faced a major battle.

    On September 27, the French climbed the slopes five times, and five times they were thrown back. The Portuguese held as well as the British. Wellington spent the night in the Carmelite convent.

    But in the morning it turned out that Masséna had found a road around the ridge. Wellington fell back toward Lisbon, to the Lines of Torres Vedras, built in advance. He gave up the ridge, but the Portuguese army had learned that it could stand.
  ru: |-
    В 1810 году французы в третий раз пошли на Португалию. Маршал Массена вёл к Лиссабону около 65 тысяч солдат. Веллингтон ждал их на хребте Бусаку, рядом с лесом, который монахи-кармелиты двести лет берегли от топора. Половина его армии была португальской: эти полки заново обучили британские офицеры, и в большой битве они ещё не стояли.

    27 сентября французы пять раз шли вверх по склонам, и пять раз их сбрасывали. Португальцы держались не хуже британцев. Ночь Веллингтон провёл в монастыре кармелитов.

    Но утром выяснилось, что Массена нашёл дорогу в обход хребта. Веллингтон отступил к Лиссабону, к заранее построенным линиям Торриш-Ведраш. Хребет он отдал, но португальская армия узнала, что может выстоять.
more:
  pt: |-
    O recuo fazia parte do plano. Um ano antes, Wellington mandara construir a norte de Lisboa as Linhas de Torres Vedras: uma cadeia de fortes e muralhas de terra do rio ao oceano. A 10 de outubro, o exército já estava por trás delas. Masséna ficou diante das Linhas todo o inverno, não se atreveu a atacar e, na primavera de 1811, retirou-se de Portugal. O Buçaco foi a última grande batalha no seu caminho para Lisboa.

    Britânicos e portugueses perderam no Buçaco exatamente o mesmo número de homens, 626 cada, como se tivessem dividido a batalha ao meio. Para o exército português, reorganizado e treinado pelo general britânico Beresford, foi a primeira grande prova, e passou nela. O convento dos carmelitas continua de pé na mata, ao lado do palácio-hotel.
  en: |-
    The retreat was part of the plan. A year earlier, Wellington had ordered the Lines of Torres Vedras built north of Lisbon: a chain of forts and earthworks from the river to the ocean. By October 10, the army was behind them. Masséna stood in front of the Lines all winter, never dared to attack, and in the spring of 1811 led his army out of Portugal. Buçaco was the last big battle on his road to Lisbon.

    At Buçaco the British and the Portuguese lost exactly the same number of men, 626 each, as if they had split the battle in half. For the Portuguese army, rebuilt and trained under the British general Beresford, it was the first great test, and it passed. The Carmelite convent still stands in the forest, next to the palace hotel.
  ru: |-
    Отступление было частью плана. Ещё за год Веллингтон приказал строить к северу от Лиссабона линии Торриш-Ведраш: цепь фортов и валов от реки до океана. К 10 октября армия стояла за ними. Массена простоял перед линиями всю зиму, не решился на штурм и весной 1811 года увёл армию из Португалии. Бусаку стал последней большой битвой на его пути к Лиссабону.

    Британцы и португальцы потеряли при Бусаку ровно поровну, по 626 человек, будто поделили битву пополам. Для португальской армии, которую заново собрал и обучил британский генерал Бересфорд, это была первая большая проверка, и она её выдержала. Монастырь кармелитов стоит в лесу до сих пор, рядом с дворцом-гостиницей.
myth:
  verdict: myth
  statement:
    pt: No Buçaco, os britânicos combateram quase sem portugueses
    en: At Buçaco the British fought almost without the Portuguese
    ru: При Бусаку британцы воевали почти без португальцев
  answer:
    pt: Os portugueses eram cerca de metade do exército de Wellington, quase 25 mil, e perderam tantos homens como os britânicos, 626.
    en: The Portuguese made up about half of Wellington’s army, nearly 25,000, and lost as many men as the British, 626.
    ru: "Португальцев было около половины армии Веллингтона, почти 25 тысяч, и потеряли они столько же, сколько британцы: 626 человек."
