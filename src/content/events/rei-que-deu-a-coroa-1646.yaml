hook:
  pt: Por tradição, nenhum rei português pôs a coroa desde 1646.
  en: By tradition, no Portuguese king has worn the crown since 1646.
  ru: С 1646 года короли Португалии, как считается, больше не надевали корону.
order_hint:
  pt: "O rei entregou a coroa a Nossa Senhora e, por tradição, nenhum rei voltou a usá-la."
  en: "The king gave his crown to the Virgin Mary, and by tradition no king wore it again."
  ru: "Король отдал корону Деве Марии, и короли, как считается, больше её не надевали."
story:
  pt: >-
    Em 1640, o duque de Bragança tornou-se o rei D. João IV, mas a guerra com Espanha durou ainda
    muitos anos. Para proteger a nova dinastia, em 1646 o rei proclamou Nossa Senhora da Conceição
    padroeira de Portugal e ofereceu a sua coroa à imagem de Vila Viçosa, a terra dos Braganças.
    Desde então, a coroa passou a ser dela e, segundo a tradição, os reis não voltaram a pô-la: eram
    aclamados, com a coroa pousada ao lado, numa almofada. O dia da Imaculada Conceição, 8 de
    dezembro, continua a ser feriado em Portugal.
  en: >-
    In 1640, the Duke of Braganza became King John IV, but the war with Spain went on for many more
    years. To protect the new dynasty, in 1646 the king proclaimed Our Lady of the Immaculate
    Conception patron of Portugal and offered his crown to her statue in Vila Viçosa, the Braganza
    family seat. From then on, the crown was hers, and by tradition no king wore it again: kings
    were acclaimed, with the crown set beside them on a cushion. The feast of the Immaculate
    Conception, December 8, is still a public holiday in Portugal.
  ru: >-
    В 1640 году герцог Браганса стал королём Жуаном IV, но война с Испанией шла ещё много лет. Чтобы
    защитить новую династию, в 1646 году король объявил покровительницей Португалии Деву Марию
    Непорочного Зачатия и поднёс свою корону её статуе в Вила-Висозе, родовой резиденции Браганса. С
    тех пор корона считалась её, и короли её больше не надевали: их провозглашали, а корону клали
    рядом на подушку. День Непорочного Зачатия, 8 декабря, в Португалии до сих пор выходной.
more:
  pt: >-
    A decisão foi tomada numa grande assembleia de nobres, clero e cidades em Lisboa, e a 25 de março
    de 1646 o rei assinou a provisão. Para um país ainda em guerra com Espanha, era um gesto claro: a
    nova dinastia, ainda frágil, ficava sob a proteção da própria Virgem.


    O rei quis que todos o soubessem. Em 1654, enviou às câmaras o texto de um juramento em latim em
    honra da Imaculada Conceição e mandou gravá-lo em pedra às portas e nas praças das cidades.
    Estas lápides sobrevivem em várias cidades; uma delas está na coleção do Paço dos Duques, em
    Guimarães. E o 8 de dezembro, dia da Imaculada Conceição, continua a ser feriado em Portugal: é a
    festa da padroeira do país.


    O último rei, D. Manuel II, também não foi coroado em 1908, mas aclamado.
  en: >-
    The decision was made at a great assembly of nobles, clergy and towns in Lisbon, and on March 25,
    1646, the king signed the decree. For a country still at war with Spain, the message was clear:
    the new and still shaky dynasty was under the protection of the Virgin herself.


    The king wanted everyone to know. In 1654, he sent the towns the text of a Latin oath honoring
    the Immaculate Conception and ordered it carved in stone at town gates and squares. Such plaques
    survive in several towns; one is in the collection of the Ducal Palace in Guimarães. And Portugal still keeps December 8, the feast of the Immaculate Conception, as a public holiday, in honor of the country’s patron.


    The last king, Manuel II, was not crowned in 1908 either, only acclaimed.
  ru: >-
    Решение приняли на большом собрании дворян, духовенства и городов в Лиссабоне, и 25 марта 1646
    года король подписал указ. Для страны, которая всё ещё воевала с Испанией, это был понятный ход:
    новую, ещё шаткую династию брала под защиту сама Дева Мария.


    Король хотел, чтобы об этом знал каждый. В 1654 году он разослал по городам текст клятвы на
    латыни в честь Непорочного Зачатия и велел высечь его на камне у ворот и на площадях. Такие
    доски сохранились в разных городах, одна есть в собрании дворца герцогов в Гимарайнше. А 8
    декабря, день Непорочного Зачатия, в Португалии до сих пор выходной: это праздник
    покровительницы страны.


    Последнего короля, Мануэла II, в 1908 году тоже не короновали, а провозгласили.
