more:
  pt: >-
    O coração do convento de Tomar foi construído ainda pelos Templários, no século XII. É uma igreja redonda, a Charola. Fizeram-na redonda à imagem dos santuários de Jerusalém que os cavaleiros tinham visto nas Cruzadas.


    Quando os navios com a cruz da ordem chegaram à Índia e ao Brasil, o dinheiro voltou a Tomar. No reinado de D. Manuel juntou-se à igreja redonda uma nova nave, e a sua janela foi decorada com tudo o que trouxera a riqueza: cordas, correntes de âncora, corais, algas. Esta janela do Capítulo é considerada o melhor exemplo do manuelino, o estilo português da época dos Descobrimentos.


    A cruz das velas não desapareceu. Está na bandeira da Madeira, a primeira ilha descoberta sob esta cruz, e a própria Ordem de Cristo existe até hoje: é uma das mais altas condecorações portuguesas.
  en: >-
    The heart of the convent in Tomar was built by the Templars themselves, in the 12th century. It’s a round church, the Charola. They made it round after the shrines of Jerusalem the knights had seen on crusade.


    When ships under the order’s cross reached India and Brazil, money flowed back to Tomar. Under King Manuel, a new nave was added to the round church, and its window was decorated with everything that had brought the wealth: ropes, anchor chains, coral, seaweed. This Chapter House window is considered the finest example of Manueline, the Portuguese style of the Age of Discovery.


    The cross from the sails never disappeared. It’s on the flag of Madeira, the first island discovered under this cross, and the Order of Christ itself still exists: it’s one of Portugal’s highest honors.
  ru: >-
    Сердце монастыря в Томаре построили ещё тамплиеры в XII веке. Это круглая церковь, шароля. Круглой её сделали по образцу святынь Иерусалима, которые рыцари видели в крестовых походах.


    Когда корабли под крестом ордена дошли до Индии и Бразилии, деньги потекли обратно в Томар. Во времена короля Мануэла к круглой церкви пристроили новый неф, а его окно украсили всем, что принесло богатство: канатами, якорными цепями, кораллами, водорослями. Это окно капитула считают лучшим образцом мануэлину, португальского стиля эпохи открытий.


    Крест с парусов никуда не делся. Он есть на флаге Мадейры, первого острова, который открыли под этим крестом, а сам Орден Христа существует до сих пор: это одна из высших наград Португалии.
