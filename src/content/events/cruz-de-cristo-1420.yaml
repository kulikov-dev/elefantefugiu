story:
  pt: >-
    Em 1312, o papa extinguiu a Ordem do Templo. Em França, os cavaleiros foram presos e julgados, e as suas terras entregues a outros.


    O rei português D. Dinis fez diferente. Os Templários tinham ajudado a conquistar o país aos mouros e guardavam castelos na fronteira, e o rei não quis entregar esses castelos a uma ordem estrangeira. Fundou uma nova, a Ordem de Cristo, e em 1319 o papa autorizou que lhe passassem todos os bens dos Templários. A nova ordem instalou-se no antigo castelo deles em Tomar.


    Cem anos depois, a ordem passou a ser governada pelo Infante D. Henrique, e os seus rendimentos pagavam as viagens ao longo da costa de África. Por isso as velas das caravelas portuguesas levavam a cruz vermelha da Ordem de Cristo.
  en: >-
    In 1312, the pope abolished the Knights Templar. In France, the knights were arrested and put on trial, and their lands were handed to others.


    Portugal’s King Dinis did things differently. The Templars had helped win the country back from the Moors and guarded castles on the border, and the king didn’t want to hand those castles to a foreign order. He founded a new one, the Order of Christ, and in 1319 the pope allowed all the Templars’ property to pass to it. The new order moved into their old castle in Tomar.


    A hundred years later, Prince Henry the Navigator took charge of the order, and its income paid for his voyages down the coast of Africa. That’s why Portuguese caravels carried the red cross of the Order of Christ on their sails.
  ru: >-
    В 1312 году папа распустил орден тамплиеров. Во Франции рыцарей арестовывали и судили, а их земли отдавали другим.


    Португальский король Диниш поступил иначе. Тамплиеры помогали отвоёвывать страну у мавров и держали крепости на границе, и король не хотел отдавать их замки чужому ордену. Он основал новый, Орден Христа, и в 1319 году папа разрешил передать ему всё имущество тамплиеров. Новый орден поселился в их старом замке в Томаре.


    Через сто лет орден возглавил инфант Энрике Мореплаватель, и доходы ордена шли на его плавания вдоль Африки. Поэтому на парусах португальских каравелл рисовали красный крест Ордена Христа.
