seo:
  title:
    pt: Azulejos de Sevilha · Sintra, 1508
    en: Tiles from Seville · Sintra, 1508
    ru: Плитка из Севильи · Синтра, 1508
story:
  pt: |-
    Por volta de 1508, D. Manuel I reconstruía o palácio de Sintra e queria revestir as paredes de azulejo. Ao que tudo indica, Portugal ainda não tinha oficinas capazes de o fazer, e os azulejos foram encomendados em Sevilha.

    Os mestres sevilhanos eram herdeiros do ofício mourisco. Com vidrados de cor compunham estrelas de oito pontas, laçarias e grelhas, como os mouros faziam havia séculos. Mas, para D. Manuel, acrescentaram ao padrão o seu emblema pessoal, a esfera armilar. Este azulejo não existe em mais lado nenhum, só neste palácio.

    Os padrões ficaram tão mouriscos que, trezentos anos depois, a sua origem se esqueceu. No século XIX, a sala com estes azulejos passou a chamar-se Sala dos Árabes, e julgava-se que eram herança dos mouros. Na verdade, quem os encomendou foi um rei cristão, a mestres espanhóis.
  en: |-
    Around 1508, King Manuel I was rebuilding the palace in Sintra and wanted its walls covered in tile. Portugal apparently had no workshops that could make them yet, so the tiles were ordered from Seville.

    Seville’s craftsmen were heirs to a Moorish trade. They built eight-pointed stars, knots, and lattices out of colored glaze, as the Moors had done for centuries. But for Manuel they worked his personal emblem, the armillary sphere, into the pattern. These tiles exist nowhere else but in this palace.

    The patterns looked so Moorish that, three hundred years later, their origin was forgotten. In the 19th century, the room with these tiles was named the Arab Room, and people believed the Moors had left them behind. In fact, a Christian king had ordered them from Spanish craftsmen.
  ru: |-
    Около 1508 года король Мануэл I перестраивал дворец в Синтре и хотел покрыть его стены плиткой. Своих мастерских, которые умели такое делать, в Португалии, по всей видимости, ещё не было, и плитку заказали в Севилье.

    Севильские мастера были наследниками мавританского мастерства. Они складывали из цветной глазури восьмиконечные звёзды, узлы и решётки, как это веками делали мавры. Но для Мануэла в узор вписали его личный знак, армиллярную сферу. Такой плитки больше нет нигде, кроме этого дворца.

    Узоры получились настолько мавританскими, что через триста лет их происхождение забыли. В XIX веке зал с этой плиткой назвали Арабским и считали, что она осталась от мавров. На самом деле её заказал христианский король у испанских мастеров.
more:
  pt: |-
    Em Sintra, os azulejos foram feitos de três maneiras, e nelas vê-se como o ofício se foi simplificando. Primeiro, os mestres cortavam pequenas peças de azulejos vidrados de várias cores e montavam com elas um mosaico: bonito, mas muito demorado. Depois aprenderam a pintar o padrão num só azulejo, separando as cores com uma linha fina para não escorrerem no forno. Mais tarde, o padrão passou a ser marcado em relevo no barro cru, e o vidrado era deitado entre os rebordos. Cada técnica era mais rápida e barata do que a anterior, e o azulejo foi-se espalhando.

    Mas ainda eram padrões, não imagens. A imagem chegou mais tarde: os mestres passaram a cobrir o azulejo de esmalte branco e a pintar sobre ele a pincel, como sobre papel, a partir de pinturas e gravuras italianas e flamengas. Nas paredes surgiram santos, navios, cenas inteiras. As oficinas portuguesas cresceram e, segundo os historiadores, em 1715 chegou do estrangeiro a última grande remessa de azulejo. Pouco depois, os painéis azuis e brancos tornaram-se o rosto do país.

    Em Sintra ficou o próprio início desta história: paredes onde o azulejo ainda forma estrelas e laçarias. É, segundo o museu, a maior coleção da Europa de azulejo mudéjar no seu lugar original.
  en: |-
    The tiles in Sintra were made in three ways, and together they show how the craft got simpler. First, craftsmen cut small pieces from colored glazed tiles and fitted them into a mosaic: beautiful, but very slow. Then they learned to paint the pattern on a single tile, separating the colors with a thin line so they wouldn’t run in the kiln. Later still, the pattern was pressed into the wet clay as raised ridges, and the glaze was poured between them. Each method was faster and cheaper than the last, and tile spread further and further.

    But these were still patterns, not pictures. Pictures came later: craftsmen began to coat the tile in white glaze and paint on it with a brush, as if on paper, working from Italian and Flemish paintings and engravings. Saints, ships, and whole scenes appeared on walls. Portuguese workshops grew, and according to historians, the last big shipment of tile from abroad arrived in 1715. Soon blue-and-white panels became the face of the country.

    Sintra kept the very start of that story: walls where tile still forms stars and knots. According to the museum, it is Europe’s largest collection of Mudéjar tiles still in their original places.
  ru: |-
    Плитку в Синтре делали тремя способами, и по ним видно, как ремесло упрощалось. Сначала мастера вырезали из цветных глазурованных плиток мелкие кусочки и складывали из них мозаику: красиво, но очень долго. Потом научились рисовать узор на одной плитке, разделяя цвета тонкой линией, чтобы они не растекались в печи. Ещё позже узор стали выдавливать в сырой глине бортиками, и глазурь заливали между ними. Каждый способ был быстрее и дешевле прежнего, и плитки становилось всё больше.

    Но это всё ещё были узоры, а не картины. Картина пришла позже: мастера стали покрывать плитку белой глазурью и рисовать по ней кистью, как по бумаге, по мотивам итальянских и фламандских картин и гравюр. На стенах появились святые, корабли, целые сцены. Свои мастерские росли, и в 1715 году, по данным историков, из-за границы пришла последняя крупная партия плитки. Вскоре сине-белые панно стали лицом страны.

    А в Синтре сохранилось само начало этой истории: стены, где плитка ещё складывается в звёзды и узлы. Это, как пишут в музее, крупнейшее в Европе собрание мудехарской плитки, оставшейся на своих местах.
myth:
  verdict: myth
  statement:
    pt: Os azulejos da Sala dos Árabes, em Sintra, ficaram dos mouros
    en: The tiles in Sintra’s Arab Room were left by the Moors
    ru: Плитка Арабского зала в Синтре осталась от мавров
  answer:
    pt: Foram feitos em Sevilha para D. Manuel I, por volta de 1508. Só no século XIX os tomaram por mouriscos.
    en: They were made in Seville for Manuel I around 1508. People only took them for Moorish in the 19th century.
    ru: Её сделали в Севилье для Мануэла I около 1508 года. За мавританскую её стали принимать в XIX веке.
