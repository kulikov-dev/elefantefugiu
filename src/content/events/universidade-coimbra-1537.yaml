hook:
  pt: A universidade portuguesa mudou-se cinco vezes entre Lisboa e Coimbra.
  en: Portugal’s university moved five times between Lisbon and Coimbra.
  ru: Университет Португалии пять раз переезжал между Лиссабоном и Коимброй.
seo:
  title:
    pt: A universidade que mudava de casa · Coimbra, 1537
    en: The University on the Move · Coimbra, 1537
    ru: Университет на колёсах · Коимбра, 1537
story:
  pt: |-
    O primeiro Estudo Geral de Portugal foi fundado por D. Dinis em 1290, em Lisboa. Mas na capital barulhenta os estudantes não se entendiam com os moradores, e em 1308 a universidade passou para Coimbra.

    Depois andou ao sabor das decisões dos reis: em 1338 voltou a Lisboa, em 1354 de novo a Coimbra, em 1377 outra vez a Lisboa. De cada vez mudavam-se mestres, livros e estudantes.

    Só em 1537, no reinado de D. João III, a universidade se fixou de vez em Coimbra. E em 1597 comprou à Coroa o paço real, no alto da colina, e desde então ele chama-se Paço das Escolas.
  en: |-
    King Dinis founded Portugal’s first university in 1290, in Lisbon. But in the noisy capital, students and townspeople didn’t get along, and in 1308 the university moved to Coimbra.

    After that it went wherever the kings decided: back to Lisbon in 1338, to Coimbra again in 1354, to Lisbon once more in 1377. Each time, teachers, books, and students all moved with it.

    Only in 1537, under King John III, did the university settle in Coimbra for good. In 1597 the university bought the royal palace at the top of the hill from the crown, and it has been called the Palace of the Schools ever since.
  ru: |-
    Первый университет Португалии король Диниш основал в 1290 году в Лиссабоне. Но в шумной столице студенты не ладили с горожанами, и в 1308 году университет перевели в Коимбру.

    Дальше он кочевал вслед за решениями королей: в 1338 году обратно в Лиссабон, в 1354 году снова в Коимбру, в 1377 году опять в Лиссабон. Каждый раз переезжали учителя, книги и студенты.

    Окончательно университет осел в Коимбре только в 1537 году, при короле Жуане III. А в 1597 году университет купил у короны королевский дворец на вершине холма, и с тех пор дворец так и называется: Дворец школ.
more:
  pt: |-
    A compra foi invulgar. O rei era então Filipe I, o rei espanhol que governava também Portugal. O paço custou 30 mil cruzados, mas metade a universidade não pagou: esses 15 mil tinha-os emprestado à Coroa em 1584. Assim, a dívida do rei transformou-se num edifício.

    Depois desta compra, a universidade nunca mais se mudou. O antigo paço tornou-se o seu coração: na antiga sala do trono entregam-se hoje os graus, ao lado ergueu-se a torre com o sino que chama os estudantes às aulas, e a biblioteca barroca. Desde 2013, a universidade e a colina são Património Mundial da UNESCO.
  en: |-
    It was an unusual sale. The king at the time was Philip II of Spain, who also ruled Portugal. The palace cost 30,000 cruzados, but the university only paid half: it had lent the other 15,000 to the crown back in 1584. The king’s debt turned into a building.

    After that purchase the university never moved again. The old palace became its heart: degrees are now awarded in the former throne room, and next to it rose the tower whose bell calls students to class, and a Baroque library. Since 2013 the university and its hill have been a UNESCO World Heritage Site.
  ru: |-
    Покупка вышла необычной. Королём тогда был испанец Филипп II, правивший и Португалией. Дворец стоил 30 тысяч крузаду, но половину университет не платил: эти 15 тысяч он ещё в 1584 году одолжил короне. Так долг короля превратился в здание.

    После этой покупки университет больше никуда не переезжал. Бывший дворец стал его сердцем: в тронном зале теперь вручают степени, рядом поставили башню с колоколом, который звонит студентам на занятия, и барочную библиотеку. С 2013 года университет вместе с холмом внесён в список Всемирного наследия ЮНЕСКО.
