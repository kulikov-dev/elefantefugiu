hook:
  pt: A monarquia proibiu esta canção, e a República fez dela o hino.
  en: The monarchy banned this song, and the republic made it the anthem.
  ru: Монархия запрещала эту песню, а республика сделала её гимном.
story:
  pt: >-
    Em janeiro de 1890, a Grã-Bretanha exigiu que Portugal saísse das terras entre Angola e
    Moçambique. O rei cedeu, e o país sentiu-o como uma humilhação. O compositor Alfredo Keil e o
    poeta Henrique Lopes de Mendonça escreveram numa só noite, em resposta, a marcha «A Portuguesa».
    Em 1891 cantaram-na os republicanos que se revoltaram no Porto, e a monarquia proibiu-a. A 5 de
    outubro de 1910, a República foi proclamada da varanda da Câmara Municipal de Lisboa, a canção
    proibida foi cantada nas ruas, e em 1911 a marcha tornou-se o hino nacional.
  en: >-
    In January 1890, Britain demanded that Portugal pull out of the lands between Angola and
    Mozambique. The king gave in, and the country took it as a humiliation. In reply, composer
    Alfredo Keil and poet Henrique Lopes de Mendonça wrote the march “A Portuguesa” in a single
    night. In 1891 it was sung by the republicans who rose up in Porto, and the monarchy banned it.
    On October 5, 1910, the republic was proclaimed from the balcony of Lisbon City Hall, the banned
    song rang out in the squares, and in 1911 the march became the national anthem.
  ru: >-
    В январе 1890 года Британия потребовала, чтобы Португалия ушла с земель между Анголой и
    Мозамбиком. Король уступил, и страна восприняла это как унижение. Композитор Алфреду Кейл и поэт
    Энрике Лопеш де Мендонса за одну ночь написали в ответ марш «A Portuguesa». В 1891 году его пели
    республиканцы, восставшие в Порту, и монархия его запретила. 5 октября 1910 года республику
    провозгласили с балкона лиссабонской ратуши, запрещённая песня зазвучала на площадях, а в 1911
    году стала гимном.
more:
  pt: >-
    No refrão, o hino chama «Às armas!» e «contra os canhões, marchar, marchar». Muitos estão
    convencidos de que a primeira versão dizia «contra os bretões», ou seja, os britânicos. Outros
    acham que os «bretões» foram acrescentados mais tarde, no calor das disputas políticas. O texto
    definitivo só foi aprovado em 1957.


    A marcha foi proibida depois da revolta republicana do Porto, a 31 de janeiro de 1891: os
    revoltosos cantavam-na. Vinte anos depois, a canção proibida soava nas praças como hino do novo
    regime.
  en: >-
    In the chorus, the anthem calls out “To arms!” and “against the cannons, march, march.” Many
    people are sure the first version said “against the Bretons,” meaning the British. Others think
    the “Bretons” were added later, in the heat of political battles. The final lyrics weren’t
    approved until 1957.


    The march was banned after the republican uprising in Porto on January 31, 1891: the rebels had
    been singing it. Twenty years later, the banned song rang out in the squares as the anthem of
    the new government.
  ru: >-
    В припеве гимн зовёт «К оружию!» и «против пушек, марш, марш». Многие уверены, что в первой
    версии пели «против бретонцев», то есть британцев. Другие считают, что «бретонцев» добавили
    позже, в разгар политических споров. Окончательный текст утвердили только в 1957 году.


    Запретили марш после республиканского восстания в Порту 31 января 1891 года: его пели
    восставшие. Через двадцать лет запрещённая песня звучала на площадях уже как гимн новой власти.
myth:
  verdict: fact
  statement:
    ru: "Гимн Португалии сочинили за одну ночь в ответ на ультиматум Англии"
    pt: "O hino foi escrito numa só noite, em resposta ao ultimato inglês"
    en: "Portugal’s anthem was written in one night in answer to England’s ultimatum"
  answer:
    ru: "После британского ультиматума 1890 года Кейл и Мендонса за ночь написали марш. Монархия его запретила, республика в 1911 году сделала гимном."
    pt: "Depois do ultimato britânico de 1890, Keil e Mendonça escreveram a marcha numa noite. A monarquia proibiu-a; a República fê-la hino em 1911."
    en: "After Britain’s ultimatum of 1890, Keil and Mendonça wrote the march in a night. The monarchy banned it; the republic made it the anthem in 1911."
