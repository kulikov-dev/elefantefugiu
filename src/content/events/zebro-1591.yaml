more:
  pt: >-
    Como seria, afinal, o próprio zebro, os cientistas ainda discutem. O italiano Pigafetta, que escreveu o livro de Duarte Lopes, achou que na Península viviam as mesmas zebras às riscas. Não é assim: o mais provável é que o zebro fosse um burro selvagem, parecido com os que ainda vivem em África e na Ásia.


    O animal desapareceu, mas deixou rasto nos nomes de lugares. Segundo uma das versões, é dele que vem o nome da Zebreira, perto de Idanha-a-Nova, embora haja outras interpretações.


    Assim, na palavra «zebra», que qualquer criança conhece, vive a memória de um animal português que já ninguém vai ver.
  en: >-
    What the zebro itself looked like is still debated. The Italian Filippo Pigafetta, who wrote up Lopes’s book, assumed Iberia had the same striped zebras. It didn’t: the zebro was most likely a wild ass, similar to the ones that still live in Africa and Asia.


    The animal vanished but left traces in place names. According to one theory, the village of Zebreira near Idanha-a-Nova takes its name from it, though there are other explanations.


    So the word “zebra,” which every child knows, keeps the memory of a Portuguese animal no one will ever see again.
  ru: >-
    Каким был сам зебро, учёные спорят до сих пор. Итальянец Пигафетта, который записал книгу Лопеша, решил, что в Иберии жили те же полосатые зебры. Это не так: скорее всего, зебро был диким ослом, вроде тех, что и сейчас живут в Африке и Азии.


    Зверь исчез, но оставил след в названиях мест. По одной из версий, от него идёт имя деревни Зебрейра под Иданья-а-Нова, хотя есть и другие толкования.


    Так в слове «зебра», которое знает каждый ребёнок, живёт память о португальском звере, которого никто из нас уже не увидит.
