story:
  pt: >-
    Na Península Ibérica medieval vivia um burro selvagem, o zebro. Falam dele forais antigos e registos de caça. No século XVI o animal desapareceu: em Espanha, as últimas testemunhas viram-no na década de 1570.


    Mais ou menos na mesma altura, os portugueses que comerciavam no Congo e em Angola encontraram um cavalo selvagem às riscas. Parecido com um burro e igualmente selvagem, recebeu o nome que já conheciam. No livro sobre o Congo publicado em Roma em 1591, a partir dos relatos do português Duarte Lopes, a zebra já aparece descrita, e de Portugal a palavra passou a outras línguas.
  en: >-
    In medieval Iberia there lived a wild ass called the zebro. Old town charters and hunting records mention it. By the 1500s the animal was gone: in Spain, the last sightings date from the 1570s.


    Around the same time, Portuguese traders in Kongo and Angola came across a wild striped horse. It looked like a donkey and was just as wild, so it got a familiar name. A book about Kongo, published in Rome in 1591 from the accounts of the Portuguese traveler Duarte Lopes, already describes the zebra, and from Portuguese the word spread to other languages.
  ru: >-
    В средневековой Иберии жил дикий осёл, зебро. Его упоминают старые грамоты и записи об охоте. К XVI веку зверь исчез: в Испании последние свидетели видели его в 1570-х.


    Примерно тогда же португальцы, торговавшие в Конго и Анголе, встретили дикую полосатую лошадь. Похожая на осла и такая же дикая, она получила знакомое имя. В книге о Конго, изданной в Риме в 1591 году по рассказам португальца Дуарте Лопеша, зебра уже описана, и из Португалии слово ушло в другие языки.
