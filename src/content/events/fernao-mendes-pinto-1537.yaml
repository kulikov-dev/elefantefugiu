more:
  pt: |-
    Ao que parece, nem o próprio Pinto percebia tudo na sua vida. Enriquecido no comércio, em 1554 deu quase toda a fortuna aos jesuítas e fez-se noviço. Influenciado por São Francisco Xavier, foi como embaixador junto de um senhor japonês, desiludiu-se e três anos depois deixou a ordem.

    Em Portugal passou anos a pedir ao rei recompensa pelos seus serviços. Foi-lhe concedida uma tença, mas, segundo ele, nunca a recebeu. Comprou então uma quinta no Pragal e sentou-se a escrever, para os filhos, como explicava. O livro esperou ainda 30 anos pela impressão: passou pela Inquisição, e cortaram-se passagens sobre os jesuítas.

    Depois foi traduzido para seis línguas, e a Europa leu-o avidamente. Os historiadores ainda discutem o que é verdade e o que foi tirado de outros, mas as descrições da China e do Sião são consideradas valiosas. Nos 500 anos do seu nascimento, em 2011, foi cunhada uma moeda de 2 euros.
  en: |-
    Pinto himself seems not to have understood everything about his life. Having grown rich in trade, in 1554 he gave almost his entire fortune to the Jesuits and became a novice. Inspired by the missionary Francis Xavier, he went as an envoy to a Japanese lord, grew disillusioned, and left the order three years later.

    Back in Portugal, he spent years asking the king for a reward for his service. He was granted a pension but, by his account, never received it. So he bought a small estate in Pragal and sat down to write, for his children, as he explained. The book waited another 30 years to be printed: it had to pass the Inquisition, and passages about the Jesuits were cut.

    Then it was translated into six languages, and Europe devoured it. Historians still argue over what is true and what was borrowed from others, but his descriptions of China and Siam are considered valuable. For his 500th birthday, in 2011, Portugal issued a 2-euro coin.
  ru: |-
    Сам Пинту, похоже, тоже не всё понимал в своей жизни. Разбогатев на торговле, он в 1554 году отдал почти всё состояние иезуитам и сам стал послушником. Под влиянием миссионера Франциска Ксаверия он поехал послом к японскому князю, разочаровался и через три года ушёл из ордена.

    Дома он годами просил у короля награду за службу. Пенсию ему назначили, но, по его словам, так и не выплатили. Тогда он купил усадьбу в Прагале и сел писать, для детей, как он объяснял. Книга ещё 30 лет ждала печати: её проверяла инквизиция, а места про иезуитов вычёркивали.

    Зато потом её перевели на шесть языков, и Европа зачитывалась. Историки до сих пор спорят, что в ней правда, а что взято у других, но описания Китая и Сиама считаются ценными. В честь пятисотлетия Пинту в 2011 году выпустили монету в 2 евро.
myth:
  verdict: fact
  statement:
    pt: Em Portugal, o nome Mendes Pinto virou piada sobre mentirosos
    en: In Portugal, the name Mendes Pinto became a joke about liars
    ru: В Португалии имя Мендеш Пинту стало шуткой про лжеца
  answer:
    pt: Por causa do seu livro incrível sobre a Ásia, o nome virou o trocadilho «Fernão, mentes? Minto!».
    en: Because of his incredible book about Asia, his name became the pun “Fernão, mentes? Minto!” (“Fernão, are you lying? I am!”).
    ru: Из-за невероятной книги о странствиях по Азии его имя переделали в каламбур «Fernão, mentes? Minto!», то есть «Фернан, врёшь? Вру!»
