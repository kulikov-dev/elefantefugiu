hook:
  pt: Contou as viagens de forma tão incrível que o nome virou piada.
  en: He told his travels so wildly that his name became a joke.
  ru: Он так невероятно рассказывал о странствиях, что его имя стало шуткой.
story:
  pt: |-
    Fernão Mendes Pinto nasceu por volta de 1509 numa família pobre de Montemor-o-Velho. Em 1537 partiu para a Índia à procura de fortuna, como milhares de portugueses sem dinheiro nem título.

    Passou 21 anos na Ásia: foi soldado, mercador, pirata, embaixador. Segundo ele, foi feito prisioneiro 13 vezes e vendido como escravo 17. De regresso, instalou-se no Pragal, do outro lado do rio, em frente a Lisboa, e escreveu tudo o que viveu.

    A «Peregrinação» saiu só em 1614, já depois da sua morte. Os leitores não acreditaram em metade, e o nome do autor virou trocadilho: Fernão Mendes Pinto → «Fernão, mentes? Minto!».
  en: |-
    Fernão Mendes Pinto was born around 1509 to a poor family in Montemor-o-Velho. In 1537 he sailed to India to seek his fortune, like thousands of Portuguese with no money and no title.

    He spent 21 years in Asia: soldier, merchant, pirate, ambassador. By his own account, he was captured 13 times and sold into slavery 17 times. Back home, he settled in Pragal, across the river from Lisbon, and wrote down everything he’d lived through.

    His book, the Peregrinação (“Pilgrimage”), came out only in 1614, after his death. Readers didn’t believe half of it, and his name became a pun: Fernão MENdes PINto → “Fernão, MENtes? MINto!” In Portuguese, that means “Fernão, are you lying? I am!”
  ru: |-
    Фернан Мендеш Пинту родился около 1509 года в бедной семье в Монтемор-у-Велью. В 1537 году он уплыл в Индию за удачей, как тысячи португальцев без денег и титула.

    В Азии он провёл 21 год: был солдатом, купцом, пиратом, послом. По его словам, его 13 раз брали в плен и 17 раз продавали в рабство. Вернувшись, он поселился в Прагале, через реку от Лиссабона, и записал всё, что пережил.

    Книга «Странствие» вышла в 1614 году, уже после его смерти. Читатели не поверили и половине, и его имя переделали в шутку. Фернан Мендеш Пинту → «Фернан, mentes? Minto!»: «Фернан, врёшь? Вру!». По-португальски это звучит почти как его имя.
