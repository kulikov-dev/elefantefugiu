more:
  pt: >-
    Ainda se discute quem viu primeiro as gravuras: fala-se de 1991 e de 1993. Mas só se tornaram
    conhecidas no outono de 1994, com a obra já em curso, e foi então que começou a campanha. O lema
    brincava com a canção «Nadar», dos Black Company, um grupo de rap muito popular na altura.


    Não se salvou uma rocha, mas uma galeria inteira. As gravuras foram feitas ao longo de muitos milhares de anos, e as mais antigas têm mais de 20 mil anos. Em geral, esta arte da Idade da Pedra encontra-se em grutas, mas aqui está ao ar livre.


    Em 1998 o vale entrou na lista do Património Mundial da UNESCO. E Guterres, que parou a barragem, viria a ser secretário-geral da ONU.
  en: >-
    Who saw the engravings first is still debated: both 1991 and 1993 come up. But they only became widely known in the fall of 1994, with construction already underway, and that’s when the campaign began. The slogan played on “Nadar” (“Swimming”), a song by Black Company, a rap group that was hugely popular at the time.


    What was saved was not a single rock but an entire gallery. The engravings were made over many thousands of years, and the oldest are more than 20,000 years old. Stone Age art like this is usually found in caves; here it stands in the open air.


    In 1998 the valley was added to UNESCO’s World Heritage list. And Guterres, who stopped the dam, later became Secretary-General of the United Nations.
  ru: >-
    Кто первым увидел рисунки, спорят до сих пор: называют и 1991, и 1993 год. Но широко о них узнали только осенью 1994-го, когда стройка уже шла, и тогда же началась кампания. Лозунг обыгрывал песню «Nadar» («Плавать») популярной тогда рэп-группы Black Company.


    Спасли не одну скалу, а целую галерею. Рисунки вырезали много тысяч лет подряд, и самым древним больше 20 тысяч лет. Обычно такие рисунки каменного века находят в пещерах, а здесь они стоят под открытым небом.


    В 1998 году долину внесли в список Всемирного наследия ЮНЕСКО. А Гутерреш, который остановил плотину, потом стал генеральным секретарём ООН.
