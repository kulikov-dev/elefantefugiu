hook:
  pt: "Gravuras da Idade da Pedra travaram uma barragem."
  en: "A dam was scrapped over Stone Age rock art."
  ru: "Стройку плотины отменили из-за рисунков каменного века."
story:
  pt: >-
    Corria o início dos anos 1990 quando as obras de uma barragem arrancaram no rio Côa, no nordeste
    de Portugal. A albufeira ia inundar o vale.

    Durante as obras, arqueólogos repararam em figuras gravadas nas rochas de xisto junto ao rio: cavalos com crinas, auroques, veados e cabras-monteses. As gravuras mais antigas têm mais de 20 mil anos. Se a barragem fosse concluída, ficariam para sempre debaixo de água.

    Em 1994 os jornais noticiaram a descoberta, e habitantes, cientistas e jornalistas de todo o país saíram em defesa das gravuras. O lema passou a ser «As gravuras não sabem nadar». Em novembro de 1995, o novo primeiro-ministro, António Guterres, cancelou a obra, e em vez de uma albufeira o vale ganhou um parque arqueológico.
  en: >-
    In the early 1990s, work began on a dam on the Côa River in northeastern Portugal. Its reservoir was going to flood the valley.

    While construction went on, archaeologists noticed figures carved into the schist rocks by the river: horses with manes, aurochs, deer, and wild goats. The oldest are more than 20,000 years old. If the dam had been finished, they would have been underwater forever.

    In 1994 the newspapers reported the find, and locals, scientists, and journalists across the country rallied to save the engravings. Their slogan became “The engravings can’t swim.” In November 1995 the new prime minister, António Guterres, canceled the project, and instead of a reservoir the valley got an archaeological park.
  ru: >-
    В начале 1990-х на реке Коа, на северо-востоке Португалии, начали строить плотину. Водохранилище должно было затопить долину.

    Пока шли работы, археологи заметили на сланцевых скалах у реки вырезанных лошадей с гривами, туров, оленей и горных козлов. Самым старым рисункам больше 20 тысяч лет. Если бы плотину достроили, они навсегда ушли бы под воду.

    В 1994 году о находке написали газеты, и за рисунки вступились жители, учёные и журналисты по всей стране. Лозунгом стала фраза «Гравюры не умеют плавать». В ноябре 1995 года новый премьер-министр Антониу Гутерреш отменил строительство, и вместо водохранилища в долине устроили археологический парк.
