more:
  pt: >-
    Serão estas as vinhas mais antigas? Não exatamente. Segundo os produtores locais, há vinha aqui há uns quinhentos anos, mas cada planta não vive tanto, e uma videira de oitenta anos já é tratada como um monumento. A raridade de Colares está noutra coisa: a Ramisco é, possivelmente, a única casta que nunca foi enxertada em raízes americanas.


    Plantá-la dá muito trabalho. Para as raízes chegarem ao barro húmido, abre-se na areia uma vala com vários metros de fundo, e as paredes estão sempre a desabar. As videiras crescem rentes ao chão, levantadas por pequenas estacas de madeira, e protegidas do vento salgado por paliçadas de cana seca.


    A areia travou a filoxera, mas não travou as férias. A terra junto ao mar, perto de Sintra, ficou cara, e no lugar das vinhas nasceram moradias e vivendas. Em 1950, Colares produzia mais de um milhão de litros de vinho por ano; hoje, cerca de vinte mil: os viticultores perderam mais de nove décimos das suas terras.
  en: >-
    Are these the oldest vineyards? Not quite. According to local winemakers, grapes have grown here for about five hundred years, but individual vines don’t live that long, and an eighty-year-old vine is already treated like a monument. What makes Colares rare is something else: Ramisco may be the only grape variety never grafted onto American roots.


    Planting it is hard work. To reach the moist clay, growers dig a trench several meters deep in the sand, and its walls keep caving in. The vines sprawl low, propped up on short wooden sticks, and are shielded from the salty wind by fences of dried reeds.


    The sand stopped phylloxera, but it couldn’t stop the beach crowd. Seaside land near Sintra became expensive, and houses and villas went up where the vineyards had been. In 1950, Colares made over a million liters of wine a year; today it makes about twenty thousand. The growers have lost more than nine-tenths of their land.
  ru: >-
    Самые древние ли это виноградники? Не совсем. Виноград здесь растёт, по словам местных виноделов, около пятисот лет, но отдельные кусты так долго не живут, и восьмидесятилетнюю лозу тут уже называют памятником. Редкость Колареша в другом: рамишку, возможно, единственный сорт винограда, который ни разу не прививали на американские корни.


    Сажать его тяжело. Чтобы корни дотянулись до влажной глины, в песке копают траншею глубиной в несколько метров, а её стенки всё время осыпаются. Лозы стелются низко, их приподнимают на деревянных подпорках, а от солёного ветра закрывают заборами из сухого тростника.


    Филлоксеру песок остановил, а курорт нет. Земля у моря под Синтрой стала дорогой, и на месте виноградников выросли дачи и виллы. В 1950 году Колареш делал больше миллиона литров вина в год, сегодня около двадцати тысяч: виноделы потеряли больше девяти десятых своих земель.
