hook:
  pt: A areia salvou Colares da filoxera, mas não das casas de férias.
  en: Sand saved Colares’ vines from phylloxera, but not from vacation homes.
  ru: Песок спас лозы Колареша от филлоксеры, но не спас от дач.
seo:
  title:
    pt: A vinha que a areia salvou · Colares, 1908
    en: The Vines Saved by Sand · Colares, 1908 | O Elefante Fugiu
    ru: Виноград, который спас песок · Колареш, 1908
story:
  pt: >-
    Na segunda metade do século XIX chegou à Europa, vinda da América, a filoxera. É um inseto minúsculo, parecido com um pulgão: vive na terra, nas raízes da videira, chupa-lhes a seiva, e a planta morre em poucos anos. A filoxera atravessou a França, a Espanha e Portugal, e quase todas as vinhas antigas tiveram de ser arrancadas.


    A salvação foram as raízes americanas: nelas enxertava-se a videira europeia, porque a videira americana resiste à filoxera. Desde então, quase toda a vinha da Europa cresce sobre raízes alheias.


    Em Colares, junto ao mar, não foi preciso enxertar. Aqui a casta Ramisco cresce nas dunas, em areia pura. A filoxera não consegue viver na areia: as galerias que abre até às raízes desabam logo. Por isso as videiras de Colares crescem sobre as suas próprias raízes, como antes da praga.
  en: >-
    In the second half of the 19th century, phylloxera arrived in Europe from America. It’s a tiny insect, similar to an aphid: it lives in the soil on grapevine roots, sucks their sap, and the vine dies within a few years. Phylloxera swept through France, Spain, and Portugal, and almost all the old vineyards had to be pulled up.


    The rescue came from American roots: European vines were grafted onto them, because American grapes can withstand phylloxera. Ever since, nearly every vine in Europe has grown on borrowed roots.


    In Colares, by the sea, grafting wasn’t needed. Here the Ramisco grape grows in the dunes, in pure sand. Phylloxera can’t live in sand: the tunnels it digs to reach the roots collapse right away. So the vines of Colares grow on their own roots, just as they did before the pest.
  ru: >-
    Во второй половине XIX века в Европу из Америки завезли филлоксеру. Это крошечное насекомое, похожее на тлю: оно живёт в земле на корнях винограда, сосёт из них сок, и куст за несколько лет погибает. Филлоксера прошла через Францию, Испанию и Португалию, и почти все старые виноградники пришлось выкорчевать.


    Спасением стали американские корни: к ним прививали европейскую лозу, потому что американский виноград филлоксеру выдерживает. С тех пор почти вся лоза Европы растёт на чужих корнях.


    В Колареше у моря прививка не понадобилась. Здесь виноград сорта рамишку растёт в дюнах, в чистом песке. Филлоксера в песке жить не может: ходы, которые она роет к корням, тут же осыпаются. Поэтому лозы Колареша растут на своих корнях, как росли до вредителя.
