hook:
  pt: Roma não conseguiu vencer o pastor. Então comprou os amigos dele.
  en: Rome couldn’t defeat the shepherd. So it bought his friends.
  ru: Победить пастуха Рим не смог. Тогда он подкупил его друзей.
story:
  pt: Viriato era um pastor lusitano e tornou-se o chefe contra quem Roma lutou oito anos. Atraía as
    legiões para as serras e para emboscadas e acabou por obrigar Roma a assinar a paz. Foi então
    que o general romano Cepião escolheu outro caminho. Três companheiros de Viriato foram ter com
    ele para negociar, e Cepião prometeu-lhes uma recompensa pela morte do chefe. De regresso,
    mataram Viriato enquanto dormia. Sem o seu chefe, os lusitanos renderam-se pouco depois.
  en: Viriathus was a Lusitanian shepherd who became the leader Rome fought for eight years. He lured
    the legions into the mountains and into ambushes, and in the end he forced Rome to sign a peace.
    That’s when the Roman general Caepio tried another way. Three of Viriathus’s companions came to
    him to negotiate, and Caepio promised them a reward for their leader’s death. When they got
    back, they killed Viriathus in his sleep. Without him, the Lusitanians soon surrendered.
  ru: Вириат был пастухом из лузитан, а стал вождём, с которым Рим воевал восемь лет. Он заманивал
    легионы в горы и засады и в конце концов заставил Рим подписать мир. Тогда римский полководец
    Цепион пошёл другим путём. Трое приближённых Вириата приехали к нему на переговоры, и он
    пообещал им награду за смерть вождя. Вернувшись, они убили Вириата во сне. Без вождя лузитаны
    вскоре сдались.
more:
  pt: >-
    A história chega-nos pelos historiadores gregos Apiano e Diodoro, que divergem nos pormenores:
    nem o nome do terceiro conjurado é o mesmo. Segundo a tradição, quando os assassinos foram
    buscar a recompensa, Cepião respondeu-lhes: «Roma não paga a traidores.» Em Apiano é diferente:
    Cepião pagou-lhes uma parte e mandou-os a Roma buscar o resto.


    Para os portugueses, Viriato tornou-se o primeiro herói do país, muito antes de Portugal
    existir. Nele vê-se um povo pequeno que não se rende a um grande império. Há ruas, escolas e
    clubes de futebol com o seu nome, e em Viseu, onde se diz que ficava o seu acampamento, tem um
    monumento.
  en: >-
    The story comes from the Greek historians Appian and Diodorus, and they disagree on the details:
    they don’t even give the same name for the third conspirator. According to legend, when the
    killers came for their reward, Caepio told them, “Rome doesn’t pay traitors.” Appian tells it
    differently: Caepio paid them part of the money and sent them to Rome for the rest.


    For the Portuguese, Viriathus became the country’s first hero, long before Portugal existed.
    They see in him a small people that won’t give in to a great empire. Streets, schools, and
    soccer clubs carry his name, and in Viseu, where his camp is believed to have stood, he has a
    monument.
  ru: >-
    Об этом рассказывают греческие историки Аппиан и Диодор, и в деталях они расходятся: даже имя
    третьего заговорщика у них разное. По преданию, когда убийцы пришли за наградой, Цепион ответил
    им: «Рим не платит предателям». У Аппиана всё иначе: Цепион заплатил им часть денег и отправил
    за остальным в Рим.


    Для португальцев Вириат стал первым героем страны, задолго до того, как появилась сама
    Португалия. В нём видят маленький народ, который не сдаётся большой империи. Его именем называют
    улицы, школы и футбольные клубы, а в Визеу, где, как считается, стоял его лагерь, ему поставили
    памятник.
