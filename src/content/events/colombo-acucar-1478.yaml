story:
  pt: >-
    No século XV, a Madeira era a ilha do açúcar da Europa. Mercadores genoveses levavam o seu açúcar por todo o Mediterrâneo e mandavam agentes à ilha. Em 1478, um desses agentes foi o jovem Cristóvão Colombo. Sabe-se isto por um processo entre mercadores em Génova, onde ele depôs como testemunha.


    Na ilha, o açúcar fazia-se cozendo o sumo da cana em grandes caldeiras. Depois da cozedura ficava um xarope espesso e escuro, que já não cristalizava. Os portugueses chamavam-lhe melaço, de mel. O xarope também se vendia, e os ingleses levaram com a mercadoria a palavra: «molasses».
  en: >-
    In the 1400s, Madeira was Europe’s sugar island. Genoese merchants shipped its sugar all over the Mediterranean and sent agents to the island. In 1478, one of those agents was a young Christopher Columbus. We know this from a lawsuit between merchants in Genoa, where he testified.


    On the island, sugar was made by boiling cane juice in big kettles. What was left after boiling was a thick, dark syrup that would no longer crystallize. The Portuguese called it “melaço,” from “mel,” honey. The syrup was sold too, and the English took the word along with the goods: molasses.
  ru: >-
    В XV веке Мадейра была сахарным островом Европы. Генуэзские купцы развозили её сахар по всему Средиземноморью и присылали на остров своих агентов. В 1478 году таким агентом был молодой Христофор Колумб. Об этом известно из судебной тяжбы между купцами в Генуе, где он давал показания.


    Сахар на острове варили из тростникового сока в больших котлах. После варки оставался густой тёмный сироп, который уже не кристаллизовался. Португальцы звали его melaço, от mel, «мёд». Сироп тоже шёл на продажу, и англичане вместе с товаром взяли слово: molasses.
