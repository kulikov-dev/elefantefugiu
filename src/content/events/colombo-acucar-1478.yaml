more:
  pt: >-
    Em 1498, a Madeira produzia mais de 120 mil arrobas de açúcar, cerca de 1800 toneladas. Mas a riqueza durou pouco. No século XVI chegou à Europa açúcar mais barato do Brasil, os engenhos da ilha pararam um após outro, e em meados do século XVII muitos estavam em ruínas.


    A ilha virou-se então para o vinho, e hoje é por ele que a Madeira é conhecida. Do século do açúcar restam os pães de açúcar no brasão do Funchal e um museu no lugar da casa de um mercador de açúcar.


    E a palavra sobreviveu ao comércio. Em Inglaterra e na América, «molasses» passou a ser o melaço de cozinha de todos os dias, sem memória da Madeira.
  en: >-
    By 1498, Madeira was producing more than 120,000 arrobas of sugar, about 1,800 metric tons. But the boom didn’t last. In the 1500s, cheaper sugar from Brazil reached Europe, the island’s mills shut down one after another, and by the mid-1600s many lay in ruins.


    So the island turned to wine, and today Madeira is known for it. The sugar age lives on in the sugar loaves on Funchal’s coat of arms and in a museum on the site of a sugar merchant’s house.


    And the word outlived the trade. In England and America, molasses became an everyday kitchen syrup, with no memory of Madeira.
  ru: >-
    К 1498 году Мадейра давала больше 120 тысяч арроб сахара, около 1800 тонн. Но богатство продержалось недолго. В XVI веке в Европу пошёл более дешёвый сахар из Бразилии, мельницы на острове встали одна за другой, и к середине XVII века многие лежали в руинах.


    Тогда остров переключился на вино, и сегодня Мадейру знают по нему. О сахарном веке напоминают сахарные головы на гербе Фуншала и музей на месте дома сахарного торговца.


    А слово пережило торговлю. В Англии и Америке molasses стала обычной кухонной патокой, без всякой памяти о Мадейре.
myth:
  verdict: fact
  statement:
    pt: A Madeira enriqueceu com o açúcar antes do vinho
    en: Madeira got rich on sugar before it got rich on wine
    ru: Мадейра разбогатела на сахаре раньше, чем на вине
  answer:
    pt: No século XV, a Madeira era a principal ilha do açúcar da Europa. Passou ao vinho quando o açúcar barato do Brasil arruinou os seus engenhos.
    en: In the 1400s Madeira was Europe’s leading sugar island. It switched to wine when cheap Brazilian sugar ruined its mills.
    ru: Правда. В XV веке Мадейра была главным сахарным островом Европы. На вино она перешла, когда дешёвый бразильский сахар разорил её мельницы.
