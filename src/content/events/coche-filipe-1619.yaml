story:
  pt: >-
    Desde 1580, Portugal era governado por reis espanhóis. Viviam em Madrid, quase nunca vinham a
    Lisboa, e os portugueses ressentiam-se: o seu país tinha-se tornado uma província.

    Em 1619, Filipe II de Portugal, que era também Filipe III de Espanha, veio finalmente. Lisboa
    recebeu-o com arcos e festas, e o rei atravessou o país num pesado coche de viagem.

    Esse coche é hoje o mais antigo do Museu Nacional dos Coches. A visita não ajudou: vinte anos
    depois, os portugueses afastaram a dinastia espanhola, e o coche ficou.
  en: >-
    From 1580, Portugal was ruled by Spanish kings. They lived in Madrid and hardly ever came to
    Lisbon, and the Portuguese resented it: their country had become a province.

    In 1619, Philip II of Portugal, who was also Philip III of Spain, finally came. Lisbon welcomed
    him with arches and festivities, and the king crossed the country in a heavy traveling coach.

    That coach is now the oldest in the National Coach Museum. The visit didn’t help: twenty years
    later the Portuguese threw out the Spanish dynasty, and the coach stayed.
  ru: >-
    С 1580 года Португалией правили испанские короли. Они жили в Мадриде, в Лиссабоне почти не
    бывали, и португальцы обижались: их страна стала провинцией.

    В 1619 году Филипп II Португальский, он же Филипп III Испанский, наконец приехал. Лиссабон
    встречал его арками и праздниками, а король ехал по стране в тяжёлой дорожной карете.

    Эта карета сегодня самая старая в Национальном музее карет. Приезд не помог: через двадцать лет
    португальцы прогнали испанскую династию, а карета осталась.
more:
  pt: >-
    O coche de 1619 não se parece com os coches dourados de gala que deram fama ao museu. É um
    veículo para longas viagens, e viajar nele era duro: nessa época ainda não havia as molas
    habituais, e a caixa costumava ser suspensa por correias de couro, por isso balançava a cada
    buraco.


    O rei veio para que as Cortes portuguesas jurassem o seu filho, o futuro Filipe IV. O juramento
    fez-se, mas o amor por Madrid não aumentou: vinte e um anos depois, a 1 de dezembro de 1640,
    Lisboa aclamou um rei seu.


    O coche sobreviveu à União e à monarquia. O museu foi aberto em 1905 pela rainha D. Amélia, e
    este coche continua a ser o mais antigo da sua coleção.
  en: >-
    The 1619 coach looks nothing like the gilded state coaches the museum is famous for. It was
    built for long journeys, and riding in it was rough: coaches didn’t have proper springs yet, and
    the body usually hung on leather straps, so it swung at every pothole.


    The king came so that the Portuguese Cortes would swear allegiance to his son, the future Philip
    IV. They took the oath, but it didn’t win Madrid any affection: twenty-one years later, on
    December 1, 1640, Lisbon proclaimed a king of its own.


    The coach outlived both the Union and the monarchy. Queen Amélia opened the museum in 1905, and
    this coach is still the oldest in its collection.
  ru: >-
    Карета 1619 года не похожа на золотые парадные кареты, которыми славится музей. Это дорожная
    повозка для долгого пути, и ехать в ней было тяжело: тогда ещё не было привычных рессор, и кузов
    обычно подвешивали на кожаных ремнях, так что на каждой яме он раскачивался.


    Король приехал, чтобы португальские кортесы присягнули его сыну, будущему Филиппу IV. Присягу
    дали, но любви к Мадриду не прибавилось: через двадцать один год, 1 декабря 1640 года, в
    Лиссабоне провозгласили своего короля.


    Карета пережила и унию, и монархию. Музей открыла в 1905 году королева Амелия, а эта карета и
    сегодня самая старая в его коллекции.
