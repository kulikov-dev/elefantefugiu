story:
  pt: >-
    Em 1543, uma tempestade levou até à ilha japonesa de Tanegashima um junco chinês onde viajavam mercadores portugueses. Assim os portugueses foram os primeiros europeus a chegar ao Japão, e durante os cem anos seguintes ali fizeram comércio e levaram coisas que os japoneses não conheciam.


    Com as coisas vieram as palavras. Os japoneses não faziam pão, por isso adotaram o português «pão», e ficou «pan». A capa de chuva passou a «kappa», e as cartas de jogar a «karuta». Estas palavras continuam vivas no japonês.


    Os japoneses chamaram aos visitantes «nanban», «bárbaros do sul», porque os navios chegavam do sul. Os pintores retrataram-nos em grandes biombos: narizes compridos, calções largos, navios enormes.
  en: >-
    In 1543, a storm drove a Chinese junk carrying Portuguese merchants to the Japanese island of Tanegashima. That made the Portuguese the first Europeans to reach Japan, and for the next hundred years they traded there and brought things the Japanese had never seen.


    Along with the things came the words. The Japanese didn’t bake bread, so they borrowed the Portuguese pão, which became pan. The rain cape, capa, became kappa, and playing cards, cartas, became karuta. These words are still used in Japanese today.


    The Japanese called the visitors nanban, “southern barbarians,” because their ships came from the south. Painters showed them on large folding screens: long noses, baggy pants, enormous ships.
  ru: >-
    В 1543 году бурей занесло к японскому острову Танэгасима китайскую джонку, на которой плыли португальские купцы. Так португальцы стали первыми европейцами в Японии и следующие сто лет торговали там и привозили вещи, которых японцы не знали.


    Вместе с вещами пришли и слова. Хлеба японцы не пекли, поэтому взяли португальское pão, и получилось «пан». Плащ от дождя capa стал «каппой», игральные карты cartas стали «карутой». Эти слова в японском живут до сих пор.


    Японцы прозвали гостей «намбан», «южные варвары», потому что корабли приходили с юга. Художники рисовали их на больших складных ширмах: высокие носы, широкие штаны, огромные корабли.
