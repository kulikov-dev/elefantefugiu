more:
  pt: >-
    O mais importante que os portugueses levaram ao Japão não foi o pão, mas a espingarda. Um senhor local comprou aos mercadores de Tanegashima dois arcabuzes e mandou um ferreiro copiá-los. Um ano depois, os artesãos japoneses já os faziam sozinhos, e pouco depois produziam talvez mais do que qualquer país da Europa. No Japão, a arma ficou mesmo conhecida como «tanegashima».


    A seguir veio a comida. De Nagasáqui, um porto que cresceu com o comércio português, espalhou-se o bolo «kasutera», do português «bolo de Castela». De onde vem a «tempura», discute-se: uma versão diz que de «tempero», outra que de «têmporas», os dias de jejum em que os católicos comiam peixe e legumes em vez de carne.


    Em 1639, os governantes do Japão expulsaram os portugueses e fecharam o país durante quase duzentos anos, por medo dos missionários. Os mercadores partiram, mas as palavras, o bolo e as espingardas ficaram.
  en: >-
    The most important thing the Portuguese brought to Japan wasn’t bread but the gun. A local lord bought two matchlocks from the merchants on Tanegashima and had a swordsmith copy them. A year later, Japanese craftsmen were making them on their own, and before long they may have been producing more than any country in Europe. In Japan, the gun was even called a tanegashima.


    Food came next. From Nagasaki, a port that grew up around Portuguese trade, came the sponge cake castella, from the Portuguese for “Castile cake.” Where tempura comes from is debated: one theory says tempero, “seasoning,” another says têmporas, the fasting days when Catholics ate fish and vegetables instead of meat.


    In 1639, Japan’s rulers expelled the Portuguese and closed the country for almost two hundred years, out of fear of the missionaries. The merchants sailed away, but the words, the cake, and the guns stayed.
  ru: >-
    Самым важным, что португальцы привезли в Японию, оказался не хлеб, а ружьё. Местный князь купил у купцов на Танэгасиме два фитильных ружья и велел кузнецу их скопировать. Через год японские мастера уже делали такие ружья сами, а скоро стали выпускать их, возможно, больше, чем любая страна Европы. В Японии ружьё так и называли: «танэгасима».


    Следом пришла еда. Из Нагасаки, порта, который вырос на португальской торговле, разошёлся бисквит кастелла: от португальского «пирог из Кастилии». Откуда взялась темпура, спорят: по одной версии, от tempero, приправа, по другой, от têmporas, постных дней, когда католики ели рыбу и овощи вместо мяса.


    В 1639 году правители Японии выслали португальцев и закрыли страну почти на двести лет: боялись миссионеров. Купцы уплыли, а слова, бисквит и ружья остались.
