hook:
  pt: Os pescadores da Póvoa não escreviam, mas cada família tinha assinatura.
  en: The fishermen of Póvoa couldn’t write, but every family had its signature.
  ru: Рыбаки Повоа не умели писать, но у каждой семьи была своя подпись.
story:
  pt: |-
    Na vila piscatória da Póvoa de Varzim, poucos sabiam ler e escrever. Mas era preciso assinar: no barco, nas redes, no palheiro da praia, no livro de dívidas do merceeiro.

    Por isso cada família tinha a sua marca, a sigla: uns quantos traços simples, parecidos com runas. Era cortada à navalha na madeira, pintada nos barcos, posta nas campas. Os investigadores contaram 84 siglas de família originais.

    A marca passava de geração em geração, mas não para o filho mais velho, e sim para o mais novo: ele ficava com os pais e herdava o barco e as redes do pai. Os irmãos mais velhos usavam a mesma marca com piques: o primeiro com um, o segundo com dois.
  en: |-
    In the fishing town of Póvoa de Varzim, few people could read or write. But they still needed to sign things: their boats, their nets, their beach sheds, the shopkeeper’s credit book.

    So each family had its own mark, a sigla: a few simple strokes that look like runes. They carved it into wood with a razor, painted it on boats, put it on gravestones. Researchers have counted 84 original family marks.

    The mark was passed down, but not to the eldest son. It went to the youngest: he stayed with his parents and inherited his father’s boat and nets. The older brothers used the same mark with notches added: the first son one notch, the second two.
  ru: |-
    В рыбацком городке Повоа-ди-Варзин мало кто умел читать и писать. Но подписываться было нужно: на лодке, на снастях, на сарае у пляжа, в долговой книге у лавочника.

    Поэтому у каждой семьи был свой знак, сигла: несколько простых черт, похожих на руны. Знак вырезали бритвой на дереве, рисовали на лодках, ставили на надгробиях. Учёные насчитали 84 исходных семейных знака.

    Знак передавался по наследству, но не старшему сыну, а младшему: он оставался с родителями и получал отцовскую лодку и сети. Старшие братья ставили тот же знак с зарубками: первый одну, второй две.
