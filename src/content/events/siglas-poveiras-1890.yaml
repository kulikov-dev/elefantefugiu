more:
  pt: |-
    Com as siglas fazia-se uma contabilidade inteira. O merceeiro apontava a dívida do pescador com a sua marca, e os círculos e traços ao lado eram moedas. O peixe apanhado era marcado com golpes de faca em forma de sigla, para se saber na partilha de quem era. Quando os noivos casavam, gravavam as suas marcas na mesa da igreja. Havia milhares delas na mesa da antiga igreja da Misericórdia, até ser demolida.

    As marcas também protegiam dos ladrões. Conta-se que um dia, em Matosinhos, um ladrão tentou vender uma bússola roubada. Uma mulher da Póvoa reconheceu a marca na tampa, e o ladrão foi levado ao capitão do porto.

    A semelhança com as runas foi notada há muito. Uns investigadores acham que as marcas vieram com os vikings; outros, que traços tão simples se inventam em todo o lado. No século XX, quando os pescadores aprenderam a ler, as siglas caíram em desuso. Mas no centro da Póvoa ainda se veem nas placas com os nomes das ruas.
  en: |-
    Siglas were a whole bookkeeping system. The shopkeeper recorded a fisherman’s debt with his mark, and the circles and strokes beside it stood for coins. Each fish caught was marked with knife cuts in the shape of a sigla, so everyone knew whose catch it was when it was divided. When couples married, they carved their marks into a table in the church. Thousands of them covered the table in the old Misericórdia church, until it was torn down.

    The marks also helped catch thieves. The story goes that once, in nearby Matosinhos, a thief tried to sell a stolen compass. A woman from Póvoa recognized the mark on its lid, and the thief was taken to the harbor master.

    The resemblance to runes was noticed long ago. Some researchers think the marks came with the Vikings; others say people everywhere invent such simple strokes on their own. In the 20th century, as fishermen learned to read, siglas fell out of use. But in central Póvoa you can still see them on street-name signs.
  ru: |-
    Сиглами вели целую бухгалтерию. Лавочник записывал долг рыбака его знаком, а кружки и чёрточки рядом означали монеты. Пойманную рыбу метили ударами ножа в форме сиглы, чтобы при дележе было видно, чей улов. Когда жених и невеста венчались, они вырезали свои знаки на столе в церкви. Тысячи таких знаков были на столе в старой церкви Мизерикордии, пока её не снесли.

    Знаки берегли и от воров. Говорят, однажды в соседнем Матозиньюше вор пытался продать украденный компас. Женщина из Повоа узнала знак на крышке, и вора отвели к капитану порта.

    Сходство с рунами заметили давно. Одни учёные считают, что знаки принесли викинги, другие — что такие простые черты люди придумывают везде сами. В XX веке, когда рыбаки научились грамоте, сиглы вышли из обихода. Но в центре Повоа их и сейчас можно увидеть на табличках с названиями улиц.
