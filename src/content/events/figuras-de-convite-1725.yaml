more:
  pt: >-
    As figuras ficavam nas entradas principais, nos patamares e junto às portas para o jardim e o pátio. Os historiadores chamam a esta época a «Grande Produção»: as oficinas de Lisboa faziam azulejo em enormes quantidades, e sobretudo em azul e branco.


    Uma destas figuras, uma dama de corpo inteiro, está no Museu Nacional do Azulejo. Tem quase 1,8 m de altura, a estatura de uma pessoa real.
  en: >-
    The figures were placed at main entrances, on landings, and by doors to gardens and courtyards. Historians call this period the “Great Production”: Lisbon workshops turned out tiles in huge quantities, mostly in blue and white.


    One of these figures, a full-length lady, is in the National Tile Museum. She is almost 1.8 m (6 ft) tall, the height of a real person.
  ru: >-
    Фигуры ставили у главных входов, на лестничных площадках, у дверей в сад и во двор. Это время историки называют «Большим производством»: лиссабонские мастерские выпускали азулежу в огромных количествах, в основном в сине-белой гамме.


    Одна такая фигура, дама в полный рост, хранится в Национальном музее азулежу. Она высотой почти 1,8 м, то есть ростом с настоящего человека.
