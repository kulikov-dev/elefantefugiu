hook:
  pt: O lacaio mais educado de Lisboa tem trezentos anos. É de azulejo.
  en: Lisbon’s politest footman is three hundred years old. He’s made of tiles.
  ru: Самому вежливому лакею Лиссабона триста лет. Он сделан из плитки.
story:
  pt: >-
    Na primeira metade do século XVIII chegava a Lisboa o ouro do Brasil, e a nobreza reconstruía os seus palácios. As paredes das entradas e das escadas cobriam-se de azulejos azuis e brancos, e as oficinas não davam conta das encomendas.


    À porta de uma casa rica, um criado recebia o convidado e acompanhava-o escada acima. Os mestres azulejadores encontraram maneira de tornar esse acolhimento eterno: junto à entrada e nos patamares começaram a pintar criados de azulejo em tamanho natural. Lacaios, alabardeiros e damas estão à entrada e na escada e recebem os convidados.


    Chamam-lhes precisamente figuras de convite. Um criado de carne e osso era preciso alimentar e vestir, mas o de azulejo fica junto à escada durante séculos e anuncia a cada visita que o dono da casa é rico.
  en: >-
    In the first half of the 18th century, Brazilian gold was flowing into Lisbon, and the nobility was rebuilding its palaces. Entrance halls and staircases were covered in blue-and-white tiles, and the workshops couldn’t keep up with orders.


    At the door of a wealthy house, a servant would greet a guest and lead them upstairs. Tile painters found a way to make that welcome permanent: by entrances and on landings, they began painting life-size servants in tile. Footmen, halberdiers, and ladies stand by the entrance and on the stairs and welcome the guests.


    They’re called figuras de convite, “welcome figures.” A real servant had to be fed and clothed, but a tile one stands by the stairs for centuries and tells every visitor that the owner of the house is rich.
  ru: >-
    В первой половине XVIII века в Лиссабон шло бразильское золото, и знать перестраивала дворцы. Стены входов и лестниц покрывали сине-белыми изразцами, и мастерские не успевали с заказами.


    У дверей богатого дома гостя встречал слуга и провожал наверх. Мастера азулежу придумали, как сделать эту встречу вечной: у входа и на площадках лестниц стали выкладывать слуг из плитки в человеческий рост. Лакеи, алебардщики и дамы стоят у входа и на лестнице и встречают гостей.


    Их так и называют, «фигуры приглашения» (figuras de convite). Живого слугу надо кормить и одевать, а изразцовый стоит у лестницы веками и каждому гостю сообщает, что хозяин дома человек богатый.
