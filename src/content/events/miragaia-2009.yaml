story:
  pt: >-
    Um estegossauro conhece-se logo: placas no dorso, espinhos na cauda e um pescoço curto, rente ao
    chão. Em 1999, perto da aldeia de Miragaia, na Lourinhã, as obras de uma estrada puseram a
    descoberto ossos que não encaixavam neste retrato.

    Os paleontólogos escavaram-nos em 1999 e 2001 e reuniram quase todo o pescoço. Tinha pelo menos 17 vértebras, mais do que a maioria dos saurópodes, os tais gigantes de pescoço comprido. A ciência não conhecia nenhum estegossauro com um pescoço assim, por isso em 2009 o achado foi descrito como espécie nova e batizado Miragaia longicollum, «a de pescoço comprido, de Miragaia».
  en: >-
    You can spot a stegosaur at a glance: plates down the back, spikes on the tail, a short neck near the ground. In 1999, near the village of Miragaia outside Lourinhã, road builders uncovered bones that didn’t fit that picture.

    Paleontologists dug them out in 1999 and 2001 and recovered almost the entire neck. It had at least 17 vertebrae, more than most sauropods, the famous long-necked giants. Science knew of no stegosaur with a neck like that, so in 2009 the find was described as a new species and named Miragaia longicollum, “the long-necked one from Miragaia.”
  ru: >-
    Стегозавров узнают сразу: пластины на спине, шипы на хвосте и короткая шея у самой земли. В 1999 году у деревни Мирагайя под Лоуриньяном строили дорогу и наткнулись на кости, которые в эту картину не вписались.

    Палеонтологи раскапывали их в 1999 и 2001 годах и собрали почти всю шею. Позвонков в ней оказалось не меньше 17, больше, чем у большинства зауроподов, тех самых длинношеих гигантов. Стегозавров с такой шеей наука не знала, поэтому в 2009 году находку описали как новый вид и назвали Miragaia longicollum, «длинношеяя из Мирагайи».
