more:
  pt: >-
    O pescoço conservou-se quase inteiro: encontraram-se 15 vértebras, faltavam apenas as duas primeiras. Nenhum outro estegossauro tinha um pescoço tão comprido.


    Para que servia, não se sabe ao certo. Os autores da descrição propuseram duas explicações. Talvez assim a Miragaia chegasse a folhas mais altas do que os vizinhos e disputasse menos comida com eles. Ou o pescoço comprido ajudava a atrair as fêmeas, como a cauda do pavão.


    A discussão sobre a Miragaia ainda não acabou. Alguns cientistas consideram que não é um género próprio, mas mais uma espécie de Dacentrurus, outro estegossauro cujos ossos aparecem em Portugal. Outros voltaram a defender, em 2025, que a Miragaia é um género à parte. Os ossos a partir dos quais foi descrita estão guardados no Museu da Lourinhã.
  en: >-
    The neck survived almost whole: 15 vertebrae were found, with only the first two missing. No other stegosaur had such a long neck.


    No one knows for sure what it was for. The authors of the description offered two explanations. Perhaps it let Miragaia reach leaves higher up than its neighbors could, so it competed less for food. Or the long neck helped it attract mates, like a peacock’s tail.


    The debate over Miragaia isn’t settled. Some scientists think it isn’t a genus of its own but another species of Dacentrurus, a stegosaur whose bones also turn up in Portugal. Others argued again in 2025 that Miragaia stands on its own. The bones it was described from are kept at the Lourinhã Museum.
  ru: >-
    Шея сохранилась почти целиком: нашли 15 позвонков, не хватало только двух первых. Ни у одного другого стегозавра шея не была такой длинной.


    Зачем она была нужна, точно не знают. Авторы описания предлагали два объяснения. Возможно, так Мирагайя доставала листья выше, чем соседи, и меньше спорила с ними за еду. Или длинная шея помогала нравиться самкам, как павлину хвост.


    Спор о Мирагайе не закончен до сих пор. Часть учёных считает её не отдельным родом, а ещё одним видом дацентруруса, другого стегозавра, кости которого находят в Португалии. Другие в 2025 году снова доказывали, что Мирагайя самостоятельна. Кости, по которым её описали, хранятся в музее Лоуриньяна.
