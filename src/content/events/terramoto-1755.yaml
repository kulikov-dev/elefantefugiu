hook:
  pt: Na manhã do terramoto, o rei já estava em Belém.
  en: >-
    On All Saints’ Day the king had already gone to Belém.
  ru: >-
    В день землетрясения король уже уехал в Белен.
story:
  pt: >-
    A 1 de novembro de 1755, Dia de Todos os Santos, D. José I ouviu missa logo de manhã e partiu
    para Belém, então nos arredores de Lisboa, porque uma das filhas queria passar o feriado fora.
    Às 9h40, o terramoto; as igrejas estavam cheias. Seguiram-se o tsunami e dias de fogo, e
    morreram dezenas de milhares. O rei escapou, mas ficou com medo de paredes, e a corte mudou-se
    para tendas na Ajuda.
  en: >-
    On November 1, 1755, All Saints’ Day, King José I heard Mass at sunrise and left for Belém, at
    the time on the outskirts of Lisbon, because a daughter wanted to spend the holiday outside the
    city. At 9:40 a.m. the earthquake hit, and the churches were full. A tsunami and days of fire
    followed; tens of thousands died. The king survived, but he feared living within walls
    afterward, and the court moved into tents on the hills of Ajuda.
  ru: >-
    1 ноября 1755 года, в День всех святых, король Жозе I после рассветной мессы уехал в Белен,
    тогда пригород Лиссабона: дочь хотела провести праздник за городом. В 9:40 началось
    землетрясение, церкви были полны. Затем нахлынуло цунами, несколько дней бушевали пожары,
    погибли десятки тысяч человек. Король остался жив, но с тех пор боялся жить в доме, и двор
    переехал в палатки на холмах Ажуды.
more:
  pt: >-
    Os números são incertos. O historiador económico Álvaro Pereira estima entre 30 000 e 40 000
    mortos em Lisboa e entre 40 000 e 50 000 em Portugal, Espanha e Marrocos; outras estimativas vão
    dos 10 000 aos 100 000. Também as alturas das ondas são discutidas: um estudo feito a partir de
    documentos da época diz que valores muito repetidos, como os 14 a 16 metros em Tânger, devem ser
    postos de parte. Pombal, o ministro do rei, terá dito: enterrar os mortos e tratar dos vivos. Os
    registos mostram que mandou retirar os corpos logo no dia seguinte, para evitar a peste. O rei
    escreveu ao cunhado, em Espanha, que ficara sem casa, sem criados, sem súbditos, sem dinheiro e
    sem pão. Hoje, a nave sem telhado do Convento do Carmo, fundado pelo vencedor de Aljubarrota, é
    o memorial do terramoto.
  en: >-
    The death toll is uncertain. The economic historian Álvaro Pereira estimates 30,000–40,000
    deaths in Lisbon and 40,000–50,000 across Portugal, Spain and Morocco; other estimates range
    from 10,000 to 100,000. Wave heights are disputed too: a study of primary documents says
    long-repeated figures, such as 14–16 meters (about 46–52 feet) at Tangier, should be abandoned.
    Pombal, the king’s chief minister, reportedly said, “Bury the dead and heal the living.” Records
    show he ordered the bodies removed the very next day, to prevent plague. The king wrote to his
    brother-in-law in Spain that he had no house, no servants, no subjects, no money, no bread.
    Today the roofless nave of the Carmo Convent, founded by Nuno Álvares Pereira of Aljubarrota
    fame, serves as the memorial.
  ru: >-
    Цифры неточны. Историк экономики Альваро Перейра оценивает число погибших в 30 000–40 000 в
    Лиссабоне и 40 000–50 000 в Португалии, Испании и Марокко; другие оценки колеблются от 10 000 до
    100 000. Высоты волн тоже оспариваются: исследование по документам эпохи говорит, что давно
    повторяемые цифры, например 14–16 м в Танжере, нужно отбросить. Помбал, главный министр короля,
    якобы сказал: хоронить мёртвых и лечить живых. По записям, уже на следующий день он приказал
    убрать тела, чтобы предотвратить чуму. Король написал шурину в Испанию, что у него нет ни дома,
    ни слуг, ни подданных, ни денег, ни хлеба. Сегодня неф монастыря Кармо, основанного победителем
    при Алжубарроте Нуну Алварешем Перейрой, стоит без крыши и служит мемориалом.
