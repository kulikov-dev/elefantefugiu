hook:
  pt: O palácio real do Buçaco ficou pronto quando já não havia reis.
  en: The Buçaco royal palace was finished when no kings were left.
  ru: Королевский дворец в лесу Бусаку достроили, когда королей уже не осталось.
story:
  pt: |-
    Em 1888, começou a construir-se na Mata do Buçaco um palácio real de verão e de caça. O lugar foi aberto sem piedade: demoliu-se a maior parte do velho convento carmelita, e ficaram só a igreja, o claustro e algumas celas.

    O arquiteto italiano Luigi Manini, cenógrafo de teatro, desenhou o palácio como um conto de fadas: torre, arcos rendilhados, tudo no estilo da época dos Descobrimentos. A obra levou quase vinte anos. Em 1908, o rei D. Carlos foi morto em Lisboa, e em 1910 a monarquia caiu.

    A família real nunca chegou a viver no palácio. Em 1917 abriu como hotel, e ainda hoje lá dormem hóspedes.
  en: |-
    In 1888, work began on a royal summer and hunting palace in the Buçaco forest. The site was cleared without mercy: most of the old Carmelite convent was torn down, leaving only the church, the cloister, and a few cells.

    The Italian architect Luigi Manini, a theater set designer, drew the palace like a fairy tale: a tower, lace-like arches, all in the style of the Age of Discovery. It took almost twenty years to build. In 1908 King Carlos was assassinated in Lisbon, and in 1910 the monarchy fell.

    The royal family never got to live in the palace. In 1917 it opened as a hotel, and guests still stay there today.
  ru: |-
    В 1888 году в лесу Бусаку начали строить королевский летний и охотничий дворец. Место освобождали без жалости: снесли большую часть старого монастыря кармелитов, оставили только церковь, двор и несколько келий.

    Итальянский архитектор Луиджи Манини, театральный декоратор, нарисовал дворец как сказку: башня, резные арки, всё в стиле эпохи открытий. Строили его почти двадцать лет. В 1908 году в Лиссабоне убили короля Карлуша, а в 1910 году монархию свергли.

    Королевская семья пожить во дворце так и не успела. В 1917 году его открыли как гостиницу, и в ней до сих пор живут гости.
more:
  pt: |-
    O palácio está decorado com azulejos com cenas da literatura e da história portuguesas, entre elas a Batalha do Buçaco: Manini e os seus sucessores não construíam uma casa, mas um monumento ao passado português. As obras terminaram em 1907, um ano antes da morte do rei.

    Junto ao palácio sobreviveram celas do convento, e uma delas é especialmente lembrada. Na noite a seguir à Batalha do Buçaco, a 27 de setembro de 1810, nela dormiu Wellington, que ali derrotara o exército de Masséna. As suites reais do hotel têm os nomes de D. Carlos, D. Amélia e D. Manuel, embora eles nunca lá tenham vivido.
  en: |-
    Inside, the palace is decorated with tiles showing scenes from Portuguese literature and history, including the Battle of Buçaco: Manini and his successors weren’t building a house but a monument to Portugal’s past. The work was finished in 1907, a year before the king was killed.

    Next to the palace, some of the convent’s cells survived, and one of them is especially remembered. On the night after the Battle of Buçaco, September 27, 1810, Wellington slept there after defeating Masséna’s army. The hotel’s royal suites are named after Carlos, Amélia, and Manuel, even though they never lived there.
  ru: |-
    Внутри дворец украшен плиткой со сценами из португальской литературы и истории, в том числе битвы при Бусаку: Манини и его преемники строили не дом, а памятник португальскому прошлому. Работы закончили в 1907 году, за год до гибели короля.

    Рядом с дворцом уцелели кельи монастыря, и одну из них помнят особо. В ночь после битвы при Бусаку, 27 сентября 1810 года, в ней спал Веллингтон, разбивший здесь армию Массены. Королевские номера в гостинице назвали именами Карлуша, Амелии и Мануэла, хотя сами они здесь не жили.
