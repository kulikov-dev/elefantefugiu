hook:
  pt: O dinheiro do Brasil pagou hospital, escolas e fábricas de uma vila.
  en: In a northern town, Brazil’s money built a hospital, schools, and factories.
  ru: В маленьком городе больницу, школы и фабрики построили на деньги из Бразилии.
story:
  pt: |-
    No século XIX, no norte de Portugal, as famílias eram grandes e a terra dava pouco. Um só pedaço de terra não chegava para todos. Por isso, rapazes de uns doze anos eram mandados para o outro lado do oceano, para o Brasil, para casa de parentes ou conterrâneos. Começavam como caixeiros nas lojas do Rio de Janeiro.

    A maioria nunca enriqueceu. Mas alguns voltavam dez ou vinte anos depois com dinheiro, e em casa chamavam-lhes simplesmente «brasileiros». Só da vila de Fafe partiram em cem anos quase nove mil pessoas.

    Os que voltavam construíam palacetes para si, mas investiam também na terra natal. Nos anos 1860 abriu em Fafe um hospital, depois escolas e fábricas. A vila foi mudando: em 1907 chegou o comboio, e nos anos 1910 acendeu-se a eletricidade.
  en: |-
    In 19th-century northern Portugal, families were big and the land gave little. One plot couldn’t feed them all. So boys of about twelve were sent across the ocean to Brazil, to relatives or people from their hometown. They started out as shop boys in Rio de Janeiro.

    Most never got rich. But some came back ten or twenty years later with money, and at home they were simply called “Brazilians.” From the small town of Fafe alone, almost nine thousand people left over a hundred years.

    Those who returned built mansions for themselves, but they also invested in their hometown. In the 1860s Fafe got a hospital, then schools and factories. The town kept changing: in 1907 the railroad arrived, and in the 1910s the electric lights came on.
  ru: |-
    В XIX веке на севере Португалии семьи были большие, а земля кормила плохо. Прокормить всех один надел не мог. Поэтому мальчиков лет двенадцати отправляли за океан, в Бразилию, к родственникам или землякам. Они начинали подручными в лавках Рио-де-Жанейро.

    Большинство так и не разбогатело. Но некоторые через десять-двадцать лет возвращались с деньгами, и дома их звали просто «бразильцами». Из одного только городка Фафе за сто лет уехало почти девять тысяч человек.

    Вернувшиеся строили себе особняки, но вкладывали деньги и в родной город. В 1860-х в Фафе открылась больница, потом школы и фабрики. Город менялся и дальше: в 1907 году пришёл поезд, а в 1910-х зажглось электричество.
