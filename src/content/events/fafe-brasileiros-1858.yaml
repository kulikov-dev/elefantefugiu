more:
  pt: |-
    De Fafe partiam famílias inteiras, de todas as camadas, até a fidalguia local. Os parentes chamavam os parentes, e do outro lado do oceano cada um tinha a sua rede de conterrâneos. Por isso, ao enriquecer, muitos pensavam não só em si, mas na terra que os tinha mandado.

    O dinheiro dos «brasileiros» ainda se vê em Fafe. Os palacetes eram feitos em grande: móveis de madeira brasileira, piano obrigatório, livros em francês, plantas tropicais nos jardins. E para a vila construíam o que lhe faltava: escolas para crianças pobres, um asilo, o hospital, as primeiras fábricas de tecidos, onde trabalhavam já os que nunca partiram.

    Em 2001 abriu em Fafe o Museu das Migrações e das Comunidades, e é precisamente esta a história que ele conta.
  en: |-
    Whole families left Fafe, from every walk of life, even the local gentry. Relatives sent for relatives, and across the ocean everyone had a network of people from home. So when they grew rich, many thought not only about themselves but about the town that had sent them.

    The “Brazilians’” money is still visible in Fafe. Their mansions were built on a grand scale: furniture of Brazilian wood, a piano without fail, French books, tropical plants in the gardens. And for the town they built what it lacked: schools for poor children, an orphanage, the hospital, the first textile mills, where those who never left found work.

    In 2001, Fafe opened its Museum of Migrations and Communities, and it tells exactly this story.
  ru: |-
    Уезжали из Фафе семьями и из всех слоёв, даже местная знать. Родственники звали родственников, и за океаном у каждого была своя цепочка земляков. Поэтому, разбогатев, многие думали не только о себе, но и о том городе, который их отправил.

    Деньги «бразильцев» видны в Фафе до сих пор. Особняки строили с размахом: мебель из бразильского дерева, обязательное пианино, французские книги, в садах тропические растения. А для города они строили то, чего ему не хватало: школы для бедных детей, приют, больницу, первые ткацкие фабрики, на которых работали уже те, кто никуда не уехал.

    В 2001 году в Фафе открыли Музей миграций и общин, и рассказывает он как раз эту историю.
myth:
  verdict: fact
  statement:
    pt: Em Fafe, chamava-se «brasileiros» aos portugueses
    en: In Fafe, “Brazilians” meant Portuguese people
    ru: «Бразильцами» в Фафе звали португальцев
  answer:
    pt: Era o nome dado aos conterrâneos que regressavam do Brasil com dinheiro. Com esse dinheiro construíram-se em Fafe o hospital, escolas e fábricas.
    en: That was the name for townspeople who came back from Brazil with money. That money built Fafe’s hospital, schools, and factories.
    ru: Так звали земляков, вернувшихся из Бразилии с деньгами. На эти деньги в Фафе строили больницу, школы и фабрики.
