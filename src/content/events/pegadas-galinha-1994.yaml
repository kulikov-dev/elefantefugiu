story:
  pt: >-
    Na Serra de Aire, junto à aldeia do Bairro, perto de Ourém, a família Galinha extraiu calcário durante anos. A pedra era retirada camada a camada e, no verão de 1994, numa laje acabada de pôr a descoberto, apareceram filas de covas enormes.

    Eram pegadas de saurópodes. Há cerca de 170 milhões de anos havia aqui águas pouco fundas, e gigantes de pescoço comprido caminharam sobre o lodo mole. O lodo endureceu, novas camadas cobriram-no, e as pegadas ficaram escondidas até os trabalhadores da pedreira as descobrirem. O trilho mais longo estende-se por 147 metros, um dos mais longos conhecidos no mundo.

    Continuar a extrair pedra significava destruir o achado. Por isso a pedreira fechou, e a laje foi classificada como monumento natural.
  en: >-
    In the Serra de Aire hills, near the village of Bairro outside Ourém, the Galinha family quarried limestone for years. The stone came off layer by layer, and in the summer of 1994 rows of huge dents appeared on a freshly exposed slab.

    They were sauropod footprints. About 170 million years ago this was shallow water, and long-necked giants walked across the soft mud. The mud turned to stone, new layers covered it, and the tracks stayed hidden until the quarry workers uncovered them. The longest trackway runs for 147 meters, one of the longest known in the world.

    Quarrying any further would have destroyed the find. So the quarry was closed, and the slab was declared a natural monument.
  ru: >-
    В Серра-де-Айре, у деревни Байру под Оуренем, годами добывали известняк в карьере семьи Галинья. Камень снимали пласт за пластом, и летом 1994 года на свежей плите показались ряды огромных вмятин.

    Это были следы зауроподов. Около 170 млн лет назад здесь было мелководье, и длинношеие гиганты прошли по мягкому илу. Ил окаменел, сверху его укрыли новые слои, и следы пролежали под ними, пока их не вскрыли камнерезы. Самая длинная цепочка тянется на 147 метров, это одна из самых длинных известных в мире.

    Добывать камень дальше значило уничтожить находку. Поэтому карьер закрыли, а плиту объявили природным памятником.
more:
  pt: >-
    As pegadas de um saurópode são de dois tipos. As patas traseiras deixavam grandes covas ovais, as dianteiras marcas mais pequenas, em forma de ferradura. Pela distância entre elas, os cientistas percebem o tamanho do animal, o comprimento do passo e para onde virava.


    Pegadas de saurópodes desta idade, do Jurássico Médio, são raras no mundo. Por isso a pedreira do Galinha é conhecida por paleontólogos muito para lá de Portugal: mostra como andavam os gigantes de pescoço comprido muito antes de os predadores da história vizinha porem os seus ovos na Lourinhã.


    Hoje há um caminho sobre a laje, e pode-se acompanhar o trilho mais longo, passo a passo.
  en: >-
    Sauropods left two kinds of prints. The hind feet made large oval pits, the front feet smaller horseshoe-shaped ones. From the spacing, scientists can tell how big the animal was, how long its stride was, and where it turned.


    Sauropod tracks this old, from the Middle Jurassic, are rare worldwide. That’s why paleontologists far beyond Portugal know the Galinha quarry: it shows how the long-necked giants walked long before the predators in the neighboring story laid their eggs at Lourinhã.


    Today a path runs across the slab, and you can walk alongside the longest trackway, step by step.
  ru: >-
    Следы у зауропода двух видов. Задние лапы оставляли большие овальные ямы, передние поменьше, в форме подковы. По расстоянию между ними учёные видят, какой длины было животное, как широко оно шагало и куда поворачивало.


    Следов зауроподов такого возраста, средней юры, в мире сохранилось мало. Поэтому карьер Галинья знают палеонтологи далеко за пределами Португалии: по нему видно, как ходили длинношеие гиганты задолго до того, как в Лоуриньяне отложили свои яйца хищники из соседней истории.


    Сейчас по плите проложена дорожка, и самую длинную цепочку можно пройти рядом, шаг за шагом.
