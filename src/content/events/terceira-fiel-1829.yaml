hook:
  pt: Portugal aceitou o tio; só uma ilha ficou fiel à rainha menina.
  en: Portugal backed the uncle; one island stayed loyal to its child queen.
  ru: Вся Португалия признала дядю, и только один остров остался верен девятилетней королеве.
seo:
  title:
    pt: A ilha que não jurou ao tio · Terceira, 1829
    en: The Island Loyal to a Girl Queen · Terceira, 1829
    ru: Остров, который не присягнул дяде · Терсейра, 1829
story:
  pt: |-
    O rei D. Pedro vivia no Brasil, onde era imperador, e deu o trono português à filha, Maria, que tinha sete anos. Confiou a regência, até ela crescer, ao irmão, D. Miguel. Miguel devia jurar fidelidade à Carta Constitucional e, quando Maria fosse adulta, casar com ela.

    Em fevereiro de 1828, Miguel voltou a Lisboa como regente e, no verão, proclamou-se rei. Todo o país o reconheceu, exceto a Madeira e a Terceira. A Madeira foi tomada depressa. A Terceira ficou do lado da jovem rainha.

    Para a ilha foram chegando os seus partidários. A 11 de agosto de 1829, a armada de Miguel tentou desembarcar tropas junto à vila da Praia, mas o desembarque foi repelido. A Praia ganhou um novo nome: Praia da Vitória.
  en: |-
    King Pedro lived in Brazil, where he was emperor, and gave the Portuguese throne to his daughter Maria, who was seven. Until she grew up, he entrusted the regency to his brother Miguel. Miguel was to swear loyalty to the constitution and, once Maria came of age, marry her.

    In February 1828, Miguel returned to Lisbon as regent, and that summer he proclaimed himself king. The whole country accepted him except Madeira and Terceira. Madeira was taken quickly. Terceira stood by the young queen.

    Her supporters began arriving on the island. On August 11, 1829, Miguel’s fleet tried to land troops near the town of Praia, but the landing was beaten back. Praia got a new name: Praia da Vitória, “Praia of Victory.”
  ru: |-
    Король Педру жил в Бразилии, где был императором, и отдал португальский трон дочери Марии, которой было семь лет. Править за неё до взрослых лет он доверил своему брату Мигелу. Мигел должен был поклясться в верности конституции, а когда Мария вырастет, жениться на ней.

    В феврале 1828 года Мигел вернулся в Лиссабон регентом, а летом объявил королём себя. Его признала вся страна, кроме Мадейры и Терсейры. Мадейру быстро взяли. Терсейра осталась за юной королевой.

    На остров потянулись её сторонники. 11 августа 1829 года флот Мигела попытался высадить войска у городка Прая, но высадку отбили. Прая получила новое имя: Прая-да-Витория, «Прая Победы».
more:
  pt: |-
    A própria Maria navegava em 1828 para a Europa. Em Gibraltar soube que o tio se proclamara rei e seguiu para Londres, rainha sem país.

    D. Pedro lutou muito tempo pela filha à distância. Em 1831 abdicou da coroa do Brasil a favor do filho de cinco anos, para se dedicar só a Portugal. Em março de 1832 chegou aos Açores, reuniu nas ilhas um exército e, a 8 de julho, desembarcou com ele perto do Porto.

    A guerra entre os irmãos terminou em 1834. Miguel abdicou e deixou o país para sempre, e Maria II, com quinze anos, voltou ao trono e anulou o noivado com o tio. Angra, pela sua lealdade, juntou ao nome a palavra «Heroísmo» e chama-se desde então Angra do Heroísmo. D. Pedro sobreviveu à vitória apenas alguns meses: morreu no Palácio de Queluz, no mesmo quarto onde nascera.
  en: |-
    In 1828 Maria herself was sailing to Europe. In Gibraltar she learned that her uncle had made himself king, and she went on to London, a queen without a country.

    For a long time Pedro fought for his daughter from afar. In 1831 he gave up the crown of Brazil to his five-year-old son so he could focus on Portugal alone. In March 1832 he arrived in the Azores, raised an army on the islands, and on July 8 landed with it near Porto.

    The war between the brothers ended in 1834. Miguel abdicated and left the country for good, and fifteen-year-old Maria II returned to the throne and broke off her engagement to her uncle. For its loyalty, Angra added the word “Heroism” to its name and has been called Angra do Heroísmo ever since. Pedro outlived the victory by only a few months: he died at the Queluz Palace, in the same room where he was born.
  ru: |-
    Сама Мария в 1828 году плыла в Европу. В Гибралтаре она узнала, что дядя объявил королём себя, и поехала в Лондон, королевой без страны.

    Педру долго воевал за дочь издалека. В 1831 году он отказался от короны Бразилии в пользу пятилетнего сына, чтобы заняться только Португалией. В марте 1832 года он приплыл на Азоры, собрал на островах армию и 8 июля высадился с ней под Порту.

    Война братьев закончилась в 1834 году. Мигел отрёкся и навсегда уехал из страны, а пятнадцатилетняя Мария II вернулась на трон и расторгла помолвку с дядей. Ангра за верность получила к имени слово «Героизм» и с тех пор называется Ангра-ду-Эроишму. Педру пережил победу всего на несколько месяцев: он умер во дворце Келуш, в той же комнате, где родился.
