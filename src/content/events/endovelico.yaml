    ru: Эндовелик, бог из Аландроала | O Elefante Fugiu
story:
  pt: >-
    Antes dos romanos, os habitantes do sul do atual Portugal veneravam Endovélico. Era um deus
    subterrâneo que curava e previa o futuro. O seu santuário ficava no alto de São Miguel da Mota,
    perto do atual Alandroal.

    Os romanos costumavam levar os seus deuses para as terras conquistadas. Mas a fama de Endovélico
    era tanta que também eles foram ter com ele. Os doentes dormiam junto ao santuário e esperavam
    que o deus lhes respondesse em sonhos. Depois de curados, ofereciam-lhe um altar de pedra com
    uma inscrição de agradecimento.

    Do monte recolheram-se tantos altares que este é um dos principais santuários da Lusitânia
    romana.
  en: >-
    Before the Romans, people in what is now southern Portugal worshipped Endovelicus. He was an
    underground god who healed the sick and foretold the future. His sanctuary stood on the hill of
    São Miguel da Mota, near today’s Alandroal.

    The Romans usually brought their own gods to the lands they conquered. But Endovelicus was so
    famous that they came to him too. The sick slept by the sanctuary and waited for the god to
    answer them in a dream. Once they recovered, they set up a stone altar with an inscription of
    thanks.

    So many altars have been gathered from the hill that it counts among the main sanctuaries of
    Roman Lusitania.
  ru: >-
    До римлян жители юга нынешней Португалии почитали Эндовелика. Это был подземный бог, который
    лечил и предсказывал будущее. Его святилище стояло на холме Сан-Мигел-да-Мота, недалеко от
    нынешнего Аландроала.

    Римляне обычно приносили в завоёванные земли своих богов. Но слава Эндовелика была такой, что к
    нему пошли и они. Больные ночевали у святилища и ждали, что бог ответит им во сне. Выздоровев,
    человек ставил ему каменный алтарь с надписью и благодарностью.

    Алтарей с холма собрали так много, что это одно из главных святилищ римской Лузитании.
more:
  pt: >-
    Em alguns altares está gravado «ex imperato averno», «por ordem de baixo». É como se a pessoa
    prestasse contas: não fui eu que decidi pôr esta pedra, mandou-me o deus de debaixo da terra. Os
    altares tornaram-se assim registos de conversas com o deus, e por eles vê-se quem subia ao
    monte: gente da terra, cidadãos romanos, escravos e libertos.


    Endovélico foi venerado durante mais tempo do que muitos deuses romanos, até ao século V. Depois
    o país tornou-se cristão, mas o lugar sagrado não foi abandonado: no monte construiu-se uma
    capela a São Miguel, daí o nome São Miguel da Mota. As pedras do santuário terão sido levadas
    mais tarde para outras obras, e os altares foram reunidos no fim do século XIX pelo arqueólogo
    Leite de Vasconcelos.


    Hoje os altares estão no Museu Nacional de Arqueologia, em Lisboa. E o monte continua lá: de
    cima vê-se ao longe a região à volta.
  en: >-
    Some altars are carved with “ex imperato averno,” “by order from below.” It’s as if the person
    were reporting: I didn’t decide to put up this stone, the god beneath the earth told me to. That
    turned the altars into records of conversations with the god, and they show who climbed the
    hill: locals, Roman citizens, enslaved people, and freedmen.


    Endovelicus was worshipped longer than many Roman gods, until the 5th century. Then the country
    became Christian, but the holy place wasn’t abandoned: a chapel to Saint Michael was built on
    the hill, which is where the name São Miguel da Mota comes from. The sanctuary’s stones were
    probably carried off later for other buildings, and the altars were gathered at the end of the
    19th century by the archaeologist Leite de Vasconcelos.


    Today the altars belong to the National Archaeology Museum in Lisbon. The hill is still there:
    from the top you can see far across the surrounding land.
  ru: >-
    На некоторых алтарях высечено «ex imperato averno», «по повелению снизу». Человек как бы
    отчитывается: я поставил этот камень не сам, мне велел бог из-под земли. Так алтари стали
    записями разговоров с богом, и по ним видно, кто приходил на холм: местные жители, римские
    граждане, рабы и вольноотпущенники.


    Эндовелику молились дольше, чем многим римским богам, до V века. Потом страна стала
    христианской, но святое место не бросили: на холме построили часовню святого Михаила, отсюда и
    название Сан-Мигел-да-Мота. Камни святилища, как считается, позже ушли на другие стройки, а
    алтари в конце XIX века собрал археолог Лейте де Вашконселуш.


    Сегодня алтари хранит Национальный археологический музей в Лиссабоне. А холм стоит, как стоял: с
    него далеко видны окрестности.
