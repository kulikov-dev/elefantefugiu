hook:
  pt: As galerias romanas inundadas de Lisboa.
  en: Lisbon’s flooded Roman galleries.
  ru: Затопленные римские галереи Лиссабона.
story:
  pt: "Depois do terramoto de 1755 a Baixa foi reconstruída de raiz, e em 1771 os construtores deram
    com galerias romanas subterrâneas debaixo da Rua da Prata. Ainda hoje se discute para que
    serviam: talvez fossem as fundações de um grande edifício na encosta. As galerias estão cheias
    de água. Duas vezes por ano a água é bombeada, abre-se uma tampa no meio da rua e as pessoas
    descem mesmo por baixo da calçada."
  en: "After the 1755 earthquake, the Baixa was rebuilt from scratch, and in 1771 builders came across
    Roman underground galleries beneath Rua da Prata. People still argue about what they were for:
    maybe the foundations of a large building on the slope. The galleries are full of water. Twice a
    year the water is pumped out, a hatch opens in the middle of the street, and people climb down
    right under the pavement."
  ru: "После землетрясения 1755 года Байшу отстраивали заново, и в 1771 году строители наткнулись под
    Руа-да-Прата на римские подземные галереи. Зачем римляне их построили, спорят до сих пор: может
    быть, это фундамент большого здания на склоне. Галереи заполнены водой. Два раза в год воду
    откачивают, посреди улицы открывают люк, и горожане спускаются прямо под мостовую."
more:
  pt: >-
    No século XX os lisboetas conheciam o sítio como a «cisterna da Rua da Prata» e iam lá buscar
    água. Não se pode esvaziá-la mais vezes: as galerias sustentam os prédios que estão por cima, e
    sem água a estrutura pode sofrer.


    Por isso as galerias abrem só alguns dias por ano, e desce-se em grupos acompanhados pela equipa
    do Museu de Lisboa.
  en: >-
    In the 20th century, Lisbon residents knew the place as the “Rua da Prata cistern” and drew
    water from it. It can’t be drained more often: the galleries support the buildings above, and
    without the water the structure could be damaged.


    That’s why the galleries open only a few days a year, and visitors go down in groups led by
    staff from the Lisbon Museum.
  ru: >-
    В XX веке лиссабонцы знали это место как «водохранилище Руа-да-Прата» и брали оттуда воду.
    Откачивать её чаще нельзя: галереи держат дома, которые стоят сверху, и без воды конструкции
    могут пострадать.


    Поэтому галереи открывают всего на несколько дней в году, и спускаются туда группами с
    сотрудниками Музея Лиссабона.
