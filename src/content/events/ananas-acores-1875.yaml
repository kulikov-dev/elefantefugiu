hook:
  pt: Nos Açores, o ananás só floresce com a estufa cheia de fumo.
  en: In the Azores, pineapples bloom only when the greenhouse fills with smoke.
  ru: На Азорах ананас не зацветёт, пока теплицу не наполнят дымом.
