more:
  pt: >-
    A palavra fez um caminho ainda mais longo. Os portugueses ouviram-na no Brasil, na língua tupi, e passaram a dizer «ananás». Do português passou ao francês, ao alemão e ao russo. Só os ingleses deram ao fruto o nome do que parecia: «pineapple», pinha.


    O segredo do fumo ainda hoje se usa, tal como as velhas estufas. Da plantação à colheita passa cerca de ano e meio, e na exploração de Augusto Arruda, na Fajã de Baixo, pode percorrer as filas e ver o ananás em todas as fases, do rebento ao fruto maduro.


    O ananás não foi a única resposta da ilha à morte dos laranjais. Nos mesmos anos plantou-se chá nas encostas de São Miguel, e as duas culturas continuam lá até hoje.
  en: >-
    The word itself traveled even farther. The Portuguese heard it in Brazil, in the Tupi language, and started saying “ananás.” From Portuguese it passed into French, German, and Russian, so in most of Europe a pineapple is still an “ananas.” English went its own way and named the fruit after what it looked like: a pine cone.


    The smoke trick is still used today, and so are the old greenhouses. It takes about a year and a half from planting to harvest, and at Augusto Arruda’s plantation in Fajã de Baixo you can walk along the rows and see pineapples at every stage, from shoot to ripe fruit.


    Pineapples weren’t the island’s only answer to the dying orange groves. In the same years, tea was planted on São Miguel’s hillsides, and both crops are still grown there today.
  ru: >-
    Само слово проделало путь ещё длиннее. Португальцы услышали его в Бразилии, в языке индейцев тупи, и стали говорить ananás. Из португальского оно перешло во французский, немецкий и русский. Только англичане назвали незнакомый плод так, как он выглядел: pineapple, «сосновая шишка».


    Секрет с дымом в ходу до сих пор, как и сами старые теплицы. От посадки до урожая здесь проходит около полутора лет, и в хозяйстве Аугушту Арруды в Фажан-де-Байшу можно пройти вдоль рядов и увидеть ананас на всех стадиях, от ростка до спелого плода.


    Ананас был не единственным ответом острова на гибель апельсинов. В те же годы на склонах Сан-Мигела посадили чай, и обе культуры живут здесь до сих пор.
myth:
  verdict: fact
  statement:
    pt: O ananás dos Açores é forçado a florescer com fumo
    en: Azorean pineapples are made to bloom with smoke
    ru: Азорские ананасы заставляют цвести с помощью дыма
  answer:
    pt: A estufa é fechada e enchida de fumo. Com o fumo e o calor, as plantas florescem ao mesmo tempo e a colheita amadurece de uma vez.
    en: The greenhouse is closed and filled with smoke. The smoke and heat make the plants bloom at the same time, so the whole crop ripens together.
    ru: Теплицу закрывают и наполняют дымом. От дыма и жары растения зацветают одновременно, и урожай поспевает разом.
