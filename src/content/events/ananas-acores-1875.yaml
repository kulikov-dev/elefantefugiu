story:
  pt: >-
    A meio do século XIX, São Miguel perdeu o seu principal ganha-pão: uma doença destruiu os laranjais, e o comércio de laranja com Inglaterra afundou. A ilha precisava de um produto novo.


    O ananás já crescia nos jardins como curiosidade, e decidiu-se cultivá-lo para venda em estufas de vidro. O segredo foi descoberto, segundo se conta, por acaso: fechando a estufa e enchendo-a de fumo, o calor sobe até aos 40 graus e todas as plantas florescem ao mesmo tempo. Assim a colheita amadurece de uma vez e pode seguir inteira num navio.


    Em 1875 já cresciam dezenas de milhares de ananases nas estufas da ilha, e antes da Primeira Guerra Mundial seguiam para Inglaterra, Alemanha e Rússia.
  en: >-
    In the mid-1800s, the island of São Miguel lost its main source of income: a disease wiped out its orange groves, and the orange trade with England collapsed. The island needed something new to sell.


    Pineapples were already growing in gardens there as a curiosity, so islanders began raising them for sale in glass greenhouses. The secret, as the story goes, was found by accident: if you shut the greenhouse and fill it with smoke, the heat climbs to 40 °C (104 °F) and all the plants bloom at once. Then the whole crop ripens together and can be loaded onto a ship in one go.


    By 1875 the island’s greenhouses held tens of thousands of pineapples, and before World War I they were shipped to England, Germany, and Russia.
  ru: >-
    В середине XIX века остров Сан-Мигел потерял главный заработок: болезнь погубила апельсиновые сады, и торговля апельсинами с Англией рухнула. Острову нужен был новый товар.


    Ананас к тому времени уже рос здесь в садах как диковинка, и его решили растить на продажу в стеклянных теплицах. Секрет нашли, как рассказывают, случайно: если закрыть теплицу и наполнить её дымом, жара поднимается до 40 градусов и все растения зацветают разом. Тогда урожай поспевает одновременно, и его можно грузить на корабль целиком.


    К 1875 году в теплицах острова росли десятки тысяч ананасов, а перед Первой мировой их везли в Англию, Германию и Россию.
