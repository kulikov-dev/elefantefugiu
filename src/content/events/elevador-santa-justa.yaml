hook:
  pt: Projetou-o um aluno de Eiffel, e por isso o atribuem ao mestre.
  en: Many credit Eiffel, but a student of his designed it.
  ru: Железный лифт, который построил не Эйфель.
story:
  pt: A Baixa fica em baixo, e o Chiado no alto da colina. Para os lisboetas não terem de subir
    escadas, em 1900 começou a construir-se uma torre de ferro com um elevador. Dois anos depois, o
    Elevador de Santa Justa, com 45 metros, levou os primeiros passageiros. Primeiro movia-o uma
    máquina a vapor, a partir de 1907 um motor elétrico. O ferro rendilhado lembra tanto a Torre
    Eiffel que muitos ainda o atribuem a Eiffel.
  en: The Baixa lies down low, and the Chiado district sits on the hill above it. To spare people the
    stairs, construction began in 1900 on an iron tower with an elevator. Two years later, the
    45-meter Santa Justa Lift carried its first passengers. At first it ran on a steam engine, and
    from 1907 on an electric motor. The lacy ironwork looks so much like the Eiffel Tower that many
    people still credit it to Eiffel.
  ru: Байша лежит внизу, а район Шиаду на холме над ней. Чтобы горожанам не карабкаться по лестницам,
    в 1900 году начали строить железную башню с лифтом. Через два года 45-метровый лифт Санта-Жушта
    поднял первых пассажиров. Сначала его двигал паровой двигатель, с 1907 года электрический.
    Ажурное железо так похоже на Эйфелеву башню, что лифт до сих пор считают работой Эйфеля.
more:
  pt: >-
    Na verdade, o elevador foi projetado por Raoul Mesnier du Ponsard, engenheiro nascido no Porto
    numa família francesa. Foi aluno de Eiffel, daí a semelhança. Mesnier construiu em Lisboa outros
    elevadores e ascensores, e antes ainda o funicular de Braga que ainda hoje anda a água.


    O elevador tem duas cabines de madeira, cada uma para 29 pessoas. Lá em cima há um miradouro e
    um passadiço que leva às ruínas do Convento do Carmo, destruído pelo terramoto de 1755.
  en: >-
    In fact, the elevator was designed by Raoul Mesnier du Ponsard, an engineer born in Porto to a
    French family. He studied under Eiffel, which explains the resemblance. Mesnier built other elevators and funiculars in Lisbon, and before that the funicular in Braga that still runs on water.


    The elevator has two wooden cars, each holding 29 people. At the top there’s a viewing platform and
    a walkway leading to the ruins of the Carmo Convent, destroyed in the 1755 earthquake.
  ru: >-
    На самом деле лифт спроектировал Раул Мениер дю Понсар, инженер, родившийся в Порту в семье
    французов. Он учился у Эйфеля, отсюда и сходство. Мениер построил в Лиссабоне и другие
    подъёмники и фуникулёры, а ещё раньше фуникулёр в Браге, который до сих пор ездит на воде.


    В лифте две деревянные кабины, в каждую помещается 29 человек. Наверху смотровая площадка и
    мостик, по которому можно пройти к руинам монастыря Карму, разрушенного землетрясением 1755
    года.
