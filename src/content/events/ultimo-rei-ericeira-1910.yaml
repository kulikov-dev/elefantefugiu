    en: The Last King Sails Away · Ericeira, 1910
    ru: Последний король уплыл · Эрисейра, 1910
story:
  pt: |-
    A 4 de outubro de 1910 começou em Lisboa a revolução. O rei D. Manuel II tinha 20 anos. Saiu da capital para o palácio de Mafra.

    No dia seguinte, os republicanos venceram. Por volta das três da tarde, a família real seguiu de Mafra para a vizinha Ericeira, até à praia onde os pescadores puxam os barcos. Os barcos levaram o rei e a mãe até ao iate real «Amélia».

    Segundo uma versão, o rei queria seguir para o Porto e continuar a luta no Norte. Mas chegou a notícia de que também o Porto estava com os republicanos, e o iate rumou a Gibraltar. D. Manuel II nunca mais voltou vivo a Portugal.
  en: |-
    On October 4, 1910, a revolution broke out in Lisbon. King Manuel II was 20 years old. He left the capital for the palace at Mafra.

    The next day the republicans won. At around three in the afternoon, the royal family drove from Mafra to nearby Ericeira, down to the beach where fishermen haul up their boats. The boats took the king and his mother out to the royal yacht Amélia.

    According to one account, the king wanted to sail to Porto and keep fighting in the north. But word came that Porto had sided with the republicans too, and the yacht headed for Gibraltar. Manuel II never came back to Portugal alive.
  ru: |-
    4 октября 1910 года в Лиссабоне началась революция. Королю Мануэлу II было 20 лет. Он уехал из столицы во дворец в Мафре.

    На следующий день республиканцы победили. Около трёх часов дня королевская семья доехала из Мафры до соседней Эрисейры, к пляжу, где рыбаки вытаскивают лодки. Лодки перевезли короля и его мать на королевскую яхту «Амелия».

    По одной версии, король хотел плыть в Порту и продолжать борьбу на севере. Но пришла весть, что Порту тоже за республиканцами, и яхта ушла в Гибралтар. В Португалию Мануэл II живым больше не вернулся.
more:
  pt: |-
    De Gibraltar, a família seguiu para Inglaterra. D. Manuel instalou-se em Twickenham, perto de Londres, casou em 1913 e, na Primeira Guerra Mundial, trabalhou na Cruz Vermelha britânica. Nunca recuperou o trono, mas encontrou outra causa: os livros antigos portugueses.

    Começou a colecioná-los em 1920: primeiras edições impressas em Portugal, livros da época dos Descobrimentos. E não só os colecionava: descrevia ele próprio cada um num grande catálogo, «Livros Antigos Portuguezes». O rei que perdera o país pôs-se a inventariar os seus primeiros livros impressos.

    Conseguiu publicar dois volumes. O terceiro foi terminado sem ele: em 1932, D. Manuel II morreu de repente em sua casa, perto de Londres, aos 42 anos, sufocado por um edema da glote. Foi sepultado em Lisboa, no Panteão dos Braganças, no Mosteiro de São Vicente de Fora. E a sua biblioteca também voltou a Portugal: está em Vila Viçosa.
  en: |-
    From Gibraltar the family went on to England. Manuel settled in Twickenham, near London, married in 1913, and worked for the British Red Cross during World War I. He never got his throne back, but he found another calling: old Portuguese books.

    He started collecting them in 1920: the first books printed in Portugal, books from the Age of Discovery. And he didn’t just collect them. He described each one himself in a large catalog, Early Portuguese Books. The king who had lost his country set about cataloging its first printed books.

    He managed to publish two volumes. The third was finished without him: in 1932, Manuel II died suddenly at his home near London, aged 42. His throat swelled up and he suffocated. He was buried in Lisbon, in the Bragança royal pantheon at the Monastery of São Vicente de Fora. His library came back to Portugal too, and it is kept in Vila Viçosa.
  ru: |-
    Из Гибралтара семья уехала в Англию. Мануэл поселился в Твикенеме под Лондоном, в 1913 году женился, а в Первую мировую работал в британском Красном Кресте. Трона он так и не вернул, и у него появилось другое дело: старые португальские книги.

    Он начал собирать их в 1920 году: первые издания, напечатанные в Португалии, книги эпохи открытий. И не просто собирал, а сам описывал каждую в большом каталоге «Старые португальские книги». Король, потерявший страну, стал составлять опись её первых печатных книг.

    Он успел выпустить два тома. Третий закончили уже без него: в 1932 году Мануэл II внезапно умер в своём доме под Лондоном, в 42 года: у него отекла гортань, и он задохнулся. Похоронили его в Лиссабоне, в пантеоне королей Браганса в монастыре Сан-Висенти-ди-Фора. А его библиотека тоже вернулась в Португалию и хранится в Вила-Висозе.
