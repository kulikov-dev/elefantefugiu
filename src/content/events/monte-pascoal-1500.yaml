hook:
  pt: O primeiro monte visto no Brasil recebeu o nome da Páscoa.
  en: The first mountain the Portuguese saw in Brazil was named after Easter.
  ru: Первую гору, которую португальцы увидели в Бразилии, назвали в честь Пасхи.
story:
  pt: >-
    A 9 de março de 1500, a frota de Pedro Álvares Cabral largou de Lisboa rumo à Índia. Para fugir às calmarias da costa de África, os navios meteram muito para oeste e, na quarta-feira, 22 de abril, os marinheiros avistaram no horizonte uma montanha alta.


    Era a semana da Páscoa: nesse ano, a Páscoa foi a 19 de abril. Por isso, como escreveu o escrivão da frota, Pero Vaz de Caminha, o capitão deu à montanha o nome de Monte Pascoal. A nova terra, Cabral tomou-a por uma ilha e chamou-lhe Ilha de Vera Cruz. Assim começou o Brasil português.
  en: >-
    On March 9, 1500, the fleet of Pedro Álvares Cabral sailed from Lisbon for India. To avoid the calms off the coast of Africa, the ships swung far to the west, and on Wednesday, April 22, the sailors saw a tall mountain on the horizon.


    It was Easter week; that year Easter fell on April 19. So, as the fleet’s scribe Pero Vaz de Caminha wrote, the captain named the mountain Monte Pascoal, Easter Mountain. The new land Cabral took for an island and called the Island of Vera Cruz, the True Cross. That was the start of Portuguese Brazil.
  ru: >-
    9 марта 1500 года из Лиссабона вышел в Индию флот Педру Алвареша Кабрала. Чтобы обойти штили у берегов Африки, корабли взяли далеко на запад, и в среду 22 апреля моряки увидели на горизонте высокую гору.


    Шла пасхальная неделя: Пасха в тот год пришлась на 19 апреля. Поэтому, как записал писарь флота Перу Ваз ди Каминья, капитан назвал гору Монте-Пашкоал, Пасхальной горой. А новую землю Кабрал принял за остров и назвал Островом Истинного Креста. Так началась португальская Бразилия.
more:
  pt: >-
    No primeiro domingo depois da Páscoa, a 26 de abril, rezou-se na praia a primeira missa. Caminha contou tudo ao rei D. Manuel I numa carta, que se considera o primeiro texto sobre o Brasil. O monte ainda se chama Pascoal, e à volta dele há um parque nacional.


    A cruz com que, segundo se crê, se disse essa missa está na Sé de Braga. Em 2025, nos 525 anos, foi levada ao Brasil, à mesma costa.
  en: >-
    On the first Sunday after Easter, April 26, the first Mass was held on the shore. Caminha described it all in a letter to King Manuel I, and that letter is considered the first text about Brazil. The mountain is still called Pascoal, and a national park surrounds it.


    The cross with which, it is believed, that Mass was said is kept in Braga Cathedral. In 2025, for the 525th anniversary, it was taken to Brazil, to that very shore.
  ru: >-
    В первое воскресенье после Пасхи, 26 апреля, на берегу отслужили первую мессу. Каминья подробно описал всё это в письме королю Мануэлу I, и это письмо считают первым текстом о Бразилии. Гора и сейчас называется Пасхальной, вокруг неё национальный парк.


    Крест, с которым, как считается, служили ту мессу, хранится в соборе Браги. В 2025 году, к 525-летию, его возили в Бразилию, на тот самый берег.
