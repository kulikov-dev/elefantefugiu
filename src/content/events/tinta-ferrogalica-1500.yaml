hook:
  pt: A história de Portugal foi escrita com tinta que cresceu num carvalho.
  en: Portugal’s history was written in ink that grew on an oak tree.
  ru: История Португалии написана чернилами, которые выросли на дубе.
seo:
  title:
    pt: Tinta de carvalho · Lisboa, 1500
    en: Ink From an Oak Tree · Lisbon, 1500
    ru: Чернила с дуба · Лиссабон, 1500
story:
  pt: |-
    A 1 de maio de 1500, Pêro Vaz de Caminha, escrivão da armada de Cabral, terminava uma carta ao rei D. Manuel I sobre uma terra nova, o futuro Brasil. Encheu catorze folhas com tinta ferrogálica.

    O essencial desta tinta crescia no carvalho. Uma pequena vespa põe um ovo num gomo, e o carvalho responde fazendo crescer à volta da larva uma bola dura, a galha. Chamam-lhes bugalhos ou nozes-de-galha, e são ricas em taninos.

    Moíam-se os bugalhos, punham-se em água ou vinho e juntava-se caparrosa, um sal de ferro. Com os taninos, o ferro dava a cor negra, e a goma-arábica engrossava a tinta. Entranhava-se no papel e não se lavava nem se raspava. Para alvarás e tratados, era isso que importava.

    Por isso, do século XV ao fim do XIX, a maior parte dos documentos do país, dos alvarás régios à carta de Caminha, foi escrita com ela.
  en: |-
    On May 1, 1500, Pêro Vaz de Caminha, the clerk of Cabral’s fleet, was finishing a letter to King Manuel I about a new land, the future Brazil. He filled fourteen sheets with iron gall ink.

    The key ingredient grew on oak trees. A wasp lays an egg in an oak bud, and the tree responds by growing a hard ball around the larva, a gall. Also called gallnuts, galls are packed with tannins.

    Galls were crushed, soaked in water or wine, and mixed with vitriol, an iron salt. The tannins and the iron turned black, and gum arabic thickened the ink. It soaked into the paper, so writing couldn’t be washed off or scraped away. For royal decrees and treaties, that was what mattered.

    That’s why, from the 15th century to the late 19th, most of the country’s documents, from royal decrees to Caminha’s letter, were written with it.
  ru: |-
    1 мая 1500 года Перу Ваз ди Каминья, писарь флота Кабрала, дописывал королю Мануэлу I письмо о новой земле, будущей Бразилии. Четырнадцать листов он исписал железо-галловыми чернилами.

    Главное в этих чернилах росло на дубе. Маленькая оса-орехотворка откладывает яйцо в почку, и дуб в ответ наращивает вокруг личинки твёрдый шарик, галлу. По-русски такие шарики зовут чернильными орешками, по-португальски bugalhos. В них много дубильных веществ.

    Галлы толкли, заливали водой или вином и добавляли железный купорос. Дубильные вещества вместе с железом давали чёрный цвет, а гуммиарабик делал чернила гуще. Такие чернила въедались в бумагу, и написанное нельзя было ни смыть, ни подчистить. Для указов, договоров и донесений королю это было главное.

    Поэтому галловыми чернилами в Португалии писали с XV до конца XIX века, и большая часть старых документов страны, от королевских указов до письма Каминьи, написана ими.
more:
  pt: |-
    Todos os escrivães conheciam a receita, e cada um tinha a sua. Um manuscrito português do século XVII manda juntar três onças de galhas pequenas e enrugadas, duas onças de caparrosa e uma onça de goma-arábica (a onça portuguesa tinha cerca de 29 gramas), e ainda cascas de romã. Para o pergaminho usavam-se as galhas de Valência, consideradas as melhores.

    Mas a receita trazia o problema dentro. Com o tempo, a caparrosa dá origem a ácido sulfúrico, e o ferro acelera a oxidação do papel. A tinta fica castanha, surge uma auréola à volta das letras, o papel por baixo torna-se quebradiço e as letras caem aos bocados. O problema foi identificado já em 1899. Na Biblioteca Estatal de Berlim, pelo menos 500 mil folhas foram assim danificadas, e há sinais de degradação em 60 a 70% das obras de Leonardo da Vinci.

    Ou seja, escolhia-se esta tinta por não se poder apagar, e agora é ela que apaga o texto, juntamente com o papel. No Arquivo Regional da Madeira, por exemplo, os conservadores tratam folhas do século XVII em que zonas inteiras ficaram quebradiças e as letras começaram a desaparecer. A carta de Caminha está guardada na caixa-forte da Torre do Tombo, numa caixa de cartolina alcalina, que neutraliza o ácido.
  en: |-
    Every clerk knew the recipe, and each had his own. A 17th-century Portuguese manuscript calls for three ounces of small wrinkled galls, two ounces of vitriol, and one ounce of gum arabic (the Portuguese ounce was about 29 grams, close to a US ounce), plus pomegranate peel. For parchment, people used galls from Valencia, which were considered the best.

    But the recipe had a problem built in. Over time, the vitriol produces sulfuric acid, and the iron speeds up the oxidation of the paper. The ink turns brown, a halo appears around the letters, the paper underneath becomes brittle, and letters fall out in pieces. The problem was identified as early as 1899. At the Berlin State Library, at least 500,000 sheets have been damaged this way, and signs of decay show up in 60 to 70 percent of Leonardo da Vinci’s works.

    So the ink was chosen because it couldn’t be erased, and now it’s erasing the text itself, along with the paper. At the Madeira Regional Archive, for example, conservators treat 17th-century sheets where whole areas have turned brittle and letters have started to disappear. Caminha’s letter is kept in the strongroom at Torre do Tombo, in a box made of alkaline cardstock that neutralizes the acid.
  ru: |-
    Рецепт знал каждый писарь, и у каждого он был свой. В португальской рукописи XVII века советуют взять три унции мелких морщинистых галл, две унции купороса (caparrosa) и унцию гуммиарабика (португальская унция, onça, около 29 граммов), а ещё добавить кожуру граната. Для пергамента брали галлы из Валенсии: они считались лучшими.

    Но в этом рецепте была заложена беда. Из купороса со временем получается серная кислота, а железо помогает бумаге окисляться. Чернила буреют, вокруг букв появляется коричневый ореол, бумага под ними становится хрупкой, и буквы выпадают целыми кусками. Проблему заметили ещё в 1899 году. В Государственной библиотеке Берлина так пострадали не меньше 500 тысяч листов, а следы порчи нашли у 60–70% работ Леонардо да Винчи.

    Выходит, чернила выбирали за то, что их нельзя стереть, а теперь они сами стирают текст вместе с бумагой. Реставраторы архива Мадейры, например, спасают листы XVII века, где целые участки стали ломкими и буквы уже начали пропадать. А письмо Каминьи хранят в сейфе Торре-ду-Томбу, в коробке из щелочного картона, который нейтрализует кислоту.
myth:
  verdict: myth
  statement:
    pt: A tinta dos documentos antigos era feita de nozes
    en: Old documents were written in ink made from nuts
    ru: Старые чернила делали из дубовых орехов
  answer:
    pt: Era feita de galhas, excrescências que o carvalho forma à volta da larva de uma vespa. Chamam-lhes nozes-de-galha, mas não são nozes.
    en: It was made from galls, growths an oak forms around a wasp larva. They’re called gallnuts, but they aren’t nuts.
    ru: "Не из орехов, а из галл: наростов, которые дуб выращивает вокруг личинки осы. Орешками их только называют."
