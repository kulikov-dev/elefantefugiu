  statement:
    pt: Para o molho romano, deixava-se o peixe apodrecer
    en: To make Roman fish sauce, they left the fish to rot
    ru: Для римского соуса рыбу оставляли гнить
  answer:
    pt: "O peixe não era abandonado: era salgado e ficava semanas ao sol. Fermentava e dava um molho."
    en: The fish wasn’t just left out. It was salted and kept in the sun for weeks, where it fermented
      into sauce.
    ru: Рыбу не просто бросали, а засаливали и неделями держали на солнце. Она бродила, и получался
      соус.
