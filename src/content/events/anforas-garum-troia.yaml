story:
  pt: >-
    A cozinha romana não passava sem garum. Era um molho de peixe salgado em grandes tanques e
    deixado ao sol durante semanas, até se transformar em líquido. Temperava-se quase tudo com ele,
    como hoje com molho de soja.

    Os melhores tanques ficavam onde havia muito peixe e muito sal. A foz do Sado era perfeita: o
    oceano ao lado, com sardinha e cavala, e salinas à volta. Na península de Tróia nasceram dezenas
    de oficinas.

    O molho ia para ânforas, jarros altos de barro com gargalo estreito e fundo pontiagudo. Eram
    feitas ali mesmo, nas margens do Sado, e seguiam de barco para todo o Mediterrâneo.
  en: >-
    Roman cooking couldn’t do without garum. It was a sauce made from fish salted in big vats and
    left in the sun for weeks until it turned into liquid. Romans put it on almost everything, the
    way people use soy sauce today.

    The best vats were wherever there was plenty of fish and salt. The mouth of the Sado River was
    perfect: the ocean next door, full of sardines and mackerel, and salt pans all around. Dozens of
    workshops sprang up on the Tróia peninsula.

    The sauce was poured into amphorae, tall clay jars with a narrow neck and a pointed bottom. They
    were made right there on the banks of the Sado and shipped all over the Mediterranean.
  ru: >-
    Римская кухня не обходилась без гарума. Это соус из рыбы, которую засаливали в больших чанах и
    неделями оставляли на солнце, пока она не превращалась в жидкость. Им приправляли почти всё, как
    сегодня соевым соусом.

    Лучшие чаны стояли там, где много рыбы и соли. Устье реки Садо подходило идеально: рядом океан с
    сардиной и скумбрией, а вокруг солеварни. На полуострове Тройя выросли десятки цехов.

    Соус разливали в амфоры, высокие глиняные кувшины с узким горлом и острым дном. Их делали тут
    же, на берегах Садо, и отправляли кораблями по всему Средиземному морю.
more:
  pt: >-
    O fundo pontiagudo da ânfora não é um erro do oleiro. No porão, os jarros iam em filas,
    espetados na areia ou encaixados na fila de baixo, e assim não rolavam com o balanço. Em terra,
    encostavam-se à parede ou punham-se num suporte.


    Pela forma da ânfora, os arqueólogos sabem de onde vem e o que levava. Os jarros do Sado,
    estreitos e compridos, aparecem em portos muito para lá da Lusitânia. Foi assim, pelos cacos,
    que se seguiu o caminho do molho português.


    Quando Roma enfraqueceu, o comércio por mar parou e as oficinas de Tróia ficaram ao abandono. A
    areia cobriu os tanques e foi ela que os conservou: hoje, junto ao rio, veem-se filas de covas
    retangulares onde o peixe fermentava.
  en: >-
    The pointed bottom wasn’t a potter’s mistake. In a ship’s hold, the jars stood in rows, stuck
    into sand or wedged into the row below, so they didn’t roll when the ship rocked. On land,
    people leaned them against a wall or set them in a stand.


    From an amphora’s shape, archaeologists can tell where it came from and what it carried. The
    narrow, elongated jars from the Sado turn up in ports far beyond Lusitania. That’s how the
    broken pieces revealed where Portuguese fish sauce traveled.


    When Rome weakened, sea trade died down and the Tróia workshops were abandoned. Sand buried the
    vats, and the sand is also what preserved them: today you can see rows of rectangular pits by
    the water where fish once fermented.
  ru: >-
    Острое дно у амфоры не ошибка гончара. В трюме кувшины ставили рядами и втыкали в песок или в
    соседний ряд, так они не катались в качку. На суше амфору прислоняли к стене или ставили в
    подставку.


    По форме амфоры археологи узнают, откуда она и что в ней везли. Кувшины с Садо, узкие и
    вытянутые, находят в портах далеко за пределами Лузитании. Так по осколкам удалось проследить,
    куда уходил португальский соус.


    Когда Рим ослаб, торговля по морю затихла, и цеха на Тройе забросили. Песок занёс чаны, и он же
    их сохранил: сегодня на берегу видны ряды прямоугольных ям, в которых когда-то бродила рыба.
myth:
