hook:
  pt: A famosa calçada ondulada de Lisboa começou por ser feita por presos.
  en: Lisbon’s famous wavy pavement was started by prisoners.
  ru: Знаменитую волнистую мостовую Лиссабона начинали выкладывать арестанты.
story:
  pt: |-
    Nos anos 1840, havia uma prisão no Castelo de São Jorge, e o seu governador, Eusébio Furtado, procurava trabalho para os reclusos. Em 1842, os presos calcetaram o pátio do castelo com pedra branca e preta, em ziguezague.

    Lisboa gostou, e Furtado conseguiu dinheiro para mais. Em 1848, a Praça do Rossio foi coberta de ondas pretas e brancas, mais de 8700 metros quadrados. Ao desenho chamaram «Mar Largo».

    Assim nasceu a calçada portuguesa. É feita à mão, pedra a pedra, e os mestres deste ofício chamam-se calceteiros.
  en: |-
    In the 1840s, Castelo de São Jorge housed a prison, and its governor, Eusébio Furtado, was looking for work for the inmates. In 1842, the prisoners paved the castle courtyard in white and black stone, in a zigzag.

    Lisbon liked it, and Furtado got money for something bigger. In 1848, Rossio Square was covered in black-and-white waves, over 8,700 square meters (94,000 square feet). The pattern was called “Wide Sea.”

    That’s how calçada portuguesa, Portuguese pavement, was born. It’s laid by hand, stone by stone, and the craftsmen who do it are called calceteiros.
  ru: |-
    В 1840-х в замке Сан-Жорже была тюрьма, а её комендант Эузебиу Фуртаду искал заключённым работу. В 1842 году арестанты выложили во дворе замка мостовую из белого и чёрного камня, зигзагом.

    Лиссабону понравилось, и Фуртаду добился денег на большее. В 1848 году площадь Россиу покрыли чёрно-белыми волнами, больше 8700 квадратных метров. Узор назвали «Широким морем».

    Так появилась калсада португеза, португальская мостовая. Её выкладывают вручную, камень за камнем, и мастеров этого дела называют калсетейрушами.
