more:
  pt: |-
    O desenho do «Mar Largo» não agradou só a Lisboa. Foi copiado no Rio de Janeiro, e hoje estas ondas são conhecidas pelo calçadão de Copacabana. O molde de madeira de Furtado para o Rossio sobreviveu: a cidade guarda cerca de três mil moldes antigos de calçada, com caravelas, flores e borboletas, e promete abrir-lhes um centro interpretativo.

    Com os mestres é mais difícil. Nos anos 1940, Lisboa tinha cerca de 400 calceteiros; hoje tem uns vinte. O trabalho é duro, de joelhos, de martelo na mão, e é mal pago, por isso há poucos aprendizes.

    Na Praça dos Restauradores, a dois passos do Rossio, está o Monumento ao Calceteiro: dois trabalhadores, um bate a pedra com o martelo, o outro ajuda.
  en: |-
    Lisbon wasn’t the only city to love the “Wide Sea.” It was copied in Rio de Janeiro, and today those waves are famous on the Copacabana promenade. Furtado’s wooden template for Rossio survives: the city keeps about three thousand old pavement templates, with caravels, flowers, and butterflies, and promises to open a center for them.

    The craftsmen are harder to keep. In the 1940s, Lisbon had about 400 calceteiros; today it has around twenty. The work is hard, on your knees with a hammer, and it pays little, so there are few apprentices.

    In Restauradores Square, a short walk from Rossio, stands the Monument to the Calceteiro: two workers, one striking a stone with a hammer, the other helping.
  ru: |-
    Узор «Широкого моря» понравился не только Лиссабону. Его скопировали в Рио-де-Жанейро, и сегодня эти волны знают по набережной Копакабаны. Деревянный шаблон Фуртаду для Россиу сохранился: город хранит около трёх тысяч старых шаблонов мостовой, с каравеллами, цветами и бабочками, и обещает открыть для них центр.

    С мастерами сложнее. В 1940-х в Лиссабоне было около 400 калсетейрушей, а сегодня их около двадцати. Работа тяжёлая, на коленях, с молотком, и платят за неё немного, поэтому учеников мало.

    На площади Рештаурадореш, в двух шагах от Россиу, стоит памятник калсетейру: двое рабочих, один бьёт молотком по камню, второй подаёт.
