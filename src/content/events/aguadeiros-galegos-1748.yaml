hook:
  pt: Galegos de barril ao ombro deram de beber a Lisboa durante séculos.
  en: Galicians with barrels on their shoulders kept Lisbon watered for centuries.
  ru: Столицу Португалии веками поили галисийцы с бочонками на плече.
story:
  pt: >-
    Até ao fim do século XIX não havia água nas casas de Lisboa. Ia-se buscá-la aos chafarizes da cidade e depois carregava-se pelas ruas íngremes acima. As casas ricas pagavam a aguadeiros para o fazer.


    Os aguadeiros eram quase sempre galegos, vindos do norte de Espanha, da zona de Pontevedra e Vigo. De barril ao ombro e boné de pala, iam do chafariz à porta dos clientes. Para trabalhar era preciso inscrever-se na Câmara, e quem não cumprisse as regras pagava multa.


    Junto aos chafarizes havia sempre gente, e para evitar zaragatas as bicas eram divididas entre grupos: umas só para aguadeiros, outras para criados, outras para marinheiros. A água canalizada chegou às casas aos poucos, e com ela o ofício desapareceu.
  en: >-
    Until the late 19th century, Lisbon homes had no running water. People fetched it from the city’s public fountains and then hauled it up the steep streets. Wealthy households paid water carriers to do it.


    The carriers were almost always Galicians, from northern Spain around Pontevedra and Vigo. With a barrel on the shoulder and a peaked cap, they went from fountain to customers’ doors. To work, you had to register with the city council, and breaking the rules meant a fine.


    The fountains were always crowded, so to prevent fights the spouts were split between groups: some only for water carriers, some for servants, some for sailors. Piped water reached homes little by little, and the trade disappeared with it.
  ru: >-
    Воды в домах Лиссабона не было до конца XIX века. Её набирали у городских фонтанов, чафаришей, а потом несли вверх по крутым улицам. Богатые дома платили за это водоносам.


    Водоносами чаще всего были галисийцы, приезжие с севера Испании, из-под Понтеведры и Виго. С бочонком на плече и в кепке с козырьком они ходили от фонтана к дверям клиентов. Чтобы работать, нужно было записаться в городской палате, а за нарушение правил штрафовали.


    У фонтанов всегда толпились люди, и чтобы не было драк, носики делили между группами: часть только для водоносов, часть для слуг, часть для моряков. Водопровод пришёл в дома постепенно, и вместе с ним исчезло ремесло.
