more:
  pt: >-
    Os aguadeiros tinham também uma obrigação para com a cidade: manter os barris prontos para acudir a incêndios. Numa cidade de madeira e ruas estreitas, isso contava.


    O chafariz público mais antigo de Lisboa, o Chafariz d’El-Rei, em Alfama, ainda existe. Teve seis bicas, e o Senado de Lisboa determinou para quem era cada uma: uma para os homens das embarcações, outras para criados e criadas, outras para homens e mulheres de diferente condição. Hoje restam três bicas, e já não corre água.


    Quando a água canalizada os afastou, conta-se que muitos antigos aguadeiros passaram a vender capilé, uma bebida doce.
  en: >-
    Water carriers also had a duty to the city: keep their barrels ready in case of fire. In a city of wood and narrow streets, that mattered.


    Lisbon’s oldest public fountain, the Chafariz d’El-Rei in Alfama, still stands. It once had six spouts, and the city senate decided who each one was for: one for the men from the boats, others for male and female servants, others for men and women of different stations. Three spouts remain today, and no water runs from them.


    When piped water pushed them out, many former water carriers reportedly took to selling capilé, a sweet drink.
  ru: >-
    У водоносов была и городская обязанность: держать бочонки наготове на случай пожара. В городе из дерева и узких улиц это было важно.


    Самый старый городской фонтан, Чафариш д’Эль-Рей в Алфаме, стоит до сих пор. Когда-то у него было шесть носиков, и Сенат Лиссабона расписал, какой из них для кого: отдельно для моряков, отдельно для служанок и слуг, отдельно для мужчин и женщин разного положения. Сегодня носиков осталось три, и вода из них не течёт.


    Когда водопровод вытеснил их, бывшие водоносы, по рассказам, стали торговать сладким напитком капилé.
