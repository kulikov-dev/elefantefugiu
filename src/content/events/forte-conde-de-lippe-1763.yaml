seo:
  title:
    pt: O forte do conde de Lippe · Elvas, 1763
    en: Count Lippe’s Fort · Elvas, 1763
    ru: Форт графа Липпе · Эльваш, 1763
story:
  pt: |-
    Elvas fica mesmo junto à fronteira espanhola e, desde o século XVII, foi cercada por um anel de muralhas e baluartes. Mas logo ali, fora das muralhas, ergue-se o monte da Graça. Em 1658, o exército espanhol cercou Elvas e ocupou esse monte. A cidade resistiu, mas o monte ficou vazio e aberto a qualquer inimigo.

    Em 1763, o marquês de Pombal chamou a Portugal o conde alemão de Lippe, para reorganizar o exército. O conde escolheu para a nova fortaleza precisamente este monte. Tomou como modelo o seu forte na terra natal e começou a construir no cimo uma estrela de baluartes.

    A obra durou quase trinta anos. Em 1792, o forte foi inaugurado e recebeu o nome do seu criador: Forte Conde de Lippe. O monte de onde outrora se olhava para a cidade passou a guardá-la.
  en: |-
    Elvas sits right on the Spanish border, and from the 17th century it was ringed with walls and bastions. But just outside the walls rises the hill of Graça. In 1658, a Spanish army besieged Elvas and occupied that hill. The town held out, but the hill stayed empty and open to any enemy.

    In 1763, the Marquis of Pombal invited a German count, Lippe, to Portugal to rebuild the army. The count chose this very hill for a new fortress. He took his own fort back home as a model and began building a star of bastions on the summit.

    The work took almost thirty years. In 1792, the fort opened and was named after its creator: Fort Conde de Lippe. The hill from which the town had once been watched now guarded it.
  ru: |-
    Эльваш стоит у самой испанской границы, и с XVII века его окружили кольцом стен и бастионов. Но совсем рядом, за стенами, поднимается холм Граса. В 1658 году испанская армия осадила Эльваш и заняла этот холм. Город тогда устоял, а холм так и остался пустым и открытым для любого врага.

    В 1763 году маркиз Помбал позвал в Португалию немецкого графа Липпе, чтобы тот перестроил армию. Граф выбрал для новой крепости именно этот холм. Он взял за образец свой форт на родине и начал строить на вершине звезду из бастионов.

    Стройка шла почти тридцать лет. В 1792 году форт открыли и назвали в честь его создателя: форт Конде-де-Липпе. Холм, с которого когда-то смотрели на город, теперь сам его охранял.
more:
  pt: |-
    O forte não esperou muito pela sua guerra. Em 1801, na breve Guerra das Laranjas, o forte resistiu às tropas espanholas. Em 1811 resistiu também aos franceses do marechal Soult. Por trás das muralhas do forte, como por trás das da cidade, Elvas continuou portuguesa.

    Mais tarde, o forte tornou-se prisão militar e, no início do século XXI, estava quase em ruínas. Em 2012, Elvas, com as suas muralhas, baluartes e fortes, entrou na lista do Património Mundial da UNESCO e, até 2015, o forte foi recuperado para abrir aos visitantes. Lá de cima percebe-se bem porque está ali: a cidade inteira fica aos pés, como na palma da mão.
  en: |-
    The fort didn’t wait long for its war. In 1801, in the short War of the Oranges, the fort held out against the Spanish troops. In 1811 it withstood Marshal Soult’s French as well. Behind the walls of the fort, as behind those of the town, Elvas stayed Portuguese.

    Later the fort became a military prison, and by the early 21st century it was close to ruin. In 2012, Elvas with its walls, bastions, and forts was added to UNESCO’s World Heritage List, and by 2015 the fort had been restored to open to visitors. From the top it’s easy to see why it’s there: the whole town lies below, spread out like the palm of your hand.
  ru: |-
    Форт ждал своей войны недолго. В 1801 году, в короткой Апельсиновой войне, форт устоял перед испанскими войсками. В 1811 году он устоял и перед французами маршала Сульта. За стенами форта, как и за стенами города, Эльваш так и остался португальским.

    Потом форт стал военной тюрьмой, а к началу XXI века почти разрушился. В 2012 году Эльваш с его стенами, бастионами и фортами внесли в список Всемирного наследия ЮНЕСКО, а к 2015 году форт отремонтировали, чтобы открыть его для посетителей. Сверху хорошо видно, зачем он здесь: весь город лежит внизу как на ладони.
myth:
  verdict: myth
  statement:
    pt: O forte sobre Elvas foi construído na guerra com Espanha, em 1659
    en: The fort above Elvas was built during the 1659 war with Spain
    ru: Форт над Эльвашем построили во время войны с Испанией в 1659 году
  answer:
    pt: Em 1658 os espanhóis só ocuparam o monte vazio. O forte começou a ser construído em 1763, no tempo de Pombal, e ficou pronto em 1792.
    en: In 1658 the Spanish only occupied the empty hill. The fort was begun in 1763, under Pombal, and finished in 1792.
    ru: В 1658 году испанцы лишь заняли пустой холм. Форт начали строить в 1763 году, при Помбале, и закончили в 1792-м.
