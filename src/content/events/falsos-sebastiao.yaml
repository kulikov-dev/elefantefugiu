hook:
  pt: Durante quase vinte anos, o rei desaparecido foi «encontrado».
  en: The missing king kept being “found” for twenty years.
  ru: Пропавшего короля «находили» двадцать лет подряд.
story:
  pt: Em 1578, o jovem rei D. Sebastião desapareceu numa batalha em Marrocos. Ninguém viu bem o corpo,
    e os portugueses acreditavam que o rei voltaria numa manhã de nevoeiro para salvar o país dos
    espanhóis. Os impostores aproveitaram. Em 1584 disse-se rei um antigo noviço de Penamacor, em
    1585 um ermitão da Ericeira, depois um pasteleiro de Madrigal, em Espanha, e um calabrês em
    Veneza. Todos foram desmascarados, mas a fé no regresso ficou.
  en: In 1578, the young King Sebastian vanished in a battle in Morocco. No one got a good look at the
    body, and the Portuguese believed the king would return one foggy morning to save the country
    from the Spanish. Impostors took advantage. In 1584 a former novice from Penamacor claimed to be
    the king, in 1585 a hermit from Ericeira, then a pastry cook from Madrigal in Spain, and a
    Calabrian in Venice. All were exposed, but the faith in his return lived on.
  ru: "В 1578 году молодой король Себастьян исчез в битве в Марокко. Тела никто толком не видел, и
    португальцы верили: король вернётся туманным утром и спасёт страну от испанцев. Этим
    пользовались самозванцы. В 1584 году «королём» назвался бывший послушник из Пенамакора, в 1585-м
    отшельник из Эрисейры, потом кондитер из испанского Мадригала и калабриец в Венеции. Всех
    разоблачили, но вера в возвращение осталась."
more:
  pt: >-
    A esta fé no regresso do rei chama-se sebastianismo. O impostor da Ericeira, Mateus Álvares,
    filho de um pedreiro dos Açores, conseguiu juntar um bando inteiro e distribuir títulos pelos
    seus seguidores. O pasteleiro Gabriel de Espinosa enganou até uma freira de sangue real, prima
    de D. Sebastião. Mas nenhum deles durou muito: quem aguentou mais tempo, cerca de quatro anos,
    foi o italiano Marco Tullio Catizone.


    «Esperar por D. Sebastião» quer dizer, em português, esperar por um milagre que não vai acontecer.
  en: >-
    This faith in the king’s return is called Sebastianism. The Ericeira impostor, Mateus Álvares,
    the son of a stonemason from the Azores, managed to gather a whole band of followers and hand
    out titles to them. The pastry cook Gabriel de Espinosa fooled even a nun of royal blood,
    Sebastian’s own cousin. But none of them lasted long: the one who kept it up longest, about four
    years, was the Italian Marco Tullio Catizone.


    In Portuguese, “waiting for King Sebastian” still means waiting for a miracle that will never
    come.
  ru: >-
    Веру в возвращение короля называют себастьянизмом. Самозванцу из Эрисейры, Матеушу Алварешу,
    сыну каменщика с Азорских островов, удалось собрать целый отряд и раздать сторонникам титулы.
    Кондитер Габриэль де Эспиноса обманул даже монахиню королевской крови, двоюродную сестру
    Себастьяна. Но никто из них долго не продержался: дольше всех, около четырёх лет, тянул обман
    итальянец Марко Туллио Катицоне.


    Фраза «ждать короля Себастьяна» до сих пор значит по-португальски «ждать чуда, которого не
    будет».
