hook:
  pt: O chá mais antigo da Europa nasceu de uma doença das laranjas.
  en: Europe’s oldest tea exists because of a disease that hit oranges.
  ru: Самый старый чай Европы появился из-за болезни апельсинов.
story:
  pt: "A ilha de São Miguel, nos Açores, vivia das laranjas: seguiam de barco para Inglaterra. Mas por
    volta de 1864 uma doença quase acabou com os pomares. Os ilhéus procuraram uma alternativa e
    resolveram experimentar o chá. Em 1878 vieram de Macau dois mestres chineses, Lau-a-Pan e o seu
    intérprete Lau-a-Teng, que ensinaram a cultivar e secar a folha. Em 1883 nasceu a plantação da
    Gorreana. Ainda funciona, e é a plantação de chá mais antiga da Europa."
  en: The island of São Miguel in the Azores lived on oranges, shipped by boat to England. But by 1864
    a blight had nearly wiped out the orchards. Islanders looked for something to replace them and
    decided to try tea. In 1878 two Chinese tea masters, Lau-a-Pan and his interpreter Lau-a-Teng,
    were brought in from Macau, and they taught the locals to grow and dry the leaf. In 1883 the
    Gorreana plantation was founded. It’s still running, and it’s the oldest tea plantation in
    Europe.
  ru: "Остров Сан-Мигел на Азорах жил апельсинами: их везли кораблями в Англию. Но к 1864 году болезнь
    почти уничтожила сады. Островитяне искали, чем их заменить, и решили попробовать чай. В 1878
    году из Макао пригласили двух китайских мастеров, Лау-а-Пана и его переводчика Лау-а-Тенга, и
    они научили местных растить и сушить чайный лист. В 1883 году появилась плантация Горреана. Она
    работает до сих пор, и это самая старая чайная плантация Европы."
more:
  pt: >-
    Os primeiros pés de chá foram trazidos para a ilha já em 1860, pelo proprietário José do Canto.
    A plantação da Gorreana foi fundada por Ermelinda Gago da Câmara.


    E assim o círculo fechou-se: em 1662 a princesa portuguesa Catarina pôs o chá na moda em
    Inglaterra, e mais de duzentos anos depois Portugal passou a cultivar o seu.


    Hoje há duas plantações de chá nos Açores: a Gorreana e a do Porto Formoso.
  en: >-
    The first tea bushes were brought to the island back in 1860 by landowner José do Canto. The
    Gorreana plantation was founded by Ermelinda Gago da Câmara.


    And so things came full circle: in 1662 the Portuguese princess Catherine made tea fashionable
    in England, and more than two hundred years later Portugal began growing its own.


    Today the Azores have two tea plantations: Gorreana and Porto Formoso.
  ru: >-
    Первые кусты чая на остров привёз ещё в 1860 году землевладелец Жозе ду Канту. Плантацию
    Горреана основала Эрмелинда Гаго да Камара.


    Так круг замкнулся: в 1662 году португальская принцесса Катарина сделала чай модным в Англии, а
    через двести с лишним лет Португалия стала выращивать собственный.


    Сегодня чайных плантаций на Азорах две: Горреана и Порту-Формозу.
