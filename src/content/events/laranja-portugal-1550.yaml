hook:
  pt: Gregos, turcos e romenos chamam «Portugal» à laranja.
  en: In Greek, Turkish and Romanian, an orange is called “Portugal.”
  ru: Грек, турок и румын называют апельсин Португалией.
seo:
  title:
    pt: A fruta chamada Portugal · Silves | O Elefante Fugiu
    en: The Fruit Called Portugal · Silves | O Elefante Fugiu
    ru: Апельсин по имени Португалия · Силвеш | O Elefante Fugiu
story:
  pt: >-
    Já havia laranjas na Europa antes dos portugueses. As amargas foram trazidas pelos árabes ainda na Idade Média. Usavam-se pelo perfume, para doces e remédios, mas não se comiam cruas: eram demasiado ácidas.


    No século XVI, mercadores portugueses trouxeram da Ásia outra variedade, doce. Podia comer-se diretamente da árvore, como uma maçã, e para a Europa era uma novidade. Os navios portugueses levavam-na pelo Mediterrâneo, para Itália, Grécia e os portos turcos.


    Os compradores chamavam à novidade pelo nome de quem a trazia: laranja portuguesa. Depois a palavra «laranja» caiu, e ficou só o país. Assim nasceram «portokali» em grego, «portakal» em turco, «portocala» em romeno e «burtuqal» em árabe. Em alguns dialetos italianos, a laranja ainda se chama «portogallo».
  en: >-
    Europe had oranges before the Portuguese. Bitter ones were brought by the Arabs back in the Middle Ages. People grew them for their scent, for preserves and for medicine, but couldn’t eat them raw: they were far too sour.


    In the 1500s, Portuguese merchants brought a different variety from Asia, a sweet one. You could eat it straight off the tree, like an apple, and for Europe that was something new. Portuguese ships carried it around the Mediterranean, to Italy, Greece and Turkish ports.


    Buyers named the novelty after the people who brought it: the Portuguese orange. Over time the word “orange” dropped away and only the country was left. That’s how Greek got “portokali,” Turkish “portakal,” Romanian “portocala” and Arabic “burtuqal.” In some Italian dialects, an orange is still called “portogallo.”
  ru: >-
    Апельсины в Европе были и до португальцев. Горькие привезли арабы ещё в Средние века. Их держали ради запаха, варенья и лекарств, но есть сырыми не могли: слишком кислые.


    В XVI веке португальские купцы привезли из Азии другой сорт, сладкий. Его можно было есть прямо с дерева, как яблоко, и для Европы это была новинка. Португальские корабли развозили его по Средиземному морю, в Италию, Грецию и турецкие порты.


    Покупатели называли новинку по тем, кто её привёз: португальский апельсин. Потом слово «апельсин» отпало, и осталась одна страна. Так появились portokali по-гречески, portakal по-турецки, portocala по-румынски и burtuqal по-арабски. В некоторых итальянских говорах апельсин до сих пор зовут portogallo.
