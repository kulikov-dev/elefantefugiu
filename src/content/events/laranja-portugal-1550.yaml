more:
  pt: >-
    Em Portugal não se diz assim. Cá, a laranja é «laranja», do árabe «naranj»: o nome veio precisamente das laranjas amargas. A variedade doce, que deu fama ao país lá fora, em casa ficou simplesmente laranja.


    Noutras línguas a história é outra. Em neerlandês, em alemão e em russo, a laranja doce chama-se «maçã da China» («appelsien», «Apfelsine», «apelsin»). Os holandeses lembraram-se de onde vinha a fruta; os gregos e os turcos, de quem a trazia.


    E no Algarve as duas histórias juntam-se num só lugar. As laranjas amargas já eram plantadas pelos árabes quando Silves era a sua capital. As doces chegaram mais tarde, e hoje o vale à volta de Silves é uma das principais regiões de laranja de Portugal.
  en: >-
    Portugal itself doesn’t say it that way. There an orange is “laranja,” from the Arabic “naranj,” a name inherited from those same bitter oranges. The sweet variety that made the country famous abroad stayed just an orange at home.


    Other languages tell yet another story. In Dutch, German and Russian, the sweet orange is a “Chinese apple” (“appelsien,” “Apfelsine,” “apelsin”). The Dutch remembered where the fruit came from; the Greeks and Turks remembered who brought it.


    And in the Algarve, both stories meet in one place. Bitter oranges were planted here by the Arabs when Silves was their capital. Sweet ones came later, and today the valley around Silves is one of Portugal’s main orange-growing regions.
  ru: >-
    В самой Португалии так не говорят. Здесь апельсин — laranja, от арабского naranj: имя досталось от тех самых горьких апельсинов. Сладкий сорт, который принёс стране славу за границей, дома остался просто апельсином.


    У русских своя история. Наше «апельсин» пришло через голландский и значит «китайское яблоко». Голландцы запомнили, откуда фрукт родом, а греки и турки — кто его привёз.


    А в Алгарве обе истории сошлись в одном месте. Горькие апельсины здесь сажали ещё арабы, когда Силвеш был их столицей. Сладкие пришли позже, и сегодня долина вокруг Силвеша — один из главных апельсиновых краёв Португалии.
myth:
  verdict: myth
  statement:
    pt: Foram os portugueses os primeiros a trazer laranjas para a Europa
    en: The Portuguese were the first to bring oranges to Europe
    ru: Апельсины в Европу первыми привезли португальцы
  answer:
    pt: As laranjas amargas foram trazidas pelos árabes séculos antes. Os portugueses trouxeram as doces, e por elas a fruta ganhou o nome de Portugal na Grécia e na Turquia.
    en: The Arabs brought bitter oranges centuries earlier. The Portuguese brought sweet ones, and that’s why Greece and Turkey named the fruit after Portugal.
    ru: Миф. Горькие апельсины привезли арабы за века до португальцев. Португальцы привезли сладкие, и по ним фрукт назвали в Греции и Турции.
