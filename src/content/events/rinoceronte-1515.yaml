hook:
  pt: >-
    O rei pôs um rinoceronte contra um elefante. O elefante fugiu.
  en: >-
    The king pitted a rhino against an elephant. The elephant fled.
  ru: Король стравил носорога со слоном. Слон убежал.
story:
  pt: >-
    Em maio de 1515 chegou a Lisboa um rinoceronte vindo da Índia, o primeiro
    vivo que a Europa via desde os romanos. A 3 de junho, D. Manuel I quis ver
    se era verdade o que Plínio escrevera: que elefantes e rinocerontes são
    inimigos de morte. Trouxeram um elefante novo perante a multidão. O bicho
    assustou-se com o barulho e fugiu antes de a luta começar.
  en: >-
    In May 1515 a rhinoceros arrived in Lisbon from India, the first live one in
    Europe since Roman times. On 3 June King Manuel I decided to test Pliny's
    claim that elephants and rhinos are bitter enemies. A young elephant was
    brought out before a crowd. It panicked at the noisy crowd and fled before a
    single blow was struck.
  ru: >-
    В мае 1515 года в Лиссабон из Индии привезли носорога, первого живого
    носорога в Европе со времён римлян. 3 июня король Мануэл I решил проверить
    слова Плиния о том, что слоны и носороги смертельные враги. К носорогу
    вывели молодого слона перед толпой. Слон испугался шума и убежал, не
    дождавшись первого удара.
more:
  pt: |-
    O rinoceronte foi uma oferta do sultão Muzaffar de Cambaia (Guzerate) ao governador Afonso de Albuquerque, que o enviou a D. Manuel depois de quatro meses de viagem. Viveu na Europa de 20 de maio de 1515 a janeiro de 1516.

    Um ano antes, D. Manuel tinha enviado ao Papa Leão X um elefante, Hanão, e em dezembro de 1515 decidiu enviar também o rinoceronte. O navio afundou-se numa tempestade ao largo de La Spezia, no fim de janeiro de 1516, e o animal morreu afogado. Os relatos sobre o corpo divergem: a maioria diz que deu à costa, foi empalhado e seguiu para o Papa, outros que a pele voltou primeiro a Lisboa. Não encontrámos rasto de nenhum rinoceronte empalhado que exista hoje.

    Albrecht Dürer nunca o viu: baseou-se no esboço e na descrição de um mercador, mas a sua gravura, com um corno a mais no ombro, passou séculos a ser o rinoceronte da Europa.

    Em Lisboa, diz-se que há um rinoceronte de pedra numa guarita da Torre de Belém, construída por essa altura.
  en: |-
    The rhino was a gift from Sultan Muzaffar of Cambay (Gujarat) to the governor Afonso de Albuquerque, who sent it on to Manuel after a four-month voyage. It lived in Europe from 20 May 1515 to January 1516.

    A year earlier Manuel had sent Pope Leo X an elephant, Hanno, and in December 1515 he decided to send the rhino too. The ship sank in a storm off La Spezia at the end of January 1516, and the animal drowned. Accounts of the body differ: most say it washed ashore and was stuffed and sent on to the Pope, others that the skin went back to Lisbon first. We found no trace of a stuffed rhino today.

    Albrecht Dürer never saw it: he worked from a sketch and a description from Lisbon, but his woodcut, with its extra horn on the shoulder, became Europe's standard rhinoceros for centuries.

    In Lisbon, a stone rhinoceros is thought to look out from a corner turret of Belém Tower, built in those same years.
  ru: |-
    Носорог был подарком султана Музаффара Камбейского (Гуджарат) губернатору Афонсу де Албукерки, который переслал его Мануэлу после четырёхмесячного плавания. Он прожил в Европе с 20 мая 1515 года по январь 1516-го.

    Годом раньше Мануэл отправил папе Льву X слона по имени Ханно, а в декабре 1515 года решил послать и носорога. Корабль затонул в шторм у Специи в конце января 1516 года, и животное утонуло. О судьбе тела рассказывают по-разному: чаще пишут, что его выбросило на берег, из него сделали чучело и отправили папе, но есть версия, что шкуру сначала вернули в Лиссабон. Следов сохранившегося чучела мы не нашли.

    Альбрехт Дюрер его никогда не видел: он работал по наброску и описанию купца, но его гравюра с лишним рогом на плече на века стала в Европе образцом носорога.

    В Лиссабоне, как считают, каменный носорог выглядывает с угловой башенки Белемской башни, построенной в те же годы.
