more:
  pt: >-
    A laje chama-se precisamente Pedra da Mua, a «pedra da mula». Em tempos foi uma margem plana de lodo, mas com o tempo as camadas de rocha ergueram-se e ficaram inclinadas. Por isso as pegadas estão hoje numa encosta, e parece que o animal subiu a direito pela arriba, como na lenda.


    Os cientistas leram nestas pegadas mais do que «aqui houve dinossauros». Na laje há vários trilhos, e quase todos foram deixados por animais pequenos, provavelmente jovens, que caminhavam lado a lado na mesma direção. É um dos primeiros indícios na Europa de que os saurópodes andavam em manada.


    A lenda, porém, continua viva. Na Ermida da Memória, os azulejos ainda mostram Nossa Senhora com o Menino montada na mula. É um lugar raro, onde o milagre e a explicação científica apontam para as mesmas pegadas.
  en: >-
    The slab is even called Pedra da Mua, “the mule’s stone.” It was once a flat, muddy shore, but over time the rock layers rose and tilted. That’s why the footprints now sit on a slope, and it looks as if the animal walked straight up the cliff, just as the legend says.


    Scientists read more in these footprints than “dinosaurs were here.” The slab holds several trackways, and nearly all were left by small, probably young animals walking side by side in the same direction. It is one of the first signs found in Europe that sauropods moved in herds.


    The legend lives on all the same. Inside the Ermida da Memória, the tiles still show the Virgin and Child riding the mule. It is a rare place where a miracle and a scientific explanation point to the same footprints.
  ru: >-
    Плиту так и называют, Педра-да-Муа, «камень мула». Когда-то это был ровный илистый берег, но со временем пласты камня поднялись и встали наискосок. Поэтому следы теперь видны на склоне, и кажется, что животное шло прямо вверх по обрыву, как в легенде.


    По этим следам учёные прочитали больше, чем просто «здесь были динозавры». На плите несколько цепочек, и почти все оставили небольшие, вероятно молодые животные, которые шли рядом в одну сторону. Это одно из первых свидетельств в Европе того, что зауроподы ходили стадами.


    Легенду при этом никто не отменял. В часовне Ермида-да-Мемория на изразцах до сих пор изображена Богородица с Младенцем на муле. Получилось редкое место, где чудо и научное объяснение показывают на одни и те же следы.
