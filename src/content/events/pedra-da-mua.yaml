hook:
  pt: "Durante séculos, peregrinos vieram ver pegadas de mula. Eram de dinossauro."
  en: "Pilgrims visited a mule’s footprints for centuries. The mule was a dinosaur."
  ru: "Паломники веками шли смотреть на следы мула. Мул оказался динозавром."
story:
  pt: >-
    Há muito que, no Cabo Espichel, a sul de Lisboa, se fala de um milagre. Nossa Senhora teria
    subido do mar pela arriba montada numa mula, e os cascos deixaram marcas na própria pedra.

    Quem chegava à beira da falésia via as pegadas, por isso acreditava-se no milagre. Durante séculos vieram peregrinos ao cabo: na arriba ergueu-se uma ermida e, mais tarde, ao lado nasceu um grande santuário.

    As fileiras de covas redondas existem mesmo, numa laje inclinada sobre o mar. Mas nos anos 1990 os cientistas perceberam que a mula nada tinha a ver com elas. Há cerca de 150 milhões de anos, saurópodes, enormes dinossauros herbívoros de pescoço comprido, passaram por uma margem lodosa. O milagre que trazia os peregrinos eram, afinal, pegadas de dinossauros.
  en: >-
    At Cape Espichel, south of Lisbon, people have long told of a miracle. The Virgin Mary is said to have risen from the sea and climbed the cliff on a mule, its hooves leaving marks in the solid rock.

    Anyone who walked to the edge could see the prints, so people believed. For centuries pilgrims came to the cape: a chapel went up on the cliff, and later a large sanctuary grew beside it.

    The rows of round hollows really are there, on a tilted slab above the sea. But in the 1990s scientists found that the mule had nothing to do with them. About 150 million years ago, sauropods, huge long-necked plant-eating dinosaurs, walked across a muddy shore. The miracle that drew the pilgrims turned out to be dinosaur footprints.
  ru: >-
    На мысе Эшпишел, к югу от Лиссабона, издавна рассказывают о чуде. Богородица будто бы поднялась из моря на обрыв верхом на муле, и копыта оставили следы прямо в камне.

    Следы видел каждый, кто подходил к краю, поэтому в чудо верили. К мысу веками шли паломники, на обрыве поставили часовню, а потом рядом выросло большое святилище.

    Цепочки круглых ямок действительно идут по наклонной плите над морем. Но в 1990-х учёные выяснили, что мул тут ни при чём. Около 150 млн лет назад по илистому берегу прошли зауроподы, огромные длинношеие травоядные динозавры. Так чудо, ради которого сюда шли люди, оказалось следами динозавров.
