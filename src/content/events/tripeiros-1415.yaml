hook:
  pt: "Diz a lenda: o Porto ficou com as tripas e uma alcunha."
  en: >-
    Porto gave away its meat, kept the tripe, and got a nickname.
  ru: Порту отдал мясо, оставил потроха и получил прозвище.
story:
  pt: >-
    Diz a lenda que, em 1415, os estaleiros do Porto construíam em segredo uma
    armada para Ceuta. O infante D. Henrique, nascido na cidade, apareceu sem
    avisar e contou ao mestre Vaz o verdadeiro destino. Vaz prometeu toda a
    carne da cidade aos navios; o povo ficava com as tripas. O infante disse que
    a alcunha de «tripeiros» era uma honra. O Porto nunca mais a largou.
  en: >-
    According to legend, in 1415 Porto's shipyards were secretly building a
    fleet for Ceuta. Prince Henry, born in the city, turned up unannounced and
    told the foreman, Master Vaz, the real target. Vaz promised the ships all
    the city's meat; the people would keep the tripe. Henry called the nickname
    'tripe-eaters' an honour. Porto has worn it ever since.
  ru: >-
    Согласно легенде, в 1415 году верфи Порту втайне строили флот для похода на
    Сеуту. Инфант Энрике (Генрих Мореплаватель), родившийся в этом городе,
    нагрянул без предупреждения и открыл настоящую цель мастеру верфи по имени
    Ваш. Ваш пообещал кораблям всё мясо города, а людям остались потроха. Энрике
    назвал прозвище «tripeiros», то есть любители потрохов, почётным. Порту
    носит его до сих пор.
more:
  pt: >-
    Não se conserva nenhuma crónica da época com esta história, e as versões
    variam: numa delas, a alcunha já tinha trinta anos, vinda de uma guerra com
    Castela. O prato, esse, existe mesmo: tripas à moda do Porto, tripas
    guisadas com feijão, enchidos e carnes de porco, frango e vitela. Em 1960,
    foi colocado um monumento de bronze de Lagoa Henriques junto aos antigos
    estaleiros, em agradecimento ao povo do Porto que equipou a armada. Na
    inscrição lê-se «À Grei».
  en: >-
    No chronicle of the time that tells this story survives, and versions
    differ: in one, the nickname is already thirty years old, from a war with
    Castile. The dish, however, is real: tripas à moda do Porto, tripe stewed
    with beans, sausages and cuts of pork, chicken and veal. In 1960 a bronze
    monument by Lagoa Henriques was placed beside the old yards, thanking the
    people of Porto who equipped the fleet. Its inscription says À Grei, 'to the
    people'.
  ru: >-
    Хроники того времени с этой историей не сохранилось, и версии расходятся: в
    одной прозвищу уже тридцать лет, оно пришло из войны с Кастилией. Зато блюдо
    настоящее: tripas à moda do Porto, рубец, тушёный с фасолью, колбасами и
    кусками свинины, курицы и телятины. В 1960 году у старых верфей поставили
    бронзовый памятник работы Лагоа Энрикеша в благодарность жителям Порту,
    снарядившим флот. На нём надпись À Grei, «народу».
