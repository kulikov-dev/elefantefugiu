story:
  pt: |-
    A sinagoga de Tomar foi construída em meados do século XV, por volta de 1460. Em 1496, D. Manuel I ordenou aos judeus que se convertessem ou partissem, e deixou de haver quem nela rezasse.

    O edifício passou de mão em mão. Em 1516 foi comprado para cadeia da vila, depois serviu de capela de São Bartolomeu. No século XIX guardou feno, depois vinho e mercearias. A sinagoga foi esquecida.

    Em 1923, o edifício foi comprado por Samuel Schwarz, engenheiro de minas polaco que vivia em Portugal e estudava a história dos seus judeus. Limpou a sala, começou escavações e, em 1939, ofereceu a sinagoga ao Estado com uma condição: que ali houvesse um museu.
  en: |-
    Tomar’s synagogue was built in the mid-15th century, around 1460. In 1496, King Manuel I ordered the Jews to convert or leave, and no one was left to pray there.

    The building changed hands. In 1516 it was bought to serve as the town jail, and later it became the chapel of Saint Bartholomew. In the 19th century it stored hay, then wine and groceries. The synagogue was forgotten.

    In 1923 the building was bought by Samuel Schwarz, a Polish mining engineer who lived in Portugal and studied the history of its Jews. He cleared the hall, began excavating, and in 1939 gave the synagogue to the state on one condition: that it become a museum.
  ru: |-
    Синагогу в Томаре построили в середине XV века, около 1460 года. В 1496 году король Мануэл I велел евреям креститься или уехать, и молиться в ней стало некому.

    Здание пошло по рукам. В 1516 году его купили под городскую тюрьму, потом в нём устроили часовню Святого Варфоломея. В XIX веке там держали сено, потом вино и бакалею. О синагоге забыли.

    В 1923 году здание купил Самуэл Шварц, польский горный инженер, который жил в Португалии и изучал историю её евреев. Он расчистил зал, начал раскопки, а в 1939 году подарил синагогу государству с одним условием: чтобы в ней был музей.
more:
  pt: |-
    A sinagoga teve sorte por ter sido sempre usada. Um armazém e uma prisão não precisavam de obras, e por isso a sala ficou quase como foi construída: quadrada, com quatro colunas e abóbadas. Diz-se que nos cantos há bilhas de barro embutidas, com a boca virada para a sala, para melhorar o som da voz.

    Schwarz ficou conhecido também por outra descoberta. Em 1917, na serra junto a Belmonte, encontrou uma comunidade que durante quatrocentos anos guardara em segredo os ritos judaicos, embora os antepassados fossem tidos por cristãos. E o museu de Tomar tem o nome de Abraão Zacuto, o astrónomo cujas tábuas Vasco da Gama levou consigo.
  en: |-
    The synagogue was lucky to have always been in use. A warehouse and a jail didn’t need any rebuilding, so the hall stayed almost as it was built: square, with four columns and vaulted ceilings. Clay jars are said to be set into the corners, mouths facing the room, to make voices carry better.

    Schwarz was famous for another discovery too. In 1917, in the hills near Belmonte, he found a community that had secretly kept Jewish rites for four hundred years, even though their ancestors were considered Christians. And the museum in Tomar is named after Abraham Zacuto, the astronomer whose tables Vasco da Gama took with him.
  ru: |-
    Синагоге повезло, что её всё время использовали. Складу и тюрьме не нужна была перестройка, поэтому зал остался почти таким, каким его построили: квадратный, с четырьмя колоннами и сводами. Говорят, в углы встроены глиняные кувшины горлышками в зал, чтобы лучше звучал голос.

    Шварц прославился и другим открытием. В 1917 году в горах у Бельмонти он нашёл общину, которая четыреста лет тайком хранила еврейские обряды, хотя её предки считались крещёными. А музей в Томаре носит имя Авраама Закуто, астронома, чьи таблицы брал с собой Васко да Гама.
