hook:
  pt: Uma princesa portuguesa levou para Inglaterra o chá e, no dote, Bombaim.
  en: A Portuguese princess brought England tea and, in her dowry, Bombay.
  ru: Португальская принцесса привезла в Англию чай, а в приданое Бомбей.
story:
  pt: "Em 1662, D. Catarina de Bragança, filha de D. João IV, casou com o rei Carlos II de Inglaterra.
    O dote era enorme: dois milhões de cruzados, Tânger, Bombaim e o direito de os mercadores
    ingleses negociarem no Brasil e na Índia. Levou também o hábito português de beber chá. Na corte
    começaram a imitar a rainha, e o chá passou de remédio raro a bebida da moda."
  en: "In 1662, Catherine of Braganza, daughter of John IV, married King Charles II of England. Her
    dowry was huge: two million cruzados, Tangier, Bombay, and the right for English merchants to
    trade in Brazil and India. She also brought the Portuguese habit of drinking tea. The court
    began to copy the queen, and tea went from a rare medicine to a fashionable drink."
  ru: "В 1662 году Катарина Брагансская, дочь Жуана IV, вышла замуж за английского короля Карла II. Её
    приданое было огромным: два миллиона крузадо, Танжер, Бомбей и право английским купцам торговать
    в Бразилии и Индии. Привезла она и португальскую привычку пить чай. При дворе стали подражать
    королеве, и чай из редкого лекарства превратился в модный напиток."
more:
  pt: >-
    Em Londres já se vendia chá antes dela. Em 1658, uma casa de café junto à Bolsa Real publicou o
    primeiro anúncio de chá em Inglaterra: «excelente bebida chinesa, aprovada por todos os
    médicos». Bebiam-no os homens nas casas de café, como um remédio saudável e muito caro.


    Catarina bebia chá todos os dias, nos seus aposentos, rodeada das suas damas. Os cortesãos
    começaram a fazer o mesmo, depois a nobreza, e o chá passou da casa de café para a sala de
    estar. Por isso lhe chamam a rainha que ensinou a Inglaterra a beber chá: não foi a primeira a
    levá-lo, mas fez dele um hábito.


    Bombaim, que veio no seu dote, foi entregue pela Inglaterra à Companhia das Índias Orientais em
    1668. Desse porto nasceu Mumbai.
  en: >-
    Tea was sold in London before she arrived. In 1658, a coffeehouse near the Royal Exchange
    printed England’s first tea advertisement: “that excellent and by all Physitians approved China
    drink.” Men drank it in coffeehouses as a healthy and very expensive remedy.


    Catherine drank tea every day in her own rooms, with her ladies. Courtiers started doing the
    same, then the nobility, and tea moved from the coffeehouse into the drawing room. That’s why
    she’s called the queen who taught England to drink tea: she wasn’t the first to bring it, but
    she made it a habit.


    England handed Bombay, part of her dowry, to the East India Company in 1668. That port grew into
    Mumbai.
  ru: >-
    Чай в Лондоне продавали и до неё. В 1658 году кофейня у Королевской биржи напечатала первую в
    Англии рекламу чая: «превосходный китайский напиток, одобренный всеми врачами». Его пили мужчины
    в кофейнях, как полезное и очень дорогое снадобье.


    Катарина пила чай каждый день, у себя, в кругу дам. Придворные стали делать то же, за ними
    знать, и чай переехал из кофейни в гостиную. Поэтому её и называют королевой, которая научила
    Англию пить чай: не первой привезла его, а сделала привычкой.


    Бомбей из её приданого Англия в 1668 году отдала Ост-Индской компании. Из этого порта вырос
    Мумбаи.
