hook:
  pt: Um rei espanhol levou água aos cavaleiros portugueses.
  en: A Spanish king brought water to Portuguese knights.
  ru: Испанский король провёл воду португальским рыцарям.
story:
  pt: |-
    Em 1581, Portugal ganhou um rei estrangeiro: Filipe II de Espanha herdou o trono depois de se extinguir a dinastia portuguesa. Os portugueses não o queriam, e Filipe precisava de agradar aos novos súbditos.

    Para isso escolheu Tomar. No Convento de Cristo, casa-mãe da ordem de cavalaria herdeira dos templários, reuniu nobreza, clero e povo em cortes e jurou: Portugal seria governado só por portugueses, e manteria a sua língua, a sua moeda e as suas leis. Ali mesmo foi aclamado rei, como Filipe I de Portugal.

    O convento ficava num monte seco, e a água tinha de ser carregada. Em agradecimento, o rei mandou fazer um aqueduto. Começou a construir-se em 1593 e estendeu-se por quase seis quilómetros, em parte sobre dois andares de arcos com até 30 metros de altura. A água só chegou à fonte do claustro em 1619, vinte anos depois da morte de Filipe.
  en: |-
    In 1581, Portugal got a foreign king: Philip II of Spain inherited the throne after the Portuguese royal line died out. The Portuguese didn’t want him, and Philip needed to win over his new subjects.

    He chose Tomar to do it. At the Convent of Christ, headquarters of a knightly order that had inherited the Templars’ role, Philip gathered the nobility, clergy, and towns and swore an oath: Portugal would be governed only by Portuguese, and would keep its own language, money, and laws. There, too, he was acclaimed king.

    The convent stood on a dry hill, and water had to be carried up. In thanks, the king ordered an aqueduct. Work began in 1593, and it ran for almost six kilometers, in places on two tiers of arches up to 30 meters high. Water only reached the fountain in the convent’s cloister in 1619, twenty years after Philip’s death.
  ru: |-
    В 1581 году Португалия получила короля-иностранца: Филипп II Испанский унаследовал трон после того, как пресеклась португальская династия. Португальцы его не хотели, и Филиппу нужно было понравиться новым подданным.

    Он выбрал для этого Томар. В Монастыре Христа, главном доме рыцарского ордена, наследника тамплиеров, Филипп собрал представителей знати, духовенства и городов и поклялся: Португалией будут управлять только португальцы, а язык, деньги и законы у неё останутся свои. Там же его признали королём.

    Монастырь стоял на сухом холме, и воду туда носили. В благодарность король заказал акведук. Его начали в 1593 году и вели почти шесть километров, местами на двух ярусах арок высотой до 30 метров. Вода забила в фонтане монастырского двора только в 1619 году, через двадцать лет после смерти Филиппа.
more:
  pt: |-
    O aqueduto foi desenhado pelo italiano Filippo Terzi, arquiteto principal do rei. Morreu em 1597, um ano antes de Filipe, e a obra foi terminada por outros mestres. Quem veio inaugurá-lo foi já o filho de Filipe, como ainda hoje lembra uma inscrição no aqueduto.

    As promessas de Tomar duraram enquanto os reis espanhóis precisaram da simpatia dos portugueses. O neto de Filipe começou a pôr espanhóis em cargos portugueses e a cobrar impostos para as suas guerras, e em 1640 Portugal revoltou-se. E a água do aqueduto correu para o convento até meados do século XX.
  en: |-
    The aqueduct was designed by the Italian Filippo Terzi, the king’s chief architect. He died in 1597, a year before Philip, and other builders finished the work. It was Philip’s son who came to open it, as an inscription on the aqueduct still records.

    The promises made at Tomar held as long as the Spanish kings needed Portuguese goodwill. Philip’s grandson began putting Spaniards into Portuguese posts and raising taxes for his wars, and in 1640 Portugal rebelled. The aqueduct kept carrying water to the convent until the mid-20th century.
  ru: |-
    Чертил акведук итальянец Филиппо Терци, главный архитектор короля. Он умер в 1597 году, за год до Филиппа, и заканчивали акведук другие мастера. Открывать его приехал уже сын Филиппа, и об этом до сих пор говорит надпись на нём.

    Клятвы в Томаре держались, пока испанские короли нуждались в любви португальцев. Внук Филиппа начал ставить испанцев на португальские должности и брать налоги на свои войны, и в 1640 году Португалия восстала. А вода по акведуку шла в монастырь до середины XX века.
