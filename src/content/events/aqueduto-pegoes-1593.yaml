  statement:
    pt: O Aqueduto dos Pegões, em Tomar, foi construído pelos romanos
    en: The Pegões Aqueduct in Tomar was built by the Romans
    ru: Акведук Пегойнш в Томаре построили римляне
  answer:
    pt: Começou em 1593 por ordem de Filipe I, o rei espanhol que se tornou também rei de Portugal.
    en: It was begun in 1593 on the orders of Philip II of Spain, who had also become king of Portugal.
    ru: Его начали в 1593 году по приказу Филиппа II, испанского короля, который стал и королём Португалии.
