hook:
  pt: Depois do terramoto, as ruas da Baixa foram repartidas pelos ofícios.
  en: "Goldsmiths here, saddlers there: a rebuilt Lisbon sorted its trades by street."
  ru: Золотых дел мастера на одной улице, шорники на другой — по указу.
story:
  pt: "Depois do terramoto de 1755, a Baixa de Lisboa foi reconstruída a régua e esquadro, com
    ruas direitas e prédios iguais. A portaria régia de 5 de novembro de 1760 deu nomes às ruas e
    destinou a algumas delas certos ofícios. Na Rua Áurea deviam trabalhar os ourives e, na Rua dos
    Correeiros, os correeiros, os seleiros e os torneiros. Os lisboetas ainda dizem Rua do Ouro,
    embora na placa se leia Rua Áurea."
  en: "After 1755, Lisbon’s lower town was rebuilt as if drawn with a ruler: straight streets,
    identical buildings. A royal order of November 5, 1760, named the streets and assigned trades to
    some of them. Goldsmiths were to work on Rua Áurea, and harness makers, saddlers, and turners on
    Rua dos Correeiros. Lisbon residents still say Rua do Ouro, or Gold Street, although the sign
    reads Rua Áurea."
  ru: "После землетрясения 1755 года нижний город Лиссабона отстроили по линейке: прямые улицы,
    одинаковые дома. Королевское распоряжение от 5 ноября 1760 года дало улицам имена и назначило
    некоторым из них ремёсла. На Руа-Аурея должны были работать ювелиры, а на улице Коррейруш (Rua
    dos Correeiros) — шорники, седельщики и токари. Лиссабонцы до сих пор говорят «Руа-ду-Ору»,
    Золотая улица, хотя по табличке она Руа-Аурея."
more:
  pt: >-
    Assim, Pombal pôs ordem não só no traçado, mas também no comércio: o comprador sabia onde
    procurar um anel ou uma sela. Na Rua Áurea, além dos ourives, as lojas que sobrassem ficavam
    para os relojoeiros.


    Parte dos nomes veio do uso ou surgiu mais tarde. A Rua da Prata chamava-se Rua Bela da Rainha
    até 1910, e a Rua dos Fanqueiros aparece na portaria como Rua Nova da Princesa. Em 1910, um mês
    depois da proclamação da República, as ruas com nomes ligados à monarquia foram rebatizadas. Daí
    uma confusão que dura até hoje: a Rua Áurea continua a ser, para toda a gente, a Rua do Ouro.
  en: >-
    Pombal thus brought order not only to the street plan but to trade as well: a shopper knew where
    to look for a ring or a saddle. On Rua Áurea, besides the goldsmiths, the spare shops were to go
    to watchmakers.


    Some of the names came from everyday use or were added later. Rua da Prata was called Rua Bela
    da Rainha until 1910, and Rua dos Fanqueiros appears in the order as Rua Nova da Princesa. In
    1910, a month after the Republic was proclaimed, streets with names tied to the monarchy were
    renamed. The result is a confusion that lives on: to everyone, Rua Áurea is still Rua do Ouro.
  ru: >-
    Так Помбал навёл порядок не только в планировке, но и в торговле: покупатель знал, где искать
    кольцо или сбрую. На Руа-Аурея, кроме ювелиров, в оставшихся лавках должны были сидеть
    часовщики.


    Часть названий пришла из обихода или появилась позже. Улица Прата (Rua da Prata) до 1910 года
    называлась Бела-да-Райнья (Rua Bela da Rainha), а улица Фанкейруш (Rua dos Fanqueiros) значится
    в указе как Нова-да-Принсеза (Rua Nova da Princesa). В 1910 году, через месяц после
    провозглашения республики, улицам с «королевскими» названиями дали новые имена. Отсюда путаница,
    которая жива до сих пор: Руа-Аурея для всех остаётся Руа-ду-Ору.
