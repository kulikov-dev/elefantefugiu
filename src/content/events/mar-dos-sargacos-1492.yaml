    en: The Sargasso Sea has no coastline at all
    ru: У Саргассова моря нет ни одного берега
  answer:
    pt: É o único mar sem terra à volta. Os seus limites são quatro correntes oceânicas, entre elas a do Golfo.
    en: It’s the only sea with no land around it. Its borders are four ocean currents, including the Gulf Stream.
    ru: Это единственное море без суши вокруг. Его границы — четыре океанских течения, среди них Гольфстрим.
