more:
  pt: >-
    O Mar dos Sargaços é o único mar sem costas. Os seus limites são quatro correntes, entre elas a do Golfo. Fazem a água girar devagar, como num funil, e as algas juntam-se ao centro. É também para aqui, como os cientistas descobriram no século XX, que as enguias europeias vêm desovar, incluindo as dos rios portugueses.


    A calmaria no centro deste remoinho deu origem a uma lenda. Os marinheiros contavam que a erva prendia os navios e que eles morriam no meio dela. Na verdade, as algas não impedem a navegação, e os veleiros ficavam parados por falta de vento. Mas a lenda pegou, e até Júlio Verne a aproveitou: o seu «Nautilus» atravessa o Mar dos Sargaços.


    E na terra da palavra, o ofício durou muito tempo. Na Apúlia, em Esposende, os sargaceiros entravam na rebentação com uma vara comprida com rede, puxavam as algas para a areia e levavam-nas para os campos. Têm um monumento junto à igreja de Nossa Senhora da Guia.
  en: >-
    The Sargasso Sea is the only sea with no shores. Its borders are four currents, including the Gulf Stream. They slowly spin the water like a funnel, and the seaweed gathers in the middle. As scientists found in the 20th century, this is also where European eels come to spawn, including eels from Portuguese rivers.


    The calm at the center of that whirl gave rise to a legend. Sailors said the weed trapped ships and they perished in it. In fact, seaweed doesn’t stop a ship; sailing ships stalled because there was no wind. But the legend stuck, and even Jules Verne used it: his Nautilus crosses the Sargasso Sea.


    Back where the word came from, the trade lasted a long time. In Apúlia, near Esposende, seaweed gatherers called “sargaceiros” waded into the surf with long poles tipped with nets, hauled the seaweed onto the sand and carted it off to the fields. They have a monument by the church of Nossa Senhora da Guia.
  ru: >-
    Саргассово море — единственное море, у которого нет берегов. Его границы — четыре течения, среди них Гольфстрим. Они медленно кружат воду, как в воронке, и водоросли собираются в середине. Сюда же, как выяснили учёные в XX веке, приплывают метать икру европейские угри, в том числе из португальских рек.


    Штиль в центре этого круговорота породил легенду. Моряки рассказывали, что трава держит корабли и они гибнут среди неё. На самом деле водоросли не мешают плыть, а парусники стояли из-за безветрия. Но легенда оказалась живучей, и её подхватил даже Жюль Верн: его «Наутилус» проходит Саргассово море.


    А на родине слова ремесло жило ещё долго. В Апулии под Эшпозенде сборщики водорослей, саргасейруш, заходили в прибой с длинным шестом с сеткой, вытаскивали водоросли на берег и везли их на поля. Им поставлен памятник у церкви Nossa Senhora da Guia.
