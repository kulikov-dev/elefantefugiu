story:
  pt: >-
    No norte de Portugal, as algas que o mar atira para a praia chamam-se sargaço. Os lavradores apanhavam-nas, secavam-nas e adubavam com elas os campos.


    No século XV, os portugueses aprenderam a voltar de África por um caminho invulgar. Voltar para casa a costear era impossível por causa do vento contrário, por isso os navios afastavam-se muito para oeste, para o alto mar, e apanhavam lá o vento favorável para os Açores e Lisboa. Nesta volta, a milhares de quilómetros de terra, os marinheiros encontravam campos inteiros de algas castanhas a flutuar. Reconheceram nelas o seu sargaço, e a palavra deu nome ao mar.


    Em 1492, Colombo atravessou esses campos. Os seus homens acharam que a terra estava perto, com tanta erva na água. Lançaram a sonda, mas não chegaram ao fundo: estas algas vivem e flutuam em pleno oceano.
  en: >-
    In northern Portugal, the seaweed that washes up on the beach is called “sargaço.” Farmers raked it up, dried it and used it to fertilize their fields.


    In the 1400s, the Portuguese learned an unusual way home from Africa. Headwinds blocked the route back along the coast, so ships swung far west into the open ocean and picked up a fair wind there toward the Azores and Lisbon. On that detour, far out of sight of land, sailors came across whole fields of floating brown seaweed. They recognized their own sargaço, and the word gave the sea its name.


    In 1492, Columbus sailed through those fields. His men thought land must be near, with so much weed in the water. They dropped a sounding line but never touched bottom: this seaweed lives and floats in the open ocean.
  ru: >-
    На севере Португалии водоросли, которые море выбрасывает на пляж, зовут sargaço. Крестьяне сгребали их, сушили и удобряли ими поля.


    В XV веке португальцы научились возвращаться из Африки необычным путём. Плыть домой вдоль берега мешал встречный ветер, поэтому корабли уходили далеко на запад, в открытый океан, и ловили там попутный ветер к Азорам и Лиссабону. На этом обходе, за тысячи километров от суши, моряки встречали целые поля плавучих бурых водорослей. Они узнали в них свой sargaço, и это слово дало имя морю.


    В 1492 году через эти поля шёл Колумб. Его моряки решили, что земля близко, раз в воде столько травы. Бросили лот, но дна не достали: эти водоросли живут и плавают прямо в открытом океане.
