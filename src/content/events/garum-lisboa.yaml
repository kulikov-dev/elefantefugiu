hook:
  pt: Debaixo de um banco de Lisboa, os romanos faziam molho de peixe.
  en: Under a Lisbon bank, Romans once made fish sauce.
  ru: Под лиссабонским банком римляне варили рыбный соус.
story:
  pt: Em 1991, um banco da Baixa decidiu remodelar a sua sede. Debaixo do chão, os operários
    encontraram tanques de pedra onde os romanos salgavam peixe. Aqui, na margem do Tejo, a antiga
    Olisipo fazia conservas de peixe e um molho forte de peixe, sal e ervas, apreciado em todo o
    império. O banco não tapou a descoberta, e hoje debaixo dos seus escritórios está uma fábrica
    romana de peixe.
  en: In 1991 a bank in Lisbon’s Baixa set out to renovate its headquarters. Under the floor, workers
    found stone vats where the Romans had salted fish. Here on the banks of the Tagus, ancient
    Olisipo made preserved fish and a pungent sauce of fish, salt, and herbs that was loved across
    the empire. The bank didn’t fill the find back in, and today a Roman fish factory lies beneath
    its offices.
  ru: В 1991 году банк в Байше взялся перестроить свою штаб-квартиру. Под полом рабочие нашли каменные
    чаны, в которых римляне солили рыбу. Здесь, на берегу Тежу, древний Олисипо делал рыбные
    консервы и острый соус из рыбы, соли и трав, который любили по всей империи. Банк не стал
    засыпать находку, и теперь под его офисом лежит римская рыбная фабрика.
more:
  pt: >-
    O molho chamava-se garum, e para os romanos era como o sal e o molho de soja juntos para nós. O
    peixe e as vísceras eram cobertos de sal e deixados a fermentar ao sol durante semanas, e depois
    tirava-se o líquido transparente. O melhor garum era caríssimo: Plínio, o Velho, escreveu que
    quase só os perfumes valiam mais.


    A costa lusitana era uma das grandes produtoras. Ânforas com molho e peixe daqui seguiam para
    todo o Mediterrâneo. Em 2021, pela primeira vez em quinze séculos, voltou a fazer-se garum num
    tanque romano: nas ruínas de Tróia, em frente a Setúbal, com sardinha da região.


    Em 1995 abriu um museu debaixo do banco. Além dos tanques, veem-se muros romanos, um pedaço de
    chão de mosaico e achados dos séculos seguintes, até ao terramoto de 1755.
  en: >-
    The sauce was called garum, and for the Romans it was like salt and soy sauce rolled into one.
    Fish and guts were layered with salt and left to ferment in the sun for weeks, and then the
    clear liquid was drained off. The best garum was extremely expensive: Pliny the Elder wrote that
    hardly anything but perfume was valued more.


    The Lusitanian coast was one of its main producers. Amphorae of local sauce and fish traveled
    all over the Mediterranean. In 2021, for the first time in fifteen centuries, garum was made
    again in a Roman vat: in the ruins of Tróia, across from Setúbal, from local sardines.


    In 1995 a museum opened under the bank. Besides the vats, you can see Roman walls, a piece of
    mosaic floor, and finds from later centuries, right up to the earthquake of 1755.
  ru: >-
    Соус назывался гарум, и для римлян он был тем же, чем для нас соль и соевый соус вместе. Рыбу и
    потроха пересыпали солью и неделями оставляли бродить на солнце, а потом сливали прозрачную
    жидкость. Лучший гарум стоил очень дорого: Плиний Старший писал, что дороже ценятся разве что
    благовония.


    Лузитанский берег был одним из главных его производителей. Амфоры с местным соусом и рыбой
    расходились по всему Средиземноморью. В 2021 году гарум впервые за пятнадцать веков снова
    сделали в римском чане: в руинах Тройи напротив Сетубала, из местной сардины.


    В 1995 году под банком открыли музей. Кроме чанов в нём видны римские стены, кусок мозаичного
    пола и находки следующих веков, вплоть до землетрясения 1755 года.
