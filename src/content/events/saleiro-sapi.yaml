hook:
  pt: Artesãos africanos esculpiam saleiros de marfim, e os reis europeus disputavam-nos.
  en: African carvers made ivory saltcellars, and Europe’s kings competed to own them.
  ru: Африканские мастера резали солонки из слоновой кости, а короли охотились за ними.
seo:
  title:
    pt: Saleiro de marfim da Serra Leoa | O Elefante Fugiu
    en: Ivory Saltcellar from Sierra Leone | O Elefante Fugiu
    ru: Солонка из слоновой кости, Сьерра-Леоне | O Elefante Fugiu
story:
  pt: >-
    Os navios portugueses compravam na costa da Serra Leoa pimenta, ouro e marfim. Os escultores
    locais, do povo sapi, perceberam que os visitantes gostavam do seu trabalho e começaram a
    esculpir por encomenda.

    A encomenda mais cara eram os saleiros. O sal na mesa de um nobre europeu era um luxo, e o
    recipiente tinha de deslumbrar. Os mestres esculpiam uma esfera sobre pés e, à volta, figuras de
    portugueses: barbas, chapéus, cruzes, brasões.

    Assim, escultores africanos que nunca tinham visto Lisboa fizeram alguns dos primeiros retratos
    de europeus vistos por olhos africanos. Seguiam para Portugal e, daí, para as coleções reais da
    Europa.
  en: >-
    Portuguese ships bought pepper, gold, and ivory on the coast of Sierra Leone. Local carvers of
    the Sapi people noticed that the visitors admired their work and began carving to order.

    The most expensive orders were saltcellars. Salt on a European noble’s table was a luxury, and
    its container had to dazzle. The masters carved a sphere on legs and surrounded it with figures
    of Portuguese men: beards, hats, crosses, coats of arms.

    So African carvers who had never seen Lisbon made some of the earliest portraits of Europeans
    seen through African eyes. The pieces traveled to Portugal and from there into Europe’s royal
    collections.
  ru: >-
    Португальские корабли покупали на берегах Сьерра-Леоне перец, золото и слоновую кость. Местные
    резчики из народа сапи заметили, что гостям нравится их работа, и стали резать вещи на заказ.

    Самым дорогим заказом были солонки. Соль на столе знатного европейца была роскошью, и сосуд для
    неё должен был поражать. Мастера вырезали шар на ножках, а вокруг ставили фигурки португальцев:
    бороды, шапки, кресты, гербы.

    Так африканские резчики, никогда не видевшие Лиссабона, сделали одни из самых ранних портретов
    европейцев глазами Африки. Их везли в Португалию, а оттуда в королевские коллекции Европы.
more:
  pt: >-
    Os sapi nunca tinham visto palácios europeus, por isso misturavam o seu com o alheio. Os
    guerreiros portugueses seguram espadas e escudos, mas os rostos e as poses são os da escultura
    local. Ao mestre mostravam-se gravuras e moedas, e o resto ele imaginava.


    As peças de marfim saíam mais finas e complexas do que o que se esculpia na Europa, por isso não
    ficavam na mesa, mas nos gabinetes de curiosidades, entre conchas e raridades. Os sapi também
    esculpiam colheres: conhecem-se, ao que se diz, apenas cerca de dez. Uma delas aparece numa
    pintura feita em Lisboa por volta de 1530: está num prato que um anjo segura diante da Virgem e
    do Menino. Sinal de que estas peças existiam nas casas de Lisboa.


    Quase todos os saleiros que sobreviveram foram parar a museus da Europa e da América; os mais
    conhecidos estão no Museu Britânico e no Metropolitan.
  en: >-
    The Sapi had never seen a European palace, so they blended their world with the foreign one. The
    Portuguese warriors hold swords and shields, but their faces and poses come from local
    sculpture. The carver was shown prints and coins and imagined the rest.


    These ivories were finer and more intricate than anything carved in Europe at the time, so they
    weren’t kept on the table but in cabinets of curiosities, among shells and rarities. The Sapi
    carved spoons too: only about ten are known today. One of them appears in a painting made in
    Lisbon around 1530, lying on a plate held by an angel before the Virgin and Child. That tells us
    such pieces were in Lisbon homes.


    Almost all the surviving saltcellars ended up in museums in Europe and America; the best known
    are in the British Museum and the Met.
  ru: >-
    Сапи никогда не видели европейских дворцов, поэтому смешивали своё и чужое. Португальские воины
    держат мечи и щиты, а лица и позы у них такие, как в местной скульптуре. Мастеру показывали
    гравюры и монеты, остальное он додумывал сам.


    Вещи из кости получались тоньше и сложнее того, что резали в Европе, поэтому их держали не на
    столе, а в кабинетах редкостей, среди раковин и диковин. Сапи резали и ложки: их, как считается,
    известно всего около десяти. Одна такая ложка нарисована на картине, написанной в Лиссабоне
    около 1530 года: она лежит в тарелке, которую держит ангел перед Девой Марией и младенцем.
    Значит, такие вещи были в лиссабонских домах.


    Почти все дожившие солонки разошлись по музеям Европы и Америки, самые известные хранят
    Британский музей и Метрополитен.
myth:
  verdict: myth
  statement:
    pt: Os saleiros africanos para os portugueses eram feitos em Lisboa
    en: The African saltcellars for the Portuguese were made in Lisbon
    ru: Африканские солонки для португальцев делали в Лиссабоне
  answer:
    pt: Eram esculpidos por mestres sapi na Serra Leoa, por encomenda, e chegavam a Portugal já prontos.
    en: Sapi master carvers made them to order in Sierra Leone, and they arrived in Portugal finished.
    ru: Их вырезали мастера сапи в Сьерра-Леоне на заказ, а в Португалию привозили готовыми.
