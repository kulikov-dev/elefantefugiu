story:
  pt: >-
    No início do século XX, os republicanos precisavam de um símbolo: uma mulher que representasse a
    República, como a Marianne em França. O escultor José Simões de Almeida procurava um modelo.

    Encontrou-o numa camisaria da Baixa. Ilda Puga tinha cerca de dezasseis anos e tinha vindo de
    Arraiolos para Lisboa. Posou sempre acompanhada pela mãe, e o escultor só precisava do rosto.

    Depois da revolução de 1910, este busto tornou-se o rosto da nova República: foi posto nas
    câmaras municipais, cunhado em moedas e medalhas. E Ilda passou a vida a costurar e morreu em
    1993, com 101 anos.
  en: >-
    In the early 20th century, Portugal’s republicans needed a symbol: a woman to stand for the
    Republic, like Marianne in France. The sculptor José Simões de Almeida was looking for a model.

    He found her in a shirtmaker’s workshop in the Baixa. Ilda Puga was about sixteen and had come
    to Lisbon from Arraiolos. She always posed with her mother present, and the sculptor needed only
    her face.

    After the 1910 revolution, this bust became the face of the new Republic: it was placed in town
    halls and struck on coins and medals. Ilda went on sewing all her life and died in 1993, at 101.
  ru: >-
    В начале XX века республиканцам понадобился символ: женщина, которая изображает Республику, как
    Марианна во Франции. Скульптор Жозе Симойнш де Алмейда искал модель.

    Он нашёл её в рубашечной мастерской в Байше. Илде Пуге было около шестнадцати, она приехала в
    Лиссабон из Аррайолуша. Позировала она под присмотром матери, и скульптору нужно было только
    лицо.

    После революции 1910 года этот бюст стал лицом новой Республики: его ставили в мэриях, чеканили
    на монетах и медалях. А Илда всю жизнь шила и умерла в 1993 году, в 101 год.
more:
  pt: >-
    O símbolo também foi procurado oficialmente: a Câmara de Lisboa abriu um concurso, e ganhou
    outro escultor, Francisco dos Santos. Mas o país não escolheu a obra dele. A cabeça de Simões de
    Almeida com barrete frígio era mais simples e mais fácil de reconhecer, foi copiada para as
    câmaras municipais e gravada em medalhas. Assim, o símbolo não foi a obra vencedora do concurso,
    mas a rapariga da camisaria.


    Em 1990, quase com cem anos, Ilda deu uma entrevista à RTP e contou como, menina de camisaria,
    ia posar para o escultor.


    Viveu a Primeira República, a ditadura de Salazar e a revolução de 1974, e em todas elas o seu
    rosto continuou a ser o símbolo da República.
  en: >-
    There was an official search for a symbol too: Lisbon’s city council held a contest, and another
    sculptor, Francisco dos Santos, won. But the country didn’t choose his work. Simões de Almeida’s
    head in a Phrygian cap was simpler and easier to recognize, so it was copied for town halls and
    stamped on medals. In the end, the symbol wasn’t the contest winner but the girl from the
    workshop.


    In 1990, at almost a hundred, Ilda gave an interview to the broadcaster RTP and told how, as a
    young seamstress, she went to pose for the sculptor.


    She lived through the First Republic, Salazar’s dictatorship, and the 1974 revolution, and under
    all of them her face remained the symbol of the Republic.
  ru: >-
    Символ искали и официально: мэрия Лиссабона объявила конкурс, и победил другой скульптор,
    Франсишку душ Сантуш. Но страна выбрала не его работу. Голова Симойнша де Алмейды во фригийском
    колпаке оказалась проще и узнаваемее, её копировали для мэрий и чеканили на медалях. Так
    символом стала не победительница конкурса, а девушка из мастерской.


    В 1990 году, почти в сто лет, Илда дала интервью телевидению RTP и рассказала, как девочкой из
    мастерской ходила позировать скульптору.


    Она пережила Первую республику, диктатуру Салазара и революцию 1974 года, и при всех них её лицо
    оставалось символом Республики.
