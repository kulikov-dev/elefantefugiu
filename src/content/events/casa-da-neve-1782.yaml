hook:
  pt: O café mais antigo de Lisboa foi aberto pelo neveiro do rei.
  en: >-
    Lisbon’s oldest café was founded by the king’s own snow-keeper.
  ru: Стол Пессоа здесь зарезервирован до сих пор. Начиналось всё со льда.
story:
  pt: >-
    Sob as arcadas da atual Praça do Comércio, em Lisboa, abriu no século XVIII uma loja que vendia
    um luxo: gelo. O fundador, Julião Pereira de Castro, era o neveiro da Casa Real. Numa cidade de
    tabernas, a sua Casa da Neve servia bebidas geladas e «neves» de vários sabores a quem podia
    pagar. Hoje é o café mais antigo de Lisboa, o Martinho da Arcada, e a mesa de Fernando Pessoa
    continua reservada.
  en: >-
    Under the arcades of today’s Praça do Comércio, Lisbon got a shop that sold a luxury: ice
    (sources say 1778 or 1782). Its founder, Julião Pereira de Castro, was the royal household’s
    chief keeper of snow. In a city of taverns, his Casa da Neve served chilled drinks and flavored
    ices to anyone who could pay. Today it is Lisbon’s oldest café, Martinho da Arcada, and Fernando
    Pessoa’s table is still reserved.
  ru: >-
    Во второй половине XVIII века под аркадами нынешней площади Комерсиу в Лиссабоне открылась
    лавка, продававшая роскошь: лёд (по разным источникам, в 1778 или 1782 году). Её основатель
    Жулиан Перейра де Кастру был главным хранителем снега при королевском дворе. Таверн в городе
    хватало, но его Каза-да-Нев подавала холодные напитки и фруктовый лёд тем, кто мог заплатить.
    Сегодня это старейшее кафе Лиссабона, Мартиньо да Аркада, а стол Фернандо Пессоа по-прежнему
    зарезервирован.
more:
  pt: |-
    De onde vinha o gelo? Primeiro, a neve era recolhida na Serra da Estrela e na Serra da Lousã, prensada em poços e levada em carros de bois e burros até ao Tejo, e depois de barco até Lisboa. Mais tarde, a Real Fábrica do Gelo, na Serra de Montejunto, muito mais perto da cidade, congelava a água de noite em tanques rasos. Julião comprou-a e reedificou-a em janeiro de 1782, como diz uma inscrição sobre a porta, e tinha o monopólio da neve e do gelo do reino.

    O que era a «neve»? Não era neve, era gelo com sabores, algo entre um sorvete e um granizado. Eça de Queirós põe uma personagem a provar laranja e morango, em 1877. No século XVIII, a Casa da Neve chegou a andar à rixa com outro café histórico, o Marrare, que também reclamava uma parte do gelo que chegava a Lisboa.

    As fontes divergem em pormenores: o ano da abertura (1778 ou 1782) e o dia (2 ou 7 de janeiro), e quando o café passou a ter o nome do dono, Martinho Bartolomeu Rodrigues (1829 ou 1845). Pelo meio foi Casa de Café Italiana. Diz-se que por lá passaram Bocage, Eça de Queirós e Pessoa. A praça tinha sido reconstruída depois do terramoto de 1755.
  en: |-
    Where did the ice come from? At first snow was gathered in the Serra da Estrela and the Serra da
    Lousã, packed in pits and carried by ox-cart and donkey to the Tagus, then by boat to Lisbon.
    Later the Royal Ice Factory in the Serra de Montejunto, much closer to the city, froze water at
    night in shallow tanks. Julião bought and rebuilt it in January 1782, as an inscription above
    its door records. He also held the kingdom’s monopoly on snow and ice.


    What was “neve”? Not snow but flavored ice, something between a sorbet and a granita. Writing in
    1877, Eça de Queirós has a character taste orange and strawberry ices. In the 18th century the
    Casa da Neve even squabbled with Marrare, another historic café that also claimed a share of the
    ice reaching Lisbon.


    Sources disagree on small details: the opening year (1778 or 1782) and day (January 2 or 7), and
    when the café took the name of its owner, Martinho Bartolomeu Rodrigues (1829 or 1845). In
    between it was an Italian coffee house. Its guests are said to have included Bocage, Eça de
    Queirós, and Pessoa. The square had been rebuilt after the 1755 earthquake.
  ru: |-
    Откуда брался лёд? Сначала снег собирали в Серра-да-Эштрела и Серра-да-Лозан, утрамбовывали в
    ямах и везли на волах и ослах до Тежу, а затем на лодках в Лиссабон. Позже Королевская ледяная
    фабрика в Серра-ди-Монтежунту, гораздо ближе к городу, замораживала воду по ночам в мелких
    бассейнах. Жулиан купил и перестроил её в январе 1782 года, как говорит надпись над дверью, и
    владел монополией на снег и лёд в королевстве.


    Что такое «neve»? Не снег, а ароматный лёд, что-то среднее между щербетом и гранитой. У Эсы де
    Кейроша в 1877 году персонаж пробует апельсиновый и клубничный лёд. В XVIII веке Каза-да-Нев
    даже ссорилась с другим историческим кафе, Марраре, которое тоже претендовало на часть льда,
    приходившего в Лиссабон.


    Источники расходятся в мелочах: год открытия (1778 или 1782) и день (2 или 7 января), и когда
    кафе получило имя владельца, Мартиньо Бартоломеу Родригиша (1829 или 1845). До этого здесь была
    итальянская кофейня. Говорят, среди гостей были Бокаже, Эса де Кейрош и Пессоа. Площадь была
    отстроена заново после землетрясения 1755 года.
