story:
  pt: >-
    O bacalhau vive nos mares frios do norte, ao largo da Terra Nova, da Islândia e da Noruega. Nas águas quentes de Portugal não existe. E, no entanto, o bacalhau salgado e seco tornou-se o peixe do país.


    Tudo porque se podia guardar. Salgado e seco, o bacalhau não se estraga durante meses, viaja bem pelo oceano e podia comer-se nos dias de abstinência, quando a Igreja proibia a carne. E esses dias eram muitos: todas as sextas-feiras, a Quaresma inteira e outras festas.


    Os portugueses já iam ao bacalhau à Terra Nova por volta de 1501, depois das viagens dos irmãos Corte-Real. Mas no século XVII foram afastados por marinheiros e corsários ingleses e franceses. Os historiadores não encontraram nenhum navio português que tenha descarregado bacalhau nessa época: comprava-se aos ingleses.
  en: >-
    Cod lives in the cold northern seas, off Newfoundland, Iceland, and Norway. It isn’t found in Portugal’s warm waters. And yet salted, dried cod, bacalhau, became the country’s signature fish.


    It all came down to keeping it. Salted and dried, cod doesn’t spoil for months, travels well across the ocean, and could be eaten on fast days, when the Church banned meat. And there were lots of those: every Friday, all of Lent, and other holy days.


    The Portuguese were already fishing for cod off Newfoundland around 1501, after the voyages of the Corte-Real brothers. But in the 17th century they were pushed out by English and French sailors and privateers. Historians have found no Portuguese ship that brought home cod in that period: it was bought from the English.
  ru: >-
    Треска живёт в холодных северных морях, у Ньюфаундленда, Исландии и Норвегии. У тёплых берегов Португалии её нет. И всё же солёная сушёная треска, бакалау, стала главной рыбой страны.


    Всё дело в том, что её можно было хранить. Засоленная и высушенная треска не портится месяцами, её легко везти через океан и есть в постные дни, когда мясо запрещала церковь. А таких дней в году набиралось много: все пятницы, весь Великий пост и другие праздники.


    Португальцы ходили за треской к Ньюфаундленду уже около 1501 года, после плаваний братьев Корте-Реал. Но в XVII веке их вытеснили английские и французские моряки и пираты. Историки не нашли ни одного португальского корабля, который привёз бы тогда треску: её покупали у англичан.
