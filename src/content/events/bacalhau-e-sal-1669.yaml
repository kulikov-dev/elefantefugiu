more:
  pt: >-
    O lucro de Portugal vinha do sal. Sem sal não há bacalhau salgado, e Portugal era famoso pelo sal de Setúbal e de Aveiro. Os holandeses salgavam arenque, os ingleses bacalhau, e os seus navios vinham buscar sal a Portugal.


    O sal era tão importante que serviu para pagar a paz. Em 1669, Portugal fez a paz com a Holanda e ficou de a pagar em sal de Setúbal: 500 mil cruzados de indemnização e o resto da dívida, repartido por vinte anos. Em 1680 chegaram a Setúbal cerca de cem navios holandeses para carregar sal.


    Os portugueses só voltaram a pescar bacalhau no século XIX, e no século XX a «frota branca» partia todos os anos para a Terra Nova e a Gronelândia. Mas, segundo o historiador Álvaro Garrido, desde os Descobrimentos o país nunca pescou mais de 15% do bacalhau que comia. Hoje o bacalhau em Portugal é sobretudo norueguês, e receitas, diz-se, há 365, uma para cada dia do ano, ou mesmo mil e uma.
  en: >-
    Portugal’s profit came from salt. You can’t make salt cod without salt, and Portugal was famous for its salt from Setúbal and Aveiro. The Dutch salted herring, the English salted cod, and their ships came to Portugal for salt.


    Salt was so valuable that it paid for peace. In 1669, Portugal made peace with the Dutch Republic and agreed to pay in Setúbal salt: 500,000 cruzados of compensation and the rest of the debt, spread over twenty years. In 1680, about a hundred Dutch ships came to Setúbal to load salt.


    The Portuguese only started catching cod again in the 19th century, and in the 20th century the “White Fleet” sailed every year for Newfoundland and Greenland. But according to historian Álvaro Garrido, since the Age of Discovery the country never caught more than 15% of the cod it ate. Today, most bacalhau in Portugal is Norwegian, and there are said to be 365 recipes, one for every day of the year, or even 1,001.
  ru: >-
    Свою выгоду Португалия получала от соли. Солёную треску не сделать без соли, а Португалия славилась солью из Сетубала и Авейру. Голландцы солили сельдь, англичане треску, и за солью их корабли шли в Португалию.


    Соль была так важна, что ею оплатили мир. В 1669 году Португалия заключила мир с Голландией и обязалась расплатиться солью из Сетубала: 500 тысяч крузадо компенсации и остаток долга, растянутый на двадцать лет. В 1680 году в Сетубал за солью пришло около сотни голландских кораблей.


    Ловить треску сами португальцы снова начали только в XIX веке, а в XX веке к Ньюфаундленду и Гренландии каждый год уходил «белый флот». Но, по оценке историка Алвару Гарриду, со времён открытий страна сама ловила не больше 15% трески, которую съедала. Сегодня бакалау в Португалии в основном норвежский, а рецептов, как говорят, 365, по одному на каждый день года, или даже тысяча и один.
