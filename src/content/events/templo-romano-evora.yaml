hook:
  pt: O templo romano de Évora sobreviveu porque lá se vendia carne.
  en: Évora’s Roman temple survived because meat was sold inside it.
  ru: Храм, который спасла мясная лавка.
story:
  pt: "No século I construiu-se no centro de Évora um templo, provavelmente em honra do imperador
    Augusto. Quando o império caiu, os templos antigos foram desmontados por todo o país para dar
    pedra a casas e muralhas. Évora teve sorte: na Idade Média o templo foi integrado numa torre do
    castelo, os espaços entre as colunas foram tapados e, do século XIV até 1836, funcionou lá
    dentro o talho da cidade. A cidade precisava do talho, e ninguém desmontou o edifício."
  en: "In the 1st century a temple was built in the center of Évora, probably in honor of Emperor
    Augustus. After the empire fell, old temples all over the country were taken apart for stone to
    build houses and walls. Évora got lucky: in the Middle Ages the temple was built into a castle
    tower, the gaps between the columns were walled up, and from the 14th century until 1836 the
    town’s butcher shop operated inside. The town needed its butcher, so nobody took the building
    apart."
  ru: "В I веке в центре Эворы построили храм, скорее всего в честь императора Августа. Когда империя
    пала, старые храмы по всей стране разбирали на камень для домов и стен. Эворе повезло: в Средние
    века храм встроили в башню замка, промежутки между колоннами заложили, а с XIV века до 1836 года
    внутри работала городская мясная лавка. Лавка была нужна городу, и здание никто не разбирал."
more:
  pt: >-
    O perigo era real. Em 1467 o rei D. Afonso V autorizou que se tirasse pedra do templo para obras
    e para a defesa. Mas enquanto lá dentro se vendia carne, ninguém tocava na torre, e as colunas
    passaram quase quinhentos anos dentro de paredes medievais.


    Na década de 1870 essas paredes foram demolidas sob a direção do arquiteto italiano Giuseppe
    Cinatti, e o templo voltou a abrir-se à cidade.


    Ainda hoje muitos lhe chamam «templo de Diana». O nome foi inventado no século XVII por um padre
    português, e a arqueologia não o confirma.
  en: >-
    The danger was real. In 1467 King Afonso V allowed stone to be taken from the temple for
    building and defense. But as long as meat was being sold inside, no one touched the tower, and
    the columns spent almost five hundred years inside medieval walls.


    In the 1870s those walls were torn down under the Italian architect Giuseppe Cinatti, and the
    temple opened up to the town again.


    Many people still call it the “Temple of Diana.” A Portuguese priest came up with that name in
    the 17th century, and archaeology doesn’t back it up.
  ru: >-
    Опасность была настоящей. В 1467 году король Афонсу V разрешил брать с храма камень для
    строительства и обороны. Но пока внутри торговали мясом, башню не трогали, и колонны почти
    пятьсот лет простояли внутри средневековых стен.


    В 1870-х годах эти стены снесли под руководством итальянского архитектора Джузеппе Чинатти, и
    храм снова открылся городу.


    Его до сих пор часто зовут «храмом Дианы». Это имя в XVII веке придумал португальский священник,
    археология его не подтверждает.
