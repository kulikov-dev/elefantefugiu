hook:
  pt: Quase sem documentos, a Severa inspirou o primeiro filme sonoro português.
  en: Few records of her survive, yet she inspired Portugal’s first sound film.
  ru: Документов о ней почти нет, но ей посвящён первый звуковой фильм Португалии.
story:
  pt: >-
    Nos anos 1840 cantava-se o fado nas tabernas dos bairros pobres de Lisboa, e as pessoas de bem evitavam essa música. Maria Severa cantava nas tabernas da Mouraria e acompanhava-se à guitarra.


    Segundo a lenda, o seu canto conquistou o conde de Vimioso, um cavaleiro tauromáquico famoso, daqueles que enfrentam o touro a cavalo. Passou a andar no círculo dos aficionados das touradas, entre a jovem nobreza. Assim, as canções dos bairros pobres chegaram a quem nunca entrava numa taberna.


    A Severa morreu em 1846, com 26 anos. Quase não há registos sobre ela, e por isso a sua vida tornou-se facilmente lenda. Em 1901 escreveram sobre ela um romance e uma peça, e em 1931 fez-se o filme «A Severa». Foi o primeiro filme sonoro português.
  en: >-
    In the 1840s, fado was sung in the taverns of Lisbon’s poor neighborhoods, and respectable people kept their distance from it. Maria Severa sang in the taverns of Mouraria and played the guitar herself.


    According to legend, her singing won over the Count of Vimioso, a famous cavaleiro, a bullfighter who faces the bull on horseback. She found herself in his circle of bullfighting fans, among young aristocrats. That’s how songs from the poor neighborhoods reached people who never set foot in a tavern.


    Severa died in 1846, at 26. There are hardly any records about her, which made it easy for her life to turn into legend. In 1901 a novel and a play were written about her, and in 1931 the film A Severa was made. It was Portugal’s first sound film.
  ru: >-
    В 1840-х годах фаду пели в тавернах бедных кварталов Лиссабона, и приличная публика эту музыку сторонилась. Мария Севера пела в тавернах Маурарии и сама играла на гитаре.


    По преданию, её пением был покорён граф Вимиозу, знаменитый кавалейру, то есть тореадор, который выходит к быку верхом. Она оказалась в его кругу, среди любителей корриды и молодой знати. Так песни бедных кварталов услышали люди, которые раньше в таверны не заходили.


    Севера умерла в 1846 году, в 26 лет. Записей о ней почти нет, и поэтому её жизнь легко превратилась в легенду. В 1901 году о ней написали роман и пьесу, а в 1931 году сняли фильм «Севера». Он стал первым португальским звуковым фильмом.
