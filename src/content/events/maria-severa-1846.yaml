more:
  pt: >-
    O filme foi visto por mais de 200 mil pessoas, e a Severa tornou-se de vez um símbolo do fado: a heroína com quem esta música teria «começado». Os historiadores, porém, são prudentes. Quase tudo o que se conta da sua vida vem do romance de Júlio Dantas, e não de documentos.


    Da própria Severa ficou pouco. Foi sepultada numa vala comum no Cemitério do Alto de São João. Na Mouraria, na Rua do Capelão, a casa onde viveu tem desde 1989 uma lápide inaugurada por Amália Rodrigues. Ao lado fica o Largo da Severa, com uma guitarra desenhada na calçada.
  en: >-
    More than 200,000 people saw the film, and Severa became a lasting symbol of fado: the heroine with whom the music supposedly “began.” Historians are cautious, though. Almost everything told about her life comes from Júlio Dantas’s novel, not from documents.


    Little remains of Severa herself. She was buried in a common grave at Alto de São João Cemetery. In Mouraria, on Rua do Capelão, the house where she lived has carried a plaque since 1989, unveiled by Amália Rodrigues. Next to it is Largo da Severa, with a guitar laid into the cobblestones.
  ru: >-
    Фильм посмотрели больше 200 тысяч человек, и Севера окончательно стала символом фаду: героиней, с которой эта музыка «началась». Историки при этом осторожны. Почти всё, что рассказывают о её жизни, пришло из романа Жулиу Данташа, а не из документов.


    От самой Северы осталось немного. Похоронили её в общей могиле на кладбище Алту-де-Сан-Жуан. В Маурарии, на улице Капелан, на доме, где она жила, в 1989 году появилась табличка, которую открыла Амалия Родригеш. Рядом площадь Ларгу-да-Севера, где в мостовой выложена гитара.
