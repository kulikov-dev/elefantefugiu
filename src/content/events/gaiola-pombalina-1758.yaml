seo:
  title:
    pt: O esqueleto de madeira da Baixa · Lisboa, 1758
    en: The Wooden Skeleton of the Baixa · Lisbon, 1758
    ru: Деревянный скелет Байши · Лиссабон, 1758 | O Elefante Fugiu
story:
  pt: >-
    O terramoto de 1755 deitou abaixo os prédios de pedra da Baixa de Lisboa. Pombal decidiu reconstruí-la de raiz, e de maneira a que os prédios sobrevivessem ao próximo abalo.


    Os engenheiros inventaram a «gaiola». Dentro das paredes montava-se uma estrutura de traves de madeira cruzadas em X. Num abalo, a pedra racha e cai, mas a madeira verga, segura os andares e impede as paredes de se desfazerem.


    Diz-se que a estrutura foi testada assim: soldados marchavam junto a uma maqueta e batiam com os pés, a imitar os abalos. Não há documentos que o provem, e o mais provável é que tenha sido uma demonstração, não um teste.
  en: >-
    The 1755 earthquake brought down the stone buildings of downtown Lisbon. Pombal decided to rebuild the Baixa from scratch, and to do it so the buildings would survive the next quake.


    Engineers came up with the gaiola, the “cage.” Inside the walls they set a frame of wooden beams braced in an X pattern. In a quake, stone cracks and falls, but wood bends, holds up the floors, and keeps the walls from falling apart.


    The story goes that the frame was tested by soldiers marching next to a model and stamping their feet to imitate the shaking. There are no records of this, and it was most likely a demonstration, not a test.
  ru: >-
    Землетрясение 1755 года обрушило каменные дома нижнего Лиссабона. Помбал решил отстроить Байшу заново, и так, чтобы следующий толчок дома пережили.


    Инженеры придумали «гайолу», клетку. Внутри стен ставили каркас из деревянных брусьев, скреплённых крест-накрест. Камень при толчке трескается и падает, а дерево гнётся, держит этажи и не даёт стенам рассыпаться.


    Говорят, каркас проверяли так: солдаты маршировали рядом с макетом и топали, изображая толчки. Документов об этом нет, и, скорее всего, это был показ, а не испытание.
