more:
  pt: >-
    Para a cidade se erguer depressa, foi construída como um jogo de montar. As peças dos prédios eram preparadas fora da cidade, transportadas e montadas no local. As ruas foram traçadas a régua, todas com a mesma largura, e os prédios limitados a quatro andares.


    Foi um dos primeiros casos na Europa em que uma cidade se construiu a pensar nos sismos. Estruturas semelhantes foram depois usadas na Calábria, no sul de Itália, após o seu terramoto de 1783.


    Só no nosso tempo se conseguiu verificar se a gaiola funciona mesmo. Engenheiros do Laboratório Nacional de Engenharia Civil (LNEC) construíram paredes com gaiola em tamanho real numa mesa sísmica e abanaram-nas com amplitude crescente. Chapas metálicas nas ligações da estrutura foram ensaiadas à parte, comparando as paredes reforçadas com as normais. Estes ensaios servem para perceber como reforçar os velhos prédios da Baixa, que continuam de pé.
  en: >-
    To get the city up quickly, it was built like a construction kit. Building parts were made outside the city, brought in, and assembled on site. Streets were laid out with a ruler, all the same width, and buildings were limited to four stories.


    It was one of the first times in Europe that a city was built with earthquakes in mind. Similar frames were later used in Calabria, in southern Italy, after its 1783 earthquake.


    Only in our time could anyone check whether the cage really works. Engineers at Portugal’s National Civil Engineering Laboratory (LNEC) built full-size gaiola walls on a shake table and shook them with rising intensity. Metal plates at the frame’s joints were tested separately, comparing reinforced walls with ordinary ones. Tests like these show how to reinforce the old Baixa buildings, which are still standing.
  ru: >-
    Чтобы город поднялся быстро, его строили как конструктор. Детали домов готовили за городом, привозили и собирали на месте. Улицы прочертили по линейке, одной ширины, а дома ограничили четырьмя этажами.


    Это был один из первых в Европе случаев, когда город строили с расчётом на землетрясение. Похожие каркасы потом применяли в Калабрии на юге Италии, после её землетрясения 1783 года.


    Проверить, работает ли клетка по-настоящему, смогли только в наше время. Инженеры Национальной лаборатории гражданского строительства (LNEC) собрали стены с гайолой в натуральную величину на вибростенде и трясли их с нарастающей силой. Металлические накладки в узлах каркаса испытывали отдельно, сравнивая усиленные стены с обычными. Такие опыты нужны, чтобы понять, как укреплять старые дома Байши, которые стоят до сих пор.
