hook:
  pt: A ponte romana que os habitantes pagaram do seu bolso.
  en: The Roman bridge the townspeople paid for themselves.
  ru: Римский мост, который горожане оплатили сами.
story:
  pt: Os romanos cobriram a Lusitânia de estradas, e na estrada de Braga para Astorga precisaram de
    uma ponte sobre o rio Tâmega. Na povoação de Aquae Flaviae, hoje Chaves, construíram-na na
    passagem do século I para o II, no tempo do imperador Trajano. A ponte sobreviveu à queda de
    Roma, aos mouros, às cheias e às guerras. Foi reparada e trocou de guardas, mas os arcos romanos
    ainda hoje levam a estrada sobre o rio.
  en: The Romans covered Lusitania with roads, and on the road from Braga to Astorga they needed a
    bridge over the Tâmega River. In the town of Aquae Flaviae, today’s Chaves, they built it around
    the turn of the 2nd century, under Emperor Trajan. The bridge outlived the fall of Rome, the
    Moors, floods, and wars. It has been repaired and its railings replaced, but the Roman arches
    still carry the road across the river.
  ru: Римляне покрыли Лузитанию дорогами, и на дороге из Браги в Асторгу им понадобился мост через
    реку Тамегу. В городке Аквы Флавиевы, нынешнем Шавише, его построили на рубеже I и II веков, при
    императоре Траяне. Мост пережил падение Рима, мавров, наводнения и войны. Его чинили и меняли
    перила, но римские арки до сих пор держат дорогу через реку.
more:
  pt: >-
    Os romanos instalaram-se aqui por causa das águas quentes, e Chaves ainda hoje é conhecida por
    elas. A ponte ligou as termas à grande estrada do império.


    A ponte começou com 16 arcos e hoje veem-se 12: os outros ficaram debaixo de casas e de areias
    do rio. No século XVI uma cheia destruiu-a em parte, e em 1880 as guardas de pedra foram
    substituídas por grades de ferro. Em 2001, à entrada da ponte, foram escavados 50 metros de
    calçada romana.


    A meio da ponte estão duas colunas romanas com inscrições em latim. A dedicada a Trajano diz que
    os habitantes de Aquae Flaviae construíram a ponte de pedra à sua própria custa. A outra, o
    Padrão dos Povos, enumera dez comunidades da região.
  en: >-
    The Romans settled here for the hot springs, and Chaves is still known for them. The bridge
    connected the springs to the empire’s great highway.


    The bridge started with 16 arches, and 12 can be seen today: the rest disappeared under houses
    and river silt. In the 16th century a flood partly destroyed it, and in 1880 the stone railings
    were replaced with iron ones. In 2001, 50 meters of Roman paving were dug up at the entrance to
    the bridge.


    Halfway across stand two Roman columns with Latin inscriptions. The one dedicated to Trajan says
    the people of Aquae Flaviae built the stone bridge at their own expense. The other, known as the
    Padrão dos Povos, or “stone of the peoples,” lists ten local communities.
  ru: >-
    Римляне поселились здесь ради горячих источников, и Шавиш знаменит ими до сих пор. Мост соединил
    источники с большой имперской дорогой.


    Сначала у моста было 16 арок, сейчас видно 12: остальные ушли под дома и речные наносы. В XVI
    веке наводнение частично его разрушило, в 1880 году каменные перила заменили железными. В 2001
    году у въезда на мост раскопали 50 метров римской мостовой.


    На середине моста стоят две римские колонны с латинскими надписями. На одной, посвящённой
    Траяну, сказано, что жители Акв Флавиевых построили каменный мост за свой счёт. На другой, её
    зовут «Падрау-душ-Повуш», «камень народов», перечислены десять местных общин.
