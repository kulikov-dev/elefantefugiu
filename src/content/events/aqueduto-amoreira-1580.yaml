  answer:
    pt: Foi construído entre 1529 e 1622. Acabá-lo foi a condição que Elvas impôs a Filipe II de Espanha ao render-se em 1580.
    en: It was built between 1529 and 1622. Finishing it was the condition Elvas set for Philip II of Spain when it surrendered in 1580.
    ru: Его строили с 1529 по 1622 год. Достроить акведук Эльваш потребовал от Филиппа II как условие сдачи в 1580 году.
