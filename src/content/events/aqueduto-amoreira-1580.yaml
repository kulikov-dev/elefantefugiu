hook:
  pt: Ao render-se, Elvas exigiu que o rei de Espanha acabasse o aqueduto.
  en: Surrendering to Spain’s king, Elvas demanded he finish its aqueduct.
  ru: Сдаваясь испанскому королю, Эльваш потребовал достроить ему акведук.
story:
  pt: |-
    Elvas é uma cidade-fortaleza num monte, mesmo junto à fronteira espanhola. No século XVI os poços começaram a secar, e decidiu-se trazer água da Amoreira, a sete quilómetros. As obras começaram por volta de 1529, o arquiteto Francisco de Arruda refez o projeto, e a construção arrastou-se por décadas.

    Em 1580, Filipe II de Espanha veio buscar o trono português com um exército. Elvas abriu-lhe as portas, mas pôs uma condição: o rei tinha de acabar o aqueduto. Filipe aceitou.

    A água demorou a chegar. Só a 23 de junho de 1622 se inauguraram na cidade o aqueduto e a fonte, 93 anos depois do início das obras.
  en: |-
    Elvas is a fortress town on a hill right by the Spanish border. In the 16th century its wells began to run dry, and the town decided to bring water from Amoreira, seven kilometers (four miles) away. Work began around 1529, the architect Francisco de Arruda redid the design, and construction dragged on for decades.

    In 1580, Philip II of Spain came to claim the Portuguese throne with an army. Elvas opened its gates to him, but on one condition: the king had to finish the aqueduct. Philip agreed.

    The water was slow to arrive. Only on June 23, 1622, did the town open the aqueduct and its fountain, 93 years after work began.
  ru: |-
    Эльваш — город-крепость на холме у самой испанской границы. В XVI веке его колодцы начали пересыхать, и воду решили вести из Амурейры, за семь километров. Работы начали около 1529 года, архитектор Франсишку ди Арруда переделал проект, и стройка растянулась на десятилетия.

    В 1580 году испанский король Филипп II пришёл за португальским троном с армией. Эльваш открыл ему ворота, но поставил условие: король должен достроить акведук. Филипп согласился.

    Вода пришла не скоро. Только 23 июня 1622 года в городе открыли акведук и фонтан, через 93 года после начала работ.
more:
  pt: |-
    O aqueduto ficou enorme: 833 arcos, e junto às muralhas os pilares sobem em vários andares. Mas mal ficou pronto, em 1640 Portugal revoltou-se contra Espanha. Elvas tornou-se a principal praça-forte da fronteira e foi cercada por uma estrela de baluartes. E parte do aqueduto que a cidade tanto negociara teve de ser demolida por causa dessas muralhas: em 1641 foi o próprio D. João IV a autorizá-lo.

    A água que restou ajudou a cidade a aguentar os cercos da Guerra da Restauração e correu para os chafarizes até ao século XX. Em 2012, Elvas e as suas fortificações, com o aqueduto, foram classificadas Património Mundial da UNESCO.
  en: |-
    The aqueduct turned out enormous: 833 arches, and near the town walls its piers rise in several tiers. But almost as soon as it was finished, Portugal rose against Spain in 1640. Elvas became the main fortress on the border and was ringed with a star of bastions. Part of the aqueduct the town had bargained so hard for had to be torn down to make way for those walls, and in 1641 King John IV himself approved it.

    The water that was left helped the town hold out through the sieges of the war of independence, and it kept flowing to the fountains until the 20th century. In 2012, fortified Elvas and its aqueduct became a UNESCO World Heritage Site.
  ru: |-
    Акведук получился огромным: 833 арки, а у стен города опоры уходят в несколько ярусов. Но едва его достроили, как в 1640 году Португалия восстала против Испании. Эльваш стал главной крепостью на границе, его опоясали звездой бастионов. И часть акведука, который город так долго выторговывал, пришлось разобрать ради этих стен: в 1641 году король Жуан IV сам разрешил снос.

    Оставшаяся вода помогала городу держаться в осадах войны за независимость, и шла в фонтаны до XX века. В 2012 году крепостной Эльваш вместе с акведуком внесли в список Всемирного наследия ЮНЕСКО.
