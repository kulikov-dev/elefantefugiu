hook:
  pt: Uma cruz de pedra portuguesa esteve quatrocentos anos num deserto africano.
  en: A Portuguese stone cross stood in an African desert for 400 years.
  ru: Португальский каменный крест простоял в африканской пустыне четыреста лет.
seo:
  title:
    pt: Padrão de Diogo Cão, 1486 | O Elefante Fugiu
    en: Diogo Cão’s Stone Cross, 1486 | O Elefante Fugiu
    ru: Каменный крест Диогу Кана, 1486 | O Elefante Fugiu
story:
  pt: >-
    Os capitães portugueses levavam no porão pesadas colunas de pedra com uma cruz no topo, os
    padrões. Onde o navio chegasse mais longe, o padrão era erguido na costa. Assim, qualquer
    marinheiro que viesse depois sabia: aqui já tinham estado os portugueses, e esta terra era do
    rei.

    Em 1486, Diogo Cão ergueu uma destas colunas num cabo deserto do sudoeste de África, na atual
    Namíbia. O cabo ficou com o nome: Cape Cross, o cabo da Cruz.

    A cruz ficou lá quatrocentos anos. Em 1893, quando a Namíbia era colónia alemã, marinheiros
    alemães levaram-na para a Alemanha e deixaram no cabo uma cópia.
  en: >-
    Portuguese captains carried heavy stone pillars with a cross on top, called padrões, in their
    holds. Wherever a ship got farther than anyone before, a padrão went up on the shore. That way
    every sailor who came after knew: the Portuguese had been here, and this land belonged to the
    king.

    In 1486, Diogo Cão set up one of these pillars on a deserted cape in southwestern Africa, in
    what is now Namibia. The cape took its name from it: Cape Cross.

    The cross stood there for four hundred years. In 1893, when Namibia was a German colony, German
    sailors took it to Germany and left a copy on the cape.
  ru: >-
    Португальские капитаны везли в трюме тяжёлые каменные столбы с крестом наверху, падраны. Там,
    где корабль заходил дальше всех, падран ставили на берегу. Так любой следующий моряк видел:
    здесь уже были португальцы, и это земля короля.

    В 1486 году Диогу Кан поставил такой столб на пустынном мысе на юго-западе Африки, сегодня это
    Намибия. Мыс так и назвали: Кейп-Кросс, мыс Креста.

    Крест простоял там четыреста лет. В 1893 году, когда Намибия была немецкой колонией, немецкие
    моряки увезли его в Германию, а на мысе поставили копию.
more:
  pt: >-
    O padrão pesa mais de uma tonelada e tem três metros e meio de altura. A pedra foi talhada em
    Portugal e levada por meia África só para ser erguida numa costa vazia. Para o rei, era um
    documento: a coluna provava quem tinha chegado primeiro.


    O imperador alemão dava valor a esse documento pela mesma razão. A cópia no cabo foi feita com
    duas inscrições, a antiga portuguesa e uma nova alemã, e a cruz verdadeira passou mais de cem
    anos em Berlim, nos últimos anos no Museu Histórico Alemão.


    Em 2019, o museu decidiu devolver a cruz à Namíbia, e nesse mesmo ano ela atravessou o oceano.
    Hoje, no cabo da Cruz, estão as cópias, e à volta vive uma das maiores colónias de
    lobos-marinhos do mundo.
  en: >-
    The padrão weighs more than a ton and stands about 11.5 feet (3.5 m) tall. The stone was cut in
    Portugal and carried halfway down Africa just to be set up on an empty shore. To the king, it
    was a document: the pillar proved who got there first.


    The German emperor valued that document for the same reason. The copy on the cape was made with
    two inscriptions, the old Portuguese one and a new German one, while the real cross spent more
    than a hundred years in Berlin, in its last years at the German Historical Museum.


    In 2019, the museum decided to return the cross to Namibia, and that same year it crossed the
    ocean. Today copies stand on Cape Cross, surrounded by one of the largest seal colonies in the
    world.
  ru: >-
    Падран весит больше тонны и высотой в три с половиной метра. Камень вырубили в Португалии и
    везли через пол-Африки только ради того, чтобы поставить на пустом берегу. Для короля это был
    документ: столб доказывал, кто пришёл первым.


    Немецкий кайзер ценил этот документ по той же причине. Копию на мысе сделали с двумя надписями,
    старой португальской и новой немецкой, а сам крест больше ста лет простоял в Берлине, последние
    годы в Немецком историческом музее.


    В 2019 году музей решил вернуть крест Намибии, и в том же году его отправили через океан.
    Сегодня на мысе Кросс стоят копии, а вокруг них живёт одна из самых больших колоний морских
    котиков в мире.
