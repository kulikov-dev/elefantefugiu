story:
  pt: |-
    No início do século XVII, na serra do Buçaco, perto de Coimbra, os carmelitas escolheram um lugar para um deserto onde queriam viver em silêncio e oração. Em 1628, o bispo de Coimbra entregou-lhes a mata.

    Os frades construíram o convento e cercaram a mata com um muro de pedra. A paz era guardada também a partir de Roma. Uma bula papal de 1622 proibiu a entrada de mulheres na mata. E uma bula de 1643 ameaçava de excomunhão quem fizesse mal às árvores.

    As mulheres acabaram por poder entrar, os frades foram expulsos em 1834, mas a mata continuou intacta. Hoje é uma das matas mais valiosas de Portugal, e os textos das duas bulas continuam na pedra junto à porta.
  en: |-
    In the early 17th century, on the Buçaco ridge near Coimbra, Carmelite friars chose a spot for a retreat where they wanted to live in silence and prayer. In 1628 the bishop of Coimbra handed the forest over to them.

    The friars built a convent and enclosed the forest with a stone wall. Rome helped guard their peace too. A papal bull of 1622 banned women from entering the forest. And a bull of 1643 threatened excommunication for anyone who harmed the trees.

    Women were eventually let in, and the friars were expelled in 1834, but the forest stayed untouched. Today it is one of Portugal’s most valuable forests, and the texts of both bulls still hang on stone by the gate.
  ru: |-
    В начале XVII века на горе Бусаку, под Коимброй, монахи-кармелиты выбрали место для пустыни, где хотели жить в тишине и молитве. В 1628 году епископ Коимбры отдал им лес.

    Монахи построили монастырь и обнесли лес каменной стеной. Покой охраняли и из Рима. Папская булла 1622 года запретила женщинам входить в лес. А булла 1643 года грозила отлучением от церкви каждому, кто повредит деревья.

    Женщин потом пустили, монахов в 1834 году выселили, но лес так и остался нетронутым. Теперь это один из самых ценных лесов Португалии, а тексты обеих булл до сих пор висят на камне у ворот.
more:
  pt: |-
    Os carmelitas não só guardavam a mata como a plantavam. Ao lado dos carvalhos e loureiros da região, plantavam também outras árvores. Dentro do muro abriram caminhos e ergueram capelas e ermidas.

    O muro de quase cinco quilómetros também foi obra dos frades, e na primeira porta, a Porta de Coimbra, colocaram as lápides com os textos das bulas. Guardaram o silêncio durante quase duzentos anos. Em 1810, mesmo junto aos muros da mata, britânicos e portugueses enfrentaram o exército de Napoleão: a mata guardada do machado tornou-se campo de batalha.
  en: |-
    The Carmelites didn’t just protect the forest, they planted it. Alongside the local oaks and laurels, they planted other trees too. Inside the wall they laid out paths and built chapels and hermit cells.

    The friars built the wall too, nearly five kilometers (three miles) of it, and on the first gate, the Coimbra Gate, they mounted the stone plaques with the text of the bulls. They kept the silence for almost two hundred years. Then in 1810, right below the forest walls, the British and Portuguese fought Napoleon’s army: the forest guarded from the axe became a battlefield.
  ru: |-
    Кармелиты не только берегли лес, но и сажали его. Рядом с дубами и лаврами здешних мест они сажали и другие деревья. Внутри стены они проложили тропы, поставили часовни и кельи для отшельников.

    Стену почти в пять километров монахи тоже строили сами, и на первых, Коимбрских, воротах укрепили плиты с текстами булл. Тишину они берегли почти двести лет. А в 1810 году прямо под стенами леса британцы и португальцы дали бой армии Наполеона: лес, который берегли от топора, стал полем битвы.
