hook:
  pt: Na Madeira desce-se a montanha em trenós de vime, sem neve.
  en: On Madeira, wicker sleds race downhill with no snow at all.
  ru: На Мадейре с горы в город съезжают в плетёных санях без снега.
story:
  pt: "A freguesia do Monte fica numa encosta íngreme sobre o Funchal. No século XIX, os seus
    habitantes inventaram uma maneira rápida de descer à cidade: um cesto-cadeira de vime sobre
    patins de madeira desliza pela calçada lisa como um trenó. Dois homens de branco e chapéu de
    palha correm ao lado, empurram e dão direção, e travam com a sola das botas. O transporte tornou-se há muito uma atração, mas as botas dos carreiros são as mesmas, de borracha grossa."
  en: "The village of Monte sits on a steep slope above Funchal. In the 19th century, its residents
    came up with a fast way to get down to town: a wicker armchair-basket on wooden runners slides
    over the smooth cobblestones like a sled. Two men in white with straw hats run alongside,
    pushing and steering, and brake with the soles of their boots. The ride long ago became a
    tourist attraction, but the drivers’ boots haven’t changed: thick rubber soles."
  ru: "Деревня Монте стоит на крутом склоне над Фуншалом. В XIX веке её жители придумали, как быстро
    спускаться в город: плетёная корзина-кресло на деревянных полозьях скользит по гладкой мостовой,
    как сани. Двое мужчин в белом и соломенных шляпах бегут рядом, толкают и рулят, а тормозят
    подошвами ботинок. Транспорт давно стал аттракционом, а ботинки у возчиков всё те же, на толстой
    резине."
more:
  pt: >-
    A descida, de cerca de dois quilómetros, passa pelas ruas da cidade e demora poucos minutos. Os
    condutores chamam-se carreiros, e antigamente levavam à cidade pessoas e cargas,
    e arrastavam os cestos vazios de volta monte acima.


    Lá em cima, junto à partida, fica a Igreja de Nossa Senhora do Monte. Nela está sepultado o
    último imperador da Áustria, Carlos I. Depois da Primeira Guerra Mundial foi exilado na Madeira,
    onde morreu em 1922.
  en: >-
    The run is about two kilometers long, goes right through the town’s streets, and takes a few
    minutes. The drivers are called carreiros, and in the old days they brought down people and cargo, then hauled the empty baskets back up the hill.


    At the top, by the starting point, stands the Church of Our Lady of Monte. The last emperor of
    Austria, Charles I, is buried there. After World War I he was sent into exile on Madeira, where
    he died in 1922.
  ru: >-
    Спуск длиной около двух километров идёт прямо по городским улицам и занимает несколько минут.
    Возчиков называют «каррейруш», и раньше они спускали в город не только людей, но и грузы, а
    пустые корзины тащили обратно в гору.


    Наверху, у старта, стоит церковь Носса-Сеньора-ду-Монте. В ней похоронен последний император
    Австрии Карл I. После Первой мировой войны его отправили в изгнание на Мадейру, где он и умер в
    1922 году.
