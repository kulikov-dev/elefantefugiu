hook:
  pt: Segundo a lenda, o fogo dos povoadores ardeu sete anos na Madeira.
  en: Legend says the settlers’ fire on Madeira burned for seven years.
  ru: Первые поселенцы подожгли лес Мадейры, и он, по преданию, горел семь лет.
seo:
  title:
    pt: A ilha que ardeu sete anos · Madeira, 1420
    en: The Island That Burned for Seven Years · Madeira, 1420
    ru: Остров, который горел семь лет · Мадейра | O Elefante Fugiu
story:
  pt: >-
    Quando, em 1420, os portugueses chefiados por Zarco começaram a povoar a Madeira, a ilha inteira estava coberta por floresta densa. O próprio nome «madeira» vem daí. Para lavrar e construir, era preciso limpar a terra.


    Conta a lenda que se pegou fogo à floresta e que o incêndio ficou fora de controlo. Os cronistas do século XVI João de Barros e Gaspar Frutuoso escreveram que o fogo durou sete anos.


    Já no século XVII se duvidou disso. O mais provável é ter ardido o sul, à volta do Funchal, onde se instalaram as pessoas, e não a ilha toda nem durante sete anos. Mas na terra limpa nasceram, de facto, os primeiros campos.
  en: >-
    When the Portuguese, led by Zarco, began settling Madeira in 1420, the whole island was covered in dense forest. Its very name means “wood.” To plow and build, the land had to be cleared.


    Legend says they set the forest on fire and the blaze got out of control. Sixteenth-century chroniclers João de Barros and Gaspar Frutuoso wrote that it burned for seven years.


    By the 17th century, people already doubted it. Most likely only the south burned, around Funchal, where people settled, and not the whole island or for seven years. But the cleared land really did become the first fields.
  ru: >-
    Когда в 1420 году португальцы во главе с Зарку начали заселять Мадейру, весь остров был покрыт густым лесом. Само слово madeira значит «древесина». Чтобы пахать и строить, землю надо было расчистить.


    По преданию, лес подожгли, и пожар вышел из-под контроля. Хронисты XVI века Жуан де Барруш и Гашпар Фрутуозу писали, что огонь горел семь лет.


    Уже в XVII веке в этом засомневались. Скорее всего, горело на юге, вокруг Фуншала, где селились люди, а не весь остров и не семь лет. Но на расчищенной земле действительно появились первые поля.
