more:
  pt: >-
    O primeiro povoado recebeu o nome da planta que mais havia por ali: o funcho. Funchal quer dizer «sítio de muito funcho».


    Nas encostas limpas começou a plantar-se cana-de-açúcar a partir da década de 1450, e o açúcar fez do Funchal uma cidade rica. Depois o açúcar ficou mais barato, e a partir do século XVII o que deu fama à ilha foi o vinho, o Madeira.


    A floresta que não ardeu ficou no norte, nas serras e nos vales. É a laurissilva, uma floresta de loureiros como a que, há milhões de anos, cobria todo o sul da Europa. Hoje ocupa cerca de um sexto da ilha, e desde 1999 é Património Mundial da UNESCO.


    A bandeira da Madeira também lembra quem descobriu a ilha: tem a cruz vermelha da Ordem de Cristo, a mesma das velas das caravelas portuguesas.
  en: >-
    The first settlement was named after the plant that grew there most: fennel, funcho in Portuguese. Funchal means “place full of fennel.”


    From the 1450s, sugarcane was planted on the cleared slopes, and sugar made Funchal a rich town. Then sugar got cheaper, and from the 17th century the island became famous for its wine, Madeira.


    The forest that didn’t burn survived in the north, in the mountains and ravines. This is the laurisilva, a laurel forest like the one that covered all of southern Europe millions of years ago. Today it covers about a sixth of the island, and it has been a UNESCO World Heritage Site since 1999.


    Madeira’s flag also remembers who discovered the island: it carries the red cross of the Order of Christ, the same one painted on the sails of Portuguese caravels.
  ru: >-
    Первое поселение назвали по траве, которой там было больше всего: фенхель по-португальски funcho, а Фуншал значит «заросли фенхеля».


    На расчищенных склонах с 1450-х годов стали сажать сахарный тростник, и сахар сделал Фуншал богатым городом. Потом сахар подешевел, и с XVII века остров прославило вино, мадера.


    А лес, который не сгорел, остался на севере, в горах и ущельях. Это лаурисилва, лавровый лес, какой миллионы лет назад рос по всему югу Европы. Сегодня он покрывает около шестой части острова, и с 1999 года он под охраной ЮНЕСКО.


    О том, кто открывал остров, помнит и флаг Мадейры: на нём красный крест Ордена Христа, тот же, что был на парусах португальских каравелл (см. историю про крест тамплиеров).
