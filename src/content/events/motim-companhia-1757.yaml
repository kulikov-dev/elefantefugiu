hook:
  pt: >-
    O Porto revoltou-se contra o ministro do rei, a gritar «Viva el-Rei!»
  en: >-
    Porto rose against the king’s minister, shouting “Long live the king!”
  ru: >-
    Порту восстал против министра, крича «Да здравствует король!»
story:
  pt: >-
    Na Quarta-feira de Cinzas, 23 de fevereiro de 1757, a multidão encheu as ruas do Porto a gritar
    pelo rei e contra a nova Companhia do vinho. Os taberneiros só viam um monopólio. Agrediram um
    juiz e destruíram bens. Pombal respondeu com tropas e julgamentos. Em outubro, entre 14 e 17
    pessoas foram executadas.
  en: >-
    On Ash Wednesday, February 23, 1757, crowds filled the streets of Porto, shouting for the king
    and against the new Wine Company. Tavern-keepers saw only a monopoly. The crowd roughed up a
    judge and wrecked property. Pombal answered with troops and trials. By October, between 14 and
    17 people had been executed.
  ru: >-
    В пепельную среду 23 февраля 1757 года улицы Порту заполнили толпы: люди кричали за короля и
    против новой Винной компании. Хозяева таверн видели в ней только монополию. Избили судью и
    разгромили имущество. Помбал ответил войсками и судами. К октябрю от 14 до 17 человек были
    казнены.
more:
  pt: |-
    Em Portugal, a revolta chama-se Motim da Companhia. Seguiu-se a repressão, com tropas e lei
    marcial. As contagens dos executados variam, de 14 a 17 nas fontes consultadas; uma indica 13
    homens e quatro mulheres, a 14 de outubro de 1757.


    Por trás da raiva estavam preços e controlo: a Companhia decidia quem comprava e vendia vinho do
    Douro, e ingleses, lavradores do Douro e taberneiros do Porto tinham queixas. A Companhia durou
    muito para além de Pombal: o nome e a marca ainda se usam hoje. A origem da Companhia e os
    marcos que delimitaram a região contam-se noutra história.
  en: |-
    In Portuguese the riot is the Motim da Companhia. Troops and martial law followed. Sources give

    different counts of the executed, from 14 to 17; one lists 13 men and four women on October 14,

    1757.



    Behind the anger lay prices and control: the Company decided who could buy and sell Douro wine,

    and English traders, Douro growers and Porto’s tavern-keepers all had grievances. The Company

    outlived Pombal by centuries: its name and trademark are still in use today. How it began, and

    the stones that marked its borders, are told on another card.
  ru: |-
    По-португальски бунт называется Motim da Companhia. Затем пришли войска и военное положение.
    Число казнённых расходится: от 14 до 17 в изученных источниках, один перечисляет 13 мужчин и
    четырёх женщин 14 октября 1757 года.


    За гневом стояли цены и контроль: Компания решала, кто может покупать и продавать вино Дору, и у
    англичан, виноделов Дору и хозяев таверн Порту были свои претензии. Компания намного пережила
    Помбала: её название и торговая марка в ходу до сих пор. Как всё началось и какие камни отметили
    её границы, рассказано в другой карточке.
