more:
  pt: |-
    A cidade ficou às escuras mais de meio século. A luz só voltou em 1848, com o gás. Agora a luz vinha de uma companhia de gás, e não dos lojistas. Mas o gás chegava primeiro só às ruas do centro, e os bairros de fora viveram muito tempo no escuro.

    O passo seguinte foi dado pelo rei. Em 1878, D. Luís I ofereceu à cidade os primeiros candeeiros elétricos: iluminaram o Chiado, e o Diário de Notícias contava como as pessoas se juntavam na praça para ver a nova luz. Em 1889 a eletricidade chegou à Avenida da Liberdade, mas só até à uma da manhã. Depois voltava a acender-se o gás.

    Candeeiros do século XIX, de ferro fundido e forjado, ainda estão pendurados nas paredes dos bairros antigos. E a eletricidade acendeu-se pela primeira vez em 1878 ali, no Chiado.
  en: |-
    The city stayed dark for more than half a century. Light returned only in 1848, with gas. Now the light came from a gas company, not from shopkeepers. Still, gas reached only the central streets at first, and the outskirts stayed dark for a long time.

    The next step came from the king. In 1878, Luís I gave the city its first electric lamps: they lit up Chiado, and the Diário de Notícias described crowds gathering in the square to see the new light. In 1889 electricity reached Avenida da Liberdade, but only until 1 a.m. After that, the gas lamps were lit again.

    19th-century cast-iron and wrought-iron lamps still hang on the walls of the old neighborhoods. And electric light first came on in 1878 right here, in Chiado.
  ru: |-
    Город остался тёмным больше чем на полвека. Свет вернулся только в 1848 году, когда в Лиссабоне провели газ. Теперь свет давала газовая компания, а не лавочники. Но газа хватало сначала только на центральные улицы, а окраины ещё долго жили в темноте.

    Следующий шаг сделал король. В 1878 году Луиш I подарил городу первые электрические фонари: ими осветили Шиаду, и газета «Диариу-ди-Нотисиаш» описывала, как на площадь собирались смотреть на новый свет. А в 1889 году электричеством осветили Авениду-да-Либердаде, правда, только до часу ночи. Потом на ней снова зажигали газ.

    Фонари XIX века, чугунные и кованые, до сих пор висят на стенах старых кварталов. А электричество в 1878 году впервые зажглось на Шиаду.
