hook:
  pt: Os «morcegos» que guardavam os lisboetas.
  en: The “bats” who guarded Lisbon at night.
  ru: «Летучие мыши», которые охраняли горожан.
story:
  pt: |-
    Depois do terramoto de 1755, Lisboa foi reconstruída, mas à noite as ruas continuavam completamente às escuras. Andar nelas era perigoso, e aos guardas noturnos os lisboetas chamavam «morcegos».

    Em 1780, o intendente da polícia Pina Manique decidiu iluminar a cidade. O Estado não tinha dinheiro para isso, e quem pagou foram os comerciantes: cada um punha um candeeiro à porta da sua loja e enchia-o de azeite.

    O azeite era caro, e a luz ficava para todos os que passavam. Os comerciantes começaram a poupar, e os candeeiros foram-se apagando um a um. Em 1792, um viajante voltava a escrever que Lisboa estava mergulhada no escuro.
  en: |-
    After the 1755 earthquake, Lisbon was rebuilt, but at night its streets were still pitch-dark. Walking them was dangerous, and people called the night watchmen “bats.”

    In 1780, police chief Pina Manique decided to light up the city. The treasury had no money for it, so shopkeepers were made to pay: each one hung a lamp by his shop door and filled it with olive oil.

    Oil was expensive, and the light went to every passerby. The shopkeepers began to cut back, and the lamps went out one by one. By 1792, a traveler was again writing that Lisbon was plunged into darkness at night.
  ru: |-
    После землетрясения 1755 года Лиссабон отстроили заново, но ночью улицы оставались совсем тёмными. Ходить по ним было опасно, а ночных стражников горожане прозвали «летучими мышами».

    В 1780 году глава полиции Пина Маники решил осветить город. Денег на это у казны не было, и платить велели торговцам: каждый ставил фонарь у своей лавки и заливал в него оливковое масло.

    Масло стоило дорого, а свет доставался всем прохожим. Торговцы стали экономить, и фонари гасли один за другим. К 1792 году путешественник снова писал, что ночной Лиссабон погружён во тьму.
