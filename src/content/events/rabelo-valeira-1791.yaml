hook:
  pt: Para o vinho descer o Douro, partiu-se um rochedo durante onze anos.
  en: Eleven years of breaking a rock so port could reach the sea.
  ru: Чтобы портвейн доплыл до моря, одиннадцать лет разбивали скалу посреди реки.
story:
  pt: >-
    O vinho do Porto faz-se no alto Douro, mas era envelhecido e vendido em Vila Nova de Gaia, junto ao mar. Não havia estradas pelas margens íngremes, por isso as pipas desciam o rio em barcos rabelos, de fundo chato, que levavam até uma centena de pipas.


    Mas no Cachão da Valeira o rio estava barrado por uma queda de pedra, e acima dela os barcos não navegavam. Em 1780 começaram a partir-se os rochedos, os primeiros barcos passaram em 1789 e, em 1791, a obra ficou concluída. A partir daí o vinho podia descer o rio desde as vinhas mais distantes.


    O Cachão nunca ficou seguro. Os rabelos eram governados por um único remo comprido à popa, o arrais ia de pé numa plataforma alta, e um erro numa corredeira bastava para despedaçar o barco nas pedras.
  en: >-
    Port is made in the upper Douro valley, but it was aged and sold in Vila Nova de Gaia, by the sea. There were no roads along the steep banks, so the casks went downriver on rabelos, flat-bottomed boats that carried up to a hundred casks.


    But at the Valeira gorge, a rock barrier blocked the river, and boats couldn’t go beyond it. In 1780 work began on breaking up the rocks, the first boats passed in 1789, and the job was finished in 1791. From then on, wine could travel by river from the most distant vineyards.


    The gorge never became safe. A rabelo was steered with a single long oar at the stern, the helmsman stood on a high platform, and one mistake in the rapids was enough to smash the boat on the rocks.
  ru: >-
    Портвейн делают в верховьях Дору, а выдерживали и продавали в Вила-Нова-ди-Гайе, у моря. Дорог по крутым берегам не было, поэтому бочки сплавляли по реке на рабелу, плоскодонных лодках на сотню бочек.


    Но в ущелье Валейра реку перегораживал каменный порог, и выше него лодки не ходили. В 1780 году скалы начали разбивать, первые лодки прошли в 1789-м, а в 1791-м работы закончили. Теперь вино можно было везти по реке из самых дальних виноградников.


    Безопасным ущелье так и не стало. Рабелу правили одним длинным веслом с кормы, рулевой стоял на высоком помосте, и одна ошибка на пороге разбивала лодку о камни.
