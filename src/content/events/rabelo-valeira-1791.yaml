more:
  pt: >-
    Em 1861, na Valeira, virou-se o barco em que seguiam o inglês barão de Forrester e a famosa produtora de vinho Antónia Ferreira. Forrester morreu. Foi o primeiro a cartografar o Douro em pormenor, assinalou mais de duzentos rápidos e queria tornar o rio mais seguro. D. Antónia salvou-se; segundo a lenda, foi a crinolina que a manteve à tona.


    Em 1887 o caminho de ferro chegou ao longo do Douro, a última viagem comercial de um rabelo terá sido em 1964 e, nos anos 1970, construiu-se a barragem da Valeira mesmo no desfiladeiro. Os rápidos ficaram debaixo de água. Os rabelos com os nomes das casas de vinho estão hoje no cais de Gaia e, uma vez por ano, a 24 de junho, saem para a regata.
  en: >-
    In 1861, at Valeira, a boat carrying the English Baron Forrester and the famous winemaker Antónia Ferreira capsized. Forrester died. He was the first to map the Douro in detail, marked more than two hundred rapids, and wanted to make the river safer. Antónia made it out; according to legend, her crinoline kept her afloat.


    In 1887 a railway was built along the Douro, the last commercial rabelo run is said to have taken place in 1964, and in the 1970s the Valeira Dam was built right in the gorge. The rapids disappeared underwater. Rabelos bearing the names of port houses now sit at the Gaia waterfront, and once a year, on June 24, they come out for a regatta.
  ru: >-
    В 1861 году в Валейре перевернулась лодка, в которой плыли англичанин барон Форрестер и знаменитая винодельщица Антония Феррейра. Форрестер погиб. Он первым подробно нанёс Дору на карту, отметил на ней больше двухсот порогов и хотел сделать реку безопаснее. Антония выплыла; по преданию, её удержал на воде пышный кринолин.


    В 1887 году вдоль Дору прошла железная дорога, последний коммерческий рейс рабелу, как считается, был в 1964 году, а в 1970-х прямо в ущелье построили плотину Валейра. Пороги ушли под воду. Рабелу с названиями винных домов теперь стоят у набережной Гайи и раз в год, 24 июня, выходят на регату.
