hook:
  pt: >-
    Masséna avançou sobre Lisboa e deu com fortes que não esperava.
  en: >-
    Masséna marched on Lisbon and found a line of secret forts.
  ru: >-
    Целый год строили линию фортов, о которой французы почти не знали.
story:
  pt: >-
    Em outubro de 1809, Wellington mandou fortificar as colinas a norte de
    Lisboa. Trabalhadores portugueses ergueram fortes e redutos em segredo. Em
    setembro de 1810, o marechal Masséna avançou para Lisboa com cerca de 60 000
    homens, por uma terra sem comida, que os próprios camponeses tinham
    destruído. A 11 de outubro chegou às Linhas de Torres Vedras. Um mês depois,
    com fome, voltou para trás.
  en: >-
    In October 1809, Wellington began fortifying the hills north of Lisbon, a project kept secret
    from the French. Portuguese workers raised forts and redoubts in secret. In September 1810,
    Marshal Masséna marched on Lisbon with about 60,000 men, through a land stripped of food by its
    own farmers. On October 11 he reached the Lines of Torres Vedras. A month later, hungry, he
    turned back.
  ru: >-
    В октябре 1809 года Веллингтон приказал укрепить холмы севернее Лиссабона: так начали строить
    линии Торриш-Ведраш. Португальские рабочие втайне возводили форты и редуты. В сентябре 1810 года
    маршал Массена двинулся на Лиссабон примерно с 60 тысячами человек по земле, где крестьяне сами
    уничтожили всю еду. 11 октября он дошёл до линий Торриш-Ведраш. Через месяц, голодный, он
    повернул назад.
more:
  pt: >-
    O sistema tinha três linhas de fortes e redutos entre o Tejo e o Atlântico,
    desenhadas pelo engenheiro-chefe de Wellington, o coronel Richard Fletcher.
    O maior forte, o de São Vicente, em Torres Vedras, tinha uma guarnição de
    cerca de 2000 homens e espaço para uns 4000. Os camponeses portugueses abandonaram as terras e destruíram a comida que não podiam levar. O exército francês passou fome. Os franceses testaram as linhas em Sobral, a
    13 e 14 de outubro, e acamparam diante delas até meados de novembro. As
    fontes divergem quanto ao número de fortes e situam o exército de Masséna
    junto às linhas entre pouco mais de 50 000 e 61 000 homens. A campanha foi
    também um desastre para os civis: algumas estimativas apontam para dezenas
    de milhares de mortos portugueses por fome e doença.
  en: >-
    The system had three lines of forts and redoubts between the Tagus and the Atlantic, designed by
    Wellington’s chief engineer, Colonel Richard Fletcher. The biggest fort, São Vicente at Torres
    Vedras, had a garrison of about 2,000 men and room for around 4,000. Portuguese farmers left
    their land and destroyed the food they could not carry, so the French army went hungry. The
    French probed the lines at Sobral on October 13 and 14, then camped in front of them until
    mid-November. Sources differ on the number of forts, and estimate Masséna’s army at the lines at
    anywhere from just over 50,000 to 61,000 men. The campaign was also a disaster for civilians:
    some estimates put the Portuguese dead from hunger and disease in the tens of thousands.
  ru: >-
    Система состояла из трёх линий фортов и редутов между Тежу и Атлантикой, спроектированных
    главным инженером Веллингтона полковником Ричардом Флетчером. Крупнейший форт, Сан-Висенте в
    Торриш-Ведраш, имел гарнизон около 2000 человек и мог вместить примерно 4000. Португальские
    крестьяне покидали земли и уничтожали еду, которую не могли унести, поэтому французская армия
    голодала. Французы прощупали линии у Собрала 13 и 14 октября, а затем стояли перед ними до
    середины ноября. Источники расходятся в числе фортов и оценивают армию Массены у линий от чуть
    более 50 000 до 61 000 человек. Кампания стала катастрофой и для гражданских: по некоторым
    оценкам, десятки тысяч португальцев умерли от голода и болезней.
