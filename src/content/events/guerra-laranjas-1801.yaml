hook:
  pt: >-
    Diz-se que um ramo de laranjas deu nome a esta guerra.
  en: A branch of oranges supposedly gave this war its name.
  ru: Восемнадцать дней войны и, по преданию, одна ветка апельсинов для королевы.
story:
  pt: >-
    Em maio de 1801, a Espanha, pressionada por Napoleão, invadiu Portugal numa guerra que durou
    menos de três semanas. O exército era comandado por Manuel Godoy, o primeiro-ministro e, diziam,
    amante da rainha. Não conseguiu tomar a fortaleza de Elvas, mas tomou Olivença e algumas vilas
    da fronteira. Diante de Elvas, conta a tradição, Godoy colheu um ramo de laranjas e enviou-o à
    rainha Maria Luísa como sinal de vitória. Os inimigos transformaram-no em anedota, e a guerra
    ficou a ser a Guerra das Laranjas.
  en: >-
    In May 1801 Spain, prodded by Napoleon’s France, invaded Portugal. The army was led by Manuel
    Godoy, the prime minister and, people said, the queen’s lover. He could not take the fortress of
    Elvas, but he took Olivença and a few border towns. Outside Elvas, according to tradition, Godoy
    plucked a branch of oranges and sent it to Queen María Luisa as a token of victory. His enemies
    turned it into a joke, and the conflict became known as the War of the Oranges.
  ru: >-
    Весной 1801 года Испания, подстрекаемая наполеоновской Францией, вторглась в Португалию. Армией
    командовал Мануэль Годой, первый министр и, как говорили, любовник королевы. Крепость Эльваш он
    взять не смог, зато взял Оливенсу и несколько приграничных городков. Под Эльвашем, гласит
    предание, Годой сорвал ветку апельсинов и отправил королеве Марии Луизе как знак победы. Его
    враги превратили это в шутку, и война вошла в историю как «Апельсиновая».
more:
  pt: |-
    A guerra durou cerca de dezoito dias, de 20 de maio ao Tratado de Badajoz, a 6 de junho de 1801.
    Elvas, sob o comando do general Francisco de Noronha, resistiu. A Espanha devolveu a maioria das
    praças que tinha tomado, mas ficou com Olivença, e Portugal teve de fechar os portos aos navios
    britânicos.


    Em 1815, o Congresso de Viena reconheceu o direito de Portugal a Olivença, e a Espanha ratificou
    a ata final em 1817, mas a vila nunca foi devolvida. Hoje, Olivença, a 23 km de Elvas, tem cerca
    de 12 000 habitantes e é administrada pela Espanha. Continua em discussão se deve regressar a
    Portugal.


    O episódio das laranjas é tradição, não um facto documentado. As fontes portuguesas falam de um
    ramo de flores de laranjeira, as espanholas e inglesas de laranjas, e diz-se que foram os
    adversários de Godoy a fazer dele uma anedota.
  en: |-
    The war lasted about eighteen days, from May 20 to the Treaty of Badajoz on June 6, 1801. Elvas,

    under General Francisco de Noronha, held out. Spain gave back most of the towns it had taken but

    kept Olivença, and Portugal had to close its ports to British ships.



    In 1815 the Congress of Vienna recognized Portugal’s right to Olivença, and Spain ratified the

    final act in 1817, yet the town was never returned. Today Olivença, about 14 miles (23 km) from

    Elvas, has about 12,000 inhabitants and is administered by Spain. Whether it should return to

    Portugal is still debated.



    The orange episode is tradition, not a documented fact. Portuguese sources speak of a branch of

    orange blossom, Spanish and English ones of oranges, and it was Godoy’s opponents who supposedly

    turned it into a joke.
  ru: |-
    Война длилась около восемнадцати дней, с 20 мая до Бадахосского договора 6 июня 1801 года.
    Эльваш под командованием генерала Франсишку де Нороньи устоял. Испания вернула большинство
    захваченных городов, но оставила Оливенсу, а Португалия должна была закрыть порты для британских
    кораблей.


    В 1815 году Венский конгресс признал право Португалии на Оливенсу, а Испания ратифицировала
    заключительный акт в 1817 году, но город так и не вернули. Сегодня Оливенса, в 23 км от Эльваша,
    насчитывает около 12 000 жителей и управляется Испанией. Должна ли она вернуться в Португалию,
    по-прежнему спорят.


    Эпизод с апельсинами — предание, а не документированный факт. Португальские источники пишут о
    ветке апельсиновых цветов, испанские и английские — об апельсинах, а в шутку это, как говорят,
    превратили противники Годоя.
