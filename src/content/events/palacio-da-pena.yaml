hook:
  pt: O convento abandonado que se tornou um conto de fadas.
  en: The abandoned monastery that became a fairy tale.
  ru: Заброшенный монастырь, который стал сказкой.
story:
  pt: O príncipe alemão Fernando de Saxe-Coburgo casou com a rainha D. Maria II e tornou-se o rei D.
    Fernando II. Pintava, colecionava e adorava castelos românticos. Em 1838 comprou, no alto de um
    monte em Sintra, um convento vazio desde a extinção das ordens em 1834. Ao velho edifício
    juntaram-se torres, portões e muralhas nas cores mais ousadas. Assim, sobre o velho convento,
    cresceram as torres cor-de-rosa e amarelas do Palácio da Pena.
  en: The German prince Ferdinand of Saxe-Coburg married Portugal’s Queen Maria II and became King
    Ferdinand II. He painted, collected art, and loved romantic castles. In 1838 he bought a
    monastery on a hilltop in Sintra that had stood empty since the monasteries were closed in 1834.
    Towers, gates, and walls in the boldest colors were added to the old building. That’s how the
    pink and yellow towers of Pena Palace rose over the old monastery.
  ru: Немецкий принц Фердинанд Саксен-Кобург женился на португальской королеве Марии II и стал королём
    Фердинандом II. Он рисовал, коллекционировал и обожал романтические замки. В 1838 году он купил
    на вершине холма в Синтре монастырь, пустовавший с тех пор, как в 1834 году закрыли монастыри. К
    старому зданию пристроили башни, ворота и стены в самых смелых цветах. Так над старым монастырём
    выросли розовые и жёлтые башни дворца Пена.
more:
  pt: >-
    A obra foi dirigida pelo barão de Eschwege, engenheiro alemão ao serviço de Portugal. A ala nova
    começou por volta de 1843, e os trabalhos terminaram em meados da década de 1860. À volta do
    palácio, D. Fernando plantou um enorme parque com árvores de todo o mundo.


    As cores vivas foram desbotando, e só em 1994 os restauradores as devolveram: o rosa ao velho
    convento e o ocre à ala nova. Um ano depois, a Paisagem Cultural de Sintra entrou na lista do
    Património Mundial da UNESCO.
  en: >-
    Construction was led by Baron von Eschwege, a German engineer in Portuguese service. The new
    wing was begun around 1843, and work was finished by the mid-1860s. Around the palace, Ferdinand
    planted a huge park with trees from all over the world.


    The bright colors faded over time, and it wasn’t until 1994 that restorers brought them back:
    pink for the old monastery and ochre for the new wing. A year later, the Cultural Landscape of
    Sintra was added to UNESCO’s World Heritage List.
  ru: >-
    Строительством руководил барон Эшвеге, немецкий инженер на португальской службе. Новое крыло
    начали около 1843 года, работы закончились к середине 1860-х. Вокруг дворца Фердинанд посадил
    огромный парк с деревьями со всего света.


    Яркие цвета со временем выцвели, и только в 1994 году реставраторы вернули их: розовый старому
    монастырю и охру новому крылу. Через год культурный ландшафт Синтры внесли в список всемирного
    наследия ЮНЕСКО.
