hook:
  pt: Depois do terramoto, o azulejo passou a ser um padrão para todos.
  en: After the earthquake, azulejo tiles became a pattern for everyone.
  ru: После землетрясения азулежу стали узором для всех.
seo:
  title:
    pt: O azulejo pombalino de Lisboa | O Elefante Fugiu
    en: Lisbon’s Pombaline Tiles | O Elefante Fugiu
    ru: Помбалинская плитка Лиссабона | O Elefante Fugiu
story:
  pt: >-
    Antes de 1755, os azulejos eram quadros: o mestre pintava a parede inteira, com cenas de caça ou
    de santos. Era demorado e caro.

    Depois do terramoto, Lisboa foi reconstruída aos quarteirões, e os quadros tornaram-se um luxo.
    Os azulejos passaram a fazer-se com padrões prontos: um desenho simples, em duas ou três cores,
    repete-se em cada quadrado e forma sozinho um ornamento em qualquer comprimento de parede.

    A estes azulejos chama-se pombalinos, por causa de Pombal. Foram assentes nas entradas e nas
    escadas dos novos prédios da Baixa, e muitos continuam lá.
  en: >-
    Before 1755, azulejos were paintings: a master painted an entire wall with hunting scenes or
    saints. It was slow and expensive.

    After the earthquake, Lisbon was rebuilt block by block, and painted walls became a luxury.
    Tiles started being made from ready-made patterns: a simple design in two or three colors
    repeats on every square and forms an ornament along a wall of any length.

    These tiles are called Pombaline, after Pombal. They went into the entrances and stairwells of
    the new buildings in the Baixa, and many are still there.
  ru: >-
    До 1755 года азулежу были картинами: мастер расписывал стену целиком, сценами охоты или святых.
    Это было долго и дорого.

    После землетрясения Лиссабон отстраивали целыми кварталами, и картины стали роскошью. Плитку
    начали делать по готовым узорам: простой рисунок в две-три краски повторяется на каждом квадрате
    и сам складывается в орнамент на любой длине стены.

    Такие плитки зовут помбалинскими, по имени Помбала. Их клали в подъезды и на лестницы новых
    домов Байши, и многие лежат там до сих пор.
more:
  pt: >-
    Um padrão de quadrados iguais perdoava muita coisa. O azulejo não tinha de encaixar numa cena:
    se um partia, trocava-se por qualquer outro do mesmo lote, e o assentador podia revestir uma
    parede de qualquer comprimento sem pensar onde acabaria o quadro. Para uma cidade construída à
    pressa, isso valia mais do que a beleza.


    Os azulejos também se faziam na Real Fábrica do Rato, fundada no tempo de Pombal, em 1767. Ao
    lado dos padrões surgiu um azulejo ainda mais simples: num quadrado branco, um só desenho
    pequeno, um pássaro, uma flor ou um barco. Assentava-se salteado, e a parede ficava bonita quase
    sem custo.


    Cem anos depois, a moda deu a volta. Segundo se pensa, os portugueses que regressavam do Brasil
    trouxeram o hábito de revestir com azulejo não as escadas, mas fachadas inteiras, e Lisboa
    tornou-se a cidade de casas de azulejo que conhecemos.
  en: >-
    A pattern of identical squares was forgiving. Tiles didn’t have to fit a scene: if one broke,
    any other from the same batch could replace it, and a tiler could cover a wall of any length
    without worrying where the picture would end. For a city being built in a hurry, that mattered
    more than beauty.


    Tiles were also made at the Royal Factory in Rato, founded under Pombal in 1767. Next to the
    patterns came an even simpler tile: a white square with one small design, a bird, a flower, or a
    boat. Laid out scattered, these made a wall look festive for almost nothing.


    A hundred years later, fashion swung back. It is generally thought that Portuguese returning
    from Brazil brought home the habit of tiling not stairwells but entire facades, and Lisbon
    became the city of tiled houses we know today.
  ru: >-
    Узор из одинаковых квадратов прощал многое. Плитку не надо было подгонять под сюжет: если одна
    разбивалась, её заменяли любой другой из той же партии, а мастер мог класть стену любой длины,
    не думая, где закончится картина. Для города, который строили на скорость, это было важнее
    красоты.


    Плитку делали и на Королевской фабрике у Рату, которую основали при Помбале в 1767 году.


    Через сто лет мода повернула обратно. Как считается, португальцы, вернувшиеся из Бразилии,
    привезли привычку облицовывать плиткой не лестницы, а целые фасады, и Лиссабон стал городом
    плиточных домов, каким мы его знаем.
