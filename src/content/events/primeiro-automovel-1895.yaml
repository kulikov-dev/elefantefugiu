more:
  pt: >-
    Ao início encheram o depósito com petróleo, porque ninguém em Portugal sabia com que combustível o carro andava. Só depois se percebeu que precisava de gasolina. Com o conde seguiam um mecânico francês e um fotógrafo.


    Poucos anos depois, os automóveis já eram o brinquedo da nobreza, e o maior entusiasta do país era o próprio rei D. Carlos I: tinha vários carros e conduzia-os ele mesmo. Em 1903 nasceu o Real Automóvel Club de Portugal, cujo emblema, segundo se diz, foi desenhado pelo rei. O clube lutava por leis claras para os condutores e por boas estradas, e em 1913 publicou o primeiro mapa de estradas de Portugal.


    As estradas onde em 1895 o carro encontrou o burro continuaram muito tempo a ser estradas de carroças. Só depois da Primeira Guerra Mundial o número de carros multiplicou-se, e em 1927 nasceu um organismo para cuidar das estradas de todo o país.
  en: >-
    At first they filled the tank with kerosene, because no one in Portugal knew what the car ran on. Only later did they figure out it needed gasoline. A French mechanic and a photographer rode along with the count.


    A few years later, cars had become a toy of the nobility, and the country’s biggest car enthusiast was King Carlos I himself: he owned several and drove them himself. In 1903 the Royal Automobile Club of Portugal was founded, and the king is said to have drawn its emblem. The club pushed for clear laws for drivers and for good roads, and in 1913 it published Portugal’s first road map.


    The roads where the car met the donkey in 1895 stayed cart roads for a long time. Only after World War I did the number of cars multiply, and in 1927 an agency was created to look after roads across the whole country.
  ru: >-
    В машину сначала залили керосин, потому что никто в Португалии не знал, на чём она ездит. Только потом выяснили, что нужен бензин. С графом ехали французский механик и фотограф.


    Через несколько лет машины уже были игрушкой знати, и главным автомобилистом страны стал сам король Карлуш I: у него было несколько автомобилей, и он водил их сам. В 1903 году появился Королевский автомобильный клуб, эмблему которому король, как считается, нарисовал своей рукой. Клуб добивался понятных законов для водителей и хороших дорог, а в 1913 году выпустил первую дорожную карту Португалии.


    Дороги, на которых в 1895 году машина встретила осла, ещё долго оставались дорогами для телег. Только после Первой мировой войны машин стало в несколько раз больше, а в 1927 году появилось ведомство, которое занялось дорогами всей страны.
