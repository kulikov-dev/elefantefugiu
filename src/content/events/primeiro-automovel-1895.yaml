story:
  pt: >-
    Em 1895, o conde de Avillez comprou em Paris um automóvel Panhard & Levassor e trouxe-o para Lisboa. Era o primeiro carro em Portugal: rodas de ferro sem pneus e velocidade de uns 15 km/h.


    O conde decidiu ir nele até à sua casa em Santiago do Cacém, a mais de cem quilómetros para sul. As estradas eram feitas para carroças e burros, e quem passava nunca tinha visto um carro sem cavalo.


    Perto de Palmela, o carro atropelou um burro. Foi o primeiro acidente de automóvel do país, antes de haver quaisquer regras de trânsito. A 15 de outubro, o carro lá chegou a Santiago do Cacém.
  en: >-
    In 1895, the Count of Avillez bought a Panhard & Levassor automobile in Paris and brought it to Lisbon. It was the first car in Portugal: iron wheels with no tires and a top speed of about 15 km/h (9 mph).


    The count decided to drive it to his estate in Santiago do Cacém, more than a hundred kilometers to the south. The roads were made for carts and donkeys, and people along the way had never seen a carriage without a horse.


    Near Palmela, the car hit a donkey. It was the country’s first car accident, before there were any traffic rules. On October 15, the car finally made it to Santiago do Cacém.
  ru: >-
    В 1895 году граф Авиллеш купил в Париже автомобиль «Панар и Левассор» и привёз его в Лиссабон. Это была первая машина в Португалии: железные колёса без шин, скорость около 15 км/ч.


    Граф решил доехать на ней до своего имения в Сантьягу-ду-Касен, это больше сотни километров на юг. Дороги были рассчитаны на телеги и ослов, а встречные никогда не видели повозки без лошади.


    Под Палмелой машина сбила осла. Так в стране появилась первая автоавария, раньше первых правил движения. 15 октября автомобиль всё-таки добрался до Сантьягу-ду-Касен.
