seo:
  title:
    pt: Batalha do Vimeiro · Lourinhã, 1808
    en: Battle of Vimeiro · Lourinhã, 1808
    ru: Битва при Вимейру · Лоуринья, 1808
story:
  pt: |-
    No verão de 1808, Portugal estava ocupado pelos franceses, e a Grã-Bretanha desembarcou aqui um exército pela primeira vez. Comandava-o Arthur Wellesley, de 39 anos, o futuro duque de Wellington. A 21 de agosto, junto à aldeia do Vimeiro, os franceses do general Junot atacaram-no nas colinas e recuaram, deixando para trás os canhões.

    Wellesley queria perseguir os que fugiam. Mas precisamente nesses dias chegou ao exército o general Burrard, mais antigo do que ele, e mandou parar. No dia seguinte chegou um terceiro chefe, Dalrymple, mais antigo do que os dois. Os franceses mandaram parlamentários, e Dalrymple, em vez de perseguir, sentou-se a negociar.

    Em Londres ninguém queria acreditar no acordo. A frota britânica levaria o exército de Junot para França, com armas, bagagens e tudo o que os franceses tinham saqueado em Portugal. O acordo tinha a assinatura dos três generais, e os três foram chamados a inquérito.
  en: |-
    In the summer of 1808, Portugal was under French occupation, and Britain landed an army here for the first time. It was led by 39-year-old Arthur Wellesley, the future Duke of Wellington. On August 21, near the village of Vimeiro, General Junot’s French attacked him in the hills and fell back, leaving their cannons behind.

    Wellesley was eager to finish off the retreating enemy. But General Burrard, who outranked him, arrived and ordered the army to stay put. The next day a third commander, Dalrymple, arrived, senior to them both. The French sent envoys, and instead of giving chase, Dalrymple sat down to negotiate.

    The deal was so generous that London could hardly believe it. The British fleet would ship Junot’s army to France, with its weapons, its baggage, and everything the French had looted in Portugal. All three generals had signed it and were summoned to an inquiry.
  ru: |-
    Летом 1808 года Португалия была под французами, и Британия впервые высадила здесь армию. Командовал ею 39-летний Артур Уэлсли, будущий герцог Веллингтон. 21 августа у деревни Вимейру французы генерала Жюно атаковали его на холмах и откатились, бросив пушки.

    Уэлсли рвался добить отступающих. Но как раз в эти дни к армии прибыл генерал Барард, старше его по званию, и приказал стоять. На следующий день приехал третий начальник, Далримпл, старше их обоих. Французы прислали парламентёров, и Далримпл вместо погони сел договариваться.

    Договорились так, что в Лондоне не поверили. Британский флот отвезёт армию Жюно домой, во Францию, с оружием, багажом и всем, что французы награбили в Португалии. Под договором стояли подписи всех трёх генералов, и всех троих вызвали на следствие.
more:
  pt: |-
    O acordo ficou conhecido como Convenção de Sintra, embora não tenha sido assinado em Sintra: segundo as fontes, foi em Lisboa ou no palácio de Queluz. Mais tarde, o quartel-general britânico esteve em Sintra, e o nome pegou. Um ano depois, o jovem Byron passou por Sintra e meteu-a no «Childe Harold»: «A Grã-Bretanha adoece ao teu nome, Sintra».

    O inquérito reuniu no hospital de Chelsea, em Londres, entre novembro e dezembro de 1808. Wellesley explicou que a sua assinatura fora uma formalidade: o acordo fora negociado pelos superiores. Não se apuraram culpados, e os três foram ilibados. Mas Dalrymple e Burrard nunca mais comandaram exércitos.

    Já Wellesley voltou a Portugal na primavera de 1809, agora como comandante-chefe. Um ano depois construiu perto de Lisboa as Linhas de Torres Vedras, onde parou o exército francês seguinte. O general a quem proibiram a perseguição no Vimeiro acabou por comandar o exército que expulsou os franceses de Portugal.
  en: |-
    The deal became known as the Convention of Sintra, even though it wasn’t signed in Sintra: sources say it was in Lisbon or at the Queluz palace. The British later set up headquarters in Sintra, and the name stuck. A year later, a young Byron passed through Sintra and put it into Childe Harold’s Pilgrimage: “Britannia sickens, Cintra! at thy name.”

    The inquiry sat at the Royal Hospital Chelsea in London from November to December 1808. Wellesley explained that his signature had been a formality: his superiors had negotiated the deal. No one was found guilty, and all three were cleared. But Dalrymple and Burrard never commanded an army again.

    Wellesley, on the other hand, returned to Portugal in the spring of 1809, this time as commander in chief. A year later he built the Lines of Torres Vedras near Lisbon, where the next French army was stopped. The general who wasn’t allowed to give chase at Vimeiro later commanded the army that drove the French out of Portugal.
  ru: |-
    Договор назвали Синтрийской конвенцией, хотя подписали его не в Синтре: по разным источникам, в Лиссабоне или во дворце Келуш. В Синтре потом стоял британский штаб, и название прилипло. Через год Синтру проездом увидел молодой Байрон и вставил её в «Паломничество Чайльд-Гарольда»: «Британия болеет при твоём имени, Синтра».

    Следствие заседало в лондонском госпитале Челси с ноября по декабрь 1808 года. Уэлсли объяснял, что его подпись была формальностью: договор вели старшие. Виновных не нашли, всех троих оправдали. Но Далримпла и Барарда больше не посылали командовать армиями.

    А Уэлсли весной 1809 года вернулся в Португалию уже главнокомандующим. Через год он построил под Лиссабоном линии Торриш-Ведраш, у которых остановилась следующая французская армия. Генерал, которого не пустили в погоню при Вимейру, потом сам командовал армией, которая вытеснила французов из Португалии.
myth:
  verdict: fact
  statement:
    pt: Os britânicos levaram para casa os franceses derrotados no Vimeiro
    en: The British shipped the French they had beaten at Vimeiro back home
    ru: Разбитых при Вимейру французов британцы сами отвезли домой
  answer:
    pt: Pela Convenção de Sintra, a frota britânica levou o exército de Junot para França, com armas, bagagens e o que tinha saqueado.
    en: Under the Convention of Sintra, the British fleet took Junot’s army to France with its weapons, baggage, and loot.
    ru: По Синтрийской конвенции британский флот доставил армию Жюно во Францию с оружием, багажом и награбленным.
