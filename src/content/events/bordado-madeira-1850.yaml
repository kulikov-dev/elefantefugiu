hook:
  pt: Na Madeira houve uma fábrica sem uma única oficina.
  en: Madeira once had a factory without a single workshop.
  ru: На Мадейре была фабрика без единого цеха.
story:
  pt: >-
    Durante séculos, as mulheres da Madeira bordaram para si: enxovais, toalhas, roupa de casa. Elizabeth Phelps, filha de um comerciante de vinho inglês do Funchal, viu nisso um produto.


    Bella Phelps ensinou raparigas da terra a bordar e, no fim dos anos 1840, levou o bordado madeirense para Inglaterra. O trabalho deu nas vistas: em 1850 foi mostrado numa exposição no Palácio de São Lourenço, no Funchal, e em 1851 havia amostras na Grande Exposição de Londres.


    As encomendas multiplicaram-se, mas ninguém construiu oficinas. As bordadeiras trabalhavam em casa: levavam-lhes o tecido com o desenho e vinham buscar o trabalho pronto. No fim do século XIX havia na ilha cerca de 70 mil bordadeiras. A fábrica inteira cabia nas casas delas.
  en: >-
    For centuries, the women of Madeira embroidered for themselves: trousseaus, tablecloths, household linen. Elizabeth Phelps, the daughter of an English wine merchant in Funchal, saw a product in it.


    Bella Phelps taught local girls to embroider and, in the late 1840s, brought Madeiran embroidery to England. The work got noticed: in 1850 it was shown at an exhibition in the São Lourenço Palace in Funchal, and in 1851 samples reached the Great Exhibition in London.


    Orders poured in, but nobody built workshops. The embroiderers worked at home: fabric with the pattern was brought to them, and the finished work was collected. By the late 19th century, the island had some 70,000 bordadeiras, embroiderers. The whole factory fit inside their homes.
  ru: >-
    Женщины Мадейры веками вышивали для себя: приданое, скатерти, бельё. Элизабет Фелпс, дочь английского виноторговца из Фуншала, увидела в этом товар.


    Белла Фелпс научила местных девочек вышивать, а в конце 1840-х привезла мадейрскую вышивку в Англию. Работу заметили: в 1850 году её показали на выставке во дворце Сан-Лоренсу в Фуншале, а в 1851 году образцы попали на Всемирную выставку в Лондоне.


    Заказов стало много, но цехов никто не строил. Вышивальщицы работали дома: им приносили ткань с рисунком и забирали готовое. К концу XIX века на острове было около 70 тысяч бордадейраш, вышивальщиц. Вся эта фабрика помещалась в их домах.
