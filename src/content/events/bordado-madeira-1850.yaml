more:
  pt: >-
    A própria Bella Phelps não foi à exposição de Londres nem expôs nada em seu nome. Mas a partir da sua iniciativa, o bordado tornou-se o principal ganha-pão das mulheres da ilha.


    Depois da Primeira Guerra Mundial a procura caiu, nos anos 1920 surgiram novas casas de bordados e, a partir dos anos 1970, as imitações baratas tomaram o mercado. Mas o bordado continua a fazer-se na Madeira.
  en: >-
    Bella Phelps herself didn’t go to the London exhibition or show anything under her own name. But her initiative made embroidery the main source of income for the island’s women.


    After World War I demand fell, new embroidery firms appeared in the 1920s, and from the 1970s cheap imitations took over the market. But embroidery is still made on Madeira today.
  ru: >-
    Сама Белла Фелпс в Лондон на выставку не ездила и ничего от своего имени не показывала. Но с её затеи вышивка стала главным женским заработком на острове.


    После Первой мировой войны спрос упал, в 1920-х появились новые фирмы, а с 1970-х рынок забрали дешёвые подделки. Но вышивку на Мадейре делают и сегодня.
