seo:
  title:
    pt: Um mosteiro no rio · Coimbra, 1677
    en: A Convent in the River · Coimbra, 1677
    ru: Монастырь в реке · Коимбра, 1677
story:
  pt: |-
    Em 1314, a Rainha Santa Isabel refundou em Coimbra um mosteiro de clarissas, mesmo à beira do Mondego. O sítio era baixo e, logo em 1331, um ano depois da sagração da igreja, o rio inundou-a.

    As cheias repetiram-se século após século. De cada vez, o rio deixava uma camada de lodo, e o terreno à volta do mosteiro ia subindo. As freiras respondiam da mesma maneira: subiam os pisos, uma e outra vez. Por volta de 1612, o novo piso da igreja já teve de ser construído a meia altura das paredes, e passou a rezar-se por cima do andar inundado.

    Em 1677, as freiras renderam-se e mudaram-se para um novo mosteiro no monte em frente. E o lodo que as expulsou cobriu as paredes antigas e guardou-as durante quase trezentos anos.
  en: |-
    In 1314, Queen Isabel of Aragon refounded a convent of Poor Clares in Coimbra, right on the bank of the Mondego. The ground was low, and as early as 1331, a year after the church was consecrated, the river flooded it.

    The floods came back century after century. Each time the river left a layer of silt, and the ground around the convent rose. The nuns answered in kind: they raised their floors again and again. Around 1612, the newest floor in the church had to be built halfway up the walls, and from then on they prayed above the flooded lower level.

    In 1677 the nuns gave up and moved to a new convent on the hill across the river. And the silt that drove them out covered the old walls and preserved them for almost three hundred years.
  ru: |-
    В 1314 году королева Изабел Арагонская заново основала в Коимбре монастырь кларисс, прямо на берегу Мондегу. Место было низкое, и уже в 1331 году, через год после освящения церкви, река её затопила.

    Наводнения повторялись век за веком. Каждый раз река оставляла слой ила, и земля вокруг монастыря росла. Монахини отвечали тем же: снова и снова поднимали полы. Около 1612 года очередной пол в церкви пришлось строить уже на середине высоты стен, и молились теперь над затопленным нижним этажом.

    В 1677 году монахини сдались и переехали в новый монастырь на холме напротив. А ил, который их выгнал, укрыл старые стены и сохранил их почти триста лет.
more:
  pt: |-
    A Rainha Santa Isabel gostava deste mosteiro e viveu os últimos anos ao seu lado. Em 1336 foi aqui sepultada, num túmulo de pedra que mandara fazer em vida. Ao subirem para o monte, as freiras levaram o túmulo consigo, e hoje ele está no novo mosteiro, Santa Clara-a-Nova.

    O mosteiro velho ficou meio em água e lodo: de fora viam-se só o alto das paredes e as abóbadas da igreja. Foi classificado como monumento nacional em 1910, mas só depois de 1995 foi possível escavá-lo. Bombeou-se a água, tirou-se o lodo, e por baixo apareceram o piso inferior, o claustro, loiça e objetos das freiras. Desde 2009 as ruínas estão abertas, com um centro interpretativo ao lado.
  en: |-
    Queen Isabel loved this convent and spent her last years beside it. In 1336 she was buried here, in a stone tomb she had ordered in advance. When the nuns moved up the hill, they took the tomb with them, and today it stands in the new convent, Santa Clara-a-Nova.

    The old convent sat half in water and mud: only the tops of the walls and the church vaults showed. It was declared a national monument in 1910, but it couldn’t be excavated until after 1995. The water was pumped out, the silt removed, and underneath were the lower floor, the cloister, pottery, and the nuns’ belongings. The ruins have been open since 2009, with a visitor center next door.
  ru: |-
    Королева Изабел любила этот монастырь и рядом с ним провела последние годы. В 1336 году её похоронили здесь, в каменной гробнице, которую она заказала заранее. Уходя на холм, монахини забрали гробницу с собой, и теперь она стоит в новом монастыре, Санта-Клара-а-Нова.

    Старый монастырь стоял наполовину в воде и иле: наружу торчали только верх стен и своды церкви. Национальным памятником его объявили в 1910 году, но раскопать смогли только после 1995 года. Воду откачали, ил вынули, и под ним нашлись нижний пол, монастырский двор с галереями, посуда и вещи монахинь. С 2009 года руины открыты, рядом музейный центр с находками.
