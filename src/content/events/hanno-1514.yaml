hook:
  pt: Hanno, o elefante de D. Manuel, ajoelhou-se diante do papa Leão X.
  en: Manuel sent the pope an elephant. All Rome came to see him.
  ru: Папе римскому подарили слона, и слон встал перед ним на колени.
story:
  pt: "Em 1514, D. Manuel I mandou uma embaixada a Roma, com presentes para o novo papa, Leão X. O
    presente principal era um jovem elefante branco da Índia, com cerca de quatro anos. Na receção,
    o elefante ajoelhou-se diante do papa e barriu. Leão X ficou encantado e instalou o elefante no
    Vaticano. O elefante chamava-se Hanno: desfilava nas procissões, dedicavam-lhe versos e toda a
    Roma corria para o ver."
  en: "In 1514 King Manuel I sent an embassy to Rome with gifts for the new pope, Leo X. The main
    gift was a young white elephant from India, about four years old. At the audience the elephant
    knelt before the pope and trumpeted. Leo X was delighted and gave him a home in the Vatican. The
    elephant was named Hanno. He marched in festive processions, poets wrote verses about him, and
    all of Rome came running to see him."
  ru: "В 1514 году король Мануэл I отправил в Рим посольство с подарками для нового папы Льва X.
    Главным подарком был молодой белый слон из Индии, которому было около четырёх лет. На приёме
    слон преклонил колени перед папой и затрубил. Лев X был в восторге и поселил слона в Ватикане.
    Слона звали Ганнон: его водили в праздничных шествиях, ему посвящали стихи, а посмотреть на него
    сбегался весь Рим."
more:
  pt: >-
    A embaixada era chefiada pelo navegador Tristão da Cunha. O elefante entrou em Roma em março de
    1514. A revista Smithsonian reconta um episódio da receção: o elefante encheu a tromba de água e
    molhou todos os presentes, incluindo o papa, a quem a cena agradou muito.


    Hanno viveu dois anos em Roma. No verão de 1516 adoeceu, os médicos deram-lhe um purgante com
    ouro e, a 8 de junho, morreu. O papa estava junto dele. Leão X escreveu ele próprio o epitáfio,
    e Rafael pintou o elefante numa parede em sua memória; o fresco não sobreviveu. Hanno foi
    sepultado no Pátio do Belvedere, no Vaticano.


    D. Manuel quis agradar ao papa mais uma vez e mandou-lhe o mesmo rinoceronte que, em 1515,
    assustara um elefante em Lisboa. O rinoceronte nunca chegou a Roma: o navio naufragou ao largo
    de Itália.
  en: >-
    The embassy was led by the navigator Tristão da Cunha. The elephant entered Rome in March 1514.
    Smithsonian Magazine recounts a moment from the audience: the elephant filled his trunk with
    water and sprayed everyone present, including the pope, who found it all delightful.


    Hanno lived in Rome for two years. In the summer of 1516 he fell ill, his doctors gave him a
    purgative laced with gold, and he died on June 8. The pope was at his side. Leo X wrote the
    epitaph himself, and Raphael painted the elephant on a wall in his memory; the fresco has not
    survived. Hanno was buried in the Belvedere Courtyard in the Vatican.


    Manuel wanted to please the pope again and sent him the same rhinoceros that had scared an
    elephant in Lisbon in 1515. The rhino never reached Rome: the ship sank off the coast of Italy.
  ru: >-
    Посольство вёл мореплаватель Триштан да Кунья. В Рим слон вошёл в марте 1514 года. Журнал
    Smithsonian пересказывает такой эпизод приёма: слон набрал воды в хобот и окатил всех
    собравшихся, включая папу, а папе представление очень понравилось.


    Ганнон прожил в Риме два года. Летом 1516 года он заболел, врачи дали ему слабительное с
    золотом, и 8 июня он умер. Папа был рядом. Лев X сам сочинил эпитафию, а Рафаэль нарисовал слона
    на стене в память о нём; фреска не сохранилась. Ганнона похоронили во дворе Бельведере в
    Ватикане.


    Мануэл хотел порадовать папу ещё раз и отправил ему того самого носорога, который в 1515 году
    напугал слона в Лиссабоне. До Рима носорог не доплыл: корабль затонул у берегов Италии.
