hook:
  pt: Para tirar sardinha aos espanhóis, Portugal construiu uma cidade em dois anos.
  en: To grab Spain’s sardines, Portugal built a whole town in two years.
  ru: Чтобы забрать сардину у соседей-испанцев, Португалия за два года построила целый город.
story:
  pt: |-
    Em 1755, o tsunami arrasou uma aldeia de pescadores na foz do Guadiana, em frente à espanhola Ayamonte. Nas areias de Monte Gordo ficaram cabanas onde viviam e pescavam pescadores espanhóis e catalães. O pescado passava ao lado do erário português.

    O Marquês de Pombal decidiu acabar com isso e erguer na fronteira uma cidade-fábrica para o peixe. A pedra foi talhada em Lisboa e trazida por mar, e no local só se montava.

    A primeira pedra foi lançada em março de 1774, e em maio de 1776 Vila Real de Santo António já estava inaugurada. As ruas direitas, as casas brancas iguais e a praça com o obelisco repetiam o plano da nova Baixa de Lisboa.
  en: |-
    In 1755, a tsunami wiped out a fishing village at the mouth of the Guadiana River, right across from Spain’s Ayamonte. On the sands of Monte Gordo stood huts where Spanish and Catalan fishermen lived and fished. Their catch slipped past the Portuguese treasury.

    The Marquis of Pombal decided to put an end to this and build a fish factory town on the border. Its stones were cut in Lisbon and shipped by sea, so on site they only had to be assembled.

    The first stone was laid in March 1774, and by May 1776 Vila Real de Santo António was open. Its straight streets, identical white houses, and square with an obelisk copied the plan of Lisbon’s new Baixa.
  ru: |-
    В 1755 году цунами смыло рыбацкую деревню в устье Гвадианы, напротив испанского Аямонте. На песке у Монте-Гордо остались хижины, где жили и ловили рыбу испанские и каталонские рыбаки. Улов уходил мимо португальской казны.

    Маркиз де Помбал решил это прекратить и поставить на границе город-фабрику для рыбы. Камни для него обтесали в Лиссабоне и привезли морем, а на месте их только собирали.

    Первый камень заложили в марте 1774 года, а в мае 1776-го Вила-Реал-ди-Санту-Антониу уже открыли. Прямые улицы, одинаковые белые дома и площадь с обелиском повторяли план новой Байши в Лиссабоне.
