more:
  pt: |-
    A cidade não foi feita para ser bonita, mas para a pesca. Nela instalou-se a Companhia Geral das Reais Pescarias do Reino do Algarve. A sardinha era aqui salgada e enviada para o norte de Portugal, que até então comprava peixe salgado à Galiza espanhola. Os pescadores catalães resistiam aos novos impostos, e ao longo da costa travava-se uma verdadeira «guerra das pescarias».

    A frente ribeirinha foi feita para se mostrar. Vista da margem espanhola, a fila de casas iguais ao longo do rio parecia a fachada de um único palácio enorme. E o obelisco da praça foi dedicado ao rei D. José I, «restaurador do comércio e da agricultura».

    O plano não resultou logo, mas o peixe sustentou a cidade quase duzentos anos. Aqui abriu uma das primeiras fábricas de conservas de Portugal, a Ramirez. Quando no século XX a sardinha e o atum escassearam, a cidade virou-se para o turismo, e Monte Gordo tornou-se praia de férias.
  en: |-
    The town was built not for beauty but for fishing. It housed the Royal Fisheries Company of the Algarve. Sardines were salted here and shipped to northern Portugal, which until then had bought salted fish from Spanish Galicia. Catalan fishermen resisted the new taxes, and a real “fishing war” raged along the coast.

    The riverfront was designed as a showcase. Seen from the Spanish bank, the row of identical houses along the river looked like the facade of one enormous palace. And the obelisk in the square was dedicated to King José I, “restorer of commerce and agriculture.”

    The plan didn’t pay off right away, but fish fed the town for almost two hundred years. One of Portugal’s first canneries, Ramirez, opened here. When sardines and tuna grew scarce in the 20th century, the town turned to tourism, and Monte Gordo became a beach resort.
  ru: |-
    Город строили не для красоты, а для улова. В нём разместили Компанию королевских рыбных промыслов Алгарве. Сардину здесь солили и отправляли на север Португалии, который до тех пор покупал солёную рыбу у испанской Галисии. Каталонские рыбаки противились новым налогам, и вдоль берега шла настоящая «рыбная война».

    Набережную сделали витриной. С испанского берега ряд одинаковых домов вдоль реки выглядел как фасад одного огромного дворца. А обелиск на площади посвятили королю Жозе I, «восстановителю торговли и земледелия».

    Расчёт сработал не сразу, но рыба кормила город почти двести лет. Здесь открылась одна из первых консервных фабрик Португалии, «Рамиреш». Когда в XX веке сардины и тунца стало мало, город переключился на туристов, а Монте-Гордо стал курортом.
