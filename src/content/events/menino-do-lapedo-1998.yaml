hook:
  pt: "Uma criança de quatro anos dividiu os cientistas durante vinte anos."
  en: "A four-year-old from Leiria had scientists arguing for twenty years."
  ru: "Четырёхлетний ребёнок из Лейрии поссорил учёных на двадцать лет."
story:
  pt: >-
    No fim de novembro de 1998, arqueólogos foram ao vale do Lapedo, perto de Leiria, ver pinturas rupestres no Abrigo do Lagar Velho. Pouco antes, máquinas tinham revolvido a terra do abrigo, e nela apareceram ossos. Era a sepultura de uma criança com cerca de quatro anos. Fora enterrada há cerca de 28 mil anos, com cuidado: com uma concha e ocre vermelho.

    Mas o que surpreendeu os cientistas foi outra coisa. Em quase tudo era uma criança da nossa espécie, mas as pernas, robustas e com outras proporções, eram como as dos neandertais. O arqueólogo João Zilhão e os colegas propuseram que as duas espécies humanas se tinham encontrado e tido filhos em comum, e que os descendentes conservaram durante muito tempo traços de ambas.

    Esta ideia foi discutida durante anos, e a discussão ainda não terminou.
  en: >-
    In late November 1998, archaeologists went to see the rock paintings at Lagar Velho, a rock shelter in the Lapedo Valley near Leiria. Shortly before, machinery had churned up the ground there, and bones had surfaced in it. It was the grave of a child about four years old, buried about 28,000 years ago with care: with a seashell and red ocher.

    But something else surprised the scientists. In almost every way it was a child of our own species, but its legs, sturdy and differently proportioned, were like a Neanderthal’s. Archaeologist João Zilhão and his colleagues proposed that the two human species had met and had children together, and that their descendants carried traits of both for a long time.

    That idea was argued over for years, and the debate still isn’t over.
  ru: >-
    В конце ноября 1998 года археологи приехали в долину Лапеду под Лейрией посмотреть на наскальные рисунки у скального навеса Лагар-Велью. Землю под навесом незадолго до этого разворошила строительная техника, и в ней показались кости. Это было погребение ребёнка лет четырёх. Его похоронили около 28 тысяч лет назад, бережно: с ракушкой и красной охрой.

    Но удивило учёных другое. Почти во всём это был ребёнок нашего вида, а вот ноги, крепкие и с другими пропорциями, были как у неандертальцев. Археолог Жуан Зильян и его коллеги предположили, что два вида людей встречались и заводили общих детей, а потомки ещё долго несли черты обоих.

    С этой идеей спорили годами, и спор не закончен до сих пор.
more:
  pt: >-
    Em 1999, quando saiu o artigo sobre a criança do Lapedo, a ideia de que neandertais e humanos da nossa espécie tiveram filhos em comum parecia ousada. A maioria pensava que a nossa espécie simplesmente tinha substituído os neandertais. Por isso, uns cientistas viram no esqueleto sinais de mistura, e outros explicaram os seus traços pela forma como aquela criança cresceu.


    Onze anos depois, a discussão mudou de rumo. Em 2010, geneticistas leram o genoma neandertal e
    encontraram vestígios dele no ADN da maioria das pessoas que vivem hoje. Ou seja, a mistura
    aconteceu mesmo, embora não se possa prová-la pelos ossos desta criança em particular. Por isso
    a história tem a etiqueta «Em debate».


    O esqueleto está guardado no Museu Nacional de Arqueologia, em Lisboa, e em 2021 foi classificado como tesouro nacional.
  en: >-
    In 1999, when the paper on the Lapedo child came out, the idea that Neanderthals and our species had children together sounded bold. Most experts believed our species had simply replaced the Neanderthals. So some scientists saw signs of mixing in the skeleton, while others put its features down to the way this particular child grew.


    Eleven years later, the debate turned. In 2010, geneticists read the Neanderthal genome and found traces of it in the DNA of most people alive today. So mixing did happen, though it can’t be proven for this particular child from the bones alone. That’s why the story carries the “Debated” label.


    The skeleton itself is kept at the National Museum of Archaeology in Lisbon, and in 2021 it was classified as a national treasure of Portugal.
  ru: >-
    В 1999 году, когда вышла статья о ребёнке из Лапеду, мысль, что неандертальцы и люди нашего вида заводили общих детей, звучала смело. Большинство считало, что наш вид просто вытеснил неандертальцев. Поэтому одни учёные увидели в скелете следы смешения, а другие объясняли его черты тем, как рос конкретный ребёнок.


    Через одиннадцать лет спор повернулся. В 2010 году генетики прочитали геном неандертальца и нашли его следы в ДНК большинства людей, живущих сегодня. Значит, смешение действительно было, хотя доказать его именно для этого ребёнка по костям нельзя. Поэтому у истории метка «в обсуждении».


    Сам скелет хранится в Национальном археологическом музее в Лиссабоне, а в 2021 году его признали национальным сокровищем Португалии.
