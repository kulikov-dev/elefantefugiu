hook:
  pt: O rei encomendou uma capela em Roma e trouxe-a às peças.
  en: The king ordered a chapel from Rome and shipped it in pieces.
  ru: Король заказал часовню в Риме и привёз её по частям.
story:
  pt: D. João V queria uma capela que não ficasse atrás das de Roma. Em 1742 foi encomendada aos
    melhores mestres romanos, e mais de 130 pessoas trabalharam nela cinco anos, em mármore,
    lápis-lazúli, ametista e bronze dourado. Depois de pronta, a capela foi montada em Roma e
    benzida pelo papa Bento XIV, e a seguir desmontada em 174 peças. Três navios levaram-nas para
    Lisboa, onde a capela voltou a ser montada na Igreja de São Roque.
  en: John V wanted a chapel as fine as any in Rome. In 1742 it was commissioned from Rome’s best
    craftsmen, and more than 130 people spent five years making it from marble, lapis lazuli,
    amethyst, and gilded bronze. Once finished, the chapel was assembled in Rome and blessed by Pope
    Benedict XIV, then taken apart into 174 pieces. Three ships carried them to Lisbon, where the
    chapel was put back together in the Church of São Roque.
  ru: Жуан V хотел у себя часовню не хуже римских. В 1742 году её заказали лучшим мастерам Рима, и
    больше 130 человек делали её пять лет из мрамора, лазурита, аметиста и позолоченной бронзы.
    Готовую часовню собрали в Риме, папа Бенедикт XIV её благословил, а потом её разобрали на 174
    части. Три корабля привезли их в Лиссабон, где часовню собрали заново в церкви Сан-Роке.
more:
  pt: >-
    O rei nunca foi a Roma ver a sua capela. Em vez disso, os mestres fizeram-lhe uma maqueta exata
    em nogueira, com dourados e pequenas pinturas sobre cobre. Por ela o rei aprovava o projeto, e
    por ela a capela foi depois montada em Lisboa. A maqueta sobreviveu e está no museu ao lado.


    Os quadros da capela são, na verdade, mosaicos. O pintor Agostino Masucci pintou-os a óleo, e os
    mestres passaram-nos para pedra. O mosaico, ao contrário da pintura, não escurece com as velas e
    a humidade.


    Poucos anos depois da montagem veio o terramoto de 1755, mas a igreja e a capela resistiram.
  en: >-
    The king never went to Rome to see his chapel. Instead, the craftsmen made him an exact walnut
    model, with gilding and tiny paintings on copper. The king approved the design from it, and the
    chapel was later reassembled in Lisbon from it too. The model survived and is in the museum next
    door.


    The paintings in the chapel are actually mosaics. The painter Agostino Masucci painted them in
    oil, and the craftsmen translated them into stone. Unlike paint, mosaic doesn’t darken from
    candle smoke and damp.


    A few years after the chapel was assembled, the 1755 earthquake struck, but the church and the
    chapel survived.
  ru: >-
    Король так и не съездил в Рим посмотреть на свою часовню. Вместо этого мастера сделали для него
    точный макет из ореха, с позолотой и крошечными картинами на меди. По нему король одобрял
    проект, а потом по нему же часовню собирали в Лиссабоне. Макет сохранился и стоит в музее рядом.


    Картины в самой часовне на самом деле мозаики. Художник Агостино Мазуччи написал их маслом, а
    мастера перевели в камень. Мозаика, в отличие от живописи, не темнеет от свечей и сырости.


    Через несколько лет после сборки случилось землетрясение 1755 года, но церковь и часовня
    уцелели.
