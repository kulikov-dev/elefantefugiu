story:
  pt: >-
    Por volta do ano 80, os romanos abriram uma estrada pela serra, de Braga até Astorga, com mais
    de trezentos quilómetros. As gentes da terra chamam a esta estrada Geira.

    A cada milha romana, cerca de um quilómetro e meio, punha-se um marco de pedra à beira da
    estrada. Nele escrevia-se quantas milhas faltavam até à cidade e que imperador tinha construído
    ou reparado a estrada.

    Os imperadores mudavam, e cada reparação deixava um marco novo. Por isso, no bosque junto ao
    Campo do Gerês, os marcos estão em grupos, vários lado a lado, cada um com o nome de outro
    imperador.
  en: >-
    Around the year 80, the Romans built a road through the mountains from Braga to Astorga, more
    than three hundred kilometers (190 miles) long. Locals call this road the Geira.

    Every Roman mile, a little under a modern mile, a stone marker was set beside the road. It said
    how many miles were left to the city and which emperor had built or repaired the road.

    Emperors came and went, and every repair left a new milestone. That’s why, in the woods near
    Campo do Gerês, the milestones stand in clusters, several side by side, each with a different
    emperor’s name.
  ru: >-
    Около 80 года римляне провели через горы дорогу из Браги в Асторгу, это больше трёхсот
    километров. Местные называют эту дорогу Жейра.

    Каждую римскую милю, это примерно полтора километра, у дороги ставили каменный столб. На нём
    писали, сколько миль до города и какой император построил или починил дорогу.

    Императоры менялись, и после каждого ремонта у дороги появлялся новый столб. Поэтому в лесу у
    Кампу-ду-Жереш столбы стоят группами, по нескольку рядом, и на каждом имя другого императора.
more:
  pt: >-
    O marco miliário não era só uma placa de caminho. Quem passava via nele o nome do imperador e
    percebia quem mandava ali e quem cuidava da sua viagem. Era o poder gravado em granito ao longo
    de toda a estrada.


    Na Geira sobreviveram tantos marcos que é considerada uma das estradas romanas mais ricas neles.
    Ninguém os levou para outras obras, porque a estrada atravessava serras isoladas, onde não havia
    quem quisesse a pedra.


    Hoje a velha estrada faz-se a pé: parte dela é um trilho no Parque Nacional da Peneda-Gerês. Os
    marcos continuam onde foram postos, e no Campo do Gerês há um museu dedicado à estrada.
  en: >-
    A milestone wasn’t just a road sign. Travelers saw the emperor’s name and understood who was in
    charge here and who was looking after their journey. It was power carved in granite along the
    whole road.


    So many milestones survive on the Geira that it’s considered one of the Roman roads richest in
    them. No one hauled them away for other buildings, because the road ran through remote mountains
    where nobody wanted the stone.


    Today people walk the old road: part of it is a trail through Peneda-Gerês National Park. The
    milestones stand where they were placed, and Campo do Gerês has a museum about the road.
  ru: >-
    Мильный столб был не только указателем. Путник видел на нём имя императора и понимал, кто здесь
    хозяин и кто заботится о его пути. Это была власть, вырезанная в граните вдоль всей дороги.


    На Жейре таких столбов уцелело так много, что её считают одной из самых богатых ими римских
    дорог. Их не увозили на стройки, потому что дорога шла через глухие горы, где камень некому было
    брать.


    Сегодня по старой дороге ходят пешком: часть её стала тропой через национальный парк
    Пенеда-Жереш. Столбы стоят там же, где их поставили, а в Кампу-ду-Жереш открыт музей дороги.
