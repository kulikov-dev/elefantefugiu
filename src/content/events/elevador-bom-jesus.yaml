hook:
  pt: Duas cabines, um cabo e água em vez de motor.
  en: The funicular that’s run on water for 140 years.
  ru: Фуникулёр, который 140 лет работает на воде.
story:
  pt: Sobre Braga ergue-se o santuário do Bom Jesus do Monte, com uma enorme escadaria barroca. Em
    1882, a subida dos peregrinos ficou mais fácil com um funicular. As duas cabines estão ligadas
    por um só cabo. Lá em cima, o depósito da cabine de cima enche-se com quase seis mil litros de
    água, ela fica mais pesada, desce e puxa a de baixo para cima. Em baixo a água é despejada, e
    tudo se repete. O funicular continua sem motor.
  en: Above Braga stands the sanctuary of Bom Jesus do Monte, with a huge Baroque staircase. In 1882,
    a funicular made the climb easier for pilgrims. Its two cars are linked by a single cable. At
    the top, the upper car’s tank is filled with almost six thousand liters of water; it gets
    heavier, rolls down, and pulls the lower car up. At the bottom the water is drained, and it all
    starts again. The funicular still has no motor.
  ru: Над Брагой стоит святилище Бон-Жезуш-ду-Монте с огромной барочной лестницей. В 1882 году
    паломникам облегчили подъём фуникулёром. Две кабины связаны одним тросом. Наверху в бак верхней
    кабины заливают почти шесть тысяч литров воды, она тяжелеет, едет вниз и тянет нижнюю наверх.
    Внизу воду сливают, и всё повторяется. Мотора у фуникулёра нет до сих пор.
more:
  pt: >-
    É o funicular de contrapeso de água mais antigo do mundo ainda a transportar passageiros. O
    percurso tem 274 metros e sobe 116.


    Projetou-o Raoul Mesnier du Ponsard, com o engenheiro suíço Niklaus Riggenbach. Vinte anos
    depois, o mesmo Mesnier construiria em Lisboa o Elevador de Santa Justa.
  en: >-
    It’s the oldest water-counterbalanced funicular in the world still carrying passengers. The
    track is 274 meters long and climbs 116 meters.


    It was designed by Raoul Mesnier du Ponsard together with the Swiss engineer Niklaus Riggenbach.
    Twenty years later, the same Mesnier would build the Santa Justa Lift in Lisbon.
  ru: >-
    Это самый старый в мире фуникулёр на водяном противовесе, который всё ещё возит пассажиров.
    Длина пути 274 метра, подъём 116 метров.


    Спроектировал его Раул Мениер дю Понсар вместе со швейцарским инженером Никлаусом Риггенбахом.
    Через двадцать лет тот же Мениер построит в Лиссабоне лифт Санта-Жушта.
