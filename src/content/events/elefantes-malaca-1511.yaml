hook:
  pt: >-
    O sultão lançou elefantes de guerra. Viraram-se contra os seus.
  en: >-
    The sultan unleashed war elephants. They turned on his own men.
  ru: Султан вывел боевых слонов. Они развернулись против него.
story:
  pt: >-
    Quem fosse senhor de Malaca, escreveu Tomé Pires, tinha a mão na garganta de Veneza: Malaca
    controlava a rota das especiarias. A 25 de julho de 1511, Afonso de Albuquerque atacou-a com
    cerca de mil homens. O sultão respondeu com elefantes de guerra. Os portugueses receberam-nos
    com lanças. O elefante do sultão, ferido, deu meia-volta aos berros, os outros entraram em
    pânico e esmagaram os seus, e o sultão, também ferido, abandonou a montada. Um mês depois, a
    cidade era portuguesa.
  en: >-
    “Whoever is lord of Malacca has his hand on the throat of Venice,” wrote the Portuguese
    apothecary Tomé Pires, because Malacca controlled the spice route. On July 25, 1511, Afonso de
    Albuquerque attacked it with about a thousand men. The sultan answered with war elephants. The
    Portuguese met them with lances. The sultan’s elephant, wounded, turned back howling. The others
    panicked and trampled their own side, and the sultan, hurt as well, abandoned his mount. A month
    later the city was Portuguese.
  ru: >-
    «Кто владеет Малаккой, тот держит Венецию за горло», — писал португальский аптекарь Томе Пиреш,
    ведь Малакка контролировала путь пряностей. 25 июля 1511 года Афонсу де Албукерки атаковал её с
    тысячей человек. Султан ответил боевыми слонами. Португальцы встретили их копьями. Раненый слон
    султана с рёвом повернул назад, остальные в панике затоптали своих, а султан, тоже раненый,
    покинул спину слона. Через месяц город стал португальским.
more:
  pt: |-
    Os números variam: algumas fontes falam em cerca de vinte elefantes, e os defensores são
    calculados entre 20 000 e 30 000. Albuquerque contava entre 1000 e 1200 homens, uns 700 deles
    portugueses. Recuou depois do primeiro assalto, voltou a atacar em agosto e tomou a cidade ao
    fim de cerca de quarenta dias de combates.


    O monumento a Afonso de Albuquerque, em Belém, mostra a tomada de Malaca num dos seus quatro
    relevos. Muito do que se sabe das suas campanhas vem do filho, Brás, que transformou os papéis
    do pai nos Comentários e construiu em Lisboa a Casa dos Bicos com a fortuna que o pai juntara.
  en: |-
    Accounts differ: some sources mention about twenty elephants and put the defenders at 20,000 to

    30,000. Albuquerque’s force is put at between 1,000 and 1,200 men, about 700 of them Portuguese.

    He pulled back after the first assault, attacked again in August and took the city after about

    forty days of fighting.



    The monument to Albuquerque in Belém shows the taking of Malacca on one of its four reliefs.

    Much of what is known of his campaigns comes from his son Brás, who turned his father’s papers

    into the Commentaries and built Lisbon’s Casa dos Bicos with the fortune his father had amassed.
  ru: |-
    Цифры расходятся: одни источники упоминают около двадцати слонов, а защитников оценивают в 20
    000–30 000. Силы Албукерки оценивают в 1000–1200 человек, около 700 из них — португальцы. После
    первого штурма он отступил, в августе атаковал снова и взял город после примерно сорока дней
    боёв.


    Памятник Албукерки в Белене показывает взятие Малакки на одном из четырёх рельефов. Многое о его
    походах известно от сына Браша, который превратил бумаги отца в «Комментарии» и построил в
    Лиссабоне Каза-душ-Бикуш на состояние отца.
