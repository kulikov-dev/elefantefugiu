hook:
  pt: >-
    Para salvar o vinho do Porto, Pombal mandou arrancar os sabugueiros.
  en: To protect port, Pombal drew its borders in granite.
  ru: >-
    Чтобы спасти портвейн, Помбал велел вырвать бузину в долине Дору.
story:
  pt: >-
    Nos anos 1750, o comércio do vinho do Porto estava em crise: excesso de vinho, falsificações e
    um negócio dominado por comerciantes britânicos. Em 1756, Sebastião José de Carvalho e Melo, o
    futuro marquês de Pombal, criou uma companhia com o monopólio do comércio com Inglaterra e o
    Brasil, e arrancaram-se os sabugueiros. Dois anos depois foi erguido o primeiro dos 335 marcos
    de granito que delimitam a região, muitas vezes apontada como a primeira região vinhateira
    demarcada do mundo.
  en: >-
    By the 1750s the port wine trade was in crisis: too much wine, too many fakes, and most of it
    sold by British merchants in Porto. In 1756 Sebastião José de Carvalho e Melo, the future
    Marquis of Pombal, created a company with a monopoly on the trade with England and Brazil, and
    the elder trees were uprooted. Two years later the first of 335 granite pillars went up to mark
    the region’s borders, in what is often called the world’s first demarcated wine region.
  ru: >-
    К 1750-м торговля портвейном была в кризисе: вина слишком много, подделок
    слишком много, а продавали его в основном британские купцы в Порту. В 1756
    году Себастьян Жозе де Карвалью-и-Мелу, будущий маркиз Помбал, создал
    компанию с монополией на торговлю с Англией и Бразилией, и бузину вырвали.
    Через два года поставили первый из 335 гранитных столбов, отмечавших границы
    региона, который часто называют первым в мире демаркированным винным
    регионом.
more:
  pt: |-
    Nos marcos estavam gravados «Feitoria» e um ano (nos primeiros, 1758), e cerca de cem dos 335
    ainda estão de pé nas vinhas. Chamam-se marcos pombalinos.


    A companhia fundada em 1756 continua viva: hoje é a Real Companhia Velha, e as suas caves e um
    pequeno museu, o 17•56, ficam à beira do Douro, em Vila Nova de Gaia.


    Nem todos receberam bem as novas regras. Em fevereiro de 1757, os taberneiros do Porto
    revoltaram-se contra a Companhia; essa história conta-se à parte.
  en: |-
    The stones were carved with “Feitoria” and a year, the first in 1758, and about a hundred of the

    335 still stand in the vineyards. In Portuguese they are the marcos pombalinos.



    The company founded in 1756 is still in business: today it is the Real Companhia Velha, and its

    cellars and a small museum, 17•56, stand on the banks of the Douro in Vila Nova de Gaia.



    Not everyone welcomed the new rules. In February 1757 Porto’s tavern-keepers rose against the

    Company; that story has its own card.
  ru: |-
    На камнях вырезали «Feitoria» и год, первые в 1758-м, и около сотни из 335 до сих пор стоят среди виноградников. По-португальски они называются marcos pombalinos.

    Компания, основанная в 1756 году, существует до сих пор: сегодня это Real Companhia Velha, а её погреба и небольшой музей 17•56 стоят на берегу Дору в Вила-Нова-ди-Гая.

    Не все приняли новые правила. В феврале 1757 года хозяева таверн Порту восстали против Компании: эта история в отдельной карточке.
