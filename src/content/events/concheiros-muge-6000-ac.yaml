hook:
  pt: Há oito mil anos, no Tejo comeram-se tantas conchas que nasceram colinas.
  en: Eight thousand years ago, people ate so much shellfish that hills grew.
  ru: Восемь тысяч лет назад люди съели столько ракушек, что выросли холмы.
story:
  pt: |-
    Há oito mil anos, junto a Muge, o Tejo era mais largo e a água do mar entrava com a maré. Na água morna e salgada havia muitas conchas: berbigões e amêijoas.

    Aqui ainda não se semeava pão. As pessoas caçavam, pescavam e apanhavam marisco. Depois de comer, deitavam as conchas para o mesmo monte, geração após geração.

    Os montes cresceram até ficarem do tamanho de um campo de futebol e mais altos do que uma pessoa. Em cima deles construíam cabanas e acendiam fogueiras. Em 1863, o geólogo Carlos Ribeiro percebeu que aquelas colinas não eram naturais. Assim se descobriu um dos maiores acampamentos de caçadores-recoletores da Europa.
  en: |-
    Eight thousand years ago, near Muge, the Tagus was wider and seawater flowed in with the tide. The warm, salty water was full of shellfish: cockles and clams.

    People here didn’t grow grain yet. They hunted, fished, and gathered shellfish. After eating, they threw the shells onto the same heap, generation after generation.

    The heaps grew until they were as wide as a soccer field and taller than a person. People built huts and lit fires on top of them. In 1863, geologist Carlos Ribeiro realized these hills weren’t natural. That’s how one of Europe’s largest hunter-gatherer sites was found.
  ru: |-
    Восемь тысяч лет назад у деревни Муже Тежу была шире, и в неё с приливом заходила морская вода. В тёплой солёной воде было полно ракушек: сердцевидок и венерок.

    Люди здесь ещё не сеяли хлеб. Они охотились, ловили рыбу и собирали моллюсков. Раковины после еды бросали в одну кучу, и так поколение за поколением.

    Кучи росли, пока не стали холмами шириной с футбольное поле и высотой в человеческий рост и больше. На них ставили хижины и жгли костры. В 1863 году геолог Карлуш Рибейру понял, что эти холмы не природные. Так нашли одну из крупнейших стоянок охотников и собирателей в Европе.
more:
  pt: |-
    As colinas de conchas revelaram-se um arquivo. As conchas impedem a terra de ficar ácida, por isso guardaram bem os ossos de animais, de peixes e dos próprios habitantes. Os mortos eram sepultados nas próprias colinas, debaixo dos pés dos vivos. Ao lado encontram-se ossos de cães e de veados, e lâminas de sílex. Numa das colinas, o Cabeço da Amoreira, alguém fez uma camada de cerca de 80 mil seixos e pedras queimadas, e até hoje não se sabe porquê.

    Pela composição dos ossos, os investigadores descobriram o que comiam. E afinal nem todos viviam só de conchas: alguns alimentavam-se quase apenas de carne e plantas de terra firme.

    As colinas não tiveram sorte. Nos anos 1950, a camada de cima de uma delas foi arrasada para uma fábrica de descasque de arroz, e outras duas foram destruídas por completo. Desde 2011, as que restam são monumento nacional.
  en: |-
    The shell hills turned out to be an archive. Shells keep the soil from turning acidic, so bones of animals, fish, and the people themselves survived well. The dead were buried right in the hills, under the feet of the living. Next to them are dog and deer bones and flint blades. On one of the hills, Cabeço da Amoreira, people laid down a layer of about 80,000 pebbles and burned stones, and no one knows why.

    By studying the bones, researchers learned what people ate. And it turned out not everyone lived on shellfish: some ate almost nothing but meat and plants from dry land.

    The hills had bad luck. In the 1950s, the top of one was leveled for a rice-husking factory, and two others were destroyed entirely. Since 2011, the remaining ones have been a national monument.
  ru: |-
    Ракушечные холмы оказались архивом. Раковины не дают земле закиснуть, поэтому в них хорошо сохранились кости зверей, рыб и самих жителей. Своих умерших они хоронили прямо в холмах, у себя под ногами. Рядом находят кости собак и оленей, кремнёвые ножи. На одном из холмов, Кабесу-да-Амурейра, люди выложили слой из примерно 80 тысяч галек и обожжённых камней, и зачем, до сих пор не знают.

    По составу костей учёные выяснили, что ели жители. И оказалось, что не все жили одними ракушками: некоторые питались почти только мясом и растениями с суши.

    Холмам не везло. В 1950-х верхний слой одного из них срыли под фабрику для очистки риса, а два других уничтожили целиком. С 2011 года оставшиеся холмы стали национальным памятником.
