hook:
  pt: Durante cinco mil anos, ninguém reparou num enorme túmulo.
  en: For five thousand years, nobody noticed an enormous tomb.
  ru: Пять тысяч лет люди ходили мимо огромной гробницы и не замечали её.
story:
  pt: |-
    Por volta de 3500 a.C., agricultores perto de Évora decidiram construir um túmulo para os seus mortos. Ainda não conheciam o metal: tinham pedra, madeira e cordas.

    Ergueram em círculo lajes de granito com até seis metros de altura, fecharam a entrada com outra laje e ligaram a câmara a um longo corredor. Depois cobriram tudo com terra, e o túmulo passou a parecer uma colina qualquer.

    Por isso ficou tanto tempo escondido. Só em 1964 o arqueólogo Henrique Leonor Pina percebeu que a colina era obra humana. Lá dentro estava a Anta Grande do Zambujeiro, talvez a anta mais alta do mundo.
  en: |-
    Around 3500 BC, farmers near Évora decided to build a tomb for their dead. They had no metal yet, only stone, wood, and rope.

    They set up granite slabs up to 20 feet (six meters) tall in a circle, closed the entrance with another slab, and built a long corridor leading to the chamber. Then they covered everything with earth, and the tomb became an ordinary-looking hill.

    That’s why it stayed hidden for so long. Only in 1964 did archaeologist Henrique Leonor Pina realize the hill was man-made. Inside was the Great Dolmen of Zambujeiro, possibly the tallest dolmen in the world.
  ru: |-
    Около 3500 лет до нашей эры земледельцы под Эворой решили построить гробницу для своих умерших. Металла у них ещё не было, только камень, дерево и верёвки.

    Они поставили по кругу гранитные плиты высотой до шести метров, закрыли вход ещё одной плитой и подвели к камере длинный коридор. Потом всё засыпали землёй, и гробница превратилась в обычный на вид холм.

    Поэтому её так долго не замечали. Только в 1964 году археолог Энрике Леонор Пина понял, что холм рукотворный. Внутри оказался дольмен Замбужейру, возможно, самый высокий дольмен в мире.
more:
  pt: |-
    Quem a construiu? Uns mil e quinhentos anos antes, nos arredores de Évora, surgiram as primeiras pessoas que deixaram de andar atrás da caça e se fixaram num lugar. Criavam gado e semeavam cereais. O cajado do pastor chegou a ser gravado nos menires, as pedras erguidas. A sua maior aldeia ficava no Alto de São Bento, de onde mais tarde nasceria Évora.

    Quem se fixa precisa de terra sua, e, segundo uma hipótese, os túmulos dos antepassados marcavam a quem ela pertencia. Neles não se sepultava um só chefe, mas muitas gerações da comunidade. Só nos arredores de Évora se conhecem cerca de 800 antas.

    O Zambujeiro estava entre as maiores. Para os mortos traziam-se pontas de seta de sílex vindo de longe: a pedra era transportada de propósito para o enterro.
  en: |-
    Who built it? About fifteen hundred years earlier, the first people around Évora stopped following game and settled in one place. They herded animals and sowed grain. They even carved the shepherd’s crook on menhirs, the standing stones. Their largest village stood on the hill of Alto de São Bento, where Évora would later grow.

    Settled people need land of their own, and, according to one hypothesis, ancestral tombs marked whose land it was. These weren’t graves for a single chief but for many generations of a community. Around Évora alone, about 800 dolmens are known.

    Zambujeiro was among the largest. Arrowheads made of flint brought from far away were placed with the dead: the stone was carried there specially for burials.
  ru: |-
    Кто его строил? Примерно за полторы тысячи лет до этого в окрестностях Эворы появились первые люди, которые не кочевали за дичью, а осели на одном месте. Они пасли скот и сеяли зерно. Посох пастуха даже вырезали на менгирах, стоячих камнях. Их самая большая деревня стояла на холме Алту-ди-Сан-Бенту, там, откуда потом выросла Эвора.

    Осевшим людям нужна была своя земля, и, по одной из гипотез, гробницы предков отмечали, чья она. Хоронили в них не одного вождя, а много поколений общины. В одной только округе Эворы известно около 800 дольменов.

    Замбужейру был среди самых больших. Для умерших сюда приносили наконечники стрел из кремня, привезённого издалека: значит, ради погребения камень везли специально.
