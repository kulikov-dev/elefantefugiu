  answer:
    pt: Caio Apuleio Diocles nasceu na Lusitânia, venceu 1462 corridas e ganhou quase 36 milhões de sestércios.
    en: Gaius Appuleius Diocles was born in Lusitania, won 1,462 races, and earned almost 36 million sesterces.
    ru: Гай Аппулей Диокл родился в Лузитании, выиграл 1462 заезда и заработал почти 36 миллионов сестерциев.
