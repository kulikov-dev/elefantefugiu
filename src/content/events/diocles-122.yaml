hook:
  pt: Um auriga da Lusitânia ganhou quase 36 milhões de sestércios.
  en: A charioteer from Lusitania earned almost 36 million sesterces racing in Rome.
  ru: Возничий из Лузитании заработал на гонках почти 36 миллионов сестерциев.
story:
  pt: |-
    Caio Apuleio Diocles nasceu em 104 na Lusitânia, a província romana onde hoje fica Portugal. Aos 18 anos chegou a Roma e tornou-se auriga nas corridas de carros, o maior espetáculo da cidade.

    As corridas eram organizadas por equipas, cada uma com uma cor. Diocles começou nos Brancos, passou para os Verdes e, nos últimos 15 anos, correu pelos Vermelhos. Ao todo esteve 24 anos na arena e, em 4257 corridas de quadrigas, carros puxados por quatro cavalos, venceu 1462.

    Ganhou com isso quase 36 milhões de sestércios, uma fortuna mesmo para Roma. Sabemo-lo porque em Roma foi erguida uma inscrição com todas as suas vitórias. Aos 42 anos, Diocles deixou a arena e foi viver para Preneste, perto de Roma.
  en: |-
    Gaius Appuleius Diocles was born in AD 104 in Lusitania, the Roman province where Portugal is today. At 18 he came to Rome and became a charioteer in the chariot races, the city’s biggest show.

    Races were run by teams, each named after a color. Diocles started with the Whites, moved to the Greens, and spent his last 15 years with the Reds. In all, he raced for 24 years, and out of 4,257 races in quadrigas, chariots pulled by four horses, he won 1,462.

    He earned almost 36 million sesterces, a fortune even by Roman standards. We know this because an inscription listing all his victories was set up in Rome. At 42, Diocles retired and went to live in Praeneste, near Rome.
  ru: |-
    Гай Аппулей Диокл родился в 104 году в Лузитании, римской провинции на месте нынешней Португалии. В 18 лет он приехал в Рим и стал возничим в колесничных гонках, главном зрелище города.

    Гонки устраивали команды, и каждая называлась по цвету. Диокл начинал у Белых, потом перешёл к Зелёным, а последние 15 лет выступал за Красных. Всего он выходил на арену 24 года и из 4257 заездов на квадригах, колесницах с четвёркой лошадей, выиграл 1462.

    За это он получил почти 36 миллионов сестерциев, огромные даже для Рима деньги. Мы знаем это потому, что в Риме поставили надпись со всеми его победами. В 42 года Диокл ушёл с арены и уехал жить в Пренесте под Римом.
