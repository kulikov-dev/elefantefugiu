more:
  pt: |-
    A inscrição parece uma folha de estatísticas desportivas. Conta quantas vezes Diocles saiu à frente e segurou o primeiro lugar (815) e quantas vezes esperou atrás e ultrapassou todos na última volta. Os aurigas eram estrelas, como hoje os futebolistas, e mudavam de equipa. Nos Verdes, Diocles parece não ter tido sorte: ganhou pouco e passou para os Vermelhos, onde correu mais tempo.

    Na terra natal de Diocles também se gostava de corridas. A cidade romana de Miróbriga, no sul do atual Portugal, tinha o seu hipódromo, o único hipódromo romano conhecido em Portugal. Não se sabe se o próprio Diocles lá correu, mas era assim uma arena onde podiam começar os aurigas da Lusitânia.
  en: |-
    The inscription reads like a sports stats sheet. It counts how many times Diocles took the lead from the start and held it (815) and how many times he waited behind and passed everyone on the final lap. Charioteers were stars, like soccer players today, and they switched teams. With the Greens, Diocles seems to have had bad luck: he won little and moved to the Reds, where he raced the longest.

    People in Diocles’ home province loved racing too. The Roman town of Miróbriga, in what is now southern Portugal, had its own hippodrome, the only Roman hippodrome known in Portugal. No one knows if Diocles himself raced there, but it shows what an arena looked like where Lusitanian charioteers might have started out.
  ru: |-
    Надпись похожа на спортивную статистику. В ней посчитано, сколько раз Диокл ушёл вперёд со старта и удержал первое место (815 раз), а сколько раз выжидал позади и обходил всех на последнем круге. Возничие тогда были звёздами, как сегодня футболисты, и переходили из команды в команду. У Зелёных Диоклу, похоже, не повезло: побед там было мало, и он ушёл к Красным, где выступал дольше всего.

    На родине Диокла тоже любили гонки. В римском городе Миробрига, на юге нынешней Португалии, был свой ипподром, и это единственный римский ипподром, известный в Португалии. Ездил ли там сам Диокл, неизвестно, но так выглядела арена, на которой могли начинать возничие из Лузитании.
