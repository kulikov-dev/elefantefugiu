hook:
  pt: Em Mafra, os livros antigos são guardados à noite por morcegos.
  en: The night shift at Mafra’s great library has wings.
  ru: Старые книги в Мафре по ночам охраняют летучие мыши.
story:
  pt: "A biblioteca do Palácio de Mafra, a noroeste de Lisboa, tem cerca de 36 mil volumes em
    estantes de madeira até ao teto. De dia está silenciosa e vazia. Mas à noite, de trás das
    estantes, saem pequenos morcegos que caçam os insetos que roem o papel e as encadernações de
    couro. Diz-se que sempre foi assim, mas ninguém sabe quando os morcegos se instalaram na
    biblioteca."
  en: "Northwest of Lisbon, the palace-convent of Mafra holds a library of about 36,000 volumes on
    wooden shelves that reach the ceiling. By day it is quiet and empty. But at night small bats fly
    out from behind the shelves and hunt the insects that eat paper and leather bindings. Some say
    the bats have always been there, but nobody knows when they moved in."
  ru: "Во дворце-монастыре Мафры, к северо-западу от Лиссабона, есть огромная библиотека: около 36
    тысяч томов на деревянных полках до самого потолка. Днём здесь тихо и пусто. А ночью из-за полок
    вылетают маленькие летучие мыши и охотятся на насекомых, которые точат бумагу и кожаные
    переплёты. Говорят, так было всегда, но когда мыши поселились в библиотеке, не знает никто."
more:
  pt: >-
    O palácio foi concebido por D. João V em 1711. A biblioteca foi decorada já na segunda metade do
    século, pelo arquiteto Manuel Caetano de Sousa (1742–1802). Os livros vão do século XIV ao XIX:
    primeiras edições, bíblias antigas, atlas.


    Também há morcegos noutra biblioteca, a Joanina, em Coimbra. Lá, à noite, cobrem as mesas
    com couro para que os morcegos não as sujem.


    A etiqueta «Em debate» está aqui porque os morcegos existem mesmo, mas desde quando estão na
    biblioteca e quanto ajudam os livros, ninguém mediu.


    O Palácio de Mafra é Património Mundial da UNESCO desde 2019.
  en: >-
    King John V conceived the palace in 1711. The architect Manuel Caetano de Sousa (1742–1802)
    fitted out the library in the second half of the century. The books date from the 14th to the
    19th century: first editions, old Bibles, atlases.


    Bats also live in another library, the Joanina in Coimbra. There, the tables are covered
    with leather at night to protect them from bat droppings.


    The “Debated” label is here because the bats are real, but no one has measured how long they
    have lived in the library or how much they actually help the books.


    The Palace of Mafra has been a UNESCO World Heritage Site since 2019.
  ru: >-
    Дворец задумал король Жуан V в 1711 году. Библиотеку отделал архитектор Мануэл Каэтану де Соуза
    (1742–1802), то есть уже во второй половине века. В библиотеке собраны книги XIV–XIX веков:
    первые издания, старинные Библии, атласы.


    Летучие мыши живут и в другой библиотеке, Жуанине в Коимбре. Там на ночь столы
    накрывают кожей, чтобы мыши их не запачкали.


    Метка «в обсуждении» стоит потому, что мыши в библиотеке есть, а вот с каких пор и сколько от них
    пользы книгам, никто не измерял.


    Дворец Мафры с 2019 года входит в список Всемирного наследия ЮНЕСКО.
