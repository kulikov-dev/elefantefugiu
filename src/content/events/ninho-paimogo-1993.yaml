more:
  pt: >-
    Só em 2024 se explicou porque é que as crias ficaram nos ovos. Investigadores espanhóis e portugueses estudaram o ninho durante quatro anos e concluíram que os ovos foram postos por pelo menos duas fêmeas. Depois veio uma cheia: a água arrastou os ovos, amontoou-os e cobriu-os de lodo. As crias não nasceram, mas foi esse lodo que lhes conservou os ossos.


    O mesmo estudo deu pistas sobre a forma como estes predadores faziam os ninhos. Ao que parece, não punham os ovos num buraco, mas num monte de terra, como fazem hoje algumas aves.


    O ninho de Paimogo continua no Museu da Lourinhã, que os Mateus começaram com um punhado de achados. Hoje o museu guarda os exemplares a partir dos quais foram descritas novas espécies, entre elas a Miragaia.
  en: >-
    Why the babies stayed in their eggs was only explained in 2024. Spanish and Portuguese researchers studied the nest for four years and found that at least two females had laid the eggs. Then a flood came: the water shifted the eggs, piled them up, and buried them in mud. The babies never hatched, but the mud is what preserved their bones.


    The same study hinted at how these predators built their nests. It seems they laid their eggs not in a hole but in a mound of earth, as some birds do today.


    The Paimogo nest is still at the Lourinhã Museum, which the Mateuses started with a handful of finds. Today it holds the specimens that new species were described from, Miragaia among them.
  ru: >-
    Почему детёныши остались в яйцах, объяснили только в 2024 году. Испанские и португальские учёные четыре года изучали гнездо и выяснили, что яйца отложили как минимум две самки. Потом на берег пришёл паводок: вода сдвинула яйца, сгрудила их в кучу и засыпала илом. Детёныши не вылупились, но именно ил сохранил их кости.


    Та же работа подсказала, как эти хищники устраивали гнёзда. Похоже, яйца они клали не в ямку, а в насыпанную горку земли, как сейчас делают некоторые птицы.


    Гнездо из Паймогу и сегодня лежит в музее Лоуриньяна, который Матеуши когда-то начинали с нескольких находок. Теперь там хранятся образцы, по которым описаны новые виды, и среди них Мирагайя.
