hook:
  pt: "Uma cheia destruiu um ninho de dinossauro e guardou-o para nós."
  en: "A flood destroyed a dinosaur nest and saved it for us."
  ru: "Паводок погубил гнездо динозавра и сохранил его для нас."
story:
  pt: >-
    Em 1984, Isabel e Horácio Mateus fundaram com amigos um pequeno museu na Lourinhã e começaram a recolher fósseis na costa da região. Procuraram com persistência e, em 1993, numa arriba sobre a praia de Paimogo, repararam em fragmentos de casca na rocha.

    Havia muita casca porque era um ninho inteiro: cerca de uma centena de ovos de um dinossauro carnívoro, provavelmente o Lourinhanosaurus. E em alguns ovos conservaram-se ossinhos minúsculos de crias que nunca chegaram a nascer.

    Ovos de dinossauro encontram-se com alguma frequência, mas embriões lá dentro quase nunca: os seus ossos frágeis raramente se conservam. Por isso o pequeno museu ficou conhecido entre paleontólogos de todo o mundo, e a Lourinhã passou a ser chamada a capital dos dinossauros portugueses.
  en: >-
    In 1984, Isabel and Horácio Mateus and a group of friends founded a small museum in Lourinhã and began collecting fossils along the local coast. They kept searching, and in 1993, in a cliff above Paimogo beach, they spotted bits of eggshell in the rock.

    There was a lot of shell because it was a whole nest: about a hundred eggs of a meat-eating dinosaur, most likely Lourinhanosaurus. And inside some of the eggs were the tiny bones of babies that never hatched.

    Dinosaur eggs turn up fairly often, but embryos inside them almost never do: their fragile bones rarely survive. So paleontologists around the world heard about the little museum, and Lourinhã came to be called Portugal’s dinosaur capital.
  ru: >-
    В 1984 году Изабел и Орасиу Матеуш вместе с друзьями основали в Лоуриньяне маленький музей и стали собирать окаменелости на здешнем побережье. Искали они упорно, и в 1993 году в обрыве над пляжем Паймогу заметили в камне обломки скорлупы.

    Скорлупы было много, потому что это было целое гнездо: около сотни яиц хищного динозавра, скорее всего лоуриньянозавра. А в некоторых яйцах сохранились крошечные косточки детёнышей, которые так и не вылупились.

    Яйца динозавров находят нередко, а зародыши в них почти никогда: их хрупкие кости обычно не сохраняются. Поэтому о маленьком музее узнали палеонтологи всего мира, а Лоуриньян стали называть столицей португальских динозавров.
