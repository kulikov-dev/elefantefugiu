hook:
  pt: Os últimos espanhóis só saíram de Portugal em 1642.
  en: The last Spaniards didn’t leave Portugal until 1642.
  ru: Последние испанцы ушли из Португалии только в 1642 году.
story:
  pt: |-
    Quando em 1580 Portugal passou para o rei de Espanha, a ilha Terceira foi a que resistiu mais tempo. Por isso os espanhóis construíram no Monte Brasil, sobre Angra, uma enorme fortaleza e deram-lhe o nome do rei, São Filipe. Devia manter em obediência a própria ilha.

    A 1 de dezembro de 1640, em Lisboa, aclamou-se um rei português, D. João IV. A notícia chegou à Terceira e os moradores revoltaram-se. Mas a guarnição espanhola fechou-se na fortaleza, e a partir de 27 de março de 1641 foi preciso cercá-la.

    A fortaleza fora feita para uma longa defesa, e o cerco durou onze meses. Só a 4 de março de 1642 os espanhóis se renderam. Deixaram-nos sair com honra, com as armas pessoais e duas peças de artilharia.
  en: |-
    When Portugal passed to the Spanish king in 1580, the island of Terceira held out the longest. So the Spanish built a huge fortress on Monte Brasil above Angra and named it São Filipe, after the king. It was meant to keep the island itself in line.

    On December 1, 1640, Lisbon proclaimed a king of its own, John IV. When the news reached Terceira, the islanders rose up. But the Spanish garrison shut itself inside the fortress, and from March 27, 1641, it had to be besieged.

    The fortress was built to hold out for a long time, and the siege dragged on for eleven months. The Spanish only surrendered on March 4, 1642. They were allowed to march out with honor, with their personal weapons and two cannons.
  ru: |-
    Когда в 1580 году Португалия перешла к испанскому королю, остров Терсейра сопротивлялся дольше всех. Поэтому испанцы построили на горе Монте-Бразил над Ангрой огромную крепость и назвали её в честь короля Сан-Фелипе. Она должна была держать в повиновении сам остров.

    1 декабря 1640 года в Лиссабоне провозгласили своего короля, Жуана IV. Весть дошла до Терсейры, и жители восстали. Но испанский гарнизон заперся в крепости, и с 27 марта 1641 года её пришлось осаждать.

    Крепость была рассчитана на долгую оборону, и осада тянулась одиннадцать месяцев. Только 4 марта 1642 года испанцы сдались. Им позволили уйти с честью, с личным оружием и двумя пушками.
more:
  pt: |-
    Na fortaleza os espanhóis deixaram 138 peças de artilharia, quase quatrocentos arcabuzes e quatrocentos mosquetes. A fortaleza passou a ser de São João Baptista, em honra do padroeiro do novo rei D. João, e nesse mesmo ano de 1642 construiu-se lá dentro a igreja de São João Baptista.

    Os soldados ficaram, só que agora portugueses: a fortaleza ainda pertence ao exército. As muralhas estendem-se por vários quilómetros na encosta do Monte Brasil, e delas vê-se toda a baía de Angra. A fortaleza construída para manter a ilha em obediência hoje protege-a.
  en: |-
    The Spanish left behind 138 cannons, nearly four hundred arquebuses, and four hundred muskets. The fortress was renamed for John the Baptist, patron saint of the new King John, and that same year, 1642, the church of São João Baptista was built inside.

    Soldiers stayed on, only now they were Portuguese: the fortress still belongs to the army. Its walls run for several kilometers along the slope of Monte Brasil, with a view over the whole bay of Angra. The fortress built to keep the island in line now guards it.
  ru: |-
    В крепости испанцы оставили 138 пушек, почти четыреста аркебуз и четыреста мушкетов. Крепость переименовали в честь Иоанна Крестителя, небесного покровителя нового короля Жуана, и в том же 1642 году внутри построили церковь Сан-Жуан-Баптишта.

    Солдаты в ней так и остались, только португальские: крепость до сих пор принадлежит армии. Её стены тянутся по склону Монте-Бразил на несколько километров, и с них видно всю бухту Ангры. Крепость, которую строили, чтобы держать остров в повиновении, теперь его охраняет.
