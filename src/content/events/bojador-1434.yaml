hook:
  pt: Doze anos a temer um cabo. Gil Eanes trouxe de lá flores.
  en: For twelve years sailors feared one cape. Gil Eanes brought back flowers.
  ru: Двенадцать лет моряки боялись одного мыса. Жил Эанеш привёз оттуда цветы.
story:
  pt: O cabo Bojador, na costa do Sara Ocidental, era tido como um lugar de onde não se voltava.
    Dizia-se que para lá dele não havia gente, o mar era raso e as correntes não deixavam o navio
    regressar. O Infante D. Henrique mandou lá navio após navio, e todos voltaram para trás. Em 1433
    voltou também Gil Eanes, de Lagos. O Infante enviou-o de novo e, em 1434, ele passou. Como
    prova, trouxe ao Infante plantas a que chamavam «rosas de Santa Maria».
  en: Cape Bojador, on the coast of Western Sahara, was thought to be a place of no return. People
    said that beyond it there were no people, the sea was shallow and the currents would never let a
    ship come back. Prince Henry sent ship after ship, and every one turned back. In 1433 Gil Eanes
    of Lagos turned back too. The prince sent him again, and in 1434 he got through. As proof, he
    brought the prince plants the Portuguese called "Saint Mary's roses".
  ru: Мыс Божадор на берегу Западной Сахары считали краем, откуда не возвращаются. Говорили, что за
    ним нет людей, море мелкое, а течения не отпустят корабль назад. Инфант Энрике годами посылал
    туда корабли, и все поворачивали. В 1433 году повернул и Жил Эанеш из Лагуша. Инфант отправил
    его снова, и в 1434 году он прошёл. Людей на берегу не было, и в доказательство Жил Эанеш привёз
    инфанту растения, которые в Португалии звали «розами Святой Марии».
more:
  pt: >-
    Sabemos tudo isto pela crónica de Gomes Eanes de Zurara, escrita por volta de 1453. Zurara
    enumera os medos dos marinheiros: para lá do cabo não há gente nem povoações, a terra é como um
    deserto, e o mar é tão baixo e as correntes tão fortes que o navio não volta. É também ele quem
    escreve que o Infante mandou navios ao Bojador durante doze anos.


    Que plantas eram essas, não se sabe ao certo.


    O cabo verdadeiro não era tão terrível. Diz-se que Gil Eanes se afastou para o mar alto e
    contornou os baixios. No ano seguinte voltou lá com Afonso Gonçalves Baldaia, e foram ainda mais
    para sul.
  en: >-
    We know all this from the chronicle of Gomes Eanes de Zurara, written around 1453. Zurara lists
    the sailors' fears: beyond the cape there are no people or villages, the land is like a desert,
    and the sea is so shallow and the currents so strong that a ship cannot return. He is also the
    one who writes that the prince sent ships to Bojador for twelve years.


    What those plants were is not known for certain.


    The real cape turned out to be less terrible. Gil Eanes is said to have simply headed further
    out to sea and gone round the shoals. A year later he went back with Afonso Gonçalves Baldaia,
    and they sailed further south still.
  ru: >-
    Всё это мы знаем из хроники Гомеша Эанеша де Зурары, написанной около 1453 года. Зурара
    перечисляет страхи моряков: за мысом нет ни людей, ни селений, земля как пустыня, а море такое
    мелкое и течения такие сильные, что корабль не вернётся. Он же пишет, что инфант двенадцать лет
    посылал корабли к Божадору.


    Что это были за растения, точно неизвестно.


    Настоящий мыс оказался не таким страшным. Говорят, Эанеш просто ушёл подальше в открытое море и
    обогнул мели. Через год он вернулся туда с Афонсу Гонсалвешем Балдайей, и они прошли ещё дальше
    на юг.
