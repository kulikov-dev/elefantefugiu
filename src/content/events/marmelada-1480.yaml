more:
  pt: >-
    Depois surgiu uma bela lenda: a marmelada teria servido para tratar Maria Stuart doente, e os cortesãos sussurravam «Marie malade», «Maria está doente». Mas Maria nasceu em 1542, sessenta anos depois da carta de Exeter, por isso a palavra é muito mais antiga do que ela.


    Em Portugal, a marmelada continuou a ser de marmelo e come-se com queijo. Há muitas receitas, e as melhores guardavam-nas os conventos: as freiras faziam doces para vender e para oferecer. Ficou especialmente famosa a marmelada branca de Odivelas, clara e quase transparente. Segundo a tradição, foi criada pelas freiras do mosteiro onde está sepultado D. Dinis.


    Assim, a mesma palavra vive de maneira diferente em dois países: um inglês que peça «marmalade» recebe laranja, e um português que peça marmelada recebe marmelo.
  en: >-
    Then came a charming legend: marmalade was supposedly used to nurse a sick Mary, Queen of Scots, while her courtiers whispered “Marie malade,” “Mary is ill.” But Mary was born in 1542, sixty years after the Exeter letter, so the word is much older than she was.


    In Portugal, marmelada stayed a quince paste, and people eat it with cheese. There are many recipes, and the best were kept by convents: nuns made sweets to sell and to give as gifts. Especially famous is the white marmelada of Odivelas, pale and nearly translucent. According to tradition, it was created by the nuns of the monastery where King Dinis is buried.


    So the same word lives two different lives: ask for marmalade in England and you get oranges; ask for marmelada in Portugal and you get quince.
  ru: >-
    Потом появилась красивая легенда: будто мармеладом лечили больную Марию Стюарт, а придворные шептали «Marie malade», «Мария больна». Но Мария родилась в 1542 году, через шестьдесят лет после письма из Эксетера, так что слово появилось задолго до неё.


    В самой Португалии marmelada так и осталась айвовой пастой, её едят с сыром. Рецептов много, и лучшие хранили монастыри: монахини варили сладости на продажу и в подарок. Особенно знаменита белая мармелада из Одивелаша, светлая и почти прозрачная. По преданию, её придумали монахини монастыря, где похоронен король Диниш.


    Так одно слово живёт в двух странах по-разному: англичанин, попросив marmalade, получит апельсины, а португалец, попросив marmelada, получит айву.
myth:
  verdict: myth
  statement:
    pt: A palavra inglesa «marmalade» nasceu de Maria Stuart doente
    en: The word marmalade comes from a sick Mary, Queen of Scots
    ru: Слово marmalade появилось из-за больной Марии Стюарт
  answer:
    pt: A palavra já aparece em Inglaterra em 1480, muito antes de Maria nascer. Vem do português «marmelada», a pasta de marmelo.
    en: The word was recorded in England by 1480, long before Mary was born. It comes from the Portuguese “marmelada,” a quince paste.
    ru: Слово записано в Англии уже в 1480 году, задолго до рождения Марии. Оно от португальского marmelada, пасты из айвы.
