story:
  pt: >-
    O marmelo cozia-se muito tempo com açúcar até dar uma pasta tão firme que se cortava à faca. Era a marmelada. Portugal tinha açúcar próprio, da Madeira, e a pasta conservava-se bem, por isso começou a vender-se para além-mar.


    Em Inglaterra, a marmelada portuguesa era um doce caro, transportado em pequenas caixas. O registo inglês mais antigo é uma carta de um mercador de Exeter de 1480.


    Mais tarde, ingleses e escoceses passaram a fazer em casa um doce igualmente espesso, mas de laranja amarga. O nome passou para a nova receita, e a «marmalade» ficou de laranja.
  en: >-
    In Portuguese, a quince is a “marmelo.” Its flesh was simmered with sugar for hours until it became a paste so firm you cut it with a knife. That was “marmelada.” Portugal had its own sugar from Madeira, and the paste kept well, so it began to be sold overseas.


    In England, Portuguese marmelada was an expensive treat, shipped in small boxes. The earliest English record of it is a letter from an Exeter merchant in 1480.


    Later, the English and the Scots began making a similarly thick preserve at home, but from bitter oranges. The name moved over to the new recipe, and marmalade became an orange thing.
  ru: >-
    Айва по-португальски marmelo. Её мякоть долго варили с сахаром, пока не получалась паста, такая плотная, что её резали ножом. Это и была marmelada. Сахар у Португалии был свой, с Мадейры, а паста хорошо хранилась, поэтому её стали продавать за море.


    В Англии португальская marmelada была дорогим лакомством, её возили в небольших коробках. Самая ранняя английская запись о ней — письмо купца из Эксетера 1480 года.


    Позже англичане и шотландцы стали варить такое же густое варенье сами, но из горьких апельсинов. Имя переехало на новый рецепт, и marmalade стал апельсиновым.
