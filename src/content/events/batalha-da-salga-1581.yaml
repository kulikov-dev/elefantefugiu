hook:
  pt: Na Terceira, um desembarque espanhol foi travado por uma manada de touros.
  en: On Terceira, a herd of bulls drove off a Spanish landing.
  ru: На Терсейре испанский десант отбили стадом быков.
story:
  pt: "Em 1580, Portugal passou para o rei espanhol Filipe II, mas a ilha Terceira, nos Açores, não o
    reconheceu. A 25 de julho de 1581, os espanhóis desembarcaram na baía da Salga. Os ilhéus
    recuavam, e então frei Pedro propôs um plano: lançar touros contra o inimigo. Centenas de
    animais, entre gritos, pauladas e tiros, avançaram contra as fileiras espanholas. As fileiras
    desfizeram-se, os ilhéus atacaram logo atrás, e os espanhóis fugiram para os barcos."
  en: "In 1580 Portugal passed to the Spanish king Philip II, but the island of Terceira in the Azores
    refused to recognize him. On July 25, 1581, the Spanish landed in Salga Bay. The islanders were
    falling back, and that’s when a friar named Pedro came up with a plan: send bulls at the enemy.
    Hundreds of animals, driven by shouts, sticks, and gunfire, charged into the Spanish lines. The
    lines broke, the islanders attacked right behind them, and the landing force ran for its boats."
  ru: "В 1580 году Португалия досталась испанскому королю Филиппу II, но остров Терсейра на Азорах его
    не признал. 25 июля 1581 года испанцы высадились в бухте Салга. Островитяне отступали, и тогда
    монах Педро предложил план: пустить на врага быков. Сотни животных под крики, удары палками и
    выстрелы рванули на испанский строй. Строй рассыпался, островитяне ударили следом, и десант
    бежал к лодкам."
more:
  pt: >-
    Conta-se que um dos espanhóis ainda gritou: «Vien con ganado, gañados somos!» Em espanhol é um
    trocadilho: «ganado» quer dizer «gado», e «gañados» soa a «estamos perdidos». Pode dizer-se que
    fugiram ao som do próprio trocadilho.


    A ilha não lutou só com touros. Segundo a tradição, Brianda Pereira, cuja casa os espanhóis
    queimaram no desembarque, juntou as mulheres das aldeias vizinhas, e elas foram à luta ao lado
    dos homens. O seu nome está em ruas e escolas da Terceira.


    A vitória deu à ilha mais dois anos de liberdade: os espanhóis só tomaram a Terceira em 1583. E
    os touros continuam a ser queridos: no verão leva-se um touro preso por uma corda comprida pelas
    ruas das aldeias, é a tourada à corda.
  en: >-
    It’s said that one of the Spaniards managed to shout, “Vien con ganado, gañados somos!” In
    Spanish it’s a pun: “ganado” means “cattle,” and “gañados” sounds like “we’re done for.” So you
    could say they fled to the sound of their own pun.


    The island didn’t fight with bulls alone. According to legend, Brianda Pereira, whose house the
    Spanish burned when they landed, gathered the women of the nearby villages, and they went into
    battle alongside the men. Streets and schools on Terceira are named after her.


    The victory bought the island two more years of freedom: the Spanish didn’t take Terceira until
    1583. And people here still love their bulls: in summer, a bull on a long rope is led through
    the village streets, a tradition called tourada à corda.
  ru: >-
    Говорят, один из испанцев успел крикнуть: «Vien con ganado, gañados somos!» По-испански это игра
    слов: «ganado» значит «скот», а «gañados» звучит как «нам конец». Так что бежали они, можно
    сказать, под собственный каламбур.


    Остров воевал не только быками. По преданию, Брианда Перейра, чей дом испанцы сожгли при
    высадке, собрала женщин из окрестных деревень, и они пошли в бой вместе с мужчинами. Её имя
    носят улицы и школы Терсейры.


    Победа подарила острову ещё два года свободы: испанцы взяли Терсейру только в 1583 году. Летом по улицам деревень водят быка на длинной верёвке: это «турада а корда».
