hook:
  pt: Milhares fugiram por uma ponte de barcos. A ponte cedeu.
  en: Thousands fled over a bridge made of boats. It gave way.
  ru: Тысячи бежали по мосту из лодок. Он не выдержал.
story:
  pt: >-
    Em março de 1809, as tropas francesas do marechal Soult tomaram o Porto. Em
    pânico, os moradores fugiram para Gaia pela Ponte das Barcas, uma ponte
    flutuante de barcaças construída em 1806. Perseguida pelos soldados, a
    multidão apinhou-se nas tábuas até a ponte ceder. As estimativas dos mortos
    vão de algumas centenas a mais de 4000.
  en: >-
    On March 29, 1809, French troops under Marshal Soult took Porto, and the city’s escape route
    turned into a trap. In a panic, residents fled toward Gaia over the Ponte das Barcas, a floating
    bridge of boats built in 1806. Chased by soldiers, the crowd packed onto the planks until the
    bridge gave way. Estimates of the dead run from several hundred to over 4,000.
  ru: >-
    В марте 1809 года французские войска маршала Сульта взяли Порту. В панике жители бросились в
    сторону Гайи по мосту Понте-даш-Баркаш, плавучему мосту из лодок, построенному в 1806 году.
    Преследуемая солдатами толпа сгрудилась на настиле, пока мост не рухнул. Оценки числа погибших
    колеблются от нескольких сотен до более чем 4000.
more:
  pt: |-
    A Ponte das Barcas tinha vinte barcaças ligadas por cabos e cobertas de pranchas. No Porto, é simplesmente «o Desastre».

    O memorial na Ribeira, as Alminhas da Ponte, tem desde 1897 um baixo-relevo em bronze do escultor José Joaquim Teixeira Lopes, e há sempre velas acesas. A Igreja de São José das Taipas também serve de memorial, e todos os anos, a 29 de março, diz-se missa pelas vítimas. O número exato de mortos nunca foi apurado.
  en: |-
    The Ponte das Barcas had 20 barges joined by cables and covered with planks. In Porto it is
    simply “the Disaster.”


    Its memorial on the Ribeira, the Alminhas da Ponte (“little souls of the bridge”), has had a
    bronze relief by the sculptor José Joaquim Teixeira Lopes since 1897, and candles are kept
    burning there. The church of São José das Taipas also serves as a memorial, and every March 29 a
    Mass is said for the victims. The exact number of dead was never established.
  ru: |-
    У Понте-даш-Баркаш было 20 барж, соединённых канатами и покрытых досками. Саму катастрофу в
    Порту зовут просто «Бедствие».


    На мемориале на набережной Рибейра, Алминьяш-да-Понте («маленькие души моста»), с 1897 года есть
    бронзовый барельеф скульптора Жозе Жоакина Тейшейры Лопеша, и там всегда горят свечи. Церковь
    Сан-Жозе-даш-Тайпаш тоже служит мемориалом, а каждый год 29 марта служат мессу по жертвам.
    Точное число погибших так и не установили.
