story:
  pt: >-
    Os açorianos aprenderam a caçar baleias com os americanos. Os baleeiros da Nova Inglaterra paravam nas ilhas para recolher água e homens, e contratavam rapazes de treze ou catorze anos.


    Quando, na década de 1860, o comércio do vinho e da laranja afundou nas ilhas, os antigos marinheiros começaram a caçar por conta própria, a partir da costa. Não tinham navios a vapor nem canhões-arpão, por isso caçava-se à moda antiga. O vigia, no alto da falésia, avistava o esguicho e lançava um foguete. Sete homens corriam para a canoa, alcançavam a baleia a remos, e o arpoador lançava o arpão à mão.


    A presa era o cachalote, de «cachola», cabeça: a cabeça deste animal ocupa cerca de um terço do corpo.
  en: >-
    Azoreans learned whaling from Americans. Whaling ships from New England stopped at the islands for water and crew, and they signed on local boys as young as 13 or 14.


    When the islands’ wine and orange trade collapsed in the 1860s, those former sailors started hunting on their own, straight from shore. They had no steamships or harpoon cannons, so they hunted the old way. A lookout on the cliff spotted a spout and fired a rocket. Seven men ran to an open boat, chased the whale under oars, and the harpooner threw the harpoon by hand.


    Their prey was the sperm whale, in Portuguese “cachalote,” from “cachola,” a slang word for head: this whale’s head takes up about a third of its body.
  ru: >-
    Азорцы научились бить китов у американцев. Китобойные суда из Новой Англии заходили на острова за водой и людьми и нанимали местных мальчишек тринадцати-четырнадцати лет.


    Когда в 1860-х на островах рухнула торговля вином и апельсинами, бывшие матросы начали охотиться сами, прямо с берега. Пароходов и гарпунных пушек у них не было, поэтому охотились по-старому. Дозорный на скале замечал фонтан и пускал ракету. Семеро мужчин бежали к открытой лодке, догоняли кита на вёслах, и гарпунщик бросал гарпун рукой.


    Охотились на кашалота, по-португальски cachalote, от cachola, «башка»: голова у этого кита занимает около трети тела.
