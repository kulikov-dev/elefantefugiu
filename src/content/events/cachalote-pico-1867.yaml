more:
  pt: >-
    Do português, a palavra passou ao francês, «cachalot», e daí ao inglês, ao russo e a muitas outras línguas. Por isso, em meio mundo, o cachalote ainda é chamado por uma alcunha portuguesa.


    Enquanto outros países caçavam baleias a partir de navios a vapor, nos Açores remou-se e lançou-se o arpão à mão durante mais de cem anos. A caça só foi proibida nos anos 1980, e o último cachalote foi morto ao largo do Pico em 1987.


    No ano seguinte, nas Lajes do Pico, abriu um museu dos baleeiros em casas de botes do século XIX. E as vigias nas falésias voltaram ao trabalho: delas avistam-se agora baleias para os barcos de turistas.
  en: >-
    From Portuguese the word passed into French as “cachalot,” and from there into English, Russian, and many other languages. “Cachalot” is still an English name for the sperm whale, a Portuguese nickname that stuck.


    While other countries hunted whales from steamships, the Azores kept rowing and throwing harpoons by hand for more than a century. Whaling was banned only in the 1980s, and the last sperm whale was taken off Pico in 1987.


    A year later, a whalers’ museum opened in Lajes do Pico, in 19th-century boathouses. And the lookout huts on the cliffs are back in use: now they spot whales for boatloads of tourists.
  ru: >-
    Из португальского слово ушло во французский как cachalot, а оттуда в английский и русский. Так у кита в нашем языке осталось португальское прозвище.


    Пока другие страны били китов с пароходов, на Азорах больше ста лет гребли и бросали гарпун рукой. Охоту запретили только в 1980-х, и последнего кашалота у острова Пику добыли в 1987 году.


    Через год в Лажеш-ду-Пику, в лодочных сараях XIX века, открылся музей китобоев. А домики дозорных на скалах снова в деле: с них теперь высматривают китов для лодок с туристами.
