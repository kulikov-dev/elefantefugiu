seo:
  title:
    pt: D. Carlos I, o rei oceanógrafo | O Elefante Fugiu
    en: King Carlos I, the Ocean Scientist | O Elefante Fugiu
    ru: Король-океанограф Карлуш I | O Elefante Fugiu
story:
  pt: >-
    O rei D. Carlos I gostava mais do mar do que da corte. Em 1896 saiu no seu iate «Amélia» para a
    primeira campanha oceanográfica ao longo da costa portuguesa.

    Houve doze campanhas assim. O próprio rei dirigia os trabalhos: media profundidades, recolhia
    amostras de água, lançava redes a centenas de metros e trazia animais que ninguém em Portugal
    tinha visto. Ao microscópio, a bordo, fotografava o plâncton, e foram as primeiras fotografias
    destas no país.

    Em 1908, o rei foi assassinado em Lisboa. A sua coleção de frascos, instrumentos e fotografias
    passou para o Aquário Vasco da Gama, onde se guarda até hoje.
  en: >-
    King Carlos I loved the sea more than the court. In 1896 he set out on his yacht Amélia on the
    first oceanographic expedition along the Portuguese coast.

    There were twelve such voyages. The king directed the work himself: he measured depths, took
    water samples, lowered nets hundreds of meters down, and brought up animals no one in Portugal
    had ever seen. Using a microscope on board, he photographed plankton, the first such photographs
    in the country.

    In 1908, the king was assassinated in Lisbon. His collection of specimen jars, instruments, and
    photographs went to the Vasco da Gama Aquarium, where it’s kept to this day.
  ru: >-
    Король Карлуш I любил море больше двора. В 1896 году он вышел на своей яхте «Амелия» в первую
    океанографическую экспедицию вдоль португальского берега.

    Таких походов было двенадцать. Король сам командовал работами: мерил глубины, брал пробы воды,
    ставил сети на сотни метров вниз и доставал животных, которых в Португалии ещё никто не видел.
    Под микроскопом на борту он снимал планктон, и это были первые такие фотографии в стране.

    В 1908 году короля убили в Лиссабоне. Его коллекцию банок, приборов и снимков передали в
    Аквариум Васку-да-Гама, где её хранят до сих пор.
more:
  pt: >-
    A paixão começou com uma amizade. O jovem D. Carlos conheceu Alberto I do Mónaco quando este
    passou por Lisboa no seu iate-laboratório. Alberto já era um oceanógrafo conhecido, e D. Carlos
    tornou-se seu aluno, depois amigo e correspondente assíduo. Os dois soberanos trocavam
    descobertas e conselhos como dois colegas.


    O rei teve quatro iates «Amélia», e cada novo era transformado num verdadeiro navio científico.
    Publicava os resultados em português e mostrava-os em exposições, e muitos animais das
    profundezas foram vistos pelo público pela primeira vez assim. Além do mar, o rei pintava e
    fotografava, e as suas aguarelas de cenas marítimas ainda hoje são apreciadas.


    Depois da morte do rei, a coleção ficou no palácio, passou depois para a Liga Naval e, em 1935,
    os herdeiros entregaram-na definitivamente ao Aquário Vasco da Gama.
  en: >-
    The passion began with a friendship. Young Carlos met Prince Albert I of Monaco when Albert
    stopped in Lisbon on his laboratory yacht. Albert was already a well-known oceanographer, and
    Carlos became his student, then his friend and faithful correspondent. The two monarchs swapped
    finds and advice like colleagues.


    The king owned four yachts named Amélia, and each new one was turned into a real research
    vessel. He published his results in Portuguese and showed them at exhibitions, and that’s how
    many deep-sea animals were first seen by the public. Beyond the sea, the king painted and took
    photographs, and his watercolors of sea scenes are still admired.


    After the king’s death, the collection stayed at the palace, then went to the Naval League, and
    in 1935 his heirs gave it permanently to the Vasco da Gama Aquarium.
  ru: >-
    Увлечение началось с дружбы. Молодой Карлуш познакомился с князем Монако Альбером I, когда тот
    зашёл в Лиссабон на своей яхте-лаборатории. Альбер уже был известным океанографом, и Карлуш стал
    его учеником, а потом другом и постоянным собеседником по переписке. Два монарха обменивались
    находками и советами, как два коллеги.


    Яхт «Амелия» у короля было четыре, каждую следующую он перестраивал в настоящее научное судно.
    Результаты он печатал по-португальски и показывал на выставках, и многие животные из глубин
    впервые попадали на глаза публике именно так. Кроме моря, король рисовал и фотографировал, и его
    акварели с морскими сценами ценят до сих пор.


    После убийства короля коллекцию хранили во дворце, потом передали Морской лиге, а в 1935 году
    наследники окончательно отдали её Аквариуму Васку-да-Гама.
