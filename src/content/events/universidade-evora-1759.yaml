seo:
  title:
    pt: Universidade e cavalaria · Évora, 1759
    en: The University and the Cavalry · Évora, 1759
    ru: Университет и кавалерия · Эвора, 1759
story:
  pt: |-
    Em 1559, o cardeal D. Henrique abriu em Évora a segunda universidade de Portugal, depois de Coimbra, e entregou-a aos jesuítas. Durante dois séculos, a ordem ensinou ali filosofia e teologia.

    Em 1759, o Marquês de Pombal acusou os jesuítas de conspirarem contra o rei e expulsou a ordem do país. A universidade era jesuíta e, por isso, a 8 de fevereiro foi cercada pela cavalaria. Os professores foram levados para Lisboa, muitos presos no forte da Junqueira, outros desterrados para os Estados Pontifícios.

    Com a ordem desapareceu também a universidade. A seguinte universidade em Évora só abriu em 1973.
  en: |-
    In 1559, Cardinal Henrique opened Portugal’s second university, after Coimbra, in Évora and handed it to the Jesuits. For two centuries the order taught philosophy and theology there.

    In 1759, the Marquis of Pombal accused the Jesuits of plotting against the king and expelled the order from the country. The university was Jesuit, so on February 8 cavalry surrounded it. The teachers were taken to Lisbon. Many were locked up in the Junqueira fort, others were deported to the Papal States.

    The university disappeared along with the order. Évora’s next university didn’t open until 1973.
  ru: |-
    В 1559 году кардинал Энрике открыл в Эворе второй университет Португалии после Коимбры и отдал его иезуитам. Двести лет орден учил здесь философии и богословию.

    В 1759 году маркиз Помбал обвинил иезуитов в заговоре против короля и изгнал орден из страны. Университет был иезуитским, поэтому 8 февраля его окружила кавалерия. Преподавателей увезли в Лиссабон, многих посадили в форт Жункейра, других выслали в Папскую область.

    Вместе с орденом исчез и университет. Следующий университет в Эворе открылся только в 1973 году.
more:
  pt: |-
    Porquê os jesuítas? No século XVI, eram a ordem mais culta do mundo católico. Tinham escolas do Brasil ao Japão, e o cardeal D. Henrique entregou-lhes Évora para formar padres e homens instruídos para o reino e as colónias. A universidade de Évora era jesuíta por inteiro: os mestres, os programas e o próprio espírito.

    Por isso Pombal não a reformou: fechou-a. E Portugal ficou século e meio com uma só universidade, em Coimbra. Só em 1911, já na República, abriram as universidades de Lisboa e do Porto.

    E o edifício de Évora ficou à espera. Na segunda metade do século XIX instalou-se ali um liceu, e os alunos sentavam-se nas mesmas salas onde antes ensinavam os jesuítas. As paredes das salas de aula estão cobertas de azulejos com cenas de ensino: Platão a ensinar os discípulos, Aristóteles a ensinar Alexandre Magno. Em 1973 abriu no velho edifício o Instituto Universitário de Évora, em 1979 tornou-se universidade, e os estudantes voltaram a sentar-se sob os mesmos painéis.
  en: |-
    Why the Jesuits? In the 16th century they were the most learned order in the Catholic world. Their schools stretched from Brazil to Japan, and Cardinal Henrique gave them Évora to train priests and educated men for the kingdom and its colonies. The University of Évora was Jesuit through and through: its teachers, its courses, its whole spirit.

    So Pombal didn’t reform it. He closed it. And for a century and a half Portugal had just one university, in Coimbra. Only in 1911, under the Republic, did universities open in Lisbon and Porto.

    Meanwhile, the building in Évora waited. In the second half of the 19th century it became a high school, and students sat in the same halls where the Jesuits had once taught. The classroom walls are covered in tiles showing scenes of teaching: Plato with his followers, Aristotle teaching Alexander the Great. In 1973 the University Institute of Évora opened in the old building, in 1979 it became a university, and students once again sat beneath the same panels.
  ru: |-
    Почему иезуиты? В XVI веке это был самый учёный орден католического мира. Его школы стояли от Бразилии до Японии, и кардинал Энрике отдал им Эвору, чтобы готовить священников и учёных людей для страны и колоний. Университет Эворы был иезуитским целиком: и учителя, и программы, и сам дух.

    Поэтому Помбал не стал его переделывать, а закрыл. И Португалия на полтора века осталась с одним университетом, в Коимбре. Только в 1911 году, уже при республике, открылись университеты в Лиссабоне и Порту.

    А здание в Эворе ждало. Во второй половине XIX века в нём устроили лицей, и школьники сидели в тех же залах, где когда-то учили иезуиты. Стены аудиторий покрыты плиткой со сценами учёбы: Платон учит своих последователей, Аристотель учит Александра Македонского. В 1973 году в старом здании открыли Университетский институт Эворы, в 1979 году он стал университетом, и студенты снова сели под те же панно.
myth:
  verdict: fact
  statement:
    pt: Depois de 1759, Portugal teve só uma universidade durante século e meio
    en: After 1759, Portugal had one university for a century and a half
    ru: После 1759 года в Португалии полтора века был только один университет
  answer:
    pt: Évora fechou com a expulsão dos jesuítas. Até 1911, quando abriram Lisboa e Porto, restou apenas Coimbra.
    en: Évora closed with the expulsion of the Jesuits. Until Lisbon and Porto opened in 1911, only Coimbra was left.
    ru: Эвору закрыли вместе с изгнанием иезуитов. До 1911 года, когда открылись Лиссабон и Порту, оставалась одна Коимбра.
