# The holidays of the site: one place for all of them (src/data/schemas.ts festaSchema, src/lib/festas.ts, docs/spec.md "Праздники").
# Window: from 00:00 three days before the holiday to the end of its day, by Lisbon time. `enabled: false` keeps a holiday out of the calendar
# (it still can be looked at with ?festa=<id>). A language with no text under `text` has no header, badge or page of the holiday.
# date: { fixed: 'MM-DD' } or { easter: <days from Easter Sunday> }. favicon: the icon of the tab in the window (crown) or null.
# The texts and drawings are approved by the owner (docs/drafts/preview-1dec.html); the other holidays get theirs when they are switched on.
- id: sao-martinho
  slug: sao-martinho
  enabled: false
  date: { fixed: '11-11' }
  favicon: null
  image: festas/sao-martinho.jpg
  text: {}

- id: restauracao
  slug: restauracao
  enabled: true
  date: { fixed: '12-01' }
  art: crown
  # The icon of the tab in the window (a plain crown, src/lib/festa-art.mjs).
  favicon: crown
  # The preview picture when the page is shared: a file in src/assets/ (.png or .jpg, cut to 1200x630 from the middle). Without the file the drawing (art) is used.
  image: festas/restauracao.jpg
  # The story of the day: a story of the site (src/content/events), shown on the page as a usual card.
  story: rei-que-deu-a-coroa-1646
  text:
    pt:
      date: '1 de dezembro'
      name: 'Restauração da Independência'
      head_date: '1 de dezembro · Restauração da Independência'
      head_title: 'A coroa que nunca mais foi usada'
      head_line: 'Em 1640, Portugal voltou a ter o seu próprio rei, e seis anos depois ele entregou a coroa.'
      head_link: 'A história deste dia →'
      art_title: 'Uma coroa numa almofada de veludo, com um ceptro à frente'
      lead: 'A 1 de dezembro de 1640, Portugal voltou a ser um reino independente, depois de 60 anos sob a mesma coroa que Espanha.'
      og_description: 'Porque é que, desde 1646, nenhum rei de Portugal voltou a usar a coroa, e como este feriado chegou a ser suspenso para poupar.'
      off_window: 'Este feriado celebra-se a 1 de dezembro'
      traditions:
        - title: '«Antes rainha por um dia».'
          text: 'Conta-se que foi a mulher do duque, Luísa de Gusmão, quem o convenceu a aceitar: «Antes ser rainha por um dia do que duquesa toda a vida». É provável que a frase lhe tenha sido atribuída mais tarde, mas todos a aprendem na escola.'
        - title: 'O feriado que foi suspenso.'
          text: 'Em 2013, durante a crise, o 1.º de Dezembro deixou de ser feriado para poupar. Três anos depois, em 2016, o feriado voltou.'
        - title: 'Uma praça com nomes de batalhas.'
          text: 'A Praça dos Restauradores, no centro de Lisboa, tem o nome deste dia. No obelisco de 1886 estão gravados os nomes das batalhas da guerra que, depois de 1640, durou mais 28 anos.'
        - title: 'Quarenta conjurados.'
          text: 'Na manhã de 1 de dezembro de 1640, quarenta fidalgos invadiram o paço, em Lisboa.'
          link: { story: restauracao-1640, label: 'A nossa história →' }
    en:
      date: 'December 1'
      name: 'Restoration of Independence Day'
      head_date: 'December 1 · Restoration of Independence Day'
      head_title: 'The crown no king wore again'
      head_line: 'In 1640, Portugal got its own king back. Six years later, he gave the crown away.'
      head_link: 'The story of this day →'
      art_title: 'A crown on a velvet cushion, with a scepter in front of it'
      lead: 'On December 1, 1640, Portugal became a separate kingdom again after 60 years of sharing a crown with Spain.'
      og_description: 'Why no king of Portugal wore the crown after 1646, and how this holiday was once canceled to save money.'
      off_window: 'This holiday is celebrated on December 1'
      traditions:
        - title: '“Better a queen for a day.”'
          text: 'The story goes that the hesitant duke was talked into it by his wife, Luísa de Gusmão: “Better to be queen for a day than duchess for a lifetime.” The line was probably put in her mouth later, but every Portuguese schoolchild knows it.'
        - title: 'The holiday that was canceled.'
          text: 'In 2013, during the debt crisis, December 1 became a working day to save money. Three years later, in 2016, the holiday came back.'
        - title: 'A square full of battles.'
          text: 'Praça dos Restauradores in central Lisbon is named for this day. Its 1886 obelisk lists the battles of the war that went on for 28 more years after 1640.'
        - title: 'Forty conspirators.'
          text: 'On the morning of December 1, 1640, forty noblemen stormed the palace in Lisbon.'
          link: { story: restauracao-1640, label: 'Our story →' }
    ru:
      date: '1 декабря'
      name: 'День восстановления независимости'
      head_date: '1 декабря · День восстановления независимости'
      head_title: 'Корона, которую больше не надевали'
      head_line: 'В 1640 году Португалия вернула себе своего короля, а через шесть лет он отдал корону.'
      head_link: 'История этого дня →'
      art_title: 'Корона лежит на бархатной подушке, перед ней скипетр'
      lead: '1 декабря 1640 года Португалия снова стала отдельным королевством после 60 лет общей короны с Испанией.'
      # What a messenger shows when the page is shared: the title is `name · date`, the description is this line.
      og_description: 'Почему с 1646 года ни один король Португалии не надевал корону и как этот праздник однажды отменили ради экономии.'
      off_window: 'Этот праздник отмечают 1 декабря'
      traditions:
        - title: '«Лучше королевой на день».'
          text: 'Говорят, колеблющегося герцога уговорила жена, Луиза де Гусман: «Лучше быть королевой один день, чем герцогиней всю жизнь». Скорее всего, фразу ей приписали позже, но её знает каждый португальский школьник.'
        - title: 'Праздник, который отменили.'
          text: 'В 2013 году, в кризис, 1 декабря сделали рабочим днём ради экономии. Через три года, в 2016-м, выходной вернули.'
        - title: 'Площадь с названиями битв.'
          text: 'Праса-душ-Рештаурадореш в центре Лиссабона названа в честь этого дня. На её обелиске 1886 года выбиты названия сражений войны, которая после 1640 года шла ещё 28 лет.'
        - title: 'Сорок заговорщиков.'
          text: 'Утром 1 декабря 1640 года во дворец в Лиссабоне ворвались сорок дворян.'
          link: { story: restauracao-1640, label: 'Наша история →' }

- id: natal
  slug: natal
  enabled: true
  date: { fixed: '12-25' }
  # The bolo-rei: whole on the home page, cut slice by slice on the page of the holiday (src/lib/bolo-rei.mjs, src/scripts/bolo-rei.ts).
  art: bolo
  favicon: bolo
  image: festas/natal.jpg
  story: bolo-rei-1910
  text:
    ru:
      date: '25 декабря'
      name: 'Рождество'
      head_date: '25 декабря · Рождество'
      head_title: 'Пирог, который пережил короля'
      head_line: 'Короля свергли в 1910 году, а bolo-rei так и не смогли переименовать.'
      head_link: 'История этого дня →'
      art_title: 'Bolo-rei на тарелке: кольцо из сдобы с цукатами'
      lead: 'В Португалии главный рождественский ужин бывает накануне, в сочельник, а на столе обязательно стоит bolo-rei.'
      og_description: 'Почему республика так и не смогла переименовать bolo-rei и где в Португалии на Рождество купаются в океане.'
      off_window: 'Этот праздник отмечают 25 декабря'
      # "Cut a slice": the words of the button, the hint, the speech bubble over a cut slice (the first words are in bold) and the line under the cake.
      bolo:
        aria: 'Bolo-rei на тарелке. Отрезать кусочек'
        hint: 'Нажми на пирог, чтобы отрезать кусочек'
        fruit: { head: 'Цукаты.', text: 'Ничего не запечено, ешь спокойно.' }
        brinde: { head: 'Подарок.', text: 'Раньше в пирог запекали маленькую фигурку, и она досталась тебе.' }
        fava: { head: 'Боб.', text: 'По обычаю, в следующем году пирог покупаешь ты.' }
        done: 'Пирог съеден. Новый испечём к следующему Рождеству.'
      traditions:
        - title: 'Рождественский костёр.'
          text: 'В деревнях Бейры в сочельник перед церковью складывают мадейру, костёр из целых стволов. Брёвна свозят местные парни, и в Пенамакоре он бывает одним из самых больших в стране. Как говорят, огонь нужен, чтобы согреть Младенца.'
        - title: 'Месса петуха.'
          text: 'Ночную рождественскую мессу в Португалии зовут Missa do Galo, «месса петуха»: по легенде, петух первым прокричал о том, что родился Христос.'
        - title: 'Треска или осьминог.'
          text: 'Ужин в сочельник называется консоада. Во внутренних районах на столе треска: сушёная и солёная, она была дешёвой и не портилась в дороге. А на севере, в Миньу и Траш-уш-Монтеш, едят осьминога, которого, как считается, сушёным привозили галисийские торговцы. 25-го из остатков жарят roupa-velha, «старую одежду».'
        - title: 'Санта-Клаусы в океане.'
          text: 'Утром 25 декабря на пляже Армасан-ди-Пера в Алгарве люди в костюмах Пай Натала, португальского Санта-Клауса, заходят в зимний океан и собирают деньги на обувь для детей из бедных семей. Так делают уже больше десяти лет. А на Азорах, как пишут, окунуться в море 25 декабря — это обновиться к новому году. Купаются и 1 января, по всему побережью, от Каркавелуша до Матозиньюша.'

