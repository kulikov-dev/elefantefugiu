<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Azulejo pattern "tapete": seamless 80x80 tile of a 17th-century carpet pattern; each corner holds one petal and one quarter of the heart, so four tiles make a four-petal flower -->
  <g fill="#000">
    <path d="M0 0 Q4 20 24 24 Q20 4 0 0 Z"/>
    <path d="M80 0 Q76 20 56 24 Q60 4 80 0 Z"/>
    <path d="M0 80 Q4 60 24 56 Q20 76 0 80 Z"/>
    <path d="M80 80 Q76 60 56 56 Q60 76 80 80 Z"/>
    <circle cx="0" cy="0" r="4"/>
    <circle cx="80" cy="0" r="4"/>
    <circle cx="0" cy="80" r="4"/>
    <circle cx="80" cy="80" r="4"/>
    <circle cx="40" cy="40" r="5"/>
  </g>
  <path fill="none" stroke="#000" stroke-width="3" d="M40 22 L58 40 L40 58 L22 40 Z"/>
  <path fill="none" stroke="#000" stroke-opacity="0.5" stroke-width="1.5" d="M24 24 L31 31 M56 24 L49 31 M24 56 L31 49 M56 56 L49 49"/>
</svg>
