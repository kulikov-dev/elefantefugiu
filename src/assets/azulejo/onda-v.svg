<g fill="none" stroke="#000">
    <path stroke-width="9" d="M0 20 Q20 0 40 20 T80 20"/>
    <path stroke-width="3" d="M0 60 Q20 40 40 60 T80 60"/>
    <path stroke-width="1.5" stroke-opacity="0.5" d="M0 40 Q20 20 40 40 T80 40"/>
  </g>
  </g>
</svg>
