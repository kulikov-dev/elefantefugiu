name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# The site lives on its own domain (public/CNAME), always over https and from the root. The address is fixed here on purpose:
# neither repository variables nor a Pages action (configure-pages) may change it, or the pages would point to http:// or to github.io.
env:
  SITE_URL: https://elefantefugiu.pt
  BASE_PATH: /
  # Set the repository variable ALLOW_PLACEHOLDER to false before launch: the build then fails on placeholder entries.
  ALLOW_PLACEHOLDER: ${{ vars.ALLOW_PLACEHOLDER || 'true' }}
  # Map tiles: the repository variable CARTO_KEY switches the map to the CARTO basemaps (see README). TILE_URL and
  # TILE_ATTRIBUTION are for another provider; with none of them the map uses the public OpenStreetMap server (development only).
  CARTO_KEY: ${{ vars.CARTO_KEY }}
  TILE_URL: ${{ vars.TILE_URL }}
  TILE_ATTRIBUTION: ${{ vars.TILE_ATTRIBUTION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
        with:
          # The whole history: <lastmod> of the sitemap is the day of the last commit of the source of each page (scripts/make-sitemap.mjs).
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (astro check)
        run: npx astro check
      # All of npm test: node:test, Vitest and the language stop-lists (check:lang).
      - name: Tests (npm test)
        run: npm test
      # The action installs again and runs npm run build with SITE_URL=https://elefantefugiu.pt (see env above): the i18n, contrast and
      # data checks, the tests, the build and then every postbuild check (sitemap, previews, links, cards, listings, weight, tokens,
      # ru, mascot, published, email, https, schema). If anything fails here, the deploy job does not run.
      # The browser suites are in qa-smoke.yml (every push and pull request) and qa-full.yml (weekly and by hand).
      # withastro/action has no node-version-file input: the version is read from .nvmrc, so every workflow runs the same Node.
      - name: Node version of .nvmrc
        id: nvm
        run: echo "version=$(tr -d 'v \r\n' < .nvmrc)" >> "$GITHUB_OUTPUT"
      - name: Build and upload your site output
        uses: withastro/action@v6
        with:
          node-version: ${{ steps.nvm.outputs.version }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
