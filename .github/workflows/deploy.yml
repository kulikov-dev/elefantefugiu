name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Defaults suit a project site: https://OWNER.github.io/REPO/.
# For a custom domain set the repository variable SITE_URL and leave BASE_PATH unset (see README).
env:
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
  BASE_PATH: ${{ vars.BASE_PATH || (vars.SITE_URL && '/' || format('/{0}', github.event.repository.name)) }}
  # Set the repository variable ALLOW_PLACEHOLDER to false before launch: the build then fails on placeholder entries.
  ALLOW_PLACEHOLDER: ${{ vars.ALLOW_PLACEHOLDER || 'true' }}
  # Map tiles: leave unset for development (public OpenStreetMap server); set both before launch (see README).
  TILE_URL: ${{ vars.TILE_URL }}
  TILE_ATTRIBUTION: ${{ vars.TILE_ATTRIBUTION }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check (astro check)
        run: npx astro check
      - name: Unit tests (Vitest)
        run: npx vitest run
      # The action installs again and runs npm run build: i18n, contrast, node:test, data checks, the build and the
      # link, card, listing, weight and token checks. The browser suites (npm run qa) are run by hand, they need Chromium.
      - name: Build and upload your site output
        uses: withastro/action@v6
        with:
          # The same Node as the steps above and as .nvmrc (the package needs 22.12 or newer).
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
