more:
  pt: >-
    Antónia serviu com nome de homem durante cerca de cinco anos. Depois da confissão obrigaram-na a voltar a vestir-se de mulher; em 1603 casou e mais tarde voltou para Lisboa. Quem a recompensou foi Filipe II de Portugal, a mesma pessoa que Filipe III de Espanha: nesses anos, Portugal e Espanha tinham o mesmo rei.


    A sua história foi escrita ainda em vida, e em Portugal chamaram-lhe «Cavaleira Portuguesa» e «Amazona de Mazagão». Depois da morte do rei, em 1621, caiu no esquecimento. Morreu por volta de 1641, e a data de nascimento só foi encontrada em 2020, no registo de batismo em Aveiro.


    Mazagão continuou portuguesa durante mais século e meio, mais do que qualquer outra fortaleza da costa marroquina. Hoje é a cidade de El Jadida, e as muralhas e a cisterna portuguesas são Património Mundial da UNESCO.
  en: >-
    Antónia served under a man’s name for about five years. After her confession she was made to dress as a woman again; she married in 1603 and later returned to Lisbon. The king who rewarded her was Philip II of Portugal, the same man as Philip III of Spain: in those years Portugal and Spain shared one king.


    Her story was written down in her own lifetime, and in Portugal she was called the “Portuguese Horsewoman” and the “Amazon of Mazagan.” After the king died in 1621, she was forgotten. She died around 1641, and her birth date was only found in 2020, in a baptism record in Aveiro.


    Mazagan stayed Portuguese for another century and a half, longer than any other fortress on the Moroccan coast. Today it’s the city of El Jadida, and its Portuguese walls and cistern are a UNESCO World Heritage Site.
  ru: >-
    Антония прослужила под мужским именем около пяти лет. После признания её заставили снова носить платье, в 1603 году она вышла замуж, а позже вернулась в Лиссабон. Наградил её Филипп II Португальский, тот же человек, что Филипп III Испанский: в те годы у Португалии и Испании был один король.


    Её историю записали ещё при её жизни, и в Португалии её прозвали «Кавалерша» и «Амазонка из Мазагана». После смерти короля в 1621 году о ней забыли. Она умерла около 1641 года, а дату рождения нашли только в 2020-м, по записи о крещении в Авейру.


    Сам Мазаган оставался португальским ещё полтора века, дольше всех крепостей на марокканском берегу. Сегодня это город Эль-Джадида, а португальские стены и подземное водохранилище там под охраной ЮНЕСКО.
