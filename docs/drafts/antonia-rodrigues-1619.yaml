story:
  pt: >-
    Antónia Rodrigues nasceu em Aveiro em 1572. Aos doze anos, a mãe mandou-a para casa da irmã mais velha, em Lisboa, mas as duas não se entenderam. Antónia cortou o cabelo, vestiu-se de marinheiro, passou a chamar-se António e embarcou como grumete num navio que ia para Mazagão, a fortaleza portuguesa na costa de Marrocos.


    Lá, «António» foi alistado como soldado e depois passou para a cavalaria. Uma noite, «ele» travou um ataque à fortaleza, e o corajoso cavaleiro ficou falado.


    Quem a denunciou foi o amor. Uma jovem de família nobre apaixonou-se por António, e o pai exigiu o casamento. Antónia teve de confessar. Não a castigaram: em 1619, o rei deu-lhe uma tença e levou o filho dela para servir na corte.
  en: >-
    Antónia Rodrigues was born in Aveiro in 1572. When she was twelve, her mother sent her to live with her older sister in Lisbon, but the two didn’t get along. Antónia cut her hair, dressed as a sailor, called herself António, and signed on as a cabin boy on a ship bound for Mazagan, Portugal’s fortress on the coast of Morocco.


    There, “António” was enlisted as a soldier and later moved to the cavalry. One night “he” stopped a raid on the fortress, and everyone started talking about the brave horseman.


    It was love that gave her away. A young woman from a noble family fell for António, and her father demanded a wedding. Antónia had to confess. She wasn’t punished: in 1619 the king granted her a pension and took her son into service at court.
  ru: >-
    Антония Родригеш родилась в Авейру в 1572 году. В двенадцать лет мать отправила её к старшей сестре в Лиссабон, но с сестрой она не ужилась. Антония остригла волосы, переоделась моряком, назвалась Антониу и нанялась юнгой на корабль, который шёл в Мазаган, португальскую крепость на берегу Марокко.


    Там «Антониу» записали в солдаты, а потом взяли в конницу. Однажды «он» сорвал ночное нападение на крепость, и о храбром всаднике заговорили.


    Выдала её любовь. В Антониу влюбилась девушка из знатной семьи, и её отец потребовал свадьбы. Антонии пришлось признаться. Наказывать её не стали: в 1619 году король наградил её пенсией, а её сына взял на службу при дворе.
