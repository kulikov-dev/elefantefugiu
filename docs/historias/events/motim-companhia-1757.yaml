story:
  pt: >-
    Na quarta-feira de cinzas, 23 de fevereiro de 1757, a multidão encheu as ruas
    do Porto a gritar pelo rei e contra a nova Companhia do vinho. Os taberneiros
    só viam um monopólio. Agrediram um juiz e destruíram bens. Pombal respondeu
    com tropas e julgamentos. Em outubro, entre 14 e 17 pessoas foram executadas.
  en: >-
    On Ash Wednesday, 23 February 1757, crowds filled the streets of Porto, shouting
    for the king and against the new Wine Company. Tavern-keepers saw only a monopoly.
    People roughed up a judge and wrecked property. Pombal answered with troops
    and trials. By October, between 14 and 17 people were put to death.
  ru: >-
    В пепельную среду, 23 февраля 1757 года, толпы заполнили улицы Порту с криками
    в защиту короля и против новой Винной компании. Хозяева таверн видели в ней
    только монополию. Избили судью и разгромили имущество. Помбал ответил войсками
    и судами. К октябрю от 14 до 17 человек были казнены.
more:
  pt: |-
    Em Portugal, a revolta chama-se Motim da Companhia. Seguiram-se tropas e lei marcial. As contagens dos executados variam, de 14 a 17 nas fontes que encontrámos; uma indica 13 homens e quatro mulheres, a 14 de outubro de 1757.

    Por trás da raiva estavam preços e controlo: a Companhia decidia quem comprava e vendia vinho do Douro, e ingleses, lavradores do Douro e taberneiros do Porto tinham queixas. A Companhia sobreviveu muito a Pombal: o nome e a marca ainda se usam hoje. Como tudo começou, e os marcos que lhe delimitaram a região, contam-se noutro cartão.
  en: |-
    In Portuguese the riot is the Motim da Companhia. Troops and martial law followed. Counts of the executed differ, from 14 to 17 in the sources we found; one lists 13 men and four women on 14 October 1757.

    Behind the anger lay prices and control: the Company decided who could buy and sell Douro wine, and English traders, Douro growers and Porto's tavern-keepers all had grievances. The Company outlived Pombal by far: its name and trademark are still in use today. How it began, and the stones that marked its borders, are told on another card.
  ru: |-
    По-португальски бунт называется Motim da Companhia. Затем пришли войска и военное положение. Число казнённых расходится: от 14 до 17 в найденных нами источниках, один перечисляет 13 мужчин и четырёх женщин 14 октября 1757 года.

    За гневом стояли цены и контроль: Компания решала, кто может покупать и продавать вино Дору, и англичане, виноделы Дору и хозяева таверн Порту имели претензии. Компания пережила Помбала намного: её название и торговая марка в ходу до сих пор. Как всё началось и какие камни отметили её границы, рассказано в другой карточке.
