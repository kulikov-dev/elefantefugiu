  ru: 25-летний коннетабль ушёл с совета и сам выбрал поле боя.
story:
  pt: >-
    Em 1385, Nuno Álvares Pereira tinha 25 anos e era condestável de Portugal. O
    conselho de guerra não chegou a acordo sobre onde combater, por isso, a 6 de
    agosto, saiu do acampamento com uns 2000 homens e escolheu sozinho o campo de
    batalha. Segundo Froissart, mandou abrir valas e covas de lobo num planalto
    estreito. A 14, à hora das vésperas, os franceses que atacaram primeiro caíram
    lá dentro. Os castelhanos, muito mais numerosos, perderam.
  en: >-
    In 1385 Nuno Álvares Pereira was 25 and Portugal's constable. The war council
    could not agree where to fight, so on 6 August he left the camp with about 2,000
    men and chose the battlefield himself. Froissart says he had ditches and wolf
    pits dug across a narrow plateau. On 14 August, at the hour of vespers, the
    French knights who charged first rode straight into them. The Castilians, several
    times more numerous, lost.
  ru: >-
    В 1385 году Нуну Алвариш Перейра был 25-летним коннетаблем Португалии. Военный
    совет не мог решить, где принимать бой, и 6 августа он ушёл из лагеря с двумя
    тысячами человек и сам выбрал поле боя. По Фруассару, он велел вырыть рвы и
    волчьи ямы на узком плато. 14 августа, в час вечерни, французские рыцари, атаковавшие
    первыми, влетели прямо в них. Кастильцы, которых было в разы больше, проиграли.
more:
  pt: >-
    Depois da vitória, Nuno deu a maior parte da fortuna aos seus veteranos. Em
    1423, com 63 anos, entrou no Convento do Carmo, que ele próprio fundara em Lisboa,
    e passou a ser o Frei Nuno de Santa Maria. O terramoto de 1755 destruiu o telhado
    do convento; hoje a nave está aberta ao céu. Os números dos exércitos variam
    muito: a Fundação Batalha de Aljubarrota fala em cerca de 7000 portugueses e
    31 000 a 44 000 castelhanos, dos quais só uns 10 000 combateram. O famoso «quadrado»
    português é hoje tido como mito, e a padeira que matou castelhanos em fuga só
    aparece nas fontes no século XVI. Foi canonizado em 2009. Fossos e covas vêm
    de Froissart; Ayala, cronista castelhano e testemunha ocular, e Fernão Lopes,
    sessenta anos depois, não os descrevem.
  en: >-
    After the victory, Nuno gave most of his wealth to his veterans. In 1423, aged
    63, he entered the Carmo convent he had founded in Lisbon and became Friar Nuno
    of Saint Mary. The 1755 earthquake destroyed the convent's roof; today its nave
    stands open to the sky. Numbers for the armies vary widely: the Aljubarrota
    Battle Foundation puts the Portuguese at about 7,000 and the Castilians at 31,000–44,000,
    of whom only about 10,000 fought. The 'Portuguese square' is now called a myth,
    and the baker woman who killed fleeing Castilians first appears in sources in
    the 16th century. He was canonised in 2009. The ditches and pits come from Froissart;
    Ayala, the Castilian eyewitness chronicler, and Fernão Lopes, sixty years later,
    do not describe them.
  ru: >-
    После победы Нуну раздал большую часть состояния своим ветеранам. В 1423 году,
    в 63 года, он вступил в основанный им в Лиссабоне монастырь Кармо и стал братом
    Нуну де Санта-Мария. Землетрясение 1755 года разрушило крышу монастыря, и сегодня
    его неф стоит открытым небу. Численность армий оценивают очень по-разному: Фонд
    битвы при Алжубарроте называет около 7000 португальцев и 31 000–44 000 кастильцев,
    из которых сражались лишь около 10 000. «Португальский квадрат» сегодня считают
    мифом, а пекарша, убившая бегущих кастильцев, появляется в источниках лишь в
    XVI веке. В 2009 году он был канонизирован. Рвы и ямы известны по Фруассару;
    кастильский хронист-очевидец Айяла и Фернан Лопеш, писавший через шестьдесят
    лет, их не описывают.
